  /* ================= 会话 ================= */
  function freshStage(){
    const old = $('#stage');
    const el = document.createElement('div');
    el.id = 'stage'; el.className = 'stage';
    old.replaceWith(el);
    return el;
  }
  function createSession(mode, stage){
    const s = {
      mode, stage, dead:false, _timers:new Set(), _listeners:[], _raf:0,
      timeout(fn, ms){
        const id = setTimeout(()=>{ s._timers.delete(id); if(!s.dead) fn(); }, ms);
        s._timers.add(id); return id;
      },
      interval(fn, ms){
        const id = setInterval(()=>{ if(!s.dead) fn(); }, ms);
        s._timers.add(id); return id;
      },
      clear(id){ if(id==null) return; clearTimeout(id); clearInterval(id); s._timers.delete(id); },
      loop(fn){
        let last = performance.now();
        const step = now => {
          if(s.dead) return;
          const dt = Math.min(80, now - last); last = now;
          fn(dt, now);
          s._raf = requestAnimationFrame(step);
        };
        s._raf = requestAnimationFrame(step);
      },
      setHud(items){
        hud.innerHTML = items.map(it =>
          '<div class="stat"><span>'+it.k+'</span><b class="'+(it.tone||'')+'">'+it.v+'</b></div>'
        ).join('');
      },
      end(res){ endGame(s, res); },
      on(target, ev, fn, opts){
        target.addEventListener(ev, fn, opts);
        s._listeners.push(()=> target.removeEventListener(ev, fn, opts));
      },
      destroy(){
        if(s.dead) return;
        s.dead = true;
        s._timers.forEach(id=>{ clearTimeout(id); clearInterval(id); });
        s._timers.clear();
        s._listeners.forEach(f=>f());
        s._listeners = [];
        if(s._raf) cancelAnimationFrame(s._raf);
      }
    };
    return s;
  }

  /* ================= 倒计时 ================= */
  function countdown(s, n, done){
    const el = document.createElement('div');
    el.className = 'countdown';
    s.stage.appendChild(el);
    let k = 0;
    (function tick(){
      if(s.dead) return;
      const isGo = k >= n;
      el.textContent = isGo ? '开始' : String(n - k);
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      if(isGo){ beep(980,.14,'triangle',.05); s.timeout(()=>{ el.remove(); if(!s.dead) done(); }, 420); }
      else { beep(520,.06,'sine',.04); k++; s.timeout(tick, 540); }
    })();
  }

  /* ================= 结算 ================= */
  function endGame(s, res){
    const m = s.mode;
    s.destroy();
    const wasPerfect = allPerfect();           /* 这一局开打之前是不是已经八关全满 */
    const rec = records[m.id] || { best:null, stars:0, plays:0 };
    rec.plays = (rec.plays || 0) + 1;
    let isNew = false;
    if(rec.best == null || (m.low ? res.value < rec.best : res.value > rec.best)){
      rec.best = res.value; isNew = true;
    }
    rec.stars = Math.max(rec.stars || 0, res.stars || 0);
    records[m.id] = rec;
    if(!previewFinale) saveRecords();          /* 预览通关页那次不写存档 */
    if(!previewFinale) clearStage(m.id);       /* 这一关做完了，现场不用再留着 */
    refreshTotal();
    const perfect = allPerfect();
    /* 只有"刚刚凑齐 24 / 24"的那一局才走庆典卡并自动进庆典；
       已经全满之后再回来重玩某一关，仍然给正常的结算卡（能再玩一次、能返回）。 */
    const celebration = perfect && !wasPerfect;

    const dots = [0,1,2].map(i =>
      '<i class="'+(i < (res.stars||0) ? 'on':'')+'" style="animation-delay:'+(0.1+i*0.12)+'s">★</i>'
    ).join('');
    const bestTxt = m.fmt(records[m.id]);
    $('#gameBest').textContent = bestTxt ? '最好 ' + bestTxt : '';
    /* 八关全三星：结算卡只留「进入通关庆典」一个出口（不点也会自动进去） */
    const actions = celebration
      ? '<button class="btn primary" data-act="finale">🎉 进入通关庆典</button>'
      : '<button class="btn primary" data-act="retry">再玩一次</button>'+
        '<button class="btn plain" data-act="home">返回</button>';
    overlay.innerHTML =
      '<div class="sheet'+(celebration ? ' celebration' : '')+'">'+
        '<div class="s-stars">'+dots+'</div>'+
        '<div class="s-value">'+res.valueText+(res.unit?'<small>'+res.unit+'</small>':'')+'</div>'+
        '<div class="s-label">'+res.headline+'</div>'+
        /* 通关卡只留一块牌子：这一局的纪录牌省掉，把位置让给「进入通关庆典」按钮 */
        (isNew && !celebration ? '<div><span class="s-badge">新纪录</span></div>' : '')+
        (celebration ? '<div><span class="s-badge">🎉 24 / 24 全部通关</span></div>' : '')+
        /* 通关卡走紧凑版：明细行也省掉，保证按钮出现在可视区里 */
        (celebration ? '' : '<div class="s-detail">'+(res.lines||[]).join(' · ')+'</div>')+
        '<div class="s-actions">'+actions+'</div>'+
      '</div>';
    overlay.classList.remove('hidden');
    requestAnimationFrame(()=>overlay.classList.add('show'));
    if(celebration){
      clearCelebrateTimer();
      celebrateTimer = setTimeout(enterFinale, 6000);   /* 学生不动手也能进庆典 */
    }

    if(isNew && res.stars >= 2){ confetti(); sfx.win(); }
    else if(res.stars >= 2){ sfx.good(); }
    else { sfx.pop(); }
    renderHome();
  }
  overlay.addEventListener('click', e=>{
    const b = e.target.closest('[data-act]');
    if(!b) return;
    if(b.dataset.act === 'finale'){ clearCelebrateTimer(); enterFinale(); }
    else if(b.dataset.act === 'retry') openGame(currentId, false);
    else goHome();
  });

  /* ================= 打开 / 返回 ================= */
  let session = null, currentId = null;
  /* openGame(id)        进关卡：这一关有做了一半的现场就接着做
     openGame(id,false)  这次从头做（「再玩一次」「重新开始」走这条）
     openGame(id,snap)   按指定的现场接着做 */
  function openGame(id, from){
    const m = getMode(id);
    if(!m) return;
    if(session){ session.destroy(); session = null; }
    hideOverlay();
    currentId = id;
    const snap = (from === false) ? null : ((from && typeof from === 'object') ? from : getStage(id));
    homeGrid.classList.add('hidden');
    gameBox.classList.remove('hidden');
    panel.classList.add('playing');
    refreshCelebrateBar();
    $('#gameName').textContent = m.name;
    $('#gameTag').textContent = m.hint;
    $('#resumeChip').classList.toggle('hidden', !snap);
    $('#restartBtn').classList.toggle('hidden', !snap);
    const best = m.fmt(records[m.id] || {});
    $('#gameBest').textContent = best ? '最好 ' + best : '';
    hud.innerHTML = '';
    const stage = freshStage();
    session = createSession(m, stage);
    session.from = snap || null;
    m.init(session);
  }
  function goHome(){
    if(session){ session.destroy(); session = null; }
    hideOverlay();
    currentId = null;
    gameBox.classList.add('hidden');
    homeGrid.classList.remove('hidden');
    panel.classList.remove('playing');
    renderHome();
  }
  function hideOverlay(){
    clearCelebrateTimer();                     /* 结算卡收起来就别再自动进庆典了 */
    overlay.classList.add('hidden'); overlay.classList.remove('show'); overlay.innerHTML = '';
  }
  $('#backBtn').addEventListener('click', ()=>{ if(!finaleOn) goHome(); });
  $('#restartBtn').addEventListener('click', ()=>{
    if(finaleOn) return;
    clearStage(currentId);                      /* 从头做：把做了一半的现场丢掉 */
    openGame(currentId, false);
  });
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && currentId && !finaleOn) goHome(); });
  $('#celebrateBar').addEventListener('click', ()=>{ if(!finaleOn) enterFinale(); });

  /* ============================================================
     01 · 闪电反应
  ============================================================ */
  function gameReaction(s){
    const TOTAL = 5;
    /* 接着上次：已经测完的回合成绩存在 times 里，idx 跟着 times 走 */
    const from = s.from;
    let times = (from && from.times) ? from.times.slice(0, TOTAL-1) : [];
    let early = (from && from.early) ? Math.max(0, Math.round(from.early)) : 0;
    let idx = times.length, phase = 'idle', t0 = 0, timer = null;
    s.stage.className = 'stage rx-idle';
    s.stage.innerHTML =
      '<div class="center-fill">'+
        '<div class="rx-title" id="rxTitle">准备好了吗</div>'+
        '<div class="rx-sub" id="rxSub">点击屏幕任意位置开始</div>'+
        '<div class="rx-dots" id="rxDots"></div>'+
      '</div>';
    const title = s.stage.querySelector('#rxTitle');
    const sub = s.stage.querySelector('#rxSub');
    const dots = s.stage.querySelector('#rxDots');

    const paint = st => { s.stage.className = 'stage rx-' + st; };
    function drawDots(){
      let html = '';
      for(let i=0;i<TOTAL;i++){
        const v = times[i];
        const cur = (i === times.length) && (phase === 'ready' || phase === 'go');
        html += '<i class="'+(v!=null?'done ':'')+(v!=null&&v<=300?'fast ':'')+(cur?'cur':'')+'">'
              + (v!=null ? Math.round(v) : (i+1)) + '</i>';
      }
      dots.innerHTML = html;
    }
    function drawHud(){
      const avg = times.length ? Math.round(times.reduce((a,b)=>a+b,0)/times.length) : null;
      s.setHud([
        { k:'回合', v: Math.min(idx+1, TOTAL) + ' / ' + TOTAL },
        { k:'上次', v: times.length ? Math.round(times[times.length-1]) + ' ms' : '—' },
        { k:'平均', v: avg!=null ? avg + ' ms' : '—' },
        { k:'抢跑', v: early + ' 次', tone: early ? 'warn' : '' }
      ]);
    }
    drawDots(); drawHud();
    if(times.length){
      /* 上次做到一半：不用再点一次开始，直接进下一回合 */
      phase = 'wait';
      sub.textContent = '接着上次继续';
      s.timeout(startRound, 700);
    }
    function startRound(){
      if(s.dead) return;
      phase = 'ready'; paint('ready');
      title.textContent = '准备';
      sub.textContent = '第 ' + (idx+1) + ' / ' + TOTAL + ' 回合';
      drawDots(); drawHud();
      timer = s.timeout(()=>{
        phase = 'go'; paint('go');
        title.textContent = '点击';
        sub.textContent = '';
        beep(900,.06,'square',.04);
        t0 = performance.now();
      }, rand(1100, 3000));
    }
    function finish(){
      const avg = Math.round(times.reduce((a,b)=>a+b,0)/times.length);
      s.end({
        value: avg, valueText: avg, unit:'ms', headline:'平均反应速度',
        stars: s.mode.star(avg),
        lines:['最快 '+Math.round(Math.min.apply(null,times))+' ms',
               '最慢 '+Math.round(Math.max.apply(null,times))+' ms']
              .concat(early ? ['抢跑 '+early+' 次'] : [])
      });
    }
    s.stage.addEventListener('pointerdown', ()=>{
      if(phase === 'idle'){ idx = 0; startRound(); return; }
      if(phase === 'ready'){
        s.clear(timer); early++; phase = 'wait'; paint('early');
        title.textContent = '抢跑';
        sub.textContent = '等变深再点';
        sfx.bad(); drawDots(); drawHud();
        saveStage(s.mode.id, { times:times, early:early });
        s.timeout(startRound, 1200);
        return;
      }
      if(phase === 'go'){
        const rt = Math.round(performance.now() - t0);
        times.push(rt);
        idx++;
        phase = 'wait'; paint('hit');
        title.textContent = rt + ' ms';
        sub.textContent = rt<=230 ? '极快' : rt<=300 ? '很快' : rt<=400 ? '不错' : '再快一点';
        sfx.good(); drawDots(); drawHud();
        saveStage(s.mode.id, { times:times, early:early });
        if(idx >= TOTAL) s.timeout(finish, 800);
        else s.timeout(startRound, 900);
      }
    });
  }

  /* ============================================================
     02 · 打地鼠
  ============================================================ */
  function gameWhack(s){
    const DUR = 30;
    /* 接着上次：分数和剩下的秒数都留着，时钟从上次停下的地方接着走 */
    const from = s.from;
    let score = 0, combo = 0, bestCombo = 0, miss = 0, escape = 0;
    let left = DUR, running = false, startAt = 0;
    if(from){
      score = Math.max(0, Math.round(from.score || 0));
      combo = Math.max(0, Math.round(from.combo || 0));
      bestCombo = Math.max(combo, Math.round(from.bestCombo || 0));
      miss = Math.max(0, Math.round(from.miss || 0));
      escape = Math.max(0, Math.round(from.escape || 0));
      left = clamp(Number(from.left) || DUR, 0.5, DUR);
    }
    const cells = [];
    const holeHtml = '<div class="hole"><div class="mole"><i class="eye l"></i><i class="eye r"></i><i class="nose"></i></div></div>';
    s.stage.innerHTML = '<div class="whack-grid">' + holeHtml.repeat(9) + '</div>';
    s.stage.querySelectorAll('.hole').forEach((el,i)=>{
      cells.push({ el, busy:false, timer:null, i });
    });
    drawHud();

    function maxActive(){ return score < 6 ? 1 : score < 15 ? 2 : 3; }
    function lifeMs(){ return Math.max(680, 1200 - score*16); }
    function drawHud(){
      const total = score + miss + escape;
      s.setHud([
        { k:'得分', v: score, tone:'good' },
        { k:'连击', v: combo, tone: combo>=5?'good':'' },
        { k:'命中率', v: total ? Math.round(score/total*100)+'%' : '100%' },
        { k:'剩余', v: left.toFixed(1) + ' s', tone: left<=5?'bad':'' }
      ]);
    }
    function spawn(){
      if(s.dead || !running) return;
      const free = cells.filter(c=>!c.busy);
      if(free.length && cells.filter(c=>c.busy).length < maxActive()){
        const c = pick(free);
        c.busy = true;
        c.el.classList.add('up');
        c.timer = s.timeout(()=>escapeCell(c), lifeMs());
      }
      s.timeout(spawn, rand(300, 620));
    }
    function escapeCell(c){
      if(!c.busy) return;
      c.busy = false; c.el.classList.remove('up');
      escape++; combo = 0; drawHud();
    }
    function hitCell(c){
      s.clear(c.timer);
      c.busy = false;
      c.el.classList.remove('up'); c.el.classList.add('hit');
      s.timeout(()=>c.el.classList.remove('hit'), 220);
      score++; combo++; bestCombo = Math.max(bestCombo, combo);
      const r = c.el.getBoundingClientRect(), sr = s.stage.getBoundingClientRect();
      popText(s.stage, '+1', r.left-sr.left+r.width/2, r.top-sr.top+r.height/3);
      sfx.pop();
      if(combo>0 && combo%5===0) popText(s.stage, '连击 x'+combo, sr.width/2, 40);
      drawHud();
    }
    s.stage.addEventListener('pointerdown', e=>{
      if(!running) return;
      const hole = e.target.closest('.hole');
      if(!hole) return;
      const c = cells.find(x=>x.el === hole);
      if(c && c.busy){ hitCell(c); return; }
      miss++; combo = 0;
      hole.classList.add('bad');
      s.timeout(()=>hole.classList.remove('bad'), 260);
      sfx.bad(); drawHud();
    });
    s.timeout(()=>{
      countdown(s, 3, ()=>{
        running = true; startAt = performance.now() - (DUR-left)*1000;
        spawn();
        s.interval(()=>{
          left = Math.max(0, DUR - (performance.now()-startAt)/1000);
          drawHud();
          saveStage(s.mode.id, { score:score, combo:combo, bestCombo:bestCombo, miss:miss, escape:escape, left:left });
          if(left <= 0 && running){
            running = false;
            cells.forEach(c=>{ s.clear(c.timer); c.busy = false; c.el.classList.remove('up'); });
            s.end({
              value: score, valueText: score, unit:'只', headline:'敲中的地鼠',
              stars: s.mode.star(score),
              lines:['最高连击 x'+bestCombo, '敲空 '+miss, '溜走 '+escape]
            });
          }
        }, 100);
      });
    }, 120);
  }

  /* ============================================================
     03 · 靶心连击
  ============================================================ */
  function gameAim(s){
    const DUR = 30;
    /* 接着上次：命中、脱靶、连击和剩下的秒数都留着 */
    const from = s.from;
    let hits = 0, miss = 0, combo = 0, bestCombo = 0, escape = 0;
    let left = DUR, running = false, startAt = 0, target = null, spawnQueued = false;
    if(from){
      hits = Math.max(0, Math.round(from.hits || 0));
      miss = Math.max(0, Math.round(from.miss || 0));
      combo = Math.max(0, Math.round(from.combo || 0));
      bestCombo = Math.max(combo, Math.round(from.bestCombo || 0));
      escape = Math.max(0, Math.round(from.escape || 0));
      left = clamp(Number(from.left) || DUR, 0.5, DUR);
    }
    drawHud();

    function drawHud(){
      const shots = hits + miss;
      s.setHud([
        { k:'命中', v: hits, tone:'good' },
        { k:'连击', v: combo, tone: combo>=5?'good':'' },
        { k:'命中率', v: shots ? Math.round(hits/shots*100)+'%' : '—' },
        { k:'剩余', v: left.toFixed(1) + ' s', tone: left<=5?'bad':'' }
      ]);
    }
    function queueSpawn(delay){
      if(spawnQueued) return;
      spawnQueued = true;
      s.timeout(()=>{ spawnQueued = false; spawn(); }, delay);
    }
    function spawn(){
      if(s.dead || !running || target) return;
      const rect = s.stage.getBoundingClientRect();
      const r = Math.max(22, 38 - hits*0.6);
      const life = Math.max(700, 1600 - hits*35);
      const x = rand(r+10, Math.max(r+12, rect.width - r - 10));
      const y = rand(r+10, Math.max(r+12, rect.height - r - 10));
      const el = document.createElement('div');
      el.className = 'target';
      el.style.cssText = 'left:'+(x-r)+'px;top:'+(y-r)+'px;width:'+(r*2)+'px;height:'+(r*2)+'px;--life:'+life+'ms';
      el.innerHTML = '<i class="tl"></i>';
      s.stage.appendChild(el);
      const t = { el, x, y, timer:null };
      t.timer = s.timeout(()=>{
        if(target !== t) return;
        target = null;
        t.el.classList.add('flee');
        s.timeout(()=>t.el.remove(), 220);
        escape++; combo = 0; drawHud();
        queueSpawn(60);
      }, life);
      target = t;
    }
    function hitTarget(t){
      s.clear(t.timer);
      target = null;
      t.el.classList.add('dead');
      s.timeout(()=>t.el.remove(), 220);
      hits++; combo++; bestCombo = Math.max(bestCombo, combo);
      popText(s.stage, '+1', t.x, t.y);
      sfx.pop();
      drawHud();
      queueSpawn(50);
    }
    s.stage.addEventListener('pointerdown', e=>{
      if(!running) return;
      const el = e.target.closest('.target');
      if(el && target && target.el === el){ hitTarget(target); return; }
      const rect = s.stage.getBoundingClientRect();
      miss++; combo = 0;
      popText(s.stage, '✕', e.clientX-rect.left, e.clientY-rect.top, true);
      sfx.bad(); drawHud();
    });
    s.timeout(()=>{
      countdown(s, 3, ()=>{
        running = true; startAt = performance.now() - (DUR-left)*1000;
        spawn();
        s.interval(()=>{
          left = Math.max(0, DUR - (performance.now()-startAt)/1000);
          drawHud();
          saveStage(s.mode.id, { hits:hits, miss:miss, combo:combo, bestCombo:bestCombo, escape:escape, left:left });
          if(!target) queueSpawn(0);
          if(left <= 0 && running){
            running = false;
            if(target){ s.clear(target.timer); target.el.remove(); target = null; }
            const shots = hits + miss;
            s.end({
              value: hits, valueText: hits, unit:'个', headline:'点爆的靶子',
              stars: s.mode.star(hits),
              lines:['命中率 '+(shots?Math.round(hits/shots*100):0)+'%',
                     '最高连击 x'+bestCombo,
                     '脱靶 '+miss+' · 溜走 '+escape]
            });
          }
        }, 100);
      });
    }, 120);
  }

  /* ============================================================
     04 · 拖拽归位
  ============================================================ */
  function gameDrag(s){
    const ROUNDS = 3, PER = 4;
    const PALETTE = [
      { c:'#a3566a' }, { c:'#5566a8' }, { c:'#5f8163' },
      { c:'#a97c2f' }, { c:'#7d5b96' }, { c:'#3d7f86' }
    ];
    /* 接着上次：从上次那一轮接着做，已经用掉的时间也接着算（星星按总用时评） */
    const from = s.from;
    let round = 0, placed = 0, errors = 0, t0 = 0, running = false, carried = 0;
    if(from){
      round = clamp(Math.round(from.round || 0), 0, ROUNDS-1);
      errors = Math.max(0, Math.round(from.errors || 0));
      carried = Math.max(0, Number(from.sec) || 0);
    }
    s.stage.innerHTML = '<div class="drag-area"></div>';
    const area = s.stage.querySelector('.drag-area');

    drawHud();
    function drawHud(){
      const now = t0 ? (performance.now()-t0)/1000 : 0;
      s.setHud([
        { k:'轮次', v: Math.min(round+1, ROUNDS) + ' / ' + ROUNDS },
        { k:'已完成', v: placed + ' / ' + PER },
        { k:'用时', v: now.toFixed(1) + ' s' },
        { k:'拖错', v: errors + ' 次', tone: errors ? 'bad' : '' }
      ]);
    }
    function buildRound(){
      placed = 0;
      area.innerHTML = '';
      const colors = shuffle(PALETTE).slice(0, PER);

      const bins = document.createElement('div');
      bins.className = 'bins';
      colors.forEach(col=>{
        const b = document.createElement('div');
        b.className = 'bin';
        b.dataset.color = col.c;
        b.innerHTML = '<i class="dot" style="background:'+col.c+'"></i>';
        bins.appendChild(b);
      });
      area.appendChild(bins);

      const winW = area.clientWidth;
      const zoneH = Math.max(120, area.clientHeight - bins.offsetHeight - 30);

      shuffle(colors).forEach(col=>{
        const ball = document.createElement('div');
        ball.className = 'ball';
        ball.dataset.color = col.c;
        ball.style.background = col.c;
        const sx = rand(8, Math.max(10, winW - 66));
        const sy = rand(8, Math.max(10, zoneH - 66));
        ball.style.left = sx + 'px';
        ball.style.top = sy + 'px';
        bindDrag(ball, sx, sy);
        area.appendChild(ball);
      });
      if(round === 0){
        const tip = document.createElement('div');
        tip.className = 'round-tip';
        tip.textContent = '按住彩球，拖进同色框里';
        area.appendChild(tip);
        s.timeout(()=>tip.remove(), 2800);
      }
      running = true;
      drawHud();
    }
    function bindDrag(ball, sx, sy){
      ball.addEventListener('pointerdown', ev=>{
        if(!running) return;
        ev.preventDefault();
        try{ ball.setPointerCapture(ev.pointerId); }catch(err){}
        ball.classList.add('dragging');
        const ar = area.getBoundingClientRect();
        const offX = ev.clientX - ar.left - sx;
        const offY = ev.clientY - ar.top - sy;
        const move = mv=>{
          ball.style.left = clamp(mv.clientX - ar.left - offX, -6, area.clientWidth - 58) + 'px';
          ball.style.top  = clamp(mv.clientY - ar.top  - offY, -6, area.clientHeight - 58) + 'px';
        };
        const up = uv=>{
          ball.removeEventListener('pointermove', move);
          ball.removeEventListener('pointerup', up);
          ball.removeEventListener('pointercancel', up);
          ball.classList.remove('dragging');
          const hitBin = Array.prototype.slice.call(area.querySelectorAll('.bin')).find(b=>{
            const r = b.getBoundingClientRect();
            return uv.clientX >= r.left && uv.clientX <= r.right && uv.clientY >= r.top && uv.clientY <= r.bottom;
          });
          if(hitBin && hitBin.dataset.color === ball.dataset.color){
            hitBin.classList.add('filled');
            hitBin.innerHTML = '<i class="dot" style="background:'+ball.dataset.color+'"></i>';
            ball.remove();
            placed++; sfx.good(); drawHud();
            if(placed >= PER){
              running = false;
              round++;
              if(round >= ROUNDS){ s.timeout(finish, 350); }
              else {
                const tip = document.createElement('div');
                tip.className = 'round-tip';
                tip.textContent = '第 ' + round + ' 轮完成';
                area.appendChild(tip);
                s.timeout(()=>{ tip.remove(); buildRound(); }, 800);
              }
            }
            return;
          }
          if(hitBin){
            errors++;
            hitBin.classList.add('shake');
            s.timeout(()=>hitBin.classList.remove('shake'), 400);
            sfx.bad();
          }
          ball.style.transition = 'left .18s var(--ease), top .18s var(--ease)';
          ball.style.left = sx + 'px'; ball.style.top = sy + 'px';
          s.timeout(()=>{ ball.style.transition = ''; }, 220);
          drawHud();
        };
        ball.addEventListener('pointermove', move);
        ball.addEventListener('pointerup', up);
        ball.addEventListener('pointercancel', up);
      });
    }
    function finish(){
      const sec = (performance.now()-t0)/1000;
      s.end({
        value: sec, valueText: sec.toFixed(1), unit:'秒', headline:'12 个彩球总用时',
        stars: s.mode.star(sec),
        lines:['拖错 '+errors+' 次',
               '平均每球 '+(sec/(ROUNDS*PER)).toFixed(1)+' 秒']
      });
    }
    s.timeout(()=>{
      countdown(s, 3, ()=>{
        t0 = performance.now() - carried*1000;
        buildRound();
        s.interval(()=>{
          drawHud();
          saveStage(s.mode.id, { round:round, errors:errors, sec:(performance.now()-t0)/1000 });
        }, 100);
      });
    }, 120);
  }

  /* ============================================================
     05 · 循迹追踪
  ============================================================ */
  function gameTrack(s){
    const DUR = 20, R = 36;
    /* 接着上次：跟住的秒数、脱靶次数都留着，计时从上次的地方接着走 */
    const from = s.from;
    let running = false, elapsed = 0, insideTime = 0, breaks = 0, streak = 0, bestStreak = 0, inside = false, hudAcc = 0;
    if(from){
      elapsed = clamp(Number(from.elapsed) || 0, 0, DUR);
      insideTime = Math.max(0, Number(from.insideTime) || 0);
      breaks = Math.max(0, Math.round(from.breaks || 0));
      streak = Math.max(0, Number(from.streak) || 0);
      bestStreak = Math.max(streak, Number(from.bestStreak) || 0);
    }
    const pos = { x:120, y:120 }, tgt = { x:200, y:200 }, mouse = { x:-999, y:-999 };
    s.stage.innerHTML = '<div class="tdot"></div>';
    const dot = s.stage.querySelector('.tdot');
    dot.style.opacity = '0';

    function pickTarget(){
      const r = s.stage.getBoundingClientRect();
      tgt.x = rand(R+10, Math.max(R+12, r.width - R - 10));
      tgt.y = rand(R+10, Math.max(R+12, r.height - R - 10));
    }
    function drawHud(){
      const pct = elapsed > 0 ? Math.min(100, insideTime/elapsed*100) : 0;
      s.setHud([
        { k:'跟随率', v: Math.round(pct) + '%', tone: pct>=85?'good':pct<50?'bad':'' },
        { k:'连续跟随', v: streak.toFixed(1) + ' s' },
        { k:'脱靶', v: breaks + ' 次', tone: breaks?'warn':'' },
        { k:'剩余', v: Math.max(0, DUR-elapsed).toFixed(1) + ' s', tone: (DUR-elapsed)<=5?'bad':'' }
      ]);
    }
    function finish(){
      const pct = Math.min(100, insideTime/Math.max(.1, elapsed)*100);
      s.end({
        value: pct, valueText: Math.round(pct), unit:'%', headline:'跟随准确率',
        stars: s.mode.star(pct),
        lines:['最长连续 '+bestStreak.toFixed(1)+' 秒', '脱靶 '+breaks+' 次']
      });
    }
    s.stage.addEventListener('pointermove', e=>{
      const r = s.stage.getBoundingClientRect();
      mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
    });
    s.stage.addEventListener('pointerleave', ()=>{ mouse.x = -999; mouse.y = -999; });
    drawHud();

    s.loop(dt=>{
      if(!running) return;
      elapsed += dt/1000;
      const dx = tgt.x - pos.x, dy = tgt.y - pos.y, d = Math.hypot(dx,dy) || 1;
      const speed = 155 + 120*Math.min(1, elapsed/DUR);
      if(d < 8) pickTarget();
      else {
        pos.x += dx/d*speed*dt/1000;
        pos.y += dy/d*speed*dt/1000;
      }
      dot.style.transform = 'translate('+pos.x+'px,'+pos.y+'px)';
      const nowIn = Math.hypot(mouse.x-pos.x, mouse.y-pos.y) <= R;
      if(nowIn){ insideTime += dt; streak += dt/1000; bestStreak = Math.max(bestStreak, streak); }
      else { if(inside) breaks++; streak = 0; }
      if(nowIn !== inside){ inside = nowIn; dot.classList.toggle('in', inside); }
      hudAcc += dt;
      if(hudAcc >= 120){ hudAcc = 0; drawHud(); }
      saveStage(s.mode.id, { elapsed:elapsed, insideTime:insideTime, breaks:breaks,
                             streak:streak, bestStreak:bestStreak });
      if(elapsed >= DUR){ running = false; finish(); }
    });

    s.timeout(()=>{
      const r = s.stage.getBoundingClientRect();
      pos.x = r.width/2; pos.y = r.height/2;
      pickTarget();
      countdown(s, 3, ()=>{
        running = true;
        dot.style.opacity = '1';
      });
    }, 120);
  }

  /* ============================================================
     06 · 描线平稳
  ============================================================ */
  function gameTrace(s){
    const ROUNDS = 3, N = 240;
    const SHAPES = [
      { name:'波浪线', tol:22, at: t => ({ x:0.08 + 0.84*t, y:0.5 + 0.19*Math.sin(t*Math.PI*3.2) }) },
      { name:'大弧线', tol:18, at: t => { const a = -0.72*Math.PI + 1.44*Math.PI*t;
          return { x:0.5 + 0.40*Math.cos(a), y:0.5 + 0.44*Math.sin(a) }; } },
      { name:'螺旋',   tol:15, at: t => { const a = -Math.PI/2 + t*Math.PI*4.2, r = 0.05 + 0.38*t;
          return { x:0.5 + r*Math.cos(a), y:0.5 + r*Math.sin(a) }; } }
    ];
    s.stage.className = 'stage';
    s.stage.innerHTML =
      '<svg class="tr-svg"></svg>'+
      '<div class="tr-flag start">起</div>'+
      '<div class="tr-flag end">终</div>'+
      '<div class="tr-dot"></div>';
    const svg = s.stage.querySelector('.tr-svg');
    const startEl = s.stage.querySelector('.tr-flag.start');
    const endEl = s.stage.querySelector('.tr-flag.end');
    const dot = s.stage.querySelector('.tr-dot');

    let pts = [], shape = null, tol = 20, pathLen = 0, progress = 0;
    let round = 0, running = false, drawing = false;
    let prev = null, prevDir = null, wasOff = false, hudT = 0;
    let acc = { on:0, off:0, out:0, turn:0, n:0 };
    const total = { on:0, off:0, out:0, turn:0, n:0 };
    /* 接着上次：从上次那一轮接着描，之前几轮的准确率、平稳度都留着 */
    const from = s.from;
    if(from){
      round = clamp(Math.round(from.round || 0), 0, ROUNDS-1);
      const t = from.total || {};
      total.on = Math.max(0, Number(t.on) || 0);
      total.off = Math.max(0, Number(t.off) || 0);
      total.out = Math.max(0, Number(t.out) || 0);
      total.turn = Math.max(0, Number(t.turn) || 0);
      total.n = Math.max(0, Number(t.n) || 0);
    }

    const accPct = a => { const n = a.on + a.off; return n ? a.on/n*100 : 100; };
    const smoothPct = a => { const m = a.n ? a.turn/a.n : 0; return clamp(100 - m*1.5, 0, 100); };
    const lastIdx = () => Math.max(1, pts.length - 1);

    function setInk(p){
      const ink = svg.querySelector('.tr-ink');
      if(ink) ink.setAttribute('stroke-dasharray', (p*pathLen).toFixed(1)+' '+(pathLen*1.2).toFixed(1));
    }
    function drawHud(force){
      const now = performance.now();
      if(!force && now - hudT < 90) return;
      hudT = now;
      s.setHud([
        { k:'轮次', v:(round+1) + ' / ' + ROUNDS },
        { k:'进度', v:Math.round(progress/lastIdx()*100) + '%', tone: progress >= pts.length-3 ? 'good' : '' },
        { k:'准确率', v:Math.round(accPct(acc)) + '%' },
        { k:'平稳度', v:Math.round(smoothPct(acc)) + '%' }
      ]);
    }
    function buildRound(){
      const r = s.stage.getBoundingClientRect();
      const W = Math.max(320, Math.round(r.width)), H = Math.max(240, Math.round(r.height));
      shape = SHAPES[round]; tol = shape.tol;
      const pad = tol + 20;
      pts = [];
      for(let i=0;i<=N;i++){
        const n = shape.at(i/N);
        pts.push({ x:pad + n.x*(W-2*pad), y:pad + n.y*(H-2*pad) });
      }
      pathLen = 0;
      for(let i=1;i<pts.length;i++) pathLen += Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
      const d = 'M ' + pts.map(p=>p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' L ');
      svg.setAttribute('width', W); svg.setAttribute('height', H);
      svg.setAttribute('viewBox', '0 0 '+W+' '+H);
      svg.classList.remove('off');
      svg.innerHTML =
        '<path class="tr-groove" style="stroke-width:'+(tol*2)+'" d="'+d+'"/>'+
        '<path class="tr-center" d="'+d+'"/>'+
        '<path class="tr-ink" style="stroke-width:'+(tol*1.5)+'" d="'+d+'"/>';
      setInk(0);
      startEl.style.left = pts[0].x+'px'; startEl.style.top = pts[0].y+'px';
      endEl.style.left = pts[pts.length-1].x+'px'; endEl.style.top = pts[pts.length-1].y+'px';
      acc = { on:0, off:0, out:0, turn:0, n:0 };
      progress = 0; prev = null; prevDir = null; wasOff = false; drawing = false;
      dot.classList.remove('off'); dot.style.opacity = '0';
      drawHud(true);
    }
    function local(e){
      const r = s.stage.getBoundingClientRect();
      return { x:e.clientX - r.left, y:e.clientY - r.top };
    }
    function distSeg(p, a, b){
      const vx = b.x-a.x, vy = b.y-a.y, wx = p.x-a.x, wy = p.y-a.y;
      const L2 = vx*vx + vy*vy;
      let t = L2 ? (wx*vx + wy*vy)/L2 : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      return Math.hypot(p.x-(a.x+vx*t), p.y-(a.y+vy*t));
    }
    function nearest(p){
      const lo = Math.max(0, progress-24), hi = Math.min(pts.length-2, progress+46);
      let best = Infinity, bi = progress;
      for(let i=lo;i<=hi;i++){
        const d = distSeg(p, pts[i], pts[i+1]);
        if(d < best){ best = d; bi = i; }
      }
      return { d:best, i:bi };
    }
    function place(p){ dot.style.left = p.x+'px'; dot.style.top = p.y+'px'; }

    function finishRound(){
      if(!running) return;
      running = false; drawing = false;
      dot.style.opacity = '0';
      svg.classList.remove('off');
      total.on += acc.on; total.off += acc.off; total.out += acc.out;
      total.turn += acc.turn; total.n += acc.n;
      round++;
      saveStage(s.mode.id, { round:round, total:total });   /* 一轮做完就落盘，接着做下一轮 */
      if(round >= ROUNDS){ s.timeout(finish, 280); return; }
      const tip = document.createElement('div');
      tip.className = 'round-tip';
      tip.textContent = '第 ' + round + ' 轮完成';
      s.stage.appendChild(tip);
      s.timeout(()=>{ tip.remove(); buildRound(); running = true; }, 820);
    }
    function finish(){
      const a = Math.round(accPct(total)), sm = Math.round(smoothPct(total));
      const score = Math.round(a*0.6 + sm*0.4);
      s.end({
        value: score, valueText: score, unit:'分', headline:'描线综合得分',
        stars: s.mode.star(score),
        lines:['准确率 '+a+'%', '平稳度 '+sm+'%', '出界 '+total.out+' 次']
      });
    }

    s.stage.addEventListener('pointerdown', e=>{
      if(!running) return;
      const p = local(e);
      const anchor = progress > 0 ? pts[progress] : pts[0];
      if(Math.hypot(p.x-anchor.x, p.y-anchor.y) > tol*2){
        popText(s.stage, progress > 0 ? '接着断点继续' : '从起点起笔', p.x, p.y, true);
        return;
      }
      drawing = true; prev = null; prevDir = null;
      try{ s.stage.setPointerCapture(e.pointerId); }catch(err){}
      dot.style.opacity = '1';
      place(p);
    });
    s.stage.addEventListener('pointermove', e=>{
      if(!drawing || !running) return;
      const p = local(e);
      if(prev && Math.hypot(p.x-prev.x, p.y-prev.y) < 2.5) return;
      if(prev){
        const vx = p.x-prev.x, vy = p.y-prev.y, len = Math.hypot(vx,vy);
        if(len > 0.01){
          if(prevDir){
            const dp = Math.max(-1, Math.min(1, (vx*prevDir.x + vy*prevDir.y)/len));
            acc.turn += Math.acos(dp)*180/Math.PI; acc.n++;
          }
          prevDir = { x:vx/len, y:vy/len };
        }
      }
      prev = p;
      place(p);
      const n = nearest(p);
      const on = n.d <= tol;
      dot.classList.toggle('off', !on);
      svg.classList.toggle('off', !on);
      if(on){
        acc.on++;
        if(n.i > progress){ progress = n.i; setInk(progress/lastIdx()); }
      } else {
        acc.off++;
        if(!wasOff) acc.out++;
      }
      wasOff = !on;
      drawHud();
      if(progress >= pts.length-3) finishRound();
    });
    const release = ()=>{ drawing = false; prev = null; prevDir = null; dot.style.opacity = '0'; };
    s.stage.addEventListener('pointerup', release);
    s.stage.addEventListener('pointercancel', release);

    s.on(window, 'resize', ()=>{ if(!s.dead && pts.length) buildRound(); });
    buildRound();
    s.timeout(()=>{
      countdown(s, 3, ()=>{ running = true; });
    }, 120);
  }

  /* ============================================================
     07 · 双击特训
  ============================================================ */
  function gameDouble(s){
    const DUR = 30, WINDOW = 460;
    /* 接着上次：击碎、单点、溜走和剩下的秒数都留着 */
    const from = s.from;
    let done = 0, singles = 0, escape = 0, left = DUR, running = false, startAt = 0;
    if(from){
      done = Math.max(0, Math.round(from.done || 0));
      singles = Math.max(0, Math.round(from.singles || 0));
      escape = Math.max(0, Math.round(from.escape || 0));
      left = clamp(Number(from.left) || DUR, 0.5, DUR);
    }
    let target = null;
    drawHud();

    function drawHud(){
      s.setHud([
        { k:'击碎', v: done, tone:'good' },
        { k:'单点无效', v: singles, tone: singles?'warn':'' },
        { k:'溜走', v: escape, tone: escape?'bad':'' },
        { k:'剩余', v: left.toFixed(1) + ' s', tone: left<=5?'bad':'' }
      ]);
    }
    function spawn(){
      if(s.dead || !running || target) return;
      const rect = s.stage.getBoundingClientRect();
      const r = Math.max(42, 70 - done*1.8);
      const x = rand(r+10, Math.max(r+12, rect.width - r - 10));
      const y = rand(r+10, Math.max(r+12, rect.height - r - 10));
      const el = document.createElement('div');
      el.className = 'dtarget';
      el.style.cssText = 'left:'+(x-r)+'px;top:'+(y-r)+'px;width:'+(r*2)+'px;height:'+(r*2)+'px;'
                       + 'font-size:'+Math.max(16, r*0.34)+'px;letter-spacing:.06em';
      el.textContent = '双击';
      s.stage.appendChild(el);
      const t = { el, r, timer:null, last:0 };
      t.timer = s.timeout(()=>{
        if(target !== t) return;
        target = null;
        escape++; sfx.bad(); drawHud();
        el.classList.add('dead');
        s.timeout(()=>{ el.remove(); spawn(); }, 220);
      }, 6000);
      el.addEventListener('pointerdown', ev=>{
        ev.stopPropagation();
        if(!running || target !== t) return;
        const now = performance.now();
        if(t.last && now - t.last < WINDOW){
          s.clear(t.timer);
          target = null;
          done++; sfx.good();
          popText(s.stage, '完成', x, y);
          el.classList.add('dead');
          s.timeout(()=>el.remove(), 220);
          drawHud();
          s.timeout(spawn, 260);
        } else {
          t.last = now;
          singles++;
          el.classList.remove('tap'); void el.offsetWidth; el.classList.add('tap');
          sfx.click(); drawHud();
        }
      });
      target = t;
    }
    s.timeout(()=>{
      countdown(s, 3, ()=>{
        running = true; startAt = performance.now() - (DUR-left)*1000;
        spawn();
        s.interval(()=>{
          left = Math.max(0, DUR - (performance.now()-startAt)/1000);
          drawHud();
          saveStage(s.mode.id, { done:done, singles:singles, escape:escape, left:left });
          if(left <= 0 && running){
            running = false;
            if(target){ s.clear(target.timer); target.el.remove(); target = null; }
            s.end({
              value: done, valueText: done, unit:'个', headline:'击碎的目标',
              stars: s.mode.star(done),
              lines:['单点无效 '+singles+' 次', '溜走 '+escape+' 个']
            });
          }
        }, 100);
      });
    }, 120);
  }

  /* ============================================================
     08 · 连点狂潮
  ============================================================ */
  function gameFrenzy(s){
    const DUR = 10;
    /* 接着上次：点击数、峰值都留着，计时从上次剩下的秒数接着走 */
    const from = s.from;
    let carried = 0;
    let count = 0, running = false, startAt = 0, peak = 0, secCount = 0, secAcc = 0;
    if(from){
      count = Math.max(0, Math.round(from.count || 0));
      peak = Math.max(0, Math.round(from.peak || 0));
      carried = clamp(DUR - (Number(from.left) || DUR), 0, DUR);
    }
    s.stage.innerHTML =
      '<div class="frenzy-center"><b id="fzNum">0</b><span>使劲点这里</span></div>';
    const num = s.stage.querySelector('#fzNum');
    if(count) num.textContent = count;
    drawHud();

    function drawHud(){
      const left = running ? Math.max(0, DUR - (performance.now()-startAt)/1000) : DUR;
      s.setHud([
        { k:'点击数', v: count, tone:'good' },
        { k:'每秒', v: (running && left < DUR ? (count/Math.max(.3, DUR-left)) : 0).toFixed(1) },
        { k:'峰值', v: peak + ' /s', tone:'warn' },
        { k:'剩余', v: left.toFixed(1) + ' s', tone: left<=3?'bad':'' }
      ]);
    }
    s.stage.addEventListener('pointerdown', e=>{
      if(!running) return;
      count++; secCount++;
      const r = s.stage.getBoundingClientRect();
      const rp = document.createElement('div');
      rp.className = 'ripple';
      rp.style.left = (e.clientX - r.left) + 'px';
      rp.style.top = (e.clientY - r.top) + 'px';
      s.stage.appendChild(rp);
      s.timeout(()=>rp.remove(), 520);
      num.textContent = count;
      num.classList.remove('bump'); void num.offsetWidth; num.classList.add('bump');
      sfx.click();
    });
    s.timeout(()=>{
      countdown(s, 3, ()=>{
        running = true; startAt = performance.now() - carried*1000; secAcc = performance.now();
        s.interval(()=>{
          const now = performance.now();
          if(now - secAcc >= 1000){ peak = Math.max(peak, secCount); secCount = 0; secAcc += 1000; }
          drawHud();
          const left = DUR - (now-startAt)/1000;
          saveStage(s.mode.id, { count:count, peak:peak, left:Math.max(0, left) });
          if(left <= 0 && running){
            running = false;
            peak = Math.max(peak, secCount);
            const cps = count/DUR;
            s.end({
              value: cps, valueText: cps.toFixed(1), unit:'次/秒', headline:'平均点击速度',
              stars: s.mode.star(cps),
              lines:['共点击 '+count+' 下', '最快一秒 '+peak+' 下']
            });
          }
        }, 80);
      });
    }, 120);
  }

  /* ============================================================
     通关闭幕：八关全满（24 / 24 星）之后的奖杯页 + 无尽点点乐
     ——和鼠标练习营的结束页是同一套，入口条件换成了"八关全部三星"。
       1) 只在 endGame 里算出 24 / 24 时进入；?finale=1 只用于预览验收。
       2) 进来就锁死：滚动 / 右键 / 拖拽 / 键盘全挡掉，学生出不去这一页。
       3) 下半区是无限小游戏：点掉掉落物 +1 分、金色 🌟 +5 分，每 10 分升一关，
          只显示「得分」和「第几关」，不记最高分、不做排行、漏掉不扣分。
  ============================================================ */
  let previewFinale = false;             /* ?finale=1 预览：24 星只存在内存里，不写存档 */
  let finaleOn = false;
  let celebrateTimer = 0;
  function clearCelebrateTimer(){
    if(celebrateTimer){ clearTimeout(celebrateTimer); celebrateTimer = 0; }
  }

  /* ===== 通关闭幕的现场（localStorage）=====
     和每个关卡的现场同理：学生正在庆典页玩无尽点点乐时手一抖刷新了，
     不该被丢回关卡列表、更不该把攒的分数清零。所以这一页也落盘：
       {ts, score, level}——在不在庆典（ts 是最后活动时间）、无尽关的得分和第几关。
     只有两种情况下会落盘：真的进了庆典，而且不是 ?finale=1 预览。
     FINALE_FRESH 之外的存档算过期：上一节课做完的庆典，下一节课打开是正常的
     关卡列表（首页那条金色横幅还在，点一下就能回到庆典），不会被永远锁在庆典里。 */
  const FINALE_KEY = 'mouseReactionLab.finale.v1';
  const FINALE_FRESH = 30*60*1000;
  let finaleEndless = { score:0, level:1 };
  let finaleWriteAt = 0;
  function writeFinaleState(force){
    if(previewFinale) return;
    const now = Date.now();
    if(!force && now - finaleWriteAt < 900) return;
    finaleWriteAt = now;
    try{
      localStorage.setItem(FINALE_KEY, JSON.stringify({
        v:1, ts:now, score:finaleEndless.score, level:finaleEndless.level
      }));
    }catch(e){}
  }
  function readFinaleState(){
    let d = null;
    try{ d = JSON.parse(localStorage.getItem(FINALE_KEY) || 'null'); }catch(e){ d = null; }
    if(!d || typeof d !== 'object') return null;
    if(!(Date.now() - (d.ts || 0) < FINALE_FRESH)) return null;
    return { score: Math.max(0, Math.round(d.score || 0)), level: Math.max(1, Math.round(d.level || 1)) };
  }

  /* 通关页撒的花：和练习营同一套配色，只是类名换成 .finale-cf，
     因为本页自己的结算撒花已经占用了 .cf。 */
  function bigConfetti(){
    const colors = ['#ff6fa5','#ffd23f','#44a3ff','#4ed47e','#a577ff','#43d2e8','#ff9f45','#fff7d6'];
    for(let i=0;i<70;i++){
      const c = document.createElement('div'); c.className = 'finale-cf';
      const sz = 8 + Math.random()*12;
      c.style.left = (Math.random()*100)+'vw';
      c.style.width = sz+'px'; c.style.height = (sz*1.4)+'px';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.borderRadius = Math.random()<0.4 ? '50%' : '3px';
      c.style.animationDuration = (2.2+Math.random()*2)+'s';
      c.style.animationDelay = (Math.random()*1.2)+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 5000);
    }
  }

  /* 烟花画布：火箭升空 → 炸成火花，外加一直飘落的纸片 */
  function startFireworks(){
    const cv = $('#fxCanvas'), ctx = cv.getContext('2d');
    let W = 0, H = 0, dpr = 1, S = 1;
    function resize(){
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      S = Math.max(0.62, Math.min(1.5, H/900));
      cv.width = Math.max(1, Math.round(W*dpr)); cv.height = Math.max(1, Math.round(H*dpr));
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.lineCap = 'round';
    }
    resize();
    window.addEventListener('resize', resize);
    const COLORS = ['#ff6fa5','#ffd23f','#44a3ff','#4ed47e','#a577ff','#43d2e8','#ff9f45','#fff7d6'];
    const pick = () => COLORS[Math.floor(Math.random()*COLORS.length)];
    const rockets = [], sparks = [], confs = [];
    function launch(x){
      rockets.push({
        x:(x == null ? W*(0.12+Math.random()*0.76) : Math.max(24, Math.min(W-24, x))),
        y:H+14, vy:-(H*0.0105+Math.random()*H*0.0042),
        ty:H*(0.10+Math.random()*0.34), col:pick(), trail:[]
      });
    }
    function explode(x,y,col){
      const n = 62+Math.floor(Math.random()*40);
      const spread = 0.85+Math.random()*0.3;
      for(let i=0;i<n;i++){
        const a = (Math.PI*2*i)/n + Math.random()*0.12;
        const sp = (1.5+Math.random()*4.2)*S;
        sparks.push({
          x:x, y:y, vx:Math.cos(a)*sp*spread, vy:Math.sin(a)*sp*spread,
          life:1, decay:0.0055+Math.random()*0.011,
          col:(Math.random()<0.7 ? col : pick()), r:1.5+Math.random()*2.1
        });
      }
      sparks.push({ x:x, y:y, vx:0, vy:0, life:1, decay:0.06, col:col, r:10*S, flash:true });
    }
    function rainConfetti(n){
      for(let i=0;i<n;i++){
        confs.push({
          x:Math.random()*W, y:-Math.random()*H*0.9,
          vx:(Math.random()-.5)*1.6, vy:0.8+Math.random()*2.2,
          w:6+Math.random()*8, h:9+Math.random()*10,
          rot:Math.random()*6.283, vr:(Math.random()-.5)*0.4,
          col:pick(), seed:Math.random()*100
        });
      }
    }
    rainConfetti(150);
    let start = 0, last = 0, nextLaunch = 0;
    function frame(now){
      if(!start){ start = now; last = now; }
      const d = Math.min(2.6, (now-last)/16.667); last = now;
      const el = now-start;
      /* 每帧重画，拖尾靠粒子自己带（不用半透明蒙层，火花更干净） */
      ctx.clearRect(0,0,W,H);
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      /* 发射节奏：开头密集一阵，之后变成背景烟花 */
      if(el > nextLaunch){
        launch();
        if(el < 2600){ launch(); if(Math.random() < 0.5) launch(); }
        nextLaunch = el + (el < 4000 ? 210+Math.random()*170 : 850+Math.random()*950);
      }
      for(let i=rockets.length-1;i>=0;i--){
        const r = rockets[i];
        r.trail.push({ x:r.x, y:r.y }); if(r.trail.length > 9) r.trail.shift();
        r.y += r.vy*d; r.vy += 0.05*d*S;
        for(let k=0;k<r.trail.length;k++){
          const q = r.trail[k], a = (k+1)/r.trail.length;
          ctx.globalAlpha = a*0.85; ctx.fillStyle = r.col;
          ctx.beginPath(); ctx.arc(q.x, q.y, 1.7*a+0.5, 0, 6.283); ctx.fill();
        }
        ctx.globalAlpha = 1; ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(r.x, r.y, 2.6, 0, 6.283); ctx.fill();
        if(r.y <= r.ty || r.vy >= 0){ explode(r.x, r.y, r.col); rockets.splice(i,1); }
      }
      for(let i=sparks.length-1;i>=0;i--){
        const p = sparks[i];
        if(p.flash){
          p.life -= p.decay*d;
          if(p.life <= 0){ sparks.splice(i,1); continue; }
          ctx.globalAlpha = p.life*0.38; ctx.fillStyle = p.col;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(1.25-p.life), 0, 6.283); ctx.fill();
          continue;
        }
        p.px = p.x; p.py = p.y;
        p.x += p.vx*d; p.y += p.vy*d;
        p.vy += 0.035*d*S;
        p.vx *= Math.pow(0.986, d); p.vy *= Math.pow(0.986, d);
        p.life -= p.decay*d*1.6;
        if(p.life <= 0){ sparks.splice(i,1); continue; }
        const rr = p.r*(0.35+p.life*0.95);
        ctx.globalAlpha = Math.min(1, p.life)*0.9;
        ctx.strokeStyle = p.col; ctx.lineWidth = rr*1.7;
        ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
        ctx.globalAlpha = Math.min(1, p.life);
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(p.x, p.y, rr*0.55, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      for(let i=confs.length-1;i>=0;i--){
        const c = confs[i];
        c.x += c.vx*d; c.y += c.vy*d;
        c.vy = Math.min(c.vy+0.03*d*S, 3.4*S);
        c.vx += Math.sin((c.y+c.seed)/70)*0.02*d;
        c.rot += c.vr*d;
        if(c.y > H+40){ confs.splice(i,1); continue; }
        ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
        ctx.globalAlpha = 0.95; ctx.fillStyle = c.col;
        ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ===== 无尽点点乐 =====
     普通物件 +1 分，金色 🌟 +5 分；每 10 分升一关——落得更快、来得更密，
     所以是无限关。物件用 pointerdown（响应更快），同时存在上限 16 个。 */
  function startEndless(){
    const area = $('#epArea');
    if(!area) return;
    const scoreEl = $('#epScore'), lvEl = $('#epLevel'), lvChip = $('#epLvChip'), tip = $('#epTip');
    const ITEMS = ['⭐','🎈','🍎','🍓','⚽','🍬','🐤','🌸','🍀'];
    const GOLD = '🌟';
    /* 难度曲线：第 1 关每秒下落约 0.3 个掉落区高度（约 3.3 秒落到底）、
       平均 0.7 秒来一个；每升一关快一点、密一点，不设上限。 */
    const FALL_H = 0.26, LEVEL_FAST = 0.035;
    /* 刷新前攒的分数和第几关接着用（startFinale 已经把存档读进 finaleEndless） */
    let score = finaleEndless.score, level = finaleEndless.level;
    let items = [], last = 0, nextSpawn = 350;
    if(scoreEl) scoreEl.textContent = score;
    if(lvEl) lvEl.textContent = level;
    if(tip) setTimeout(()=>tip.classList.add('hide'), 5200);

    function spawn(){
      const w = area.clientWidth, h = area.clientHeight;
      if(w < 40 || h < 40) return;
      const gold = Math.random() < 0.12;
      const size = Math.max(34, Math.min(62, Math.round(h*0.22)));
      const x = 6 + Math.random()*Math.max(6, w-size-12);
      const el = document.createElement('div');
      el.className = 'ep-item' + (gold ? ' gold' : '');
      el.style.width = size+'px'; el.style.height = size+'px';
      el.style.lineHeight = size+'px';
      el.style.fontSize = Math.round(size*0.56)+'px';
      el.textContent = gold ? GOLD : ITEMS[Math.floor(Math.random()*ITEMS.length)];
      const it = { el:el, x:x, y:-size, size:size, gold:gold, dead:false,
                   vy:h*(FALL_H+level*LEVEL_FAST)*(0.85+Math.random()*0.35) };
      el.style.transform = 'translate3d('+it.x+'px,'+it.y+'px,0)';
      area.appendChild(el);
      el.addEventListener('pointerdown', ev=>{ ev.preventDefault(); hit(it); });
      items.push(it);
      if(items.length > 16){                     /* 保险：同时存在太多就淘汰最老的 */
        const old = items.shift();
        if(old && old.el && old.el.parentNode) old.el.parentNode.removeChild(old.el);
      }
    }

    function rise(it, gain){
      const p = document.createElement('div');
      p.className = 'ep-plus' + (gain > 1 ? ' big' : '');
      p.textContent = '+' + gain;
      p.style.left = (it.x + it.size/2)+'px';
      p.style.top = (it.y + it.size*0.15)+'px';
      area.appendChild(p);
      setTimeout(()=>{ if(p.parentNode) p.parentNode.removeChild(p); }, 900);
    }

    function hit(it){
      if(it.dead) return;
      it.dead = true;
      const idx = items.indexOf(it); if(idx >= 0) items.splice(idx,1);
      const gain = it.gold ? 5 : 1;
      score += gain;
      scoreEl.textContent = score;
      const nl = Math.floor(score/10)+1;
      if(nl > level){                            /* 每 10 分升一关：更快、更密，并晃一下提示 */
        level = nl; lvEl.textContent = level;
        if(lvChip){ lvChip.classList.remove('flash'); void lvChip.offsetWidth; lvChip.classList.add('flash'); }
      }
      finaleEndless.score = score; finaleEndless.level = level;
      writeFinaleState(true);                    /* 得分是离散事件，立刻落盘，刷新后不会少分 */
      it.el.style.transform = 'translate3d('+it.x+'px,'+it.y+'px,0) scale(1.45)';
      it.el.style.opacity = '0';
      setTimeout(()=>{ if(it.el.parentNode) it.el.parentNode.removeChild(it.el); }, 260);
      rise(it, gain);
      beep(it.gold ? 1180 : 880, .09, 'sine', .05);
    }

    window.addEventListener('resize', ()=>{
      const w = area.clientWidth;
      items.forEach(it=>{
        if(it.x > w-it.size-4){
          it.x = Math.max(4, w-it.size-4);
          it.el.style.transform = 'translate3d('+it.x+'px,'+it.y+'px,0)';
        }
      });
    });

    function frame(now){
      requestAnimationFrame(frame);
      if(document.hidden) return;
      writeFinaleState();                        /* 滑一下存档时间：正在玩就别算过期 */
      if(!last){ last = now; return; }
      const dt = Math.min(.05, (now-last)/1000); last = now;
      const h = area.clientHeight;
      if(h < 40) return;
      nextSpawn -= dt*1000;
      if(nextSpawn <= 0){
        spawn();
        nextSpawn = Math.max(300, 700-level*45)*(0.8+Math.random()*0.5);
      }
      for(let i=items.length-1;i>=0;i--){
        const it = items[i];
        it.y += it.vy*dt;
        if(it.y > h){                            /* 漏掉了：不扣分，也不惩罚 */
          it.dead = true;
          if(it.el.parentNode) it.el.parentNode.removeChild(it.el);
          items.splice(i,1);
          continue;
        }
        it.el.style.transform = 'translate3d('+it.x+'px,'+it.y+'px,0)';
      }
    }
    requestAnimationFrame(frame);
  }

  function startFinale(){
    if(finaleOn) return;
    finaleOn = true;
    const box = $('#finale');
    /* 预览不看存档、也不写存档；正常进来就接着上次的分数继续 */
    finaleEndless = previewFinale ? { score:0, level:1 } : (readFinaleState() || { score:0, level:1 });
    writeFinaleState(true);
    document.documentElement.style.overflow = 'hidden';
    document.body.classList.add('locked');
    hideOverlay();
    $('#celebrateBar').disabled = true;
    document.querySelectorAll('#homeGrid .mode').forEach(b=>{ b.disabled = true; });
    box.classList.add('show');
    bigConfetti();                                        /* 撒花 */
    startFireworks();                                     /* 烟花 */
    setTimeout(()=>box.classList.add('card-in'), 1500);    /* 大奖杯 */
    setTimeout(bigConfetti, 2700);
    setTimeout(startEndless, 1700);                        /* 通关后一直有得玩 */
    /* 锁定：画面停在这里，不接受任何滚动 / 右键 / 键盘操作 */
    const block = e => { e.preventDefault(); e.stopPropagation(); };
    const stopKeys = [' ','Spacebar','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'];
    document.addEventListener('wheel', block, { passive:false, capture:true });
    document.addEventListener('touchmove', block, { passive:false, capture:true });
    document.addEventListener('contextmenu', block, { capture:true });
    document.addEventListener('dragstart', block, { capture:true });
    document.addEventListener('selectstart', block, { capture:true });
    document.addEventListener('keydown', e=>{ if(stopKeys.indexOf(e.key) >= 0) block(e); }, true);
    document.addEventListener('click', e=>{ if(!box.contains(e.target)) block(e); }, true);
  }

  /* 结算卡按「进入通关庆典」、首页金色横幅都走这里：先收回游戏视图再开幕 */
  function enterFinale(){
    if(finaleOn) return;
    clearCelebrateTimer();
    goHome();
    startFinale();
  }

  /* ================= 启动 ================= */
  /* 网址后面加 ?finale=1 直接进通关闭幕（预览 / 验收用，不写进任何界面提示）。
     先认这个参数：预览期间 24 星只标在内存里，不写 localStorage，
     也不写"正在庆典里"的标记，免得污染学生机上的真实进度。 */
  previewFinale = /[?&]finale=1\b/.test(location.search);
  restoreStageSave();      /* 先把各关"做了一半的现场"读回来，首页才标得出「上次做到一半」 */
  if(previewFinale){
    MODES.forEach(m=>{
      const r = records[m.id] || { best:null, stars:0, plays:0 };
      r.stars = 3; records[m.id] = r;
    });
  }
  refreshTotal();
  renderHome();
  if(previewFinale){
    setTimeout(startFinale, 60);
  } else if(allPerfect() && readFinaleState()){
    /* 刷新前就停在通关闭幕里（误按刷新、误关标签页都算）：直接回到庆典，
       无尽点点乐的得分和第几关也接着上次继续 */
    setTimeout(startFinale, 60);
  }
})();
</script>
</body>
</html>
