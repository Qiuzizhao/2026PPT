<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>鼠标反应力实验室</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23f7f6f2'/><rect x='.75' y='.75' width='30.5' height='30.5' rx='6.5' fill='none' stroke='%231c3d6e' stroke-opacity='.28' stroke-width='1.5'/><path d='M17.6 4L6.8 18.4h8.1L13.6 28l11-14.4h-8.2z' fill='%23d9a93a' stroke='%23806620' stroke-width='1.6' stroke-linejoin='round'/></svg>">
<meta name="theme-color" content="#f5f4f1">
<style>
  :root{
    --bg:#f5f4f1;
    --surface:#ffffff;
    --surface-2:#fbfaf8;
    --line:#e8e6e0;
    --line-2:#d9d6ce;
    --ink:#1b1b19;
    --ink-2:#6f6d66;
    --ink-3:#a5a29a;
    --good:#4a7a52;
    --warn:#96762c;
    --bad:#a34f4f;
    --ease:cubic-bezier(.2,0,0,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    font-size:16px; line-height:1.55; min-height:100vh;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:0 28px 48px}

  /* ===== 页头 ===== */
  header{display:flex;align-items:center;gap:12px;padding:30px 0 22px}
  html.no-flexgap header > *:not(:last-child){margin-right:12px}
  .mark{width:24px;height:24px;flex:0 0 24px;color:var(--ink)}
  .brand{font-size:19px;font-weight:600;letter-spacing:.01em}
  .brand span{color:var(--ink-3);font-weight:400;margin-left:10px;font-size:14px;letter-spacing:.04em}
  .total{margin-left:auto;font-size:15px;color:var(--ink-2);letter-spacing:.03em;font-variant-numeric:tabular-nums}
  .total b{color:var(--ink);font-weight:600}

  /* ===== 面板 ===== */
  .panel{
    position:relative;background:var(--surface);
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 1px 2px rgba(27,27,25,.03);
  }
  .panel.playing{height:620px;height:clamp(420px,68vh,620px)}
  .hidden{display:none !important}

  /* ===== 模式列表 ===== */
  .modes{display:grid;grid-template-columns:1fr 1fr}
  .mode{
    display:flex;align-items:center;gap:16px;width:100%;min-height:86px;
    padding:18px 26px;background:none;border:0;border-bottom:1px solid var(--line);
    font:inherit;color:inherit;text-align:left;cursor:pointer;
    transition:background .18s var(--ease);
  }
  html.no-flexgap .mode > *:not(:last-child){margin-right:16px}
  .mode:nth-child(odd){border-right:1px solid var(--line)}
  .mode:nth-last-child(-n+2){border-bottom:0}
  .mode:hover{background:var(--surface-2)}
  .mode:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
  .mi{width:26px;height:26px;flex:0 0 26px;color:var(--h)}
  .m-body{display:flex;flex-direction:column;gap:2px;min-width:0}
  html.no-flexgap .m-body > *:not(:last-child){margin-bottom:2px}
  .m-name{font-size:18px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
  .m-cat{font-size:14px;color:var(--ink-3);white-space:nowrap}
  .m-right{margin-left:auto;display:flex;align-items:center;gap:20px;flex-shrink:0}
  html.no-flexgap .m-right > *:not(:last-child){margin-right:20px}
  .m-best{font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .m-stars{display:flex;gap:2px;font-size:16px;line-height:1}
  html.no-flexgap .m-stars > *:not(:last-child){margin-right:2px}
  .m-stars i{font-style:normal;color:var(--line-2)}
  .m-stars i.on{color:var(--h)}

  /* ===== 游戏视图 ===== */
  .game{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;gap:18px;padding:22px 26px 24px}
  html.no-flexgap .game > *:not(:last-child){margin-bottom:18px}
  .gbar{display:flex;align-items:center;gap:16px}
  html.no-flexgap .gbar > *:not(:last-child){margin-right:16px}
  .back{
    display:flex;align-items:center;gap:6px;min-height:44px;
    border:1px solid var(--line-2);border-radius:11px;background:var(--surface);
    padding:0 18px;font:inherit;font-size:15px;font-weight:500;letter-spacing:.02em;
    color:var(--ink-2);cursor:pointer;
    transition:color .16s var(--ease),border-color .16s var(--ease);
  }
  html.no-flexgap .back > *:not(:last-child){margin-right:6px}
  .back:hover{color:var(--ink);border-color:var(--ink-3)}
  .back:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .gtitle{font-size:20px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
  .gcat{font-size:15px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 「接着上次继续」时标题栏多出来的两样：一枚小标 + 一个重新开始 */
  .rstart{min-height:44px;padding:0 16px;font-size:14px;white-space:nowrap;flex:0 0 auto}
  .resume-chip{
    display:inline-flex;align-items:center;flex:0 0 auto;
    padding:4px 12px;border-radius:999px;white-space:nowrap;
    font-size:13px;letter-spacing:.04em;color:#4a3708;
    background:#ffe9a8;border:1px solid #e8cf7e;
  }
  .gbest{margin-left:auto;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .stats{display:flex;gap:46px;flex-wrap:wrap}
  html.no-flexgap .stats > *:not(:last-child){margin-right:46px}
  .stat{display:flex;flex-direction:column;gap:2px}
  html.no-flexgap .stat > *:not(:last-child){margin-bottom:2px}
  .stat span{font-size:13px;color:var(--ink-3);letter-spacing:.05em;white-space:nowrap}
  .stat b{font-size:24px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stat b.good{color:var(--good)} .stat b.warn{color:var(--warn)} .stat b.bad{color:var(--bad)}

  .stagewrap{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface-2)}
  .stage{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;touch-action:none}

  /* ===== 结算 ===== */
  .scrim{
    position:absolute;top:0;right:0;bottom:0;left:0;z-index:50;display:grid;place-items:center;padding:20px;
    background:rgba(27,27,25,.16);backdrop-filter:blur(3px);
    opacity:0;transition:opacity .2s var(--ease);
  }
  .scrim.show{opacity:1}
  .sheet{
    width:420px;max-width:100%;width:min(420px,100%);max-height:100%;overflow:auto;background:var(--surface);
    border-radius:16px;padding:32px 30px 26px;text-align:center;
    box-shadow:0 24px 60px -24px rgba(27,27,25,.34);
    transform:translateY(8px);transition:transform .26s var(--ease);
  }
  .scrim.show .sheet{transform:none}
  .s-stars{display:flex;gap:4px;justify-content:center;margin-bottom:18px;font-size:22px;line-height:1}
  html.no-flexgap .s-stars > *:not(:last-child){margin-right:4px}
  .s-stars i{font-style:normal;color:var(--line-2)}
  .s-stars i.on{color:var(--ink);animation:dotIn .4s var(--ease) both}
  @keyframes dotIn{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
  .s-value{font-size:60px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .s-value small{font-size:18px;font-weight:400;letter-spacing:0;color:var(--ink-2);margin-left:6px}
  .s-label{font-size:15px;color:var(--ink-3);letter-spacing:.05em;margin-top:10px}
  .s-badge{
    display:inline-block;margin-top:16px;font-size:14px;letter-spacing:.06em;
    color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:5px 15px;
  }
  .s-detail{font-size:15px;color:var(--ink-2);line-height:1.9;margin-top:16px;font-variant-numeric:tabular-nums}
  .s-actions{display:flex;gap:12px;justify-content:center;margin-top:26px}
  html.no-flexgap .s-actions > *:not(:last-child){margin-right:12px}
  .btn{
    border:1px solid transparent;border-radius:12px;padding:0 28px;min-height:52px;
    font:inherit;font-size:17px;font-weight:600;cursor:pointer;
    transition:background .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease);
  }
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.primary:hover{background:#000}
  .btn.plain{background:transparent;border-color:var(--line-2);color:var(--ink-2)}
  .btn.plain:hover{color:var(--ink);border-color:var(--ink-3)}

  /* ===== 通用动效 ===== */
  .countdown{
    position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;
    font-size:106px;font-size:clamp(64px,13vw,106px);font-weight:200;letter-spacing:-.04em;
    color:var(--ink);z-index:40;pointer-events:none;
  }
  .countdown.pop{animation:cdIn .44s var(--ease)}
  @keyframes cdIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pop-text{
    position:absolute;font-size:16px;font-weight:600;letter-spacing:.04em;color:var(--ink);
    pointer-events:none;z-index:45;transform:translate(-50%,-50%);
    animation:popUp .7s var(--ease) forwards;
  }
  .pop-text.bad{color:var(--bad)}
  @keyframes popUp{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-160%)}}
  .round-tip{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:16px;letter-spacing:.04em;color:var(--ink-2);
    background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 26px;
    pointer-events:none;
  }
  .cf{position:fixed;top:-12px;width:4px;height:10px;border-radius:2px;z-index:80;pointer-events:none;animation:cfFall 1.3s ease-in forwards}
  @keyframes cfFall{to{transform:translateY(105vh) rotate(420deg);opacity:.15}}

  /* ===== 01 闪电反应 ===== */
  .center-fill{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:18px}
  html.no-flexgap .center-fill > *:not(:last-child){margin-bottom:6px}
  .rx-title{font-size:60px;font-size:clamp(36px,7vw,60px);font-weight:300;letter-spacing:-.02em;line-height:1.15}
  .rx-sub{font-size:17px;color:var(--ink-3);letter-spacing:.04em}
  .rx-dots{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;justify-content:center}
  html.no-flexgap .rx-dots > *:not(:last-child){margin-right:8px}
  .rx-dots i{
    font-style:normal;width:46px;height:46px;border-radius:12px;border:1px solid var(--line-2);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  }
  .rx-dots i.cur{border-color:var(--ink-3);color:var(--ink-2)}
  .rx-dots i.done{background:var(--ink);border-color:var(--ink);color:#fff}
  .rx-dots i.fast{background:var(--good);border-color:var(--good);color:#fff}
  .stage.rx-idle{background:var(--surface-2)}
  .stage.rx-ready{background:#efede8}
  .stage.rx-go{background:#1b1b19}
  .stage.rx-hit{background:#f2f4f0}
  .stage.rx-early{background:#f5e8e5}
  .stage.rx-go .rx-title,.stage.rx-go .rx-sub{color:#fff}
  .stage.rx-early .rx-title{color:var(--bad)}

  /* ===== 02 打地鼠 ===== */
  .whack-grid{position:absolute;top:14px;right:14px;bottom:14px;left:14px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px}
  .hole{
    position:relative;overflow:hidden;border-radius:10px;
    background:#f0eee9;border:1px solid var(--line);
    transition:background .16s var(--ease);
  }
  .hole.up{background:#eae6de}
  .hole.bad{background:#f3e3e0}
  .hole.hit{background:#e3ece5}
  .mole{
    position:absolute;left:50%;bottom:-4%;width:52%;height:0;padding-bottom:54.6%;
    transform:translate(-50%,122%);transition:transform .16s var(--ease);
    border-radius:50% 50% 44% 44%;background:#b06a48;pointer-events:none;
  }
  .hole.up .mole{transform:translate(-50%,0);pointer-events:auto;cursor:pointer}
  .hole.hit .mole{transform:translate(-50%,0) scale(.88)}
  .mole .eye{position:absolute;top:34%;width:13%;height:0;padding-bottom:13%;background:#2a1c14;border-radius:50%}
  .mole .eye.l{left:24%} .mole .eye.r{right:24%}
  .mole .nose{position:absolute;top:58%;left:50%;transform:translateX(-50%);width:20%;height:0;padding-bottom:15.4%;background:#e6b9a5;border-radius:50%}

  /* ===== 03 靶心连击 ===== */
  .target{
    position:absolute;border-radius:50%;cursor:pointer;border:1px solid rgba(27,27,25,.08);
    background:radial-gradient(circle,#fff 0 26%,#a3566a 26% 34%,#fff 34% 58%,#a3566a 58% 66%,#fff 66% 100%);
    box-shadow:0 2px 10px -4px rgba(27,27,25,.3);
    animation:popIn .16s var(--ease);
  }
  .target .tl{position:absolute;top:16%;right:16%;bottom:16%;left:16%;border-radius:50%;border:1px solid var(--ink-3);animation:shrink linear forwards;animation-duration:var(--life,1200ms)}
  .target.dead{animation:dead .2s var(--ease) forwards}
  .target.flee{animation:flee .2s var(--ease) forwards}
  @keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes shrink{from{transform:scale(1.3);opacity:.55}to{transform:scale(.2);opacity:.06}}
  @keyframes dead{to{transform:scale(1.5);opacity:0}}
  @keyframes flee{to{transform:scale(.3);opacity:0}}

  /* ===== 04 拖拽归位 ===== */
  .drag-area{position:absolute;top:0;right:0;bottom:0;left:0}
  .ball{
    position:absolute;width:58px;height:58px;border-radius:50%;cursor:grab;touch-action:none;
    border:1px solid rgba(27,27,25,.1);box-shadow:0 2px 8px -3px rgba(27,27,25,.28);
    transition:box-shadow .16s var(--ease);
  }
  .ball.dragging{cursor:grabbing;z-index:60;box-shadow:0 10px 22px -6px rgba(27,27,25,.4)}
  .bins{position:absolute;left:10px;right:10px;bottom:16px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
  html.no-flexgap .bins > *:not(:last-child){margin-right:20px}
  .bin{
    width:92px;height:78px;border-radius:14px;border:1px dashed var(--line-2);background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    transition:border-color .16s var(--ease),background .16s var(--ease);
  }
  .bin .dot{width:28px;height:28px;border-radius:50%;opacity:.28;transition:all .18s var(--ease)}
  .bin.filled{background:var(--surface-2)}
  .bin.filled .dot{opacity:1;width:48px;height:48px}
  .bin.shake{animation:shake .34s var(--ease)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  /* ===== 05 循迹追踪 ===== */
  .tdot{
    position:absolute;left:0;top:0;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;
    border:1px solid #5566a8;background:rgba(85,102,168,.07);pointer-events:none;
    transition:background .14s var(--ease),border-color .14s var(--ease),box-shadow .14s var(--ease);
  }
  .tdot.in{background:rgba(85,102,168,.2);box-shadow:0 0 0 8px rgba(85,102,168,.07)}

  /* ===== 06 描线平稳 ===== */
  .tr-svg{position:absolute;left:0;top:0;pointer-events:none}
  .tr-svg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .tr-groove{stroke:#ecebe6}
  .tr-svg.off .tr-groove{stroke:#f2e2df}
  .tr-center{stroke:#d5d2ca;stroke-width:1.5;stroke-dasharray:4 9}
  .tr-ink{stroke:#3d7f86;transition:stroke .12s var(--ease)}
  .tr-flag{
    position:absolute;width:32px;height:32px;border-radius:50%;transform:translate(-50%,-50%);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:600;letter-spacing:.02em;pointer-events:none;
  }
  .tr-flag.start{background:#3d7f86;color:#fff}
  .tr-flag.end{background:var(--surface);color:var(--ink-3);border:1px solid var(--line-2)}
  .tr-dot{
    position:absolute;width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%);
    background:#3d7f86;border:2px solid #fff;pointer-events:none;opacity:0;
    box-shadow:0 1px 4px rgba(27,27,25,.25);
    transition:opacity .16s var(--ease),background .12s var(--ease);
  }
  .tr-dot.off{background:var(--bad)}

  /* ===== 07 双击特训 ===== */
  .dtarget{
    position:absolute;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-weight:600;color:var(--ink-2);
    background:var(--surface);border:1px solid #5f8163;
    box-shadow:inset 0 0 0 6px rgba(95,129,99,.1);
    animation:popIn .16s var(--ease);
  }
  .dtarget.tap{animation:tapPulse .18s var(--ease)}
  .dtarget.dead{animation:dead .2s var(--ease) forwards}
  @keyframes tapPulse{0%{transform:scale(1)}50%{transform:scale(.94)}100%{transform:scale(1)}}

  /* ===== 08 连点狂潮 ===== */
  .frenzy-center{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  html.no-flexgap .frenzy-center > *:not(:last-child){margin-bottom:6px}
  .frenzy-center b{font-size:116px;font-size:clamp(58px,15vw,116px);font-weight:200;line-height:1;letter-spacing:-.04em;color:#8a7b3f;font-variant-numeric:tabular-nums}
  .frenzy-center span{font-size:16px;color:var(--ink-3);letter-spacing:.05em}
  .frenzy-center b.bump{animation:bump .12s var(--ease)}
  @keyframes bump{50%{transform:scale(1.05)}}
  .ripple{
    position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
    border:1px solid #8a7b3f;pointer-events:none;animation:ripple .5s var(--ease) forwards;
  }
  @keyframes ripple{from{transform:scale(.3);opacity:.6}to{transform:scale(1.8);opacity:0}}

  /* ===== 通关闭幕（八关全满，24 / 24 星）=====
     和鼠标练习营的结束页是同一套：大奖杯 + 烟花 + 不会结束的「无尽点点乐」。
     只在八关全部拿到三星时进入；进来了就锁死在页面上（和练习营一致）。
     下半区的掉落小游戏是通关后的无限练习：点掉一个 +1 分、金色 🌟 +5 分，
     每 10 分升一关，更快更密，不设上限；漏掉不扣分。只显示「得分」和「第几关」。 */
  body.locked{overflow:hidden}
  .finale{
    position:fixed;top:0;right:0;bottom:0;left:0;z-index:30000;display:none;overflow:hidden;
    flex-direction:column;align-items:center;justify-content:center;padding:14px;
    background:radial-gradient(circle at 50% 36%,#4b3a8c 0%,#2c2356 48%,#16122f 100%);
  }
  .finale.show{display:flex}
  .finale-fx{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
  /* 通关页分上下两半：上半是奖杯，下半全是掉落物小游戏 */
  .finale-top{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;flex:1 1 50%;width:100%;min-height:0}
  .finale-card{
    position:relative;z-index:3;text-align:center;color:#fff;max-width:780px;
    opacity:0;transform:translateY(30px) scale(.82);
  }
  .finale.card-in .finale-card{animation:card-in .9s cubic-bezier(.18,1.5,.45,1) forwards}
  @keyframes card-in{
    0%{opacity:0;transform:translateY(34px) scale(.8)}
    60%{opacity:1;transform:translateY(-8px) scale(1.04)}
    100%{opacity:1;transform:none}
  }
  .trophy-wrap{
    position:relative;display:inline-flex;align-items:center;justify-content:center;
    width:168px;max-width:34vw;width:min(168px,34vw);height:168px;max-height:34vw;height:min(168px,34vw);
  }
  .trophy-wrap::before{
    content:"";position:absolute;top:4%;right:4%;bottom:4%;left:4%;border-radius:50%;

<script>
/* ===== 防误触兜底 =====
   1) 右键菜单：学生鼠标不熟练，乱按时很容易弹出系统右键菜单挡住画面。
      这里全局取消默认菜单，但只调 preventDefault、绝不 stopPropagation。
      输入框除外，要用右键粘贴。
   2) 拖拽：防止图片/文字被拖出页面。拖拽归位等玩法走 pointer 事件，不受影响。
   3) 防误退：Edge 的鼠标手势（右键按住向左拖动）和误按后退键都会触发浏览器
      后退，把学生从练习页带走。压两层 history 哨兵，任何后退/前进都只会落回
      本页，popstate 一响立刻再压一层，页面始终留在原地。
   本页不使用 hash / history 导航，以上都不影响页内关卡切换。 */
(function () {
  /* 输入框里保留原生右键菜单，方便右键粘贴 */
  function keepNative(el) {
    return !!(el && el.closest &&
      el.closest('input, textarea, [contenteditable]:not([contenteditable="false"])'));
  }
  document.addEventListener('contextmenu', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();                    /* 只取消默认菜单，不阻断页内逻辑 */
  }, true);
  document.addEventListener('dragstart', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();
  }, true);

  /* 防误退 */
  if (location.protocol === 'file:') return;      /* file:// 下浏览器禁止 pushState */
  function guard() {
    try { history.pushState({ mtSentinel: 1 }, '', location.href); } catch (e) {}
  }
  try {
    guard(); guard();
    window.addEventListener('popstate', guard);
  } catch (e) {}
})();
</script>
<script>
/* ===== 兼容层 A：flex gap 能力探测 =====
   老内核（Edge 84 以前、EdgeHTML）的 flex 布局不支持 gap，间距会全部塌掉。
   这里用真实布局量一次宽度来判断，支持就用原样，不支持就给 <html> 挂上
   no-flexgap，样式表里预置的 margin 规则接管间距。
   不用 CSS.supports('gap') 判断：gap 在 Chrome 66 起就作为 grid-gap 的别名存在，
   老版本会误报"支持"。 */
(function () {
  try {
    var box = document.createElement('div');
    box.style.cssText = 'position:absolute;top:-9999px;left:-9999px;display:flex;gap:10px;width:auto;height:1px';
    var a = document.createElement('i');
    var b = document.createElement('i');
    a.style.cssText = b.style.cssText = 'display:block;width:10px;height:1px';
    box.appendChild(a); box.appendChild(b);
    document.documentElement.appendChild(box);
    var w = box.getBoundingClientRect().width || box.scrollWidth;
    document.documentElement.removeChild(box);
    if (!(w >= 30)) document.documentElement.className += ' no-flexgap';
  } catch (e) {}
})();
</script>

<script>
(function(){
  "use strict";

  /* ================= 基础工具 ================= */
  const $ = s => document.querySelector(s);
  const rand = (a,b) => a + Math.random()*(b-a);
  const randInt = (a,b) => Math.floor(rand(a,b+1));
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const shuffle = a => { const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=randInt(0,i);[r[i],r[j]]=[r[j],r[i]];} return r; };

  const panel = $('#panel'), homeGrid = $('#homeGrid'), gameBox = $('#gameBox');
  const hud = $('#hud'), overlay = $('#overlay');

  let audioCtx = null;
  function beep(freq, dur, type, vol){
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type||'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol||.04, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + (dur||.08));
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + (dur||.08));
    }catch(e){}
  }
  const sfx = {
    click: () => beep(680,.05,'triangle',.03),
    pop:   () => beep(760,.07,'triangle',.04),
    good:  () => { beep(760,.07,'triangle',.04); setTimeout(()=>beep(1020,.10,'triangle',.035), 70); },
    bad:   () => beep(180,.14,'sawtooth',.035),
    win:   () => [0,110,220,360].forEach((d,i)=>setTimeout(()=>beep([660,880,1040,1320][i],.15,'triangle',.04), d))
  };
  const HUES = ['#a97c2f','#b06a48','#a3566a','#7d5b96','#5566a8','#3d7f86','#5f8163','#8a7b3f'];

  function confetti(){
    for(let i=0;i<18;i++){
      const c = document.createElement('div'); c.className = 'cf';
      c.style.left = Math.random()*100 + 'vw';
      c.style.background = HUES[Math.floor(Math.random()*HUES.length)];
      c.style.animationDelay = (Math.random()*.3) + 's';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 1700);
    }
  }
  function popText(container, text, x, y, bad){
    const el = document.createElement('div');
    el.className = 'pop-text' + (bad ? ' bad' : '');
    el.textContent = text;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    container.appendChild(el);
    setTimeout(()=>el.remove(), 720);
  }

  /* ================= 存档 ================= */
  const KEY = 'mouseReactionLab.v1';
  let records = {};
  try{ records = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){ records = {}; }
  function saveRecords(){ try{ localStorage.setItem(KEY, JSON.stringify(records)); }catch(e){} }

  /* ===== 进行中的现场（localStorage）=====
     成绩（每关最好成绩 + 星级）一直都会存；但"这一关做到哪一步"以前一刷新就没了：
     闪电反应做到第 4 回合、打地鼠还剩 12 秒……学生手一抖刷新或关掉标签页就白做一遍。
     现在每关的现场也落盘，下次进这一关接着做：
       stage[关卡] = {snap:各关自己的现场, ts:最后一次更新时间}
     三个约定：
       1) 读数一律按"已知的八关"过滤，坏数据、旧版本数据都不会把页面带崩；
       2) 存储被禁用（隐私设置、老策略）时静默降级成"只记在内存里"，
          读写都包在 try/catch 里，最坏情况只是不保存，绝不让页面报错；
       3) 超过 STAGE_FRESH 没动过的现场算过期，直接丢掉，免得学生第二天打开
          还被拉回昨天做到一半的那一局。 */
  const STAGE_KEY = 'mouseReactionLab.stage.v1';
  const STAGE_FRESH = 6*60*60*1000;
  const stageSave = {};
  let stageWriteAt = 0;
  function writeStage(){
    try{ localStorage.setItem(STAGE_KEY, JSON.stringify({ v:1, stage:stageSave })); }catch(e){}
  }
  /* 从存档里读回来（要等 MODES 定义好之后再调，见启动处） */
  function restoreStageSave(){
    let d = null;
    try{ d = JSON.parse(localStorage.getItem(STAGE_KEY) || 'null'); }catch(e){ d = null; }
    if(!d || typeof d !== 'object' || !d.stage || typeof d.stage !== 'object') return;
    const now = Date.now();
    for(let i=0;i<MODES.length;i++){
      const id = MODES[i].id, it = d.stage[id];
      if(!it || typeof it !== 'object') continue;
      if(!it.snap || typeof it.snap !== 'object') continue;
      if(!(now - (it.ts || 0) < STAGE_FRESH)) continue;
      stageSave[id] = { snap: it.snap, ts: it.ts || now };
    }
  }
  /* 游戏里每 100ms 就报一次现场，这里写盘限流到 0.7 秒一次：
     内存里永远是最新的，刷新前最多丢最后不到一秒的进度 */
  function saveStage(id, snap, force){
    if(!id || !snap) return;
    stageSave[id] = { snap:snap, ts:Date.now() };
    const now = Date.now();
    if(!force && now - stageWriteAt < 250) return;    /* 计分、过关这类离散事件传 true，立刻落盘 */
    stageWriteAt = now; writeStage();
  }
  function clearStage(id){
    if(!id || !stageSave[id]) return;
    delete stageSave[id]; writeStage();
  }
  function getStage(id){
    const it = stageSave[id];
    if(!it) return null;
    if(Date.now() - it.ts > STAGE_FRESH){ clearStage(id); return null; }
    return it.snap;
  }
  /* 页面被切走或关掉时补一次落盘 */
  window.addEventListener('pagehide', writeStage);
  document.addEventListener('visibilitychange', function(){ if(document.hidden) writeStage(); });

  function totalStars(){
    return MODES.reduce((sum,m)=> sum + ((records[m.id] && records[m.id].stars) || 0), 0);
  }
  /* 八关全部三星（24 / 24）才算完美通关，才开放通关闭幕。 */
  function allPerfect(){
    return MODES.every(m => ((records[m.id] && records[m.id].stars) || 0) >= 3);
  }
  function refreshTotal(){ $('#starNum').textContent = totalStars(); }
  /* 首页顶部的金色横幅：只有"在首页"并且"八关全满"时才露出来。
     游戏视图是绝对定位铺满整个面板的，横幅留在页面上会从游戏视图底下透出来，
     所以进关卡时也要把它收起来。 */
  function refreshCelebrateBar(){
    const bar = $('#celebrateBar');
    if(bar) bar.classList.toggle('hidden', !allPerfect() || !gameBox.classList.contains('hidden'));
  }

  /* ================= 图标（线性几何，1.4px 描边） ================= */
  const ICONS = {
    bolt:   '<path d="M13.5 3 6 13.5h5l-1 7.5L18 10.5h-5l1-7.5z"/>',

  /* ================= 模式表 ================= */

  const getMode = id => MODES.find(m => m.id === id);

  /* ================= 主页列表 ================= */
  function renderHome(){
    homeGrid.innerHTML = '';
    refreshCelebrateBar();
    MODES.forEach(m=>{
      const rec = records[m.id] || {};
      const stars = rec.stars || 0;
      const best = m.fmt(rec);
      const half = !!getStage(m.id);            /* 这一关上次做了一半 */
      let dots = '';
      for(let i=0;i<3;i++) dots += '<i class="'+(i<stars?'on':'')+'">★</i>';
