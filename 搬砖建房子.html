<script>
/* ===== 防误触兜底 =====
   1) 右键菜单：学生鼠标不熟练，乱按时很容易弹出系统右键菜单挡住画面。
      这里全局取消默认菜单，但只调 preventDefault、绝不 stopPropagation，
      页内自己监听 contextmenu 的功能照常收到事件。输入框除外，要用右键粘贴。
   2) 拖拽：防止图片/文字被拖出页面。拖拽练习走 pointer 事件，不受影响。
   3) 防误退：Edge 的鼠标手势（右键按住向左拖动）和误按后退键都会触发浏览器
      后退，把学生从练习页带走。压两层 history 哨兵，任何后退/前进都只会落回
      本页，popstate 一响立刻再压一层，页面始终留在原地。
   本页不使用 hash / history 导航，以上都不影响页内功能。 */
(function () {
  /* 输入框里保留原生右键菜单，方便右键粘贴 */
  function keepNative(el) {
    return !!(el && el.closest &&
      el.closest('input, textarea, [contenteditable]:not([contenteditable="false"])'));
  }
  document.addEventListener('contextmenu', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();                    /* 只取消默认菜单，不阻断页内逻辑 */
  }, true);
  document.addEventListener('dragstart', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();
  }, true);

  /* 防误退 */
  if (location.protocol === 'file:') return;      /* file:// 下浏览器禁止 pushState */
  function guard() {
    try { history.pushState({ mtSentinel: 1 }, '', location.href); } catch (e) {}
  }
  try {
    guard(); guard();
    window.addEventListener('popstate', guard);
  } catch (e) {}
})();
</script>
<script>
/* ===== 兼容层 A：flex gap 能力探测 =====
   老内核（Edge 84 以前、EdgeHTML）的 flex 布局不支持 gap，间距会全部塌掉。
   这里用真实布局量一次宽度来判断，支持就用原样，不支持就给 <html> 挂上
   no-flexgap，样式表里预置的 margin 规则接管间距。
   不用 CSS.supports('gap') 判断：gap 在 Chrome 66 起就作为 grid-gap 的别名存在，
   老版本会误报"支持"。 */
(function () {
  try {
    var box = document.createElement('div');
    box.style.cssText = 'position:absolute;top:-9999px;left:-9999px;display:flex;gap:10px;width:auto;height:1px';
    var a = document.createElement('i');
    var b = document.createElement('i');
    a.style.cssText = b.style.cssText = 'display:block;width:10px;height:1px';
    box.appendChild(a); box.appendChild(b);
    document.documentElement.appendChild(box);
    var w = box.getBoundingClientRect().width || box.scrollWidth;
    document.documentElement.removeChild(box);
    if (!(w >= 30)) document.documentElement.className += ' no-flexgap';
  } catch (e) {}
})();
</script>

<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg', parts=[], done=0, target='', bag=[];

var cottageSVG=document.getElementById('house').innerHTML;
var levels=[{name:'田园小屋',build:buildCottage},{name:'海边灯塔',build:buildLighthouse},{name:'童话城堡',build:buildCastle},
  {name:'北京四合院',build:buildCourtyard}, {name:'江南凉亭',build:buildPavilion},
  {name:'徽派民居',build:buildHuizhou}, {name:'中式宝塔',build:buildPagoda},
  {name:'古城门楼',build:buildGate}, {name:'福建土楼',build:buildTulou},
  {name:'金瓦宫殿',build:buildPalace}];
var letters='abcdefghijklmnopqrstuvwxyz';
var fingers=[['qaz','左手小指'],['wsx','左手无名指'],['edc','左手中指'],['rfvtgb','左手食指'],['yuhjnm','右手食指'],['ik','右手中指'],['ol','右手无名指'],['p','右手小指']];
function el(id){return document.getElementById(id);}
function addPart(group,node){
  node.setAttribute('class','piece');
  el(group).appendChild(node);parts.push({node:node,group:group});
}
function rect(group,x,y,w,h,color){
  var node=document.createElementNS(NS,'rect');
  node.setAttribute('x',x);node.setAttribute('y',y);
  node.setAttribute('width',w);node.setAttribute('height',h);
  node.setAttribute('fill',color);node.setAttribute('rx','3');
  addPart(group,node);return node;
}
function buildCottage(){
el('house').innerHTML=cottageSVG;
/* 六层错缝砖，从地基向上砌。边缘用半砖收口，共 51 块。 */
var brickColors=['#f2d8a8','#f6dfb7','#eed0a0','#f4ddb2'];
for(var r=0;r<6;r++){
  var widths=r%2?[23.125,46.25,46.25,46.25,46.25,46.25,46.25,46.25,23.125]:[46.25,46.25,46.25,46.25,46.25,46.25,46.25,46.25];
  var x=215,y=480-(r+1)*38;
  for(var c=0;c<widths.length;c++){
    rect('walls',x+1.5,y+1.5,widths[c]-3,35,brickColors[(r+c)%4]);
    x+=widths[c];
  }
}
/* 门按木板安装，窗按玻璃安装，不再把整栋房子切成同一种方格。 */
for(var d=0;d<4;d++)rect('door',358+d*21,328,21,152,d%2?'#82a992':'#8eb39b');
for(var win=0;win<2;win++){
  var wx=248+win*218;
  for(var pane=0;pane<4;pane++){
    var glass=rect('windows',wx+(pane%2)*43,306+Math.floor(pane/2)*40,43,40,pane<2?'#bfdee2':'#a9cfd6');
    glass.setAttribute('clip-path',win?'url(#rightWindowClip)':'url(#leftWindowClip)');
  }
  var finish=document.createElementNS(NS,'g');
  finish.setAttribute('class','house-detail');
  finish.setAttribute('data-after',win?63:59);
  finish.innerHTML='<rect x="'+(wx-16)+'" y="310" width="11" height="72" rx="4" fill="#90aa83"/>'+
    '<rect x="'+(wx+91)+'" y="310" width="11" height="72" rx="4" fill="#90aa83"/>'+
    '<rect x="'+wx+'" y="306" width="86" height="80" rx="10" fill="none" stroke="#fff5dc" stroke-width="7"/>'+
    '<path d="M'+(wx+43)+' 308 V384 M'+wx+' 346 H'+(wx+86)+'" stroke="#fff5dc" stroke-width="5"/>'+
    '<path d="M'+(wx+12)+' 332 L'+(wx+27)+' 316 M'+(wx+56)+' 373 L'+(wx+72)+' 357" stroke="#edf8f7" stroke-width="4" stroke-linecap="round" opacity=".8"/>'+
    '<rect x="'+(wx-6)+'" y="387" width="98" height="7" rx="3" fill="#cda77b"/>';
  el('windowFinishes').appendChild(finish);
}
for(var ch=0;ch<4;ch++)rect('chimney',511,124+ch*23,48,22,ch%2?'#ca9278':'#d6a086');
/* 圆弧瓦片由檐口铺向屋脊；颜色与细缝形成屋瓦，不显示白色网格。 */
var roofRows=[3,5,7];
for(var rr=2;rr>=0;rr--){
  var topY=100+rr*52,bottomY=topY+52;
  var topLeft=400-rr*75,bottomLeft=topLeft-75;
  var topWidth=rr*150,bottomWidth=(rr+1)*150;
  for(var cc=0;cc<roofRows[rr];cc++){
    var count=roofRows[rr],tile=document.createElementNS(NS,'path');
    var tl=topLeft+topWidth*cc/count,tr=topLeft+topWidth*(cc+1)/count;
    var bl=bottomLeft+bottomWidth*cc/count,br=bottomLeft+bottomWidth*(cc+1)/count;
    tile.setAttribute('d','M'+tl+' '+(topY-2)+' L'+tr+' '+(topY-2)+' L'+br+' '+(bottomY-3)+' Q'+((bl+br)/2)+' '+(bottomY+7)+' '+bl+' '+(bottomY-3)+' Z');
    tile.setAttribute('fill',['#da8b72','#d17d65','#e1967a'][(rr+cc)%3]);
    tile.setAttribute('stroke','#ba6c55');tile.setAttribute('stroke-width','1.2');
    addPart('roof',tile);
  }
}
}

function pathPart(group,d,color,stroke){
  var node=document.createElementNS(NS,'path');node.setAttribute('d',d);node.setAttribute('fill',color);
  if(stroke){node.setAttribute('stroke',stroke);node.setAttribute('stroke-width','1.2');}
  addPart(group,node);return node;
}

function curvedRoof(x,y,w,h,colors){
  // 屋脊和翘起的两端形成中式屋檐；每片瓦共享曲线边界。
  for(var row=1;row>=0;row--){
    var top=row/2,bottom=(row+1)/2;
    function point(t,v){return [x+w*(.5+(t-.5)*(.56+.44*v)),y+h*(v-.22*v*Math.pow(2*t-1,4))];}

      pathPart('roof','M'+a.join(' ')+' L'+b.join(' ')+' L'+c.join(' ')+' Q'+((c[0]+d[0])/2)+' '+(Math.max(c[1],d[1])+3)+' '+d.join(' ')+' Z',colors[(i+row)%colors.length],colors[0]);
    }
  }
  pathPart('roof','M'+x+' '+(y+h*.70)+' Q'+(x+w*.07)+' '+(y+h*.99)+' '+(x+w*.19)+' '+(y+h)+' H'+(x+w*.81)+' Q'+(x+w*.93)+' '+(y+h*.99)+' '+(x+w)+' '+(y+h*.70)+' L'+(x+w)+' '+(y+h*.84)+' Q'+(x+w*.95)+' '+(y+h+10)+' '+(x+w*.81)+' '+(y+h+10)+' H'+(x+w*.19)+' Q'+(x+w*.05)+' '+(y+h+10)+' '+x+' '+(y+h*.84)+' Z',colors[0]);

    for(var i=0;i<levels.length;i++){
      var n=stored.progress[i];
      progress[i]=Number.isInteger(n)&&n>=0&&n<=levels[i].total?n:0;
    }
    if(Number.isInteger(stored.level)&&stored.level>=0&&stored.level<levels.length)level=stored.level;
  }else{
    var legacy=JSON.parse(localStorage.getItem('brickHouse.progress.v1'));
    if(legacy&&legacy.v===1&&Number.isInteger(legacy.done)&&legacy.done>=0&&legacy.done<=82)progress[0]=legacy.done;
  }
}catch(e){}
function selectLevel(index){
  level=index;done=progress[level];parts=[];bag=[];
  el('house').classList.remove('complete');el('task').classList.remove('finished');
  el('message').textContent='';
  levels[level].build();total=parts.length;
  el('house').setAttribute('aria-label',levels[level].name+'，逐块建造');
  nextLetter();render();save();
}
function updateLevelNav(){
  var buttons=el('levelNav').querySelectorAll('button');
  for(var i=0;i<buttons.length;i++){
    buttons[i].classList.toggle('active',i===level);
    buttons[i].classList.toggle('done',progress[i]===levels[i].total);
    buttons[i].setAttribute('aria-label','第'+(i+1)+'关 '+levels[i].name+(progress[i]===levels[i].total?'，已完成':''));
    if(i===level)buttons[i].setAttribute('aria-current','step');else buttons[i].removeAttribute('aria-current');
  }
}
function lightFinger(name){
  var digits=document.querySelectorAll('.hand-finger');
  for(var i=0;i<digits.length;i++){
    var selected=digits[i].getAttribute('data-finger')===name;
    digits[i].classList.toggle('active',selected);
  }
  el('hands').setAttribute('aria-label',name?'当前使用'+name:'双手指法');
}
function nextLetter(){if(!bag.length){bag=letters.split('');for(var i=bag.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=bag[i];bag[i]=bag[j];bag[j]=t;}if(bag[bag.length-1]===target){var swap=bag[0];bag[0]=bag[bag.length-1];bag[bag.length-1]=swap;}}target=bag.pop();el('letter').textContent=target;var finger='';fingers.forEach(function(f){if(f[0].indexOf(target)!==-1)finger=f[1];});el('finger').textContent=finger;lightFinger(finger);var keys=document.querySelectorAll('.key');for(var n=0;n<keys.length;n++)keys[n].classList.remove('active');el('key-'+target).classList.add('active');}
function render(animate){
parts.forEach(function(p,i){p.node.setAttribute('class','piece'+(i<done?' built':'')+(animate&&i===done-1?' arriving':''));});
var finishes=document.querySelectorAll('.house-detail');
for(var f=0;f<finishes.length;f++)finishes[f].classList.toggle('installed',done>=Number(finishes[f].getAttribute('data-after')));
el('builtCount').textContent=done;el('totalCount').textContent='/ '+total;var percent=Math.floor(done/total*100);el('progressText').textContent='完成 '+percent+'%';el('bar').style.width=percent+'%';el('progress').setAttribute('aria-valuenow',percent);var names={foundation:'铺好地基',walls:'正在砌墙',door:'装上小门',windows:level===1?'装上灯室':'装上窗户',chimney:'搭起烟囱',trim:'装好护栏',roof:'铺好屋顶'};updateLevelNav();el('phase').textContent=done===total?'已建成':names[parts[done].group];if(done===total){el('house').classList.add('complete');el('task').classList.add('finished');el('next').textContent=level<levels.length-1?'下一关':(progress.some(function(n,i){return n<levels[i].total;})?'继续练习':'再练十关');el('letter').textContent='⌂';el('finger').textContent='已建成';lightFinger('');el('message').textContent='';var active=document.querySelector('.key.active');if(active)active.classList.remove('active');}}
function accept(key){if(done===total||!key||!/^[a-zA-Z]$/.test(key))return;key=key.toLowerCase();if(key!==target){el('message').textContent='请按 '+target;el('letter').classList.remove('shake');void el('letter').offsetWidth;el('letter').classList.add('shake');return;}done++;save();render(true);if(done<total){nextLetter();el('message').textContent='';}}
document.addEventListener('keydown',function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.isComposing||e.key==='Process'){el('message').textContent='请切换到英文输入。';return;}if(e.key==='Backspace')e.preventDefault();if(!/^[a-zA-Z]$/.test(e.key))return;e.preventDefault();if(e.repeat)return;accept(e.key);});
el('next').addEventListener('click',function(){
  if(level<levels.length-1)selectLevel(level+1);
  else{
    var unfinished=progress.findIndex(function(n,i){return n<levels[i].total;});
    if(unfinished>=0)selectLevel(unfinished);
    else{progress=levels.map(function(){return 0;});selectLevel(0);}
  }
  this.blur();
});
el('levelNav').addEventListener('click',function(e){
  var button=e.target.closest('button[data-level]');
  if(!button)return;
  selectLevel(Number(button.getAttribute('data-level')));button.blur();
});
selectLevel(level);
})();
</script>
</body>
</html>
