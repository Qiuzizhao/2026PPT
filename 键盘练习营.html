<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⌨️ 键盘练习</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23f7f6f2'/><rect x='.75' y='.75' width='30.5' height='30.5' rx='6.5' fill='none' stroke='%231c3d6e' stroke-opacity='.28' stroke-width='1.5'/><rect x='4.5' y='10.5' width='23' height='14' rx='3' fill='%2344a3ff' fill-opacity='.16' stroke='%231c3d6e' stroke-width='2'/><g stroke='%231c3d6e' stroke-width='2.2' stroke-linecap='round'><path d='M9.5 15h.01M14.5 15h.01M19.5 15h.01'/></g><path d='M11 20h10' stroke='%23a83232' stroke-width='2.2' stroke-linecap='round'/></svg>">
<meta name="theme-color" content="#d9f0ff">
<style>
  :root{
    --ink:#2b2b45; --muted:#8a8aa8;
    --blue:#44a3ff; --green:#4ed47e; --orange:#ff9f45;
    --good:#2ec77b; --bad:#ff6a5e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Comic Sans MS","Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    color:var(--ink); min-height:100vh;
    background:linear-gradient(160deg,#d9f0ff,#e9deff 55%,#ffe6ef);
    background-attachment:fixed; user-select:none;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .wrap{width:680px;max-width:100%;width:min(680px,100%);text-align:center}

  /* top-right total stars */
  .tot{
    position:fixed;top:14px;right:14px;z-index:60;
    background:#fff;border-radius:18px;box-shadow:0 6px 14px rgba(80,60,150,.22);
    padding:9px 16px;font-weight:900;color:#6a53a8;
    font-size:19px;font-size:clamp(14px,3vw,19px);display:flex;align-items:center;gap:8px;
  }
  html.no-flexgap .tot > *:not(:last-child){margin-right:8px}
  .tot .n{min-width:26px;text-align:center;color:#e8a712}
  .tot .m{opacity:.55}

  /* header */
  header{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
  html.no-flexgap header > *:not(:last-child){margin-right:12px}
  .mascot{font-size:46px;line-height:1;flex-shrink:0}
  .title{font-size:30px;font-size:clamp(22px,5vw,30px);font-weight:900;color:#6a53a8}


  /* nav */
  nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 22px}
  html.no-flexgap nav > *:not(:last-child){margin-right:8px}
  nav button{
    border:none;cursor:pointer;border-radius:18px;padding:11px 18px;
    font-family:inherit;font-size:18px;font-size:clamp(15px,2.4vw,18px);font-weight:800;color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .1s ease;
  }
  nav button:hover{transform:translateY(-2px)}
  nav button.n-done::after{content:" ✓";font-size:.72em;opacity:.75}
  nav button.n-a{background:var(--blue)}
  nav button.n-n{background:var(--orange)}
  nav button.n-m{background:var(--green)}
  /* card */
  .card{
    background:#fff;border-radius:30px;box-shadow:0 12px 26px rgba(80,60,150,.18);
    border:4px solid #fff;padding:44px 40px;padding:clamp(22px,6vw,44px) clamp(16px,5vw,40px);
  }
  .prompt{font-size:26px;font-size:clamp(18px,4.2vw,26px);font-weight:800;color:var(--muted);margin-bottom:6px}
  .prompt b{color:var(--blue)}
  .target{
    width:220px;width:clamp(170px,42vw,220px);height:220px;height:clamp(170px,42vw,220px);margin:14px auto 6px;
    border-radius:40px;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:140px;font-size:clamp(88px,24vw,140px);color:#fff;line-height:1;
    box-shadow:0 10px 0 rgba(0,0,0,.14);
    transition:transform .15s ease;
  }
  .target.pop{animation:pop .3s ease}
  .target.wrong{animation:shake .4s ease}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

  .msg{font-size:20px;font-size:clamp(15px,3vw,20px);font-weight:800;color:var(--muted);min-height:28px;margin-top:8px}
  .msg.good{color:var(--good)}
  .msg.bad{color:var(--bad)}

  /* stars: fixed 12-column grid, sized so 36 (全部) fully shows; height stays constant */
  .stars{display:grid;grid-template-columns:repeat(12,auto);gap:6px;justify-content:center;align-content:center;height:74px;margin-top:16px}
  .stars .s-in{font-size:20px;line-height:1;filter:grayscale(1);opacity:.4;transition:all .2s ease}
  .stars .pop .s-in{filter:none;opacity:1;transform:scale(1.2)}
  .scount{min-height:24px;margin-top:6px;font-weight:900;font-size:17px;font-size:clamp(14px,3vw,17px);color:#6a53a8}

  /* modal */
  .overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(40,30,80,.4);display:none;align-items:center;justify-content:center;z-index:10000;padding:18px}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:30px;box-shadow:0 12px 26px rgba(80,60,150,.18);max-width:420px;width:100%;padding:28px 22px;text-align:center;animation:pop .32s ease}
  .modal .moji{font-size:70px;line-height:1}
  .modal h2{margin:10px 0 6px;font-size:30px;font-size:clamp(24px,6vw,30px);color:var(--blue)}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:16px;line-height:1.7}
  .modal .mstars{font-size:24px;letter-spacing:3px;margin-bottom:16px}
  .modal .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  html.no-flexgap .modal .actions > *:not(:last-child){margin-right:10px}
  .btn{border:none;cursor:pointer;border-radius:16px;padding:13px 20px;font-family:inherit;font-size:17px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .1s ease}
  .btn:hover{transform:translateY(-2px)}
  .btn.primary{background:var(--green);color:#fff}
  .btn.ghost{background:#eef2ff;color:var(--ink)}

  .cf{position:fixed;top:0;width:12px;height:16px;z-index:99999;pointer-events:none;border-radius:3px;animation:fall 1.1s ease-in forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}

  /* ===== Grand finale (all levels cleared) ===== */
  body.locked{overflow:hidden}
  .finale{
    position:fixed;top:0;right:0;bottom:0;left:0;z-index:30000;display:none;overflow:hidden;
    align-items:center;justify-content:center;padding:16px;
    background:radial-gradient(circle at 50% 36%,#4b3a8c 0%,#2c2356 48%,#16122f 100%);
  }
  .finale.show{display:flex}
  .finale-fx{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
  .finale-card{
    position:relative;z-index:3;text-align:center;color:#fff;max-width:780px;
    opacity:0;transform:translateY(30px) scale(.82);
  }
  .finale.card-in .finale-card{animation:card-in .9s cubic-bezier(.18,1.5,.45,1) forwards}
  @keyframes card-in{
    0%{opacity:0;transform:translateY(34px) scale(.8)}
    60%{opacity:1;transform:translateY(-8px) scale(1.04)}
    100%{opacity:1;transform:none}
  }
  .trophy-wrap{
    position:relative;display:inline-flex;align-items:center;justify-content:center;
    width:250px;max-width:54vw;width:min(250px,54vw);height:250px;max-height:54vw;height:min(250px,54vw);
  }
  .trophy-wrap::before{
    content:"";position:absolute;top:4%;right:4%;bottom:4%;left:4%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,210,63,.45),rgba(255,210,63,0) 68%);
    animation:glowpulse 2.4s ease-in-out infinite;
  }
  .trophy-rays{
    position:absolute;top:-20%;right:-20%;bottom:-20%;left:-20%;border-radius:50%;opacity:.75;
    background:conic-gradient(from 0deg,rgba(255,224,120,.75) 0 5deg,transparent 5deg 22deg);
    -webkit-mask:radial-gradient(circle,#000 30%,transparent 72%);
    mask:radial-gradient(circle,#000 30%,transparent 72%);
    animation:spin 18s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes glowpulse{0%,100%{opacity:.6;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
  .big-trophy{
    position:relative;font-size:178px;font-size:min(178px,38vw);line-height:1;
    filter:drop-shadow(0 14px 26px rgba(255,178,40,.6));
    animation:bobf 2.6s ease-in-out infinite;
  }
  @keyframes bobf{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .finale-title{
    margin:6px 0 10px;font-size:58px;font-size:clamp(30px,8vw,58px);font-weight:900;letter-spacing:3px;
    background:linear-gradient(180deg,#fffbe4,#ffd23f 46%,#ff9f45);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.28));
  }
  .finale-sub{margin:0 0 16px;font-size:21px;font-size:clamp(15px,3.2vw,21px);font-weight:700;color:#e4dcff}
  .finale-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
  html.no-flexgap .finale-chips > *:not(:last-child){margin-right:10px}
  .finale-chips .chip{
    display:flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);
    border-radius:999px;padding:7px 15px;font-weight:800;
    font-size:16px;font-size:clamp(13px,2.4vw,16px);backdrop-filter:blur(2px);
  }
  html.no-flexgap .finale-chips .chip > *:not(:last-child){margin-right:7px}
  .finale-chips .chip i{font-style:normal;font-size:1.2em}
  .finale-chips .chip b{color:#ffd23f}
  .finale-stars{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.16);border:2px solid rgba(255,210,63,.6);
    border-radius:999px;padding:8px 20px;font-weight:900;
    font-size:20px;font-size:clamp(15px,3vw,20px);color:#fff6cf;
  }
  html.no-flexgap .finale-stars > *:not(:last-child){margin-right:8px}
  @media(max-height:620px){
    .trophy-wrap{width:180px;max-width:42vw;width:min(180px,42vw);height:180px;max-height:42vw;height:min(180px,42vw)}
    .big-trophy{font-size:126px;font-size:min(126px,30vw)}
    .finale-sub{margin-bottom:10px}
  }

/* 隐藏厨房：布局与正课、奖杯页面各自独立。 */
.k-enter{border:0;border-radius:18px;padding:15px 30px;background:#ffd36a;color:#5a4130;font-family:inherit;font-size:20px;font-weight:800;cursor:pointer;margin-top:20px}.k-enter:focus{outline:3px solid #fff;outline-offset:4px}
.finale.kitchen-on{background:#f6f2e8;padding:18px;color:#3b5147}.finale.kitchen-on .finale-card,.finale.kitchen-on .finale-fx{display:none}
.kitchen[hidden]{display:none!important}.kitchen{width:1120px;max-width:100%;height:100%;display:flex;flex-direction:column;position:relative;z-index:5;text-align:left}
.k-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;flex-shrink:0}.k-head h2{margin:0;font-size:26px;color:#385647}.k-stats{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:12px}.k-stat{padding:7px 16px;background:#fffaf0;border:1px solid #e4ddce;border-radius:13px;text-align:center;min-width:110px}.k-stat small{display:block;color:#8b8975;font-size:12px;margin-bottom:3px}.k-stat strong{font-size:22px;color:#506e56}
.k-board{display:grid;grid-template-columns:1fr 345px;grid-gap:20px;flex:1;min-height:0;background:#fffdf7;border:1px solid #e5dfd0;border-radius:23px;padding:18px 24px;overflow:hidden}.k-scene{display:flex;flex-direction:column;min-height:0}.k-scene h3{margin:0;font-size:22px;color:#685343}.k-policy{font-size:13px;color:#939481;margin:6px 0 0}.k-food{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.k-food svg{display:block;width:100%;height:100%;max-height:360px}.k-orderside{display:flex;flex-direction:column;justify-content:center;min-height:0}.k-tokens{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:10px}.k-token{position:relative;border:2px solid #ece7db;border-radius:14px;background:#f8f7f0;padding:10px;text-align:center;color:#9fa899}.k-token small{display:block;font-size:12px;color:#999984;margin-bottom:6px}.k-token b{display:inline-block;font-family:Arial,sans-serif;font-size:31px;line-height:1.15;margin:0 3px;color:#adb5a5;border-bottom:3px solid transparent}.k-token.ready{border-color:#90ab7d;background:#f1f5e7}.k-token b.current{color:#365b45;border-color:#d4b968}.k-token b.typed{color:#83a46e}.k-token.done{background:#edf2e6;border-color:#d8e3cc;opacity:.7}.k-token i{position:absolute;right:8px;top:7px;font-style:normal;font-size:13px;color:#729360}.k-status{height:22px;line-height:22px;margin-top:12px;text-align:center;color:#a37b47;font-size:13px}
.k-bottom{flex-shrink:0;margin-top:12px}.k-keyboard{margin:auto;width:640px;max-width:100%}.k-key-row{display:flex;justify-content:center;margin-bottom:4px}.k-key{display:flex;align-items:center;justify-content:center;width:43px;height:25px;margin:0 3px;border-radius:6px;border:1px solid #e0decf;border-bottom-width:2px;background:#fffdf8;color:#a1a792;font:14px Arial,sans-serif}.k-key.active{background:#5b7a58;border-color:#5b7a58;color:#fff}.k-hands{display:block;width:500px;max-width:100%;height:96px;margin:3px auto 0}.k-hands .hand-palm,.k-hands .digit{fill:#e5e7dc;stroke:#bbc4af;stroke-width:2}.k-hands .nail{fill:#fffcf3}.k-hands .active .digit{fill:#8baa7b;stroke:#53734f;stroke-width:3}.k-hands .hand-label{font-size:14px;fill:#8b947d;text-anchor:middle}.k-food-piece.k-new{animation:k-drop .22s ease-out}@keyframes k-drop{from{transform:translateY(-12px)}to{transform:translateY(0)}}
@media(max-height:700px){.finale.kitchen-on{padding:12px}.k-head{margin-bottom:10px}.k-head h2{font-size:22px}.k-stat{padding:5px 13px}.k-stat strong{font-size:18px}.k-board{padding:12px 18px}.k-token{padding:6px}.k-token b{font-size:24px}.k-token small{margin-bottom:3px}.k-key{height:21px}.k-hands{height:70px}.k-bottom{margin-top:8px}}
@media(max-width:1000px){.k-board{grid-template-columns:1fr 280px;grid-gap:12px}.k-stat{min-width:90px;padding-left:10px;padding-right:10px}.k-stats{grid-gap:7px}}
@media(prefers-reduced-motion:reduce){.k-food-piece.k-new{animation:none}}

body.kitchen-playing .cf{display:none}
@media(max-height:560px){.k-head h2{font-size:18px}.k-stat{padding:3px 10px}.k-stat small{font-size:10px}.k-stat strong{font-size:16px}.k-board{padding:9px 15px}.k-scene h3{font-size:18px}.k-key{height:17px;font-size:12px}.k-hands{height:50px}.k-token{padding:4px}.k-token small{font-size:10px;margin-bottom:2px}.k-token b{font-size:18px}.k-tokens{grid-gap:7px}.k-status{font-size:11px;margin-top:6px;height:18px;line-height:18px}}
</style>
<script>
/* ===== 防误触兜底 =====
   1) 右键菜单：学生鼠标不熟练，乱按时很容易弹出系统右键菜单挡住画面。
      这里全局取消默认菜单，但只调 preventDefault、绝不 stopPropagation，
      页内自己监听 contextmenu 的功能照常收到事件。输入框除外，要用右键粘贴。
   2) 拖拽：防止图片/文字被拖出页面。拖拽练习走 pointer 事件，不受影响。
   3) 防误退：Edge 的鼠标手势（右键按住向左拖动）和误按后退键都会触发浏览器
      后退，把学生从练习页带走。压两层 history 哨兵，任何后退/前进都只会落回
      本页，popstate 一响立刻再压一层，页面始终留在原地。
   本页不使用 hash / history 导航，以上都不影响页内功能。 */
(function () {
  /* 输入框里保留原生右键菜单，方便右键粘贴 */
  function keepNative(el) {
    return !!(el && el.closest &&
      el.closest('input, textarea, [contenteditable]:not([contenteditable="false"])'));
  }
  document.addEventListener('contextmenu', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();                    /* 只取消默认菜单，不阻断页内逻辑 */
  }, true);
  document.addEventListener('dragstart', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();
  }, true);

  /* 防误退 */
  if (location.protocol === 'file:') return;      /* file:// 下浏览器禁止 pushState */
  function guard() {
    try { history.pushState({ mtSentinel: 1 }, '', location.href); } catch (e) {}
  }
  try {
    guard(); guard();
    window.addEventListener('popstate', guard);
  } catch (e) {}
})();
</script>
<script>
/* ===== 兼容层 A：flex gap 能力探测 =====
   老内核（Edge 84 以前、EdgeHTML）的 flex 布局不支持 gap，间距会全部塌掉。
   这里用真实布局量一次宽度来判断，支持就用原样，不支持就给 <html> 挂上
   no-flexgap，样式表里预置的 margin 规则接管间距。
   不用 CSS.supports('gap') 判断：gap 在 Chrome 66 起就作为 grid-gap 的别名存在，
   老版本会误报"支持"。 */
(function () {
  try {
    var box = document.createElement('div');
    box.style.cssText = 'position:absolute;top:-9999px;left:-9999px;display:flex;gap:10px;width:auto;height:1px';
    var a = document.createElement('i');
    var b = document.createElement('i');
    a.style.cssText = b.style.cssText = 'display:block;width:10px;height:1px';
    box.appendChild(a); box.appendChild(b);
    document.documentElement.appendChild(box);
    var w = box.getBoundingClientRect().width || box.scrollWidth;
    document.documentElement.removeChild(box);
    if (!(w >= 30)) document.documentElement.className += ' no-flexgap';
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="tot" id="tot">⭐ <span class="n" id="totN">0</span><span class="m">/ 72</span></div>
<div class="wrap">
  <header>
    <div class="mascot" id="mascot">🐼</div>
    <div class="title">键盘练习</div>
  </header>

  <nav id="nav">
    <button class="n-a" data-mode="a">🔤 字母</button>
    <button class="n-n" data-mode="n">🔢 数字</button>
    <button class="n-m" data-mode="m">🔀 全部</button>
  </nav>

  <div class="card">
    <div class="prompt" id="prompt">按键盘上的 <b>A</b></div>
    <div class="target" id="target" style="background:linear-gradient(150deg,#44a3ff,#2f7fe0)">A</div>
    <div class="msg" id="msg"></div>
    <div class="stars" id="stars"></div>
    <div class="scount" id="scount"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="moji" id="moji">🎉</div>
    <h2 id="mTitle">太棒啦！</h2>
    <p id="mText"></p>
    <div class="mstars" id="mStars"></div>
    <div class="actions">
      <button class="btn primary" id="mOk">确定</button>
    </div>
  </div>
</div>

<div class="finale" id="finale">
  <canvas class="finale-fx" id="fxCanvas"></canvas>
  <div class="finale-card">
    <div class="trophy-wrap">
      <div class="trophy-rays"></div>
      <div class="big-trophy">🏆</div>
    </div>
    <h2 class="finale-title">全部关卡已通关</h2>
    <p class="finale-sub">键盘小能手就是你！字母和数字全都难不倒你～</p>
    <div class="finale-chips" id="finaleChips"></div>
    <div class="finale-stars"><span>⭐</span><span id="finaleStarTxt">满星通关</span></div>
    <button class="k-enter" id="k-enter" type="button">进入隐藏厨房</button>
  </div>

  <section class="kitchen" id="kitchen" aria-label="隐藏关卡打字小厨师" hidden>
    <header class="k-head"><h2>打字小厨师</h2><div class="k-stats"><div class="k-stat"><small>累计积分</small><strong id="k-score">0</strong></div><div class="k-stat"><small>第几关</small><strong id="k-level">1</strong></div><div class="k-stat"><small>本关订单</small><strong id="k-orders">0 / 5</strong></div></div></header>

<script>
(function(){
  "use strict";
  const $=s=>document.querySelector(s);
  const mascot=$('#mascot'),prompt=$('#prompt'),target=$('#target'),msg=$('#msg'),
        stars=$('#stars'),scount=$('#scount'),overlay=$('#overlay');
  const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const DIGITS='0123456789'.split('');

  let mode='a', queue=[], qi=0, total=0;

  /* sounds */
  let av=null;
  function tone(f,d,t,av2){
    try{
      av=av||new(window.AudioContext||window.webkitAudioContext)();
      const o=av.createOscillator(),g=av.createGain();
      o.type=t||'sine'; o.frequency.value=f; g.gain.value=av2||.12;
      o.connect(g); g.connect(av.destination); o.start();
      g.gain.exponentialRampToValueAtTime(.0001,av.currentTime+(d||.18));
      o.stop(av.currentTime+(d||.18)+.02);
    }catch(e){}
  }
  const good=()=>{tone(660,.14,'sine');setTimeout(()=>tone(880,.18,'sine'),90);};
  const bad=()=>{tone(200,.2,'square',.07);};

  function confetti(n){
    const cols=['#ff6fa5','#ffd23f','#44a3ff','#4ed47e','#a577ff'];
    for(let i=0;i<(n||14);i++){
      const c=document.createElement('div');c.className='cf';
      c.style.left=Math.random()*100+'vw';
      c.style.background=cols[Math.floor(Math.random()*cols.length)];
      c.style.animationDelay=(Math.random()*.25)+'s';
      document.body.appendChild(c);setTimeout(()=>c.remove(),1500);
    }
  }
  function setStars(done,total){
    stars.innerHTML='';
    scount.textContent='';
    if(total<=0)return;
    for(let i=0;i<total;i++){
      const s=document.createElement('span');s.className='air'+(i<done?' pop':'');
      s.innerHTML='<span class="s-in">⭐</span>'; stars.appendChild(s);
    }
    scount.textContent=done+' / '+total;
  }

  function shuffle(arr){
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function newQueue(m){
    if(m==='a')return shuffle(LETTERS);            // all 26 letters, shuffled
    if(m==='n')return shuffle(DIGITS);             // all 10 digits, shuffled
    if(m==='m')return shuffle(LETTERS.concat(DIGITS)); // all 36 keys, shuffled
    return [];
  }
  const tColor={a:'linear-gradient(150deg,#44a3ff,#2f7fe0)',n:'linear-gradient(150deg,#ff9f45,#ff8a3d)',m:'linear-gradient(150deg,#4ed47e,#33b662)'};

  function setStage(){
    mascot.textContent='🐼';
    queue=newQueue(mode);qi=0;total=queue.length;
    setStars(0,total); target.style.background=tColor[mode]; draw();
  }
  function draw(){
    const c=queue[qi];
    target.textContent=c;
    target.classList.remove('pop','wrong');void target.offsetWidth;target.classList.add('pop');
    prompt.innerHTML='按键盘上的 <b>'+c+'</b>';
    msg.className='msg'; msg.textContent='';
  }

  function finish(){
    lockMode(mode);                   // completed -> cannot restart
    if(done.size>=3){                 // 最后一关：不弹小窗，直接进入通关大奖
      good(); fanfare();
      setTimeout(startFinale,420);
      return;
    }
    confetti(40);good();
    $('#moji').textContent='🎉';$('#mTitle').textContent='太棒啦！';
    $('#mText').innerHTML='你把全部 <b>'+total+'</b> 个都按对啦！<br>用真正的键盘好厉害～';
    $('#mStars').textContent='⭐ 全部完成';
    overlay.classList.add('show');
  }

  function press(ch){
    if(finaleOn) return;                             // grand finale: everything frozen
    if(overlay.classList.contains('show')) return;   // modal open: ignore keys
    if(done.has(mode)) return;                       // completed mode: no play
    const c=queue[qi];
    if(ch===c){
      good();qi++;setStars(qi,total);confetti();
      if(qi>best[mode]){ best[mode]=qi; updateTot(); }
      mascot.textContent='😄';
      msg.className='msg good'; msg.textContent='对啦！';
      if(qi>=total){finish();return;}
      setTimeout(draw,420);
    }else{
      bad();
      target.classList.remove('wrong');void target.offsetWidth;target.classList.add('wrong');
      mascot.textContent='🤔';
      const kind=c.match(/[0-9]/)?'数字':'字母';
      msg.className='msg bad'; msg.textContent='不对哦，要找 '+kind+' '+c;
    }
  }

  /* only the real keyboard advances the game */
  window.addEventListener('keydown',e=>{
    let ch=e.key;
    if(/^[a-z]$/i.test(ch)){ ch=ch.toUpperCase(); e.preventDefault(); press(ch); }
    else if(/^[0-9]$/.test(ch)){ e.preventDefault(); press(ch); }
  });

  /* mode switching */
  const done=new Set();               // completed -> click only shows finished state
  const TOTALS={a:26,n:10,m:36};
  const MAX=26+10+36;                 // total stars available = 72
  const best={a:0,n:0,m:0};           // best stars earned per mode
  function updateTot(){
    const s=best.a+best.n+best.m;
    $('#totN').textContent=s;
  }
  function lockMode(name){
    done.add(name);
    const b=document.querySelector('#nav [data-mode="'+name+'"]');
    if(b) b.classList.add('n-done');  // add ✓ marker, still clickable
  }
  function show(name){
    mode=name;
    document.querySelectorAll('#nav button').forEach(b=>b.style.outline=b.dataset.mode===name?'3px solid #fff':'none');
    overlay.classList.remove('show');
    if(done.has(name)){ showCompleted(name); return; }  // completed: no replay
    setStage();
  }
  function showCompleted(name){
    target.style.background=tColor[name];
    target.textContent='🏆';
    prompt.innerHTML='这一关已经完成啦！';
    msg.className='msg'; msg.textContent='';
    setStars(TOTALS[name],TOTALS[name]);   // all stars lit
    mascot.textContent='🏆';
  }

  /* ===== finale: every level cleared -> fireworks + big trophy, page frozen here ===== */
  const LEVELS=[
    ['a','字母','🔤'],['n','数字','🔢'],['m','全部','🔀']
  ];
  function allCleared(){ return LEVELS.every(l=>done.has(l[0])); }
  let finaleOn=false;
  function fanfare(){
    [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.1),i*150));
  }
  function bigConfetti(){
    const colors=['#ff6fa5','#ffd23f','#44a3ff','#4ed47e','#a577ff','#43d2e8','#ff9f45','#fff7d6'];
    for(let i=0;i<70;i++){
      const c=document.createElement('div'); c.className='cf';
      const sz=8+Math.random()*12;
      c.style.left=(Math.random()*100)+'vw';
      c.style.width=sz+'px'; c.style.height=(sz*1.4)+'px';
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.borderRadius=Math.random()<0.4?'50%':'3px';
      c.style.animationDuration=(2.2+Math.random()*2)+'s';
      c.style.animationDelay=(Math.random()*1.2)+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),5000);
    }
  }
  function startFireworks(){
    const cv=$('#fxCanvas'), ctx=cv.getContext('2d');
    let W=0,H=0,dpr=1,S=1;
    function resize(){
      dpr=Math.min(2,window.devicePixelRatio||1);
      W=window.innerWidth; H=window.innerHeight;
      S=Math.max(0.62,Math.min(1.5,H/900));
      cv.width=Math.max(1,Math.round(W*dpr)); cv.height=Math.max(1,Math.round(H*dpr));
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.lineCap='round';
    }
    resize();
    window.addEventListener('resize',resize);
    const COLORS=['#ff6fa5','#ffd23f','#44a3ff','#4ed47e','#a577ff','#43d2e8','#ff9f45','#fff7d6'];
    const pick=()=>COLORS[Math.floor(Math.random()*COLORS.length)];
    const rockets=[], sparks=[], confs=[];
    function launch(x){
      rockets.push({
        x:(x==null? W*(0.12+Math.random()*0.76) : Math.max(24,Math.min(W-24,x))),
        y:H+14, vy:-(H*0.0105+Math.random()*H*0.0042),
        ty:H*(0.10+Math.random()*0.34), col:pick(), trail:[]
      });
    }
    function explode(x,y,col){
      const n=62+Math.floor(Math.random()*40);
      const spread=0.85+Math.random()*0.3;
      for(let i=0;i<n;i++){
        const a=(Math.PI*2*i)/n+Math.random()*0.12;
        const sp=(1.5+Math.random()*4.2)*S;
        sparks.push({
          x:x,y:y,vx:Math.cos(a)*sp*spread,vy:Math.sin(a)*sp*spread,
          life:1, decay:0.0055+Math.random()*0.011,
          col:(Math.random()<0.7? col : pick()), r:1.5+Math.random()*2.1
        });
      }
      sparks.push({x:x,y:y,vx:0,vy:0,life:1,decay:0.06,col:col,r:10*S,flash:true});
    }
    function rainConfetti(n){
      for(let i=0;i<n;i++){
        confs.push({
          x:Math.random()*W, y:-Math.random()*H*0.9,
          vx:(Math.random()-.5)*1.6, vy:0.8+Math.random()*2.2,
          w:6+Math.random()*8, h:9+Math.random()*10,
          rot:Math.random()*6.283, vr:(Math.random()-.5)*0.4,
          col:pick(), seed:Math.random()*100
        });
      }
    }
    rainConfetti(150);
    let start=0, last=0, nextLaunch=0;
    function frame(now){
      if(!$('#kitchen').hidden)return;
      if(!start){ start=now; last=now; }
      const d=Math.min(2.6,(now-last)/16.667); last=now;
      const el=now-start;
      /* crisp redraw each frame; trails come from the particles themselves */
      ctx.clearRect(0,0,W,H);
      ctx.globalCompositeOperation='lighter';
      ctx.lineCap='round';
      /* launch schedule: busy burst first, then an ambient show */
      if(el>nextLaunch){
        launch();
        if(el<2600){ launch(); if(Math.random()<0.5) launch(); }
        nextLaunch=el+(el<4000? 210+Math.random()*170 : 850+Math.random()*950);
      }
      for(let i=rockets.length-1;i>=0;i--){
        const r=rockets[i];
        r.trail.push({x:r.x,y:r.y}); if(r.trail.length>9) r.trail.shift();
        r.y+=r.vy*d; r.vy+=0.05*d*S;
        for(let k=0;k<r.trail.length;k++){
          const q=r.trail[k], a=(k+1)/r.trail.length;
          ctx.globalAlpha=a*0.85; ctx.fillStyle=r.col;
          ctx.beginPath(); ctx.arc(q.x,q.y,1.7*a+0.5,0,6.283); ctx.fill();
        }
        ctx.globalAlpha=1; ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(r.x,r.y,2.6,0,6.283); ctx.fill();
        if(r.y<=r.ty||r.vy>=0){ explode(r.x,r.y,r.col); rockets.splice(i,1); }
      }
      for(let i=sparks.length-1;i>=0;i--){
        const p=sparks[i];
        if(p.flash){
          p.life-=p.decay*d;
          if(p.life<=0){ sparks.splice(i,1); continue; }
          ctx.globalAlpha=p.life*0.38; ctx.fillStyle=p.col;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1.25-p.life),0,6.283); ctx.fill();
          continue;
        }
        p.px=p.x; p.py=p.y;
        p.x+=p.vx*d; p.y+=p.vy*d;
        p.vy+=0.035*d*S;
        p.vx*=Math.pow(0.986,d); p.vy*=Math.pow(0.986,d);
        p.life-=p.decay*d*1.6;
        if(p.life<=0){ sparks.splice(i,1); continue; }
        const rr=p.r*(0.35+p.life*0.95);
        ctx.globalAlpha=Math.min(1,p.life)*0.9;
        ctx.strokeStyle=p.col; ctx.lineWidth=rr*1.7;
        ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x,p.y); ctx.stroke();
        if(p.life>0.55){
          ctx.globalAlpha=(p.life-0.55)/0.45;
          ctx.fillStyle='#fff';
          ctx.beginPath(); ctx.arc(p.x,p.y,rr*0.5,0,6.283); ctx.fill();
        }
      }
      ctx.globalAlpha=1;
      ctx.globalCompositeOperation='source-over';
      for(let i=confs.length-1;i>=0;i--){
        const c=confs[i];
        c.x+=c.vx*d; c.y+=c.vy*d;
        c.vy=Math.min(c.vy+0.03*d*S,3.4*S);
        c.vx+=Math.sin((c.y+c.seed)/70)*0.02*d;
        c.rot+=c.vr*d;
        if(c.y>H+40){ confs.splice(i,1); continue; }
        ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
        ctx.globalAlpha=0.95; ctx.fillStyle=c.col;
        ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
        ctx.restore();
      }
      ctx.globalAlpha=1;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  function startFinale(){
    if(finaleOn) return;
    finaleOn=true;
    kitchenGame.unlock();
    const box=$('#finale');
    $('#finaleChips').innerHTML=LEVELS.map(l=>'<span class="chip"><i>'+l[2]+'</i>'+l[1]+'<b>✓</b></span>').join('');
    $('#finaleStarTxt').textContent='满星 72 / 72';
    document.documentElement.style.overflow='hidden';
    document.body.classList.add('locked');
    document.querySelectorAll('#nav button').forEach(b=>b.disabled=true);
    overlay.classList.remove('show');
    box.classList.add('show');
    bigConfetti();                              /* 撒花 */
    startFireworks();                           /* 烟花 */
    setTimeout(()=>box.classList.add('card-in'),1500);   /* 大奖杯 */
    setTimeout(()=>bigConfetti(),2700);
    /* 锁定：画面停在这里，不接受任何滚动/操作 */
    const block=e=>{e.preventDefault();};
    const stopKeys=[' ','Spacebar','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'];
    document.addEventListener('wheel',block,{passive:false,capture:true});
    document.addEventListener('touchmove',block,{passive:false,capture:true});
    document.addEventListener('contextmenu',block,{capture:true});
    document.addEventListener('dragstart',block,{capture:true});
    document.addEventListener('selectstart',block,{capture:true});
    document.addEventListener('keydown',e=>{ if(stopKeys.indexOf(e.key)>=0) block(e); },true);
    document.addEventListener('click',e=>{ if(!box.contains(e.target)) block(e); },true);
  }
  document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.mode)));
  // "确定" just closes the popup and shows the finished state — no auto switch
  $('#mOk').onclick=()=>{
    overlay.classList.remove('show');
    if(allCleared()) startFinale(); else showCompleted(mode);
  };

  /* 隐藏厨房：十种制作任务，20 关循环，订单和积分按离散按键保存。 */
  const kitchenGame=(function(){
    const KEY='keyboardcamp.kitchen.v1';
    const params=new URLSearchParams(location.search);
    const preview=params.get('kitchen')==='1'||params.get('finale')==='1';
    const dishes=[
      {name:'叠汉堡',policy:'sequence',labels:['面包','蔬菜','肉饼','芝士','顶包']},
      {name:'烤饼干',policy:'free',labels:['圆饼干','星饼干','圆饼干','心饼干','圆饼干','花饼干']},
      {name:'调饮料',policy:'sequence',labels:['水果','果汁','冰块','奶盖']},
      {name:'做披萨',policy:'free',labels:['酱汁','芝士','番茄','蘑菇','青椒']},
      {name:'串糖葫芦',policy:'sequence',labels:['水果','水果','水果','水果','糖衣']},
      {name:'装寿司盒',policy:'free',labels:['寿司','寿司','寿司','寿司','寿司','寿司']},
      {name:'装饰蛋糕',policy:'sequence',labels:['蛋糕','奶油','夹心','蛋糕','裱花','水果']},
      {name:'煮面条',policy:'sequence',labels:['汤底','面条','蔬菜','鸡蛋','葱花']},
      {name:'做冰淇淋',policy:'sequence',labels:['草莓球','香草球','薄荷球']},
      {name:'打包套餐',policy:'combo',labels:['小汉堡','小汉堡','饼干','饼干','饮料','饮料']}
    ];
    let state={v:1,unlocked:false,entered:false,level:1,score:0,orders:0,order:null};
    let servingTimer=0,lastChanged=-1;
    function validOrder(o){
      return o&&Number.isInteger(o.kind)&&o.kind>=0&&o.kind<10&&Number.isInteger(o.variant)&&o.variant>=0&&o.variant<4&&Array.isArray(o.tokens)&&o.tokens.length===dishes[o.kind].labels.length&&o.tokens.every(t=>t&&typeof t.text==='string'&&/^[a-z0-9]{1,3}$/.test(t.text)&&Number.isInteger(t.pos)&&t.pos>=0&&t.pos<=t.text.length)&&Number.isInteger(o.focus)&&o.focus>=-1&&o.focus<o.tokens.length&&typeof o.pending==='boolean'&&(o.pending===o.tokens.every(t=>t.pos===t.text.length));
    }
    if(!preview){try{
      const saved=JSON.parse(localStorage.getItem(KEY));
      if(saved&&saved.v===1&&saved.unlocked===true&&Number.isSafeInteger(saved.level)&&saved.level>=1&&Number.isSafeInteger(saved.score)&&saved.score>=0&&Number.isInteger(saved.orders)&&saved.orders>=0&&saved.orders<5){
        state={v:1,unlocked:true,entered:saved.entered===true,level:saved.level,score:saved.score,orders:saved.orders,order:validOrder(saved.order)?saved.order:null};
      }
    }catch(e){}}
    if(preview){state.unlocked=true;state.level=Math.max(1,Math.min(10000,parseInt(params.get('level'),10)||1));}
    const box=$('#kitchen');
    function save(){if(preview)return;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
    function unlock(){state.unlocked=true;save();}
    function randomChar(advanced,index){
      const left='qwertasdfgzxcvb',right='yuiophjklnm';
      if(index===6)return left[Math.floor(Math.random()*left.length)];
      const pool=advanced?'abcdefghijklmnopqrstuvwxyz0123456789':'abcdefghijklmnopqrstuvwxyz';
      return pool[Math.floor(Math.random()*pool.length)];
    }
    function newOrder(){
      const kind=(state.level-1)%10,advanced=(state.level-1)%20>=10;
      const width=Math.min(3,(kind>=4&&kind<=7?2:1)+(advanced?1:0));
      const firsts=[];
      const tokens=dishes[kind].labels.map(function(label,index){
        let text='',first=randomChar(advanced,kind),attempts=0;
        if(advanced&&kind!==6&&index===0)first='0123456789'[(kind+state.orders)%10];
        while(firsts.indexOf(first)>=0&&attempts++<80)first=randomChar(advanced,kind);
        if(firsts.indexOf(first)>=0)first='abcdefghijklmnopqrstuvwxyz'[index];
        firsts.push(first);text=first;
        for(let c=1;c<width;c++){
          if(kind===6){const pool=c%2?'yuiophjklnm':'qwertasdfgzxcvb';text+=pool[Math.floor(Math.random()*pool.length)];}
          else text+=randomChar(advanced,kind);
        }
        return {text:text,pos:0};
      });
      state.order={kind:kind,variant:(Math.floor((state.level-1)/20)+Math.floor(Math.random()*4))%4,tokens:tokens,focus:-1,pending:false};save();
    }
    function candidates(){
      const o=state.order;if(!o||o.pending)return [];
      const remaining=[];o.tokens.forEach((t,i)=>{if(t.pos<t.text.length)remaining.push(i);});
      if(o.focus>=0&&remaining.indexOf(o.focus)>=0)return [o.focus];
      const policy=dishes[o.kind].policy;
      if(policy==='sequence')return remaining.slice(0,1);
      if(policy==='combo'){
        const group=Math.floor(remaining[0]/2);
        return group===1?remaining.filter(i=>Math.floor(i/2)===group):remaining.slice(0,1);
      }
      return remaining;
    }
    function R(x,y,w,h,fill,rx){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(rx||8)+'" fill="'+fill+'"/>';}
    function E(x,y,rx,ry,fill){return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="'+fill+'"/>';}
    function P(d,fill,stroke,width){return '<path d="'+d+'" fill="'+(fill||'none')+'"'+(stroke?' stroke="'+stroke+'" stroke-width="'+(width||4)+'" stroke-linecap="round" stroke-linejoin="round"':'')+'/>';}
    function C(x,y,r,fill){return E(x,y,r,r,fill);}
    function food(){
      const o=state.order,kind=o.kind,variant=o.variant;
      const pink=['#dc8e85','#dbb166','#9aa9c7','#bc9caf'][variant];
      const green=['#8dac75','#a8b875','#8aa896','#9bb881'][variant];
      const layers=[];
      let base=E(300,288,165,17,'#e4e4d8')+E(300,280,169,16,'#faf8ef');
      if(kind===0){
        layers.push(P('M207 261 Q300 276 393 261 L383 282 H217 Z','#dfac5f'));
        layers.push(P('M209 247 Q226 236 242 245 T275 245 T308 245 T341 245 T390 246 L390 260 H210 Z',green));
        layers.push(R(212,229,176,20,'#8b5e49',11));
        layers.push(P('M210 224 L390 224 L370 237 L300 231 L264 242 L213 234 Z','#f1c766'));
        layers.push(P('M206 217 Q215 133 300 133 Q385 133 394 217 Z','#e5b96c')+C(266,166,3,'#f9e5b8')+C(309,157,3,'#f9e5b8')+C(342,177,3,'#f9e5b8')+C(290,188,3,'#f9e5b8'));
      }else if(kind===1){
        base=R(146,104,308,178,'#b8c6bf',18)+R(156,113,288,158,'#e3e5dc',13);
        for(let n=0;n<6;n++){const x=208+(n%3)*92,y=153+Math.floor(n/3)*82;
          let shape=n===1?P('M'+x+' '+(y-31)+' l9 19 22 3 -16 15 4 22 -19 -11 -19 11 4 -22 -16 -15 22 -3 Z','#dbb775'):C(x,y,29,'#ddb87b');
          if(n===3)shape=P('M'+x+' '+(y+27)+' Q'+(x-42)+' '+(y-2)+' '+(x-25)+' '+(y-22)+' Q'+(x-10)+' '+(y-36)+' '+x+' '+(y-15)+' Q'+(x+10)+' '+(y-36)+' '+(x+25)+' '+(y-22)+' Q'+(x+42)+' '+(y-2)+' '+x+' '+(y+27)+' Z','#ddb87b');
          if(n===5){shape='';for(let petal=0;petal<5;petal++)shape+=C(x+Math.cos(petal*1.256)*18,y+Math.sin(petal*1.256)*18,14,'#ddb87b');}
          const chip=['#8f6650','#ba7875','#91a173','#a58fae'][variant];
          layers.push(shape+C(x-10,y-8,4,chip)+C(x+11,y-6,4,chip)+C(x+2,y+12,4,chip));
        }
      }else if(kind===2){
        base=P('M233 95 H367 L350 278 H250 Z','#faf8ef','#c3cfc8',4);
        layers.push(R(253,233,94,37,pink,6)+C(265,248,8,'#fae1bf')+C(325,250,9,'#efd29d'));
        layers.push(P('M240 151 H360 L350 242 H250 Z',pink));
        layers.push(R(266,155,25,25,'#e7f0e6',5)+R(307,168,27,26,'#e7f0e6',5));
        layers.push(P('M238 139 Q251 117 267 134 Q290 107 308 130 Q333 112 361 138 L358 155 H241 Z','#fff2d5')+P('M325 80 L320 137',null,green,9));
      }else if(kind===3){
        base=C(300,197,112,'#e3b16b')+C(300,197,99,'#f7dfaa');
        layers.push(C(300,197,96,'#cb826c'));
        layers.push(C(300,197,89,'#f4d995'));
        layers.push(C(260,168,17,pink)+C(331,227,17,pink)+C(324,156,16,pink));
        layers.push(P('M242 212 Q267 180 288 212 Z','#e2d8be')+R(260,213,9,17,'#e2d8be',3)+P('M316 187 Q339 161 358 187 Z','#e2d8be')+R(332,188,9,16,'#e2d8be',3));
        layers.push(P('M290 151 Q264 176 278 198 M335 205 Q365 217 339 244 M243 237 Q261 219 274 243',null,green,9));
      }else if(kind===4){
        base=P('M300 110 V304',null,'#ba9973',6);
        for(let n=0;n<4;n++)layers.push(C(300,243-n*42,23,n%2?pink:'#dba073')+C(292,235-n*42,5,'#f6ddba'));
        layers.push(P('M278 252 Q283 230 279 216 M279 205 Q285 183 280 174 M279 163 Q285 143 282 133',null,'#fff4d6',4));
      }else if(kind===5){
        base=R(143,109,314,173,'#92795f',20)+R(155,120,290,149,'#d8c8ad',14);
        for(let n=0;n<6;n++){const x=204+(n%3)*96,y=160+Math.floor(n/3)*72;
          layers.push(E(x,y,34,24,'#fcf5dd')+R(x-12,y-22,24,44,'#58715d',3)+P('M'+(x-32)+' '+(y-8)+' Q'+x+' '+(y-29)+' '+(x+32)+' '+(y-8)+' L'+(x+27)+' '+(y+4)+' Q'+x+' '+(y-9)+' '+(x-27)+' '+(y+4)+' Z',n%2?pink:'#e7b074'));
        }
      }else if(kind===6){
        layers.push(R(218,241,164,36,'#d4ad7e',8));layers.push(R(215,228,170,17,'#fff1d4',8));
        layers.push(R(221,215,158,16,pink,6));layers.push(R(219,173,162,43,'#dcb884',8));
        layers.push(P('M211 177 Q221 155 235 163 Q252 144 268 160 Q285 142 302 159 Q320 143 336 160 Q362 145 389 177 L384 190 Q370 184 362 195 Q349 183 341 193 Q320 181 307 194 Q288 181 276 195 Q257 183 247 195 Q229 184 216 192 Z','#fff2db'));
        layers.push(C(254,148,12,pink)+C(301,144,12,pink)+C(350,149,12,pink)+P('M250 138 L254 130 L259 139 M296 132 L301 124 L306 133',green));
      }else if(kind===7){
        base=P('M174 177 Q185 283 300 287 Q415 283 426 177 Z','#b1c1c1')+E(300,177,126,27,'#e4e8dd');
        layers.push(E(300,179,111,24,'#d4ae76'));
        layers.push(P('M218 179 Q246 161 259 181 T300 180 T347 180 T388 179 M223 191 Q249 177 266 194 T315 193 T375 190',null,'#f8e0a0',7));
        layers.push(P('M216 173 Q199 149 220 145 Q232 150 229 164 M244 186 Q231 154 252 151 Q265 164 259 181',green));
        layers.push(E(347,170,25,18,'#fff6de')+E(347,170,12,11,'#eac369'));
        layers.push(C(282,174,5,green)+C(320,186,5,green)+C(279,194,5,green)+C(386,181,5,green));
      }else if(kind===8){
        base=P('M252 208 L348 208 L300 300 Z','#dfb477')+P('M266 219 L320 271 M283 214 L330 249 M334 219 L281 271 M319 213 L270 247',null,'#bf9865',2);
        for(let n=0;n<3;n++)layers.push(C(300,204-n*43,33,[pink,'#f0d7a7',green][n])+C(291,195-n*43,7,'#fff4de'));
      }else{
        base=R(131,110,338,171,'#b29a79',18)+R(141,120,318,151,'#efe3c9',12)+P('M251 120 V270 M363 120 V270',null,'#b29a79',5);
        layers.push(R(159,212,74,18,'#9a6a4f',7)+R(156,232,80,13,'#d8a96b',7));
        layers.push(P('M157 203 Q160 160 196 160 Q232 160 236 203 Z','#e5b96c')+P('M157 209 H235',null,green,7));
        layers.push(C(283,168,21,'#dbb775')+C(282,167,4,'#8f6650'));
        layers.push(C(327,221,22,'#dbb775')+C(324,218,4,'#8f6650'));
        layers.push(P('M388 154 H437 L429 244 H397 Z',pink));
        layers.push(P('M388 155 Q401 136 414 146 Q427 135 437 154 Z','#fff2d5')+P('M418 130 V151',null,green,5));
      }
      let art=base;
      layers.forEach(function(svg,i){const t=o.tokens[i];const opacity=t.pos===t.text.length?1:(t.pos?0.3+0.7*t.pos/t.text.length:0);art+='<g class="k-food-piece '+(i===lastChanged?'k-new':'')+'" opacity="'+opacity+'">'+svg+'</g>';});
      return '<svg viewBox="130 70 340 245" role="img" aria-label="'+dishes[kind].name+'制作进度">'+art+'</svg>';
    }
    function render(){
      const o=state.order,choices=candidates(),policy=dishes[o.kind].policy;
      $('#k-score').textContent=state.score;$('#k-level').textContent=state.level;$('#k-orders').textContent=state.orders+' / 5';
      $('#k-name').textContent=dishes[o.kind].name;
      $('#k-policy').textContent=o.pending?'订单完成':policy==='combo'?'汉堡 → 饼干 → 饮料':policy==='free'?'任选一组，连续敲完':'按顺序输入';
      $('#k-food').innerHTML=food();
      $('#k-tokens').innerHTML=o.tokens.map(function(t,i){
        const finished=t.pos===t.text.length;
        const chars=t.text.split('').map((c,n)=>'<b class="'+(n<t.pos?'typed':(n===t.pos&&choices.indexOf(i)>=0?'current':''))+'">'+c+'</b>').join('');
        return '<div class="k-token '+(finished?'done':(choices.indexOf(i)>=0?'ready':''))+'"><small>'+dishes[o.kind].labels[i]+'</small><div>'+chars+'</div>'+(finished?'<i>✓</i>':'')+'</div>';
      }).join('');
      const next=choices.map(i=>o.tokens[i].text[o.tokens[i].pos]);
      document.querySelectorAll('#k-keyboard .k-key').forEach(node=>node.classList.toggle('active',next.indexOf(node.getAttribute('data-key'))>=0));
      const names=[];
      const mapping=[['qaz','左手小指'],['wsx','左手无名指'],['edc','左手中指'],['rfvtgb','左手食指'],['yuhjnm','右手食指'],['ik','右手中指'],['ol','右手无名指'],['p','右手小指'],['1','左手小指'],['2','左手无名指'],['3','左手中指'],['45','左手食指'],['67','右手食指'],['8','右手中指'],['9','右手无名指'],['0','右手小指']];
      mapping.forEach(f=>{if(next.some(c=>f[0].indexOf(c)>=0))names.push(f[1]);});
      document.querySelectorAll('#k-hands .hand-finger').forEach(node=>node.classList.toggle('active',names.indexOf(node.getAttribute('data-finger'))>=0));
      lastChanged=-1;
      $('#k-hands').setAttribute('aria-label',names.length?'对应手指：'+Array.from(new Set(names)).join('、'):'双手指法');
    }
    function serve(){
      clearTimeout(servingTimer);
      $('#k-status').textContent='送出一份，+5 分';
      servingTimer=setTimeout(function(){newOrder();$('#k-status').textContent='';render();},650);
    }
    function enter(){
      if(!state.unlocked)return;
      state.entered=true;if(!state.order)newOrder();
      document.body.classList.add('kitchen-playing');
      $('#finale').classList.add('kitchen-on');box.hidden=false;
      save();render();if(state.order.pending)serve();
      $('#k-enter').blur();
    }
    window.addEventListener('keydown',function(e){
      if(box.hidden||e.ctrlKey||e.metaKey||e.altKey)return;
      if(e.isComposing||e.key==='Process'){$('#k-status').textContent='请切换到英文输入';return;}
      if(!/^[a-z0-9]$/i.test(e.key))return;
      e.preventDefault();if(e.repeat||!state.order||state.order.pending)return;
      const ch=e.key.toLowerCase(),choices=candidates();
      let match=-1;choices.some(i=>{const t=state.order.tokens[i];if(t.text[t.pos]===ch){match=i;return true;}return false;});
      if(match<0){$('#k-status').textContent='看看亮起的字符，再试一次';return;}
      const t=state.order.tokens[match];t.pos++;state.score++;lastChanged=match;
      state.order.focus=t.pos<t.text.length?match:-1;
      good();$('#k-status').textContent='';
      if(state.order.tokens.every(x=>x.pos===x.text.length)){
        state.score+=5;state.orders++;state.order.pending=true;
        if(state.orders===5){state.orders=0;state.level++;}
      }
      save();render();if(state.order.pending)serve();
    });
    ['1234567890','qwertyuiop','asdfghjkl','zxcvbnm'].forEach(row=>{
      const line=document.createElement('div');line.className='k-key-row';
      row.split('').forEach(c=>{const key=document.createElement('span');key.className='k-key';key.setAttribute('data-key',c);key.textContent=c;line.appendChild(key);});
      $('#k-keyboard').appendChild(line);
    });
    $('#k-enter').onclick=enter;
    return {unlock:unlock,enter:enter,restored:state.unlocked,entered:state.entered,preview:preview};
  })();

  if(kitchenGame.restored){
    LEVELS.forEach(l=>{best[l[0]]=TOTALS[l[0]];lockMode(l[0]);});updateTot();startFinale();
    if(kitchenGame.entered||new URLSearchParams(location.search).get('kitchen')==='1')kitchenGame.enter();
  }else show('a');
})();
</script>
