<script>
/* ===== 防误触兜底 =====
   1) 右键菜单：学生鼠标不熟练，乱按时很容易弹出系统右键菜单挡住画面。
      这里全局取消默认菜单，但只调 preventDefault、绝不 stopPropagation，
      页内自己监听 contextmenu 的功能照常收到事件。输入框除外，要用右键粘贴。
   2) 拖拽：防止图片/文字被拖出页面。拖拽练习走 pointer 事件，不受影响。
   3) 防误退：Edge 的鼠标手势（右键按住向左拖动）和误按后退键都会触发浏览器
      后退，把学生从练习页带走。压两层 history 哨兵，任何后退/前进都只会落回
      本页，popstate 一响立刻再压一层，页面始终留在原地。
   本页不使用 hash / history 导航，以上都不影响页内功能。 */
(function () {
  /* 输入框里保留原生右键菜单，方便右键粘贴 */
  function keepNative(el) {
    return !!(el && el.closest &&
      el.closest('input, textarea, [contenteditable]:not([contenteditable="false"])'));
  }
  document.addEventListener('contextmenu', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();                    /* 只取消默认菜单，不阻断页内逻辑 */
  }, true);
  document.addEventListener('dragstart', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();
  }, true);

  /* 防误退 */
  if (location.protocol === 'file:') return;      /* file:// 下浏览器禁止 pushState */
  function guard() {
    try { history.pushState({ mtSentinel: 1 }, '', location.href); } catch (e) {}
  }
  try {
    guard(); guard();
    window.addEventListener('popstate', guard);
  } catch (e) {}
})();
</script>
<script>
/* ===== 兼容层 A：flex gap 能力探测 =====
   老内核（Edge 84 以前、EdgeHTML）的 flex 布局不支持 gap，间距会全部塌掉。
   这里用真实布局量一次宽度来判断，支持就用原样，不支持就给 <html> 挂上
   no-flexgap，样式表里预置的 margin 规则接管间距。
   不用 CSS.supports('gap') 判断：gap 在 Chrome 66 起就作为 grid-gap 的别名存在，
   老版本会误报"支持"。 */
(function () {
  try {
    var box = document.createElement('div');
    box.style.cssText = 'position:absolute;top:-9999px;left:-9999px;display:flex;gap:10px;width:auto;height:1px';
    var a = document.createElement('i');
    var b = document.createElement('i');
    a.style.cssText = b.style.cssText = 'display:block;width:10px;height:1px';
    box.appendChild(a); box.appendChild(b);
    document.documentElement.appendChild(box);
    var w = box.getBoundingClientRect().width || box.scrollWidth;
    document.documentElement.removeChild(box);
    if (!(w >= 30)) document.documentElement.className += ' no-flexgap';
  } catch (e) {}
})();
</script>

var FINGERS=[['qaz','左手小指'],['wsx','左手无名指'],['edc','左手中指'],['rfvtgb','左手食指'],['yuhjnm','右手食指'],['ik','右手中指'],['ol','右手无名指'],['p','右手小指']];
function buildKeyboard(){['qwertyuiop','asdfghjkl','zxcvbnm'].forEach(function(row){var line=document.createElement('div');line.className='key-row';row.split('').forEach(function(c){var k=document.createElement('span');k.className='key'+(c==='f'||c==='j'?' home':'');k.id='key-'+c;k.textContent=c.toUpperCase();line.appendChild(k);});$('keyboard').appendChild(line);});}
function hint(){var c=busy||state.screen==='invite'||state.screen==='practice'&&state.rounds[state.level].done===lessonTotal(state.level)?'':word().raw[typed().length],finger='';FINGERS.forEach(function(f){if(c&&f[0].indexOf(c)!==-1)finger=f[1];});
 document.querySelectorAll('.key').forEach(function(k){k.classList.toggle('active',k.id==='key-'+c);});document.querySelectorAll('.hand-finger').forEach(function(f){f.classList.toggle('active',f.getAttribute('data-finger')===finger);});
 $('fingerHint').textContent=c?'下一键 '+c.toUpperCase()+' · '+finger:'';$('hands').setAttribute('aria-label',finger?finger+'按键提示':'双手指法');
}

function renderRoute(){
 var view=currentJourney(),m=mission();
 $('routeTitle').textContent=m.name+'邮路';
 $('journeyGoal').textContent='';
 $('parcelLabel').textContent='送往 · '+m.place;
 $('routeProgress').innerHTML='<span class="route-track"><span style="width:'+((view.done+(motion?1:0))*2)+'%"></span></span>';
 $('routeProgress').setAttribute('aria-label','本段完成 '+view.done+' / 50');
}

/* 生成的2.5D大地图与窄小径；人物和镜头沿同一条曲线前进。 */
var MAP_ROUTE='M130 580 C220 600 680 570 730 460 C780 360 370 420 400 290 C450 220 720 220 850 125';
var MAP_ROUTES={'medieval-village':'M150 530 C230 550 600 550 620 450 C620 410 350 410 400 330 C450 250 730 270 850 125','medieval-town':'M150 530 C220 550 420 530 420 450 C400 420 300 400 350 330 C420 260 730 280 850 125','medieval-city':'M150 530 C250 550 510 530 520 450 C520 420 380 410 400 330 C450 280 720 230 850 125',bamboo:'M130 580 C250 560 600 600 690 510 C740 440 320 460 350 330 C380 240 740 280 850 125',night:'M130 580 C230 590 650 580 700 500 C720 440 350 440 350 340 C500 290 650 240 850 125',forest:'M130 580 C190 500 420 510 430 440 C440 390 300 370 350 300 C420 220 700 230 850 125',city:'M130 580 C180 500 470 530 500 450 C530 400 260 390 290 300 C370 230 700 250 850 125'};
function mapPoint(position){var path=$('mapRoute'),length=path.getTotalLength();return path.getPointAtLength(length*Math.max(0,Math.min(50,position))/50);}
function routePosition(trip,done,partial){
 var words=routeWords(trip),letters=0,total=0;
 words.forEach(function(w,i){total+=w.raw.length;if(i<done)letters+=w.raw.length;});
 return (letters+(partial?partial.length:0))/total*50;
}
function mapCamera(point){
 var el=$('scene'),width=740,height=Math.min(620,el.clientHeight/el.clientWidth*width);
 return {x:Math.max(0,Math.min(1000-width,point.x-width*.5)),y:Math.max(0,Math.min(667-height,point.y-height*.58)),width:width,height:height};
}
var walkFrame=0,mapPosition=0,mapTarget=0;
function setMapFrame(position){
 var point=mapPoint(position),c=mapCamera(point);
 $('journeySvg').setAttribute('viewBox',c.x+' '+c.y+' '+c.width+' '+c.height);
 $('courier').setAttribute('transform','translate('+point.x+' '+point.y+')');
 $('journeyWorld').setAttribute('data-camera',String(position*110));
 mapPosition=position;
}
function moveOnMap(target){
 if(Math.abs(target-mapTarget)<.00001)return;
 cancelAnimationFrame(walkFrame);mapTarget=target;
 var from=mapPosition,begun=performance.now();
 function frame(now){var t=Math.min(1,(now-begun)/140),ease=1-Math.pow(1-t,3);setMapFrame(from+(target-from)*ease);if(t<1)walkFrame=requestAnimationFrame(frame);else walkFrame=0;}
 walkFrame=requestAnimationFrame(frame);
}

function drawJourney(){
 var view=currentJourney(),t=mission(),key='map-'+view.trip,target=motion?routePosition(view.trip,view.done+1,''):routePosition(view.trip,view.done,state.mail.typed);
 $('scene').setAttribute('aria-label',t.name+'邮路');$('scene').style.background=t.sky;
 if(lastScene!==key){
  lastScene=key;cancelAnimationFrame(walkFrame);
  var image='assets/pinyin-post/'+t.kind+'.png',route=MAP_ROUTES[t.kind]||MAP_ROUTE;
  var pathColor=t.kind==='snow'?'#f6f5e8':t.kind==='city'?'#ddd0b8':t.kind==='night'?'#c4bfa3':'#d8c5a2';
  $('landscape').innerHTML='<svg id="journeySvg" viewBox="0 0 1000 667" preserveAspectRatio="xMidYMid slice" role="img" aria-label="'+t.name+'立体地图与送件小哥"><defs><filter id="courierShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".16"/></filter></defs><g id="journeyWorld"><image href="'+image+'" xlink:href="'+image+'" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="667" preserveAspectRatio="none"/><path d="'+route+'" fill="none" stroke="#5f6544" stroke-opacity=".055" stroke-width="12" stroke-linecap="round" transform="translate(0 2)"/><path id="mapRoute" d="'+route+'" fill="none" stroke="'+pathColor+'" stroke-width="9" stroke-linecap="round"/><path d="'+route+'" fill="none" stroke="#fff6df" stroke-opacity=".10" stroke-width="2" stroke-linecap="round"/><circle cx="850" cy="125" r="8" fill="#fff4c6" stroke="#b79260" stroke-width="2"/><g id="courier"><ellipse cy="1" rx="11" ry="4" fill="#263e3640"/><g id="courierArt"><image class="courier-body" href="assets/pinyin-post/courier.png" xlink:href="assets/pinyin-post/courier.png" xmlns:xlink="http://www.w3.org/1999/xlink" x="-23" y="-53" width="46" height="56" preserveAspectRatio="xMidYMax meet"/></g></g></g></svg>';
  mapTarget=target;setMapFrame(target);
  var nextMap=new Image();nextMap.src='assets/pinyin-post/'+SCENES[sceneIndex(view.trip+1)].kind+'.png';
 }
 moveOnMap(target);
}
window.addEventListener('resize',function(){if(state.screen==='post')setMapFrame(mapPosition);});

function landscape(){if(state.screen==='post'){drawJourney();return;}var post=state.screen==='post',station=Math.floor(state.mail.sent/5)+1,index=post?Math.floor((state.mail.sent-(state.mail.delivering?1:0))/5)%4:0,t=THEMES[index],key=post?String(index):'base';
 $('scene').setAttribute('aria-label',t.name);$('scene').style.background=t.sky;
 if(lastScene===key)return;lastScene=key;
 var decorations=index===1?'<path d="M0 285 Q60 265 120 285 T240 285 T360 285 T500 285 V370 H0Z" fill="#77b9c1"/><path d="M12 290 Q50 278 88 290 M260 298 Q300 286 340 298" fill="none" stroke="#d5f0ef" stroke-width="4"/>':index===2?'<path d="M0 240 L85 120 168 240 246 97 365 240 430 160 500 240Z" fill="#b9cdd6"/><path d="M65 150 L85 120 110 156 85 148Z M220 135 L246 97 280 141 248 130Z" fill="#fff"/>':index===3?'<g fill="#fce6ad"><circle cx="80" cy="90" r="2"/><circle cx="242" cy="70" r="2"/><circle cx="355" cy="133" r="2"/><circle cx="420" cy="55" r="3"/><circle cx="148" cy="141" r="2"/></g>':'';
 var trees='';for(var i=0;i<5;i++){var x=20+i*112;trees+='<g transform="translate('+x+' '+(190+(i%2)*18)+')"><path d="M0 80 V10" stroke="#78936d" stroke-width="7"/><path d="M-29 35 L0 -30 29 35Z M-35 62 L0 -5 35 62Z" fill="'+(index===2?'#f5f7ed':index===3?'#48634c':'#8aaf7b')+'"/></g>';}
 $('landscape').innerHTML='<svg viewBox="0 0 500 370" preserveAspectRatio="xMidYMax slice" role="img" aria-label="'+t.name+'的邮局、小屋与邮车"><rect width="500" height="370" fill="'+t.sky+'"/><circle cx="391" cy="96" r="27" fill="'+(t.night?'#fff1c7':'#f6d58e')+'"/><path d="M0 224 Q105 155 223 217 T500 199 V370 H0Z" fill="'+t.hill+'"/>'+decorations+trees+'<path d="M0 300 Q250 260 500 304 V370 H0Z" fill="'+t.ground+'"/><path d="M-30 340 Q160 289 530 343" fill="none" stroke="#ede1bc" stroke-width="30"/>'+
 '<g transform="translate(62 191)"><rect width="152" height="107" rx="6" fill="#fff1ca"/><path d="M-13 4 L74 -60 165 4Z" fill="#c57049"/><path d="M17 3 H135" stroke="#e19c6b" stroke-width="7"/><rect x="61" y="52" width="35" height="55" rx="14" fill="#537d63"/><circle cx="86" cy="83" r="2" fill="#edcf7f"/><rect x="15" y="41" width="30" height="31" rx="5" fill="#b9d3b7"/><path d="M30 42 V70 M15 57 H45" stroke="#fff4db" stroke-width="3"/><rect x="108" y="39" width="29" height="20" rx="3" fill="#d9a05d"/><path d="M111 42 L122 50 134 42" fill="none" stroke="#fff7df" stroke-width="2"/><rect x="42" y="7" width="70" height="26" rx="4" fill="#fffaf0"/><text x="77" y="25" font-size="13" font-weight="bold" text-anchor="middle" fill="#58735a">森林邮局</text></g>'+
 '<g transform="translate(346 211)"><rect width="93" height="79" rx="4" fill="'+t.house+'"/><path d="M-9 3 L47 -45 103 3Z" fill="#728c70"/><rect x="34" y="35" width="27" height="44" rx="10" fill="#8c9a76"/><rect x="12" y="21" width="18" height="22" rx="3" fill="'+(t.night?'#ffe6a3':'#fff3c9')+'"/><rect x="65" y="21" width="18" height="22" rx="3" fill="#fff3c9"/></g>'+
 '<g class="delivery-van" transform="translate(0 0)"><g transform="translate(205 282)"><rect x="0" y="-8" width="63" height="41" rx="7" fill="#cf6b45"/><path d="M63 1 H80 L95 20 V33 H63Z" fill="#e18c59"/><path d="M68 5 H78 L87 19 H68Z" fill="#e2ecda"/><rect x="14" y="3" width="29" height="19" rx="3" fill="#fff2d6"/><path d="M17 6 L28 13 40 6" stroke="#cc805a" stroke-width="2" fill="none"/><circle cx="19" cy="34" r="10" fill="#445c51"/><circle cx="78" cy="34" r="10" fill="#445c51"/><circle cx="19" cy="34" r="4" fill="#ced7ba"/><circle cx="78" cy="34" r="4" fill="#ced7ba"/></g></g></svg>';
}
function render(){
 var post=state.screen==='post',invite=state.screen==='invite',r=state.rounds[state.level],w=word(),done=!post&&r.done===lessonTotal(state.level);
 $('app').classList.toggle('journey-on',post);$('parcelLabel').hidden=!post;$('journeyGoal').hidden=!post;$('lessonNav').hidden=post;$('routes').hidden=!post;$('invitation').hidden=!invite;
 $('headerCount').innerHTML=post?'已送达 <strong>'+state.mail.sent+'</strong> 件':'已完成练习 <strong>'+state.rounds.reduce(function(n,a){return n+a.done;},0)+'</strong> / '+TOTAL;
 document.querySelectorAll('.lesson').forEach(function(b,i){b.classList.toggle('active',i===state.level);b.classList.toggle('done',state.rounds[i].done===lessonTotal(i));b.querySelector('.tally').textContent=state.rounds[i].done===lessonTotal(i)?'✓ 完成':state.rounds[i].done+' / '+lessonTotal(i);b.setAttribute('aria-current',i===state.level?'step':'false');});
 if(post){renderRoute();} $('roundLabel').textContent=post?(currentJourney().done+(motion?1:0))+' / 50':(done?lessonTotal(state.level)+' / '+lessonTotal(state.level)+' · 已完成':(r.done+1)+' / '+lessonTotal(state.level));
 $('wordName').textContent=w.name;$('wordIcon').textContent=post?'':w.icon;$('pinyin').textContent=w.tone;
 $('tokens').innerHTML='';w.raw.split('').forEach(function(c,i){var span=document.createElement('span');span.className='token'+(done||busy||i<typed().length?' correct':i===typed().length?' current':'');span.textContent=c;$('tokens').appendChild(span);});$('tokens').setAttribute('aria-label','需要输入 '+w.raw+'，已输入 '+typed());
 $('nextLesson').hidden=!done;$('nextLesson').textContent='下一关';$('stamp').hidden=!busy||post;$('workspace').classList.toggle('delivering',busy&&post);
 $('status').textContent=feedback;landscape();hint();
 if(invite)$('enterPost').focus({preventScroll:true});
}
function finishWord(){
 sound('done');
 busy=true;feedback='';
 if(state.screen==='post'){motion={trip:state.mail.sent,done:state.mail.done};state.mail.done++;if(state.mail.done===50){state.mail.sent++;state.mail.done=0;}state.mail.typed='';state.mail.delivering=true;}
 else{var r=state.rounds[state.level];r.done++;r.typed='';if(complete())state.screen='invite';}
 save();
 if(state.screen==='invite'){busy=false;render();return;}
 render();
 timer=setTimeout(function(){busy=false;if(state.screen==='post'){state.mail.delivering=false;motion=null;}feedback='';save();render();focusApp();},state.screen==='post'?180:650);
}
function accept(e){
 if(e.ctrlKey||e.altKey||e.metaKey)return;
 if(state.screen==='invite'){if(e.key==='Tab'){e.preventDefault();$('enterPost').focus();}return;}
 if(e.isComposing||e.key==='Process'||e.key==='Unidentified'){status('请切换到英文输入。');return;}
 if(e.key===' '||e.key==='Enter'||e.key==='Backspace')e.preventDefault();
 if(e.repeat||busy||state.screen==='practice'&&state.rounds[state.level].done===lessonTotal(state.level))return;
 if(e.key==='Backspace'){setTyped(typed().slice(0,-1));feedback='';save();render();return;}
 if(!/^[a-zA-Z]$/.test(e.key))return;e.preventDefault();var key=e.key.toLowerCase(),w=word();
 if(key!==w.raw[typed().length]){sound('wrong');status('请按 '+w.raw[typed().length].toUpperCase());$('tokens').classList.remove('wrong');void $('tokens').offsetWidth;$('tokens').classList.add('wrong');return;}
 setTyped(typed()+key);feedback='';if(typed()===w.raw){finishWord();return;}sound('tap');save();render();
}
$('nextLesson').addEventListener('click',function(){var i=state.rounds.findIndex(function(r,i){return r.done<lessonTotal(i);});if(i>=0)selectLesson(i);});
$('enterPost').addEventListener('click',function(){if(!complete())return;stopTimer();state.screen='post';feedback='';save();render();focusApp();});
document.addEventListener('keydown',accept);window.addEventListener('focus',focusApp);document.addEventListener('visibilitychange',function(){if(!document.hidden)focusApp();});$('workspace').addEventListener('pointerdown',focusApp);
restore();
if(preview){state.mail.seed=17;state.rounds.forEach(function(r,i){r.done=lessonTotal(i);r.typed='';});state.screen=params.get('post')==='1'?'post':'invite';var station=parseInt(params.get('station'),10);if(number(station,SCENES.length)&&station>0){var order=shuffled(SCENES.map(function(s,i){return i;}),state.mail.seed);state.mail.sent=order.indexOf(station-1);}var step=parseInt(params.get('step'),10);if(number(step,49))state.mail.done=step;}

buildNav();buildKeyboard();render();focusApp();
/* 只读快照供课堂自检使用，不绕过键盘操作。 */
window.__post={snapshot:function(){return JSON.parse(JSON.stringify(state));},target:function(){return word().raw;},mission:function(){return mission();},scenes:SCENES,routeWords:routeWords,sceneIndex:sceneIndex,lessons:LESSONS};
})();
</script>
