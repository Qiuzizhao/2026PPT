<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖥️ 鼠标练习营 3 · 我的第一台电脑</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f6cbd'/><rect x='5' y='7' width='22' height='15' rx='2' fill='%23f3f3f3'/><circle cx='16' cy='14' r='3.2' fill='%230f6cbd'/><path d='M11 19h10' stroke='%230f6cbd' stroke-width='2' stroke-linecap='round'/><path d='M16 22v3M12 27h8' stroke='%23f3f3f3' stroke-width='2' stroke-linecap='round'/></svg>">
<meta name="theme-color" content="#0f6cbd">
<style>
  :root{
    --blue:#0f6cbd; --blue-dark:#0b5394; --blue-soft:#dceaf7;
    --ink:#1f1f1f; --muted:#5c6470; --line:#d7dbe2;
    --surface:#f6f7f9; --card:#ffffff;
    --taskbar:rgba(28,32,40,.92);
    --accent:#e8890c;
    --gold:#f2c14e; --good:#107c41;
    --shadow:0 10px 26px rgba(15,25,45,.22);
    --shadow-sm:0 3px 10px rgba(15,25,45,.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    color:var(--ink);background:#0b1220;
    user-select:none;
  }
  /* ===== 桌面 ===== */
  .desk{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden}
  .wall{
    position:absolute;top:0;right:0;bottom:0;left:0;
    background:
      radial-gradient(circle at 78% 22%, #ffe6a7 0 8%, rgba(255,230,167,0) 30%),
      linear-gradient(180deg,#1b3b6f 0%,#2b5c9b 38%,#5b9bd5 66%,#a8cdec 100%);
    transition:filter .4s ease;
  }
  .wall::after{
    content:"";position:absolute;left:-10%;right:-10%;bottom:-6%;height:46%;
    background:
      radial-gradient(60% 100% at 22% 100%, #2f6b4f 0 60%, rgba(47,107,79,0) 62%),
      radial-gradient(52% 90% at 62% 104%, #245a43 0 60%, rgba(36,90,67,0) 62%),
      radial-gradient(70% 80% at 96% 110%, #1f4f3b 0 60%, rgba(31,79,59,0) 62%);
  }
  .wall.light{filter:brightness(1.25) saturate(.75)}

  /* ===== 顶部教学条 ===== */
  .topbar{
    position:absolute;top:0;right:0;left:0;height:44px;z-index:60;
    background:linear-gradient(180deg,rgba(12,18,30,.92),rgba(12,18,30,.78));
    color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px;
    font-size:17px;font-weight:700;
  }
  html.no-flexgap .topbar > *:not(:last-child){margin-right:14px}
  .topbar .lv{background:var(--blue);border-radius:8px;padding:4px 12px;white-space:nowrap}
  .topbar .task{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .topbar .task b{color:#ffd76a}
  .topbar .dots{display:flex;gap:6px}
  html.no-flexgap .topbar .dots > *:not(:last-child){margin-right:6px}
  .topbar .dot{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.45)}
  .topbar .dot.done{background:var(--gold);border-color:var(--gold)}
  .topbar .dot.now{background:#fff;border-color:#fff;transform:scale(1.15)}
  .topbar .stars{color:#ffd76a;white-space:nowrap}
  .topbar button{
    font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
    border:none;border-radius:8px;padding:8px 14px;background:rgba(255,255,255,.16);color:#fff;
  }
  .topbar button:hover{background:rgba(255,255,255,.28)}
  .topbar button.primary{background:var(--accent);color:#231a03}
  .topbar button.primary:hover{background:#f79b1e}

  /* ===== 桌面图标 ===== */
  .icons{position:absolute;top:60px;right:0;bottom:56px;left:0;z-index:10}
  .icon{
    position:absolute;width:100px;height:108px;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:4px;padding:8px 4px 4px;cursor:pointer;border:2px solid transparent;
    transition:background .12s ease,border-color .12s ease,transform .12s ease;
  }
  html.no-flexgap .icon > *:not(:last-child){margin-bottom:4px}
  .icon .face{
    width:62px;height:62px;border-radius:12px;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:36px;
    box-shadow:var(--shadow-sm);
  }
  .icon .lbl{
    font-size:14px;font-weight:600;color:#fff;text-align:center;line-height:1.25;
    text-shadow:0 1px 3px rgba(0,0,0,.6);padding:0 2px;
    max-width:96px;word-break:break-all;
  }
  .icon:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5)}
  .icon.sel{background:rgba(96,166,255,.42);border-color:#bfe0ff}
  .icon.sel .lbl{color:#fff}
  .icon.dragging{opacity:.65;transform:scale(1.05)}
  .icon.target{border-color:var(--gold);background:rgba(242,193,78,.35)}
  .icon.done{opacity:.5}
  .icon .lbl .sub{display:block;font-size:12px;opacity:.92;font-weight:600;margin-top:2px}
  .cf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:950;pointer-events:none;animation:cfall 2s linear forwards}
  @keyframes cfall{to{transform:translateY(110vh) rotate(540deg);opacity:.35}}
  .icon.pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(242,193,78,.75)}
    50%{box-shadow:0 0 0 14px rgba(242,193,78,0)}
  }

  /* ===== 窗口 ===== */
  .winlayer{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20;pointer-events:none}
  .win{
    position:absolute;pointer-events:auto;background:var(--card);
    border-radius:10px;overflow:hidden;border:1px solid rgba(0,0,0,.14);
    box-shadow:var(--shadow);display:flex;flex-direction:column;
    transition:opacity .18s ease,transform .18s ease;
  }
  .win.min{opacity:0;transform:scale(.7);pointer-events:none}
  .win .tbar{
    height:44px;flex-shrink:0;background:#eef1f5;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;cursor:grab;
    touch-action:none;
  }
  html.no-flexgap .win .tbar > *:not(:last-child){margin-right:10px}
  .win .tbar.grabbing{cursor:grabbing}
  .win .tbar .wico{font-size:20px}
  .win .tbar .wtxt{flex:1;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .win .wbtns{display:flex;gap:4px}
  html.no-flexgap .win .wbtns > *:not(:last-child){margin-right:4px}
  .win .wb{
    width:44px;height:34px;border:none;border-radius:6px;background:transparent;cursor:pointer;
    font-family:inherit;font-size:16px;font-weight:700;color:#41474f;
    display:flex;align-items:center;justify-content:center;
  }
  .win .wb:hover{background:#dfe4ea}
  .win .wb.cls:hover{background:#e81123;color:#fff}
  .win .wbody{
    flex:1;overflow:auto;padding:16px 18px;font-size:17px;line-height:1.9;color:#2b3038;
    background:#fff;
  }
  .win .wbody.center{display:flex;align-items:center;justify-content:center;font-size:64px}
  .win.active{border-color:var(--blue);box-shadow:0 14px 34px rgba(15,25,45,.34)}
  .win.active .tbar{background:linear-gradient(180deg,#e6f0fb,#d8e7f8)}
  .win.flash{animation:flashok .8s ease}
  @keyframes flashok{0%{box-shadow:0 0 0 0 rgba(16,124,65,.55)}100%{box-shadow:0 0 0 26px rgba(16,124,65,0)}}

  /* 贴边预览 */
  .snapview{
    position:absolute;z-index:18;display:none;pointer-events:none;
    background:rgba(96,166,255,.32);border:3px solid #bfe0ff;border-radius:10px;
    transition:all .12s ease;
  }
  /* 右键菜单 */
  .ctxmenu{
    position:absolute;z-index:200;display:none;min-width:210px;background:#fbfcfe;
    border-radius:10px;padding:6px;box-shadow:0 16px 34px rgba(10,20,40,.34);
    border:1px solid rgba(0,0,0,.12);
  }
  .ctxmenu.show{display:block;animation:popin .12s ease}
  @keyframes popin{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .ctxmenu .mi{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:8px;
    font-size:17px;font-weight:600;cursor:pointer;
  }
  html.no-flexgap .ctxmenu .mi > *:not(:last-child){margin-right:10px}
  .ctxmenu .mi:hover{background:var(--blue-soft)}
  .ctxmenu .mi .ic{font-size:19px;width:24px;text-align:center}
  .ctxmenu .sep{height:1px;background:var(--line);margin:5px 8px}

  /* ===== 任务栏 ===== */
  .taskbar{
    position:absolute;left:0;right:0;bottom:0;height:56px;z-index:70;
    background:var(--taskbar);display:flex;align-items:center;gap:10px;padding:0 12px;
    color:#fff;
  }
  html.no-flexgap .taskbar > *:not(:last-child){margin-right:10px}
  .tb-btn{
    border:none;font-family:inherit;cursor:pointer;color:#fff;
    background:rgba(255,255,255,.12);border-radius:8px;padding:10px 16px;
    font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;
    min-height:40px;
  }
  html.no-flexgap .tb-btn > *:not(:last-child){margin-right:8px}
  .tb-btn:hover{background:rgba(255,255,255,.24)}
  .tb-btn.on{background:var(--blue-soft);color:#12314f}
  .tb-btn.start{background:var(--blue)}
  .tb-btn.start:hover{background:#1a7fd0}
  .tb-tasks{display:flex;align-items:center;gap:8px;flex:1;overflow:hidden}
  html.no-flexgap .tb-tasks > *:not(:last-child){margin-right:8px}
  .tb-clock{font-size:16px;font-weight:700;white-space:nowrap;padding-left:10px;border-left:1px solid rgba(255,255,255,.25)}
  .tb-clock small{display:block;font-size:12px;font-weight:600;opacity:.8}

  /* ===== 开始菜单 ===== */
  .startmenu{
    position:absolute;z-index:150;left:12px;bottom:64px;width:320px;display:none;
    background:#f7f9fc;border-radius:12px;border:1px solid rgba(0,0,0,.14);
    box-shadow:0 18px 40px rgba(10,20,40,.36);overflow:hidden;
  }
  .startmenu.show{display:block;animation:popin .14s ease}
  .startmenu .sm-head{padding:12px 16px 8px;font-size:15px;font-weight:700;color:var(--muted)}
  .startmenu .sm-list{max-height:290px;overflow:auto;padding:0 6px 10px}
  .startmenu .app{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;
    font-size:17px;font-weight:600;cursor:pointer;
  }
  html.no-flexgap .startmenu .app > *:not(:last-child){margin-right:12px}
  .startmenu .app:hover{background:var(--blue-soft)}
  .startmenu .app .face{font-size:22px;width:26px;text-align:center}
  .startmenu .sm-foot{padding:10px 16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}

  /* ===== 小助手 + 提示气泡 ===== */
  .assistant{
    position:absolute;left:16px;bottom:70px;z-index:120;display:flex;align-items:flex-end;gap:10px;
    pointer-events:none;
  }
  html.no-flexgap .assistant > *:not(:last-child){margin-right:10px}
  .assistant .bot{
    width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0;
    animation:bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .assistant .bubble{
    max-width:520px;background:#fff;border-radius:14px 14px 14px 4px;padding:12px 16px;
    box-shadow:var(--shadow);font-size:18px;font-weight:700;line-height:1.6;color:var(--ink);
  }
  .assistant .bubble b{color:var(--blue)}
  .assistant .bubble.shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  /* 幽灵指针 */
  .ghost{position:absolute;left:0;top:0;z-index:300;pointer-events:none;opacity:0;transition:opacity .2s ease}
  .ghost .cur{display:block;filter:drop-shadow(0 5px 9px rgba(0,0,0,.42))}
  .ghost .rip{
    position:absolute;left:0;top:0;width:56px;height:56px;margin:-28px 0 0 -28px;
    border-radius:50%;border:5px solid rgba(96,166,255,.8);opacity:0;transform:scale(.3);
  }
  .ghost .rip.go{animation:rip .6s ease-out}
  @keyframes rip{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(1.5)}}

  /* ===== 信息条 / 通知 ===== */
  .infobar{
    position:absolute;left:50%;bottom:70px;transform:translateX(-50%);z-index:110;
    background:rgba(20,26,36,.9);color:#fff;border-radius:10px;padding:9px 18px;
    font-size:16px;font-weight:600;box-shadow:var(--shadow);display:none;max-width:70%;
    text-align:center;
  }
  .infobar.show{display:block}
  .toast{
    position:absolute;right:16px;bottom:70px;z-index:220;width:300px;display:none;
    background:#fff;border-radius:12px;box-shadow:var(--shadow);border-left:6px solid var(--good);
    padding:14px 16px;
  }
  .toast.show{display:block;animation:slidein .28s ease}
  @keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  .toast .tt{font-size:16px;font-weight:800;color:var(--good)}
  .toast .td{font-size:15px;color:var(--muted);margin-top:4px;line-height:1.5}

  /* ===== 任务清单 ===== */
  .checklist{
    position:absolute;right:16px;top:56px;z-index:160;width:360px;display:none;
    background:#fff;border-radius:12px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.12);
    overflow:hidden;
  }
  .checklist.show{display:block;animation:popin .14s ease}
  .checklist .ch-head{padding:12px 16px;background:#eef1f5;font-size:16px;font-weight:800;border-bottom:1px solid var(--line)}
  .checklist .ch-list{padding:8px 10px 12px}
  .checklist .ch{
    display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:8px;
    font-size:16px;font-weight:600;line-height:1.5;color:#3a414b;
  }
  html.no-flexgap .checklist .ch > *:not(:last-child){margin-right:10px}
  .checklist .ch .box{
    width:22px;height:22px;border-radius:6px;border:2px solid #b9c2cf;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:1px;
  }
  .checklist .ch.done{color:var(--good)}
  .checklist .ch.done .box{background:var(--good);border-color:var(--good)}
  .checklist .ch.now{background:#fff7e6}
  .checklist .ch.now .box{border-color:var(--accent)}

  /* ===== 颁奖画面 ===== */
  .finale{
    position:fixed;top:0;right:0;bottom:0;left:0;z-index:900;display:none;
    align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(circle at 50% 30%,#12406f 0%,#0a1b30 60%,#050c16 100%);
  }
  .finale.show{display:flex}
  .cert{
    background:#fffdf7;border-radius:18px;padding:34px 40px;max-width:720px;width:100%;
    text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5);border:8px double var(--gold);
    animation:popin .5s ease;
  }
  .cert .big{font-size:76px;line-height:1}
  .cert h2{margin:12px 0 6px;font-size:38px;font-size:clamp(26px,5vw,38px);color:var(--blue-dark)}
  .cert p{margin:0 0 16px;font-size:19px;color:var(--muted);line-height:1.8}
  .cert .skills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
  html.no-flexgap .cert .skills > *:not(:last-child){margin-right:10px}
  .cert .skills span{
    background:var(--blue-soft);color:#12314f;border-radius:999px;padding:8px 16px;
    font-size:16px;font-weight:700;
  }
  .cert button{
    font-family:inherit;font-size:19px;font-weight:800;cursor:pointer;border:none;
    border-radius:10px;padding:14px 26px;background:var(--blue);color:#fff;
  }
  .cert button:hover{background:#1a7fd0}

  .screen-note{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
    color:rgba(255,255,255,.92);font-size:22px;font-weight:700;text-align:center;
    text-shadow:0 2px 8px rgba(0,0,0,.45);pointer-events:none;line-height:1.9;
  }
  @media(max-width:900px){
    .topbar{font-size:15px;gap:10px;padding:0 10px}
    .topbar .task{font-size:15px}
    .assistant .bubble{max-width:340px;font-size:16px}
    .icon{width:88px;height:100px}
    .icon .face{width:54px;height:54px;font-size:30px}
  }
</style>
<script>
/* ===== 防误触兜底 =====
   1) 右键菜单：本页大量练习右键，系统菜单会挡住画面，所以全局取消默认菜单，
      只调 preventDefault、绝不 stopPropagation，页内自绘的菜单照常工作。
      输入框除外。2) 拖拽：防止图标/文字被浏览器拖走；本页图标与窗口拖动都走
      pointer 事件，不受影响。3) 防误退：压两层 history 哨兵，右键拖动手势和
      误按后退键都不会把学生带走。本页不使用 hash / history 导航。 */
(function () {
  /* 输入框里保留原生右键菜单，方便右键粘贴 */
  function keepNative(el) {
    return !!(el && el.closest &&
      el.closest('input, textarea, [contenteditable]:not([contenteditable="false"])'));
  }
  document.addEventListener('contextmenu', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();                    /* 只取消默认菜单，不阻断页内逻辑 */
  }, true);
  document.addEventListener('dragstart', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();
  }, true);

  /* 防误退 */
  if (location.protocol === 'file:') return;      /* file:// 下浏览器禁止 pushState */
  function guard() {
    try { history.pushState({ mtSentinel: 1 }, '', location.href); } catch (e) {}
  }
  try {
    guard(); guard();
    window.addEventListener('popstate', guard);
  } catch (e) {}
})();
</script>
<script>
/* ===== 兼容层 A：flex gap 能力探测 =====
   老内核（Edge 84 以前、EdgeHTML）的 flex 布局不支持 gap，间距会全部塌掉。
   这里用真实布局量一次宽度来判断，支持就用原样，不支持就给 <html> 挂上
   no-flexgap，样式表里预置的 margin 规则接管间距。
   不用 CSS.supports('gap') 判断：gap 在 Chrome 66 起就作为 grid-gap 的别名存在，
   老版本会误报"支持"。 */
(function () {
  try {
    var box = document.createElement('div');
    box.style.cssText = 'position:absolute;top:-9999px;left:-9999px;display:flex;gap:10px;width:auto;height:1px';
    var a = document.createElement('i');
    var b = document.createElement('i');
    a.style.cssText = b.style.cssText = 'display:block;width:10px;height:1px';
    box.appendChild(a); box.appendChild(b);
    document.documentElement.appendChild(box);
    var w = box.getBoundingClientRect().width || box.scrollWidth;
    document.documentElement.removeChild(box);
    if (!(w >= 30)) document.documentElement.className += ' no-flexgap';
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="desk" id="desk">
  <div class="wall" id="wall"></div>

  <div class="screen-note" id="screenNote"></div>

  <div class="topbar" id="topbar">
    <span class="lv" id="lvName">鼠标练习营 3</span>
    <span class="task" id="taskText">正在准备桌面……</span>
    <span class="dots" id="dots"></span>
    <span class="stars" id="stars">⭐ 0</span>
    <button class="primary" id="btnDemo" style="display:none">看演示 👀</button>
    <button id="btnList">任务清单</button>
    <button id="btnHome">回到桌面</button>
  </div>

  <div class="icons" id="icons"></div>
  <div class="winlayer" id="winlayer"></div>
  <div class="snapview" id="snapview"></div>

  <div class="assistant" id="assistant">
    <div class="bot" id="bot">🤖</div>
    <div class="bubble" id="bubble">点一个图标，我们开始吧！</div>
  </div>

  <div class="infobar" id="infobar"></div>
  <div class="toast" id="toast"><div class="tt" id="toastT"></div><div class="td" id="toastD"></div></div>

  <div class="ctxmenu" id="ctxmenu"></div>
  <div class="startmenu" id="startmenu">
    <div class="sm-head">所有应用（滚轮往下滑）</div>
    <div class="sm-list" id="smList"></div>
    <div class="sm-foot" id="smFoot">把鼠标放在这里转滚轮，列表会上下滑动</div>
  </div>
  <div class="checklist" id="checklist">
    <div class="ch-head">任务清单 <button class="tb-btn" id="btnListClose" style="float:right;padding:4px 10px;font-size:14px">收起</button></div>

<script>
(function(){
  "use strict";
  const $ = s=>document.querySelector(s);
  const desk=$('#desk'), iconsLayer=$('#icons'), winLayer=$('#winlayer'), snapView=$('#snapview');
  const ctxmenu=$('#ctxmenu'), startmenu=$('#startmenu'), checklist=$('#checklist'), chList=$('#chList');
  const bubble=$('#bubble'), infobar=$('#infobar'), toast=$('#toast');
  const taskText=$('#taskText'), dotsEl=$('#dots'), starsEl=$('#stars');
  const tbTasks=$('#tbTasks'), smList=$('#smList'), ghost=$('#ghost');
  const lvName=$('#lvName'), btnDemo=$('#btnDemo'), wall=$('#wall');

  /* ================= 小工具 ================= */
  function el(tag,cls,html){
    const e=document.createElement(tag);
    if(cls) e.className=cls;
    if(html!=null) e.innerHTML=html;
    return e;
  }
  function on(t,type,fn,opt){ t.addEventListener(type,fn,opt||false); return fn; }
  function centerOf(node){
    const r=node.getBoundingClientRect();
    return {x:Math.round(r.left+r.width/2), y:Math.round(r.top+r.height/2)};
  }
  function flash(node,cls){ if(!node) return; node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
  function say(msg,shake){
    bubble.innerHTML=msg;
    bubble.style.display='block';
    if(shake){ flash(bubble,'shake'); }
    clearTimeout(say._t);
    say._t=setTimeout(function(){ bubble.style.display='none'; }, 7000);
  }
  function tip(msg,ms){
    clearTimeout(tip._t);
    tip._t=setTimeout(function(){ say(msg); }, ms||3600);
  }
  function showInfo(msg){
    infobar.innerHTML=msg;
    infobar.className='infobar show';
    clearTimeout(showInfo._t);
    showInfo._t=setTimeout(function(){ infobar.className='infobar'; }, 4200);
  }
  function notify(title,detail){
    $('#toastT').textContent=title;
    $('#toastD').textContent=detail;
    toast.className='toast show';
    clearTimeout(notify._t);
    notify._t=setTimeout(function(){ toast.className='toast'; }, 4200);
  }
  let timers=[];
  function T(ms,fn){ timers.push(setTimeout(fn,ms)); }
  function clearTimers(){ while(timers.length) clearTimeout(timers.pop()); clearTimeout(tip._t); }
  function rectOf(node){ const r=node.getBoundingClientRect(); return {x:r.left,y:r.top,w:r.width,h:r.height}; }

  /* ================= 桌面几何 ================= */
  const TOP=44, BAR=56, PAD=18, CELL_W=104, CELL_H=114, COLS=6;
  function deskW(){ return desk.clientWidth; }
  function deskH(){ return desk.clientHeight; }
  function workTop(){ return TOP; }
  function workH(){ return deskH()-TOP-BAR; }
  function slotPos(col,row){
    const p=slotPos;   /* 图标层的坐标（图标层在 topbar 下面） */
    return {x:PAD+col*CELL_W, y:PAD+row*CELL_H};
  }

  /* ================= 桌面图标 ================= */
  const S={ sel:null, selSeen:{}, icons:[], wins:[], zTop:30, active:null,
            inFolder:{}, seqStep:0, flags:{}, wallLight:false, props:0, taskDone:true, ctxOn:null };

  const APPS={
    pc:   {label:'我的电脑', emoji:'🖥',  body:'<p>这里是你的电脑。</p><p>左边能看到硬盘和文件夹，双击才打得开。</p>'},
    bin:  {label:'回收站',   emoji:'🗑',  body:'<p>删掉的东西先放在这里。</p><p>确认不要了，再点「清空回收站」。</p>'},
    draw: {label:'画图',     emoji:'🎨',  body:'<p>可以在这里画画。</p><p>左边是颜色，上面是画笔。</p>'},
    photo:{label:'照片',     emoji:'🖼',  body:'<div style="font-size:72px;text-align:center;line-height:1.4">🌄</div><p style="text-align:center">这是你拍的照片</p>'},
    essay:{label:'作文',     emoji:'📝',  scroll:'essay'},
    calc: {label:'计算器',   emoji:'🧮',  body:'<div style="font-size:30px;font-weight:800;text-align:right;padding:8px 14px;background:#eef1f5;border-radius:8px">2026</div><p style="text-align:center;margin-top:14px">1 2 3 + 4 = 5 …</p>'},
    music:{label:'音乐',     emoji:'🎵',  body:'<p>正在播放：小星星</p><p>⏵ ⏸ ⏭</p>'},
    paint:{label:'美术作业', emoji:'🖼',  body:'<div style="font-size:72px;text-align:center;line-height:1.4">🎨</div><p style="text-align:center">这幅画要交给老师</p>'},
    cn:   {label:'语文作业', emoji:'📖',  body:'<p>今天的作业：</p><p>1. 读课文三遍<br>2. 抄写生字</p>'},
    folder:{label:'作业',    emoji:'📁',  folder:true}
  };
  const SCROLL_ESSAY=
    '<h3 style="margin:0 0 10px">我的周末</h3>'
    +'<p>星期六早上，我七点就起床了。</p><p>我先刷牙洗脸，然后吃早饭。早饭是牛奶和面包。</p>'
    +'<p>吃完早饭，我写了一会儿作业，就下楼玩了。</p><p>楼下有好多小朋友，我们一起跳绳。</p>'
    +'<p id="mk-hello" style="background:#fff3cd;padding:6px 10px;border-radius:6px"><b>早上好</b>，我们一起玩到中午。</p>'
    +'<p>中午回家吃饭，妈妈做了西红柿炒鸡蛋，我吃了两碗饭。</p>'
    +'<p>下午我睡了一会儿午觉，起来以后看了一集动画片。</p>'
    +'<p>动画片里的小狗特别可爱，它还会数数。</p><p>看完动画片，我帮妈妈把桌子擦干净了。</p>'
    +'<p>晚上我和爸爸一起散步，天上的星星很亮。</p><p>爸爸说，那颗最亮的是北极星。</p>'
    +'<p>回家以后，我洗了澡，刷了牙，九点就睡觉了。</p>'
    +'<p>这个周末过得很开心，我最喜欢和小朋友一起跳绳。</p>'
    +'<p id="mk-end" style="background:#e3f2fd;padding:6px 10px;border-radius:6px"><b>最后一行：我的作业编号是 2026</b></p>'
    +'<p style="height:60px"></p>';

  function iconNode(ic){
    const n=el('div','icon');
    n.dataset.id=ic.id;
    n.innerHTML='<span class="face">'+ic.emoji+'</span><span class="lbl">'+ic.label+'</span>';
    return n;
  }
  function renderIcons(){
    iconsLayer.innerHTML='';
    S.icons.forEach(function(ic){
      if(ic.hidden||S.inFolder[ic.id]) return;
      const n=iconNode(ic);
      const p=slotPos(ic.col,ic.row);
      n.style.left=p.x+'px'; n.style.top=p.y+'px';
      if(S.sel===ic.id) n.classList.add('sel');
      iconsLayer.appendChild(n);
      bindIconNode(n);
    });
  }
  function iconEl(id){
    const list=iconsLayer.querySelectorAll('.icon');
    for(let i=0;i<list.length;i++){ if(list[i].dataset.id===id) return list[i]; }
    return null;
  }
  function iconById(id){ for(let i=0;i<S.icons.length;i++){ if(S.icons[i].id===id) return S.icons[i]; } return null; }
  function freeSlot(col,row){
    for(let i=0;i<S.icons.length;i++){
      const ic=S.icons[i];
      if(ic.hidden||S.inFolder[ic.id]) continue;
      if(ic.col===col&&ic.row===row) return false;
    }
    return true;
  }
  function nearestSlot(x,y){
    /* 找离落点最近、又没被占的格子 */
    let best=null, bestD=1e9;
    for(let row=0;row<4;row++){
      for(let col=0;col<COLS;col++){
        if(!freeSlot(col,row)) continue;
        const p=slotPos(col,row);
        const d=Math.abs(p.x-x)+Math.abs(p.y-y);
        if(d<bestD){ bestD=d; best={col:col,row:row}; }
      }
    }
    return best||{col:0,row:0};
  }
  function selectIcon(id){
    S.sel=id;
    renderIcons();
    if(id){
      const ic=iconById(id);
      S.selSeen[id]=true;
      showInfo('已选中：<b>'+ic.label+'</b>　（双击可以打开）');
    } else {
      showInfo('已取消选中');
    }
    checkGoal();
  }

  /* ================= 窗口 ================= */
  let winSeq=1;
  function winById(id){ for(let i=0;i<S.wins.length;i++){ if(S.wins[i].id===id) return S.wins[i]; } return null; }
  function makeWindow(opt){
    const w={ id:opt.id||('w'+(winSeq++)), title:opt.title, icon:opt.icon||'🪟',
              state:'normal', snap:null, rect:null, restore:null, z:++S.zTop, el:null };
    const node=el('div','win');
    node.dataset.win=w.id;
    node.innerHTML='<div class="tbar"><span class="wico">'+w.icon+'</span><span class="wtxt">'+w.title+'</span>'
      +'<span class="wbtns"><button class="wb min" title="最小化">—</button>'
      +'<button class="wb max" title="最大化">□</button>'
      +'<button class="wb cls" title="关闭">✕</button></span></div>'
      +'<div class="wbody'+(opt.center?' center':'')+'">'+(opt.html||'')+'</div>';
    w.el=node;
    winLayer.appendChild(node);
    S.wins.push(w);
    const body=node.querySelector('.wbody');
    if(body) on(body,'scroll',function(){ checkGoal(); });
    /* 初始大小和位置 */
    const size=opt.size||[520,360];
    const wide=Math.max(320,Math.min(size[0], deskW()-40));
    const high=Math.max(220,Math.min(size[1], workH()-40));
    const n=S.wins.length;
    const x=opt.x!=null?opt.x:Math.max(20,Math.round(deskW()/2-wide/2)+((n%3)-1)*36);
    const y=opt.y!=null?opt.y:Math.max(TOP+16,Math.round(workTop()+workH()/2-high/2)+((n%3)-1)*28);
    setWinRect(w,{x:x,y:y,w:wide,h:high});
    bindWindow(w);
    activate(w);
    renderTaskbar();
    return w;
  }
  function setWinRect(w,r){
    w.rect={x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.w),h:Math.round(r.h)};
    const e=w.el;
    e.style.left=w.rect.x+'px'; e.style.top=w.rect.y+'px';
    e.style.width=w.rect.w+'px'; e.style.height=w.rect.h+'px';
  }
  function activate(w){
    if(!w) return;
    if(w.state==='min'){ w.state='normal'; w.el.classList.remove('min'); }
    S.active=w.id;
    S.wins.forEach(function(x){
      x.el.classList.toggle('active', x.id===w.id);
      if(x.id===w.id) x.el.style.zIndex=++S.zTop;
    });
    renderTaskbar();
    checkGoal();
  }
  function closeWindow(w){
    if(!w) return;
    const i=S.wins.indexOf(w);
    if(i>=0) S.wins.splice(i,1);
    if(w.el&&w.el.parentNode) w.el.parentNode.removeChild(w.el);
    if(S.active===w.id) S.active=S.wins.length?S.wins[S.wins.length-1].id:null;
    renderTaskbar();
    checkGoal();
  }
  function closeAllWindows(){
    while(S.wins.length) closeWindow(S.wins[0]);
  }
  function toggleMax(w){
    if(w.snap==='max'||w.snap){
      if(w.restore) setWinRect(w,w.restore);
      w.snap=null;
      w.el.querySelector('.wb.max').textContent='□';
    } else {
      w.restore=w.rect;
      setWinRect(w,snapRect('max'));
      w.snap='max';
      w.el.querySelector('.wb.max').textContent='❐';
    }
    w.state='normal'; w.el.classList.remove('min');
    activate(w);
  }
  function minimize(w){
    w.state='min'; w.el.classList.add('min');
    if(S.active===w.id) S.active=null;
    renderTaskbar(); checkGoal();
  }
  function bindWindow(w){
    const e=w.el;
    on(e,'pointerdown',function(){ if(S.active!==w.id) activate(w); });
    on(e.querySelector('.wb.min'),'click',function(){ minimize(w); });
    on(e.querySelector('.wb.max'),'click',function(){ toggleMax(w); });
    on(e.querySelector('.wb.cls'),'click',function(){ closeWindow(w); });
    const tb=e.querySelector('.tbar');
    on(tb,'dblclick',function(){ toggleMax(w); });
    on(tb,'pointerdown',function(ev){ winDragStart(ev,w); });
  }
  function renderTaskbar(){
    tbTasks.innerHTML='';
    S.wins.forEach(function(w){
      const b=el('button','tb-btn'+(S.active===w.id&&w.state!=='min'?' on':''),
        '<span>'+w.icon+'</span>'+w.title);
      b.dataset.win=w.id;
      on(b,'click',function(){
        if(w.state==='min') activate(w);
        else if(S.active===w.id) minimize(w);
        else activate(w);
      });
      tbTasks.appendChild(b);
    });
    checkGoal();
  }

  /* ================= 窗口拖动 + 贴边 ================= */
  function snapZoneAt(x,y){
    const W=deskW(), top=workTop(), H=workH();
    const ex=44, ey=44;
    const nearLeft=x<ex, nearRight=x>W-ex;
    const nearTop=y<top+ey, nearBottom=y>top+H-ey;
    if(nearTop&&!nearLeft&&!nearRight) return 'max';
    if(nearLeft&&nearTop) return 'tl';
    if(nearLeft&&nearBottom) return 'bl';
    if(nearRight&&nearTop) return 'tr';
    if(nearRight&&nearBottom) return 'br';
    if(nearLeft) return 'left';
    if(nearRight) return 'right';
    return null;
  }
  function snapRect(zone){
    const W=deskW(), top=workTop(), H=workH();
    const w2=Math.round(W/2), h2=Math.round(H/2);
    if(zone==='max')  return {x:0,y:top,w:W,h:H};
    if(zone==='left') return {x:0,y:top,w:w2,h:H};
    if(zone==='right')return {x:W-w2,y:top,w:w2,h:H};
    if(zone==='tl')   return {x:0,y:top,w:w2,h:h2};
    if(zone==='tr')   return {x:W-w2,y:top,w:w2,h:h2};
    if(zone==='bl')   return {x:0,y:top+H-h2,w:w2,h:h2};
    if(zone==='br')   return {x:W-w2,y:top+H-h2,w:w2,h:h2};
  }
  function showSnapView(zone){
    if(!zone){ snapView.style.display='none'; return; }
    const r=snapRect(zone);
    snapView.style.display='block';
    snapView.style.left=r.x+'px'; snapView.style.top=r.y+'px';
    snapView.style.width=r.w+'px'; snapView.style.height=r.h+'px';
  }
  function applySnap(w,zone){
    if(!zone) return;
    w.restore=w.restore||w.rect;
    setWinRect(w,snapRect(zone));
    w.snap=zone;
    w.el.querySelector('.wb.max').textContent=(zone==='max')?'❐':'□';
  }
  let winDrag=null;
  function winDragStart(ev,w){
    if(ev.button!==0) return;
    if(ev.target.closest&&ev.target.closest('.wb')) return;
    stopDemo();
    const r=rectOf(w.el);
    winDrag={w:w,id:ev.pointerId,dx:ev.clientX-r.x,dy:ev.clientY-r.y,zone:null};
    w.el.classList.add('active');
    w.el.querySelector('.tbar').classList.add('grabbing');
    S.active=w.id;
    document.addEventListener('pointermove',winDragMove);
    document.addEventListener('pointerup',winDragEnd);
    document.addEventListener('pointercancel',winDragEnd);
  }
  function winDragMove(ev){
    if(!winDrag||ev.pointerId!==winDrag.id) return;
    ev.preventDefault();
    const w=winDrag.w;
    if(w.snap){                       /* 从贴边/最大化状态拖出来 → 还原成原来的大小 */
      const before=w.restore||{w:520,h:360};
      const rx=(ev.clientX-desk.getBoundingClientRect().left)/(w.rect.w||1);
      const back={w:before.w,h:before.h,x:ev.clientX-before.w*rx,y:ev.clientY-22};
      w.snap=null;
      w.el.querySelector('.wb.max').textContent='□';
      setWinRect(w,back);
      winDrag.dx=ev.clientX-back.x; winDrag.dy=22;
    }
    const dr=desk.getBoundingClientRect();
    let x=ev.clientX-dr.left-winDrag.dx;
    let y=ev.clientY-dr.top-winDrag.dy;
    x=Math.max(-w.rect.w+90, Math.min(deskW()-90, x));
    y=Math.max(TOP, Math.min(deskH()-40, y));
    w.el.style.left=Math.round(x)+'px'; w.el.style.top=Math.round(y)+'px';
    w.rect.x=Math.round(x); w.rect.y=Math.round(y);
    const zone=snapZoneAt(ev.clientX-dr.left, ev.clientY-dr.top);
    if(zone!==winDrag.zone){ winDrag.zone=zone; showSnapView(zone); }
  }
  function winDragEnd(ev){
    if(!winDrag||ev.pointerId!==winDrag.id) return;
    document.removeEventListener('pointermove',winDragMove);
    document.removeEventListener('pointerup',winDragEnd);
    document.removeEventListener('pointercancel',winDragEnd);
    const w=winDrag.w, zone=winDrag.zone;
    w.el.querySelector('.tbar').classList.remove('grabbing');
    winDrag=null;
    showSnapView(null);
    if(zone) applySnap(w,zone);
    else setFlag('move:'+w.id);          /* 拖动结束但没贴边 = 单纯移动了窗口 */
    checkGoal();
  }

  /* ================= 右键菜单 ================= */
  function openCtx(x,y,items){
    ctxmenu.innerHTML='';
    items.forEach(function(it){
      if(it.sep){ ctxmenu.appendChild(el('div','sep')); return; }
      const mi=el('div','mi','<span class="ic">'+(it.ic||'')+'</span>'+it.label);
      mi.dataset.label=it.label;
      on(mi,'click',function(ev){
        ev.preventDefault();
        closeCtx();
        if(it.act) it.act();
        checkGoal();
      });
      ctxmenu.appendChild(mi);
    });
    ctxmenu.className='ctxmenu show';
    const w=ctxmenu.offsetWidth, h=ctxmenu.offsetHeight;
    ctxmenu.style.left=Math.max(6,Math.min(deskW()-w-6,x))+'px';
    ctxmenu.style.top=Math.max(TOP+4,Math.min(deskH()-BAR-h-6,y))+'px';
    S.ctxOn=openCtx._target||'desk';
    checkGoal();
  }
  function closeCtx(){ ctxmenu.className='ctxmenu'; S.ctxOn=null; }
  function ctxAt(node,pt){
    const c=pt||centerOf(node);
    if(node&&node.dataset&&node.dataset.id){
      openCtx._target='icon:'+node.dataset.id;
      openCtx(c.x,c.y,iconMenuItems(node.dataset.id));
    } else {
      openCtx._target='desk';
      openCtx(c.x,c.y,deskMenuItems());
    }
  }
  function deskMenuItems(){
    return [
      {ic:'🔄', label:'刷新', act:function(){ setFlag('refresh'); notify('已刷新','桌面看起来更新了'); }},
      {ic:'📁', label:'新建文件夹', act:function(){ createFolder(); }},
      {sep:true},
      {ic:'⚙️', label:'显示设置', act:function(){
        S.wallLight=!S.wallLight;
        wall.className='wall'+(S.wallLight?' light':'');
        notify('显示设置','桌面亮了一点'+(S.wallLight?'':'（已复原）'));
      }},
      {ic:'🧭', label:'排列图标', act:function(){ setFlag('arrange'); arrangeIcons(); }}
    ];
  }
  function iconMenuItems(id){
    const ic=iconById(id);
    return [
      {ic:'📂', label:'打开', act:function(){ openIcon(id); }},
      {ic:'✏️', label:'重命名', act:function(){ askRename(id); }},
      {sep:true},
      {ic:'ℹ️', label:'查看属性', act:function(){ openProps(id); }},
      {ic:'🗑', label:'删除', act:function(){ deleteIcon(id); }}
    ];
  }
  let folderSeq=0;
  function createFolder(name){
    folderSeq++;
    const n=(S.icons.filter(function(i){ return i.folder; }).length)+1;
    const id='newfolder'+folderSeq;
    S.icons.push({id:id,label:name||('新建文件夹'+(n>1?n:'')),emoji:'📁',folder:true,
                  col:0,row:0,isNew:true});
    arrangeIcons();
    renderIcons();
    notify('已新建','桌面上多了一个「'+iconById(id).label+'」');
    checkGoal();
  }
  function arrangeIcons(){
    let col=0,row=0;
    S.icons.forEach(function(ic){
      if(ic.hidden||S.inFolder[ic.id]) return;
      ic.col=col; ic.row=row;
      row++;
      if(row>3){ row=0; col++; if(col>=COLS) col=0; }
    });
    renderIcons();
  }
  function askRename(id){

  let iconDrag=null;
  function iconDragStart(e,id){
    if(e.button!==0) return;
    stopDemo(); closeCtx(); closeStart();
    const node=iconEl(id);
    if(!node) return;
    const r=rectOf(node);
    iconDrag={id:id,node:node,id0:e.pointerId,dx:e.clientX-r.x,dy:e.clientY-r.y,moved:false};
    document.addEventListener('pointermove',iconDragMove);
    document.addEventListener('pointerup',iconDragEnd);
    document.addEventListener('pointercancel',iconDragEnd);
  }
  function iconDragMove(e){
    if(!iconDrag||e.pointerId!==iconDrag.id0) return;
    e.preventDefault();
    const layer=iconsLayer.getBoundingClientRect();
    const x=e.clientX-iconDrag.dx-layer.left;
    const y=e.clientY-iconDrag.dy-layer.top;
    if(Math.abs(x-parseFloat(iconDrag.node.style.left||0))>3||Math.abs(y-parseFloat(iconDrag.node.style.top||0))>3){
      iconDrag.moved=true;
      iconDrag.node.classList.add('dragging');
      iconDrag.node.classList.remove('sel');
    }
    if(iconDrag.moved) e.preventDefault();      /* 真开始拖了才拦，不然 click 事件会被浏览器吞掉 */
    iconDrag.node.style.left=Math.round(x)+'px';
    iconDrag.node.style.top=Math.round(y)+'px';
    /* 拖到文件夹上就高亮 */
    const folder=folderUnder(e.clientX,e.clientY,iconDrag.node);
    iconsLayer.querySelectorAll('.icon').forEach(function(n){
      n.classList.toggle('target', !!folder && n.dataset.id===folder && n!==iconDrag.node);
    });
  }
  function folderUnder(cx,cy,skipNode){
    const list=iconsLayer.querySelectorAll('.icon');
    for(let i=0;i<list.length;i++){
      const n=list[i];
      if(skipNode&&n===skipNode) continue;
      const ic=iconById(n.dataset.id);
      if(!ic||!ic.folder) continue;
      const r=n.getBoundingClientRect();
      if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom) return n.dataset.id;
    }
    return null;
  }
  function iconDragEnd(e){
    if(!iconDrag||e.pointerId!==iconDrag.id0) return;
    document.removeEventListener('pointermove',iconDragMove);
    document.removeEventListener('pointerup',iconDragEnd);
    document.removeEventListener('pointercancel',iconDragEnd);
    const d=iconDrag; iconDrag=null;
    d.node.classList.remove('dragging');
    iconsLayer.querySelectorAll('.target').forEach(function(n){ n.classList.remove('target'); });
    const ic=iconById(d.id);
    if(!d.moved) return;      /* 没拖动的话，选中交给 click 事件处理（指针抬起时重建 DOM 会吞掉 click） */
    const folder=folderUnder(e.clientX,e.clientY,null);
    if(folder){
      S.inFolder[d.id]=folder;
      if(S.sel===d.id) S.sel=null;
      renderIcons();
      notify('放进去了','「'+ic.label+'」被拖进了「'+iconById(folder).label+'」');
      checkGoal();
      return;
    }
    if(S.inFolder[d.id]) delete S.inFolder[d.id];
    const layer=iconsLayer.getBoundingClientRect();
    const p=nearestSlot(parseFloat(d.node.style.left||0), parseFloat(d.node.style.top||0));
    ic.col=p.col; ic.row=p.row;
    renderIcons();
    checkGoal();
  }

  function markerVisible(winId,markerId){
    const w=winById(winId); if(!w) return false;
    const body=w.el.querySelector('.wbody'); if(!body) return false;
    const mk=body.querySelector('#'+markerId); if(!mk) return false;
    const br=body.getBoundingClientRect(), mr=mk.getBoundingClientRect();
    return mr.top>=br.top-4 && mr.bottom<=br.bottom+4;
  }
  function scrolledBottom(winId){
    const w=winById(winId); if(!w) return false;
    const body=w.el.querySelector('.wbody'); if(!body) return false;
    return body.scrollTop+body.clientHeight >= body.scrollHeight-8;
  }
  function goalMet(g){
    if(!g) return false;
    switch(g.k){
      case 'sel':    return S.sel===g.id;
      case 'none':   return !S.sel;
      case 'selAll': return g.ids.every(function(id){ return !!S.selSeen[id]; });
      case 'seq': {
        const st=S.seqStep||0;
        if(st>=g.steps.length) return true;
        if(goalMet(g.steps[st])){
          S.seqStep=st+1;
          return S.seqStep>=g.steps.length;
        }
        return false;
      }
      case 'ctx': {
        if(!S.ctxOn) return false;
        if(!g.on) return true;
        if(g.on==='desk') return S.ctxOn==='desk';
        if(g.on==='icon') return S.ctxOn==='icon:'+g.id;
        return true;
      }
      case 'flag':   return !!S.flags[g.name];
      case 'winOpen':return !!winById(g.id);
      case 'winClosed':return !winById(g.id);
      case 'allClosed':return S.wins.length===0;
      case 'allMin': return S.wins.length>0 && S.wins.every(function(w){ return w.state==='min'; });
      case 'snap':   return !!winById(g.id) && winById(g.id).snap===g.zone;
      case 'active': return S.active===g.id && winById(g.id) && winById(g.id).state!=='min';
      case 'state':  return !!winById(g.id) && winById(g.id).state===g.value;
      case 'folder': return S.inFolder[g.icon]===g.folder;
      case 'folders':return S.icons.filter(function(i){ return i.folder && i.isNew && !i.hidden; }).length>=g.n;
      case 'slots':  return g.list.every(function(x){
                        const ic=iconById(x.id);
                        return ic && ic.col===x.col && ic.row===x.row; });
      case 'marker': return markerVisible(g.win,g.marker);
      case 'bottom': return scrolledBottom(g.win);
      case 'wall':   return S.wallLight===g.on;
      case 'props':  return !!winById('props');
      case 'startOpen': return startmenu.classList.contains('show');
      default: return false;
    }
  }

  function stopDemo(){

  function ghostTo(x,y,ms){
    ghost.style.transition='transform '+ms+'ms cubic-bezier(.35,.05,.3,1)';

  function ripAt(x,y){
    const r=$('#rip');
    r.style.left=x+'px'; r.style.top=y+'px';
    r.className='rip'; void r.offsetWidth; r.className='rip go';
  }
  function rip(node){ const c=centerOf(node); ripAt(c.x,c.y); }
  function runSteps(steps,done){
    let i=0;
    function next(){
      if(i>=steps.length){ if(done) done(); return; }
      const s=steps[i++];
      if(s.msg) say(s.msg);
      const node=s.at?$(s.at):null;
      const go=function(cb){
        if(node){ const c=centerOf(node); ghostTo(c.x,c.y,420); DT(480,cb); }
        else DT(80,cb);
      };
      go(function(){
        if(s.rip!==false && node && s.click) rip(node);
        if(s.click && node && node.click) node.click();
        if(s.clickSel && node){ selectIcon(node.dataset.id); }
        if(s.ctxMenu && node){ const c=centerOf(node), dr=desk.getBoundingClientRect(); ctxAt(node,{x:c.x-dr.left,y:c.y-dr.top}); }
        if(s.ctxDesk){ ctxAt(null,{x:centerOf($('#icons')).x-desk.getBoundingClientRect().left, y:centerOf($('#icons')).y-desk.getBoundingClientRect().top}); }
        if(s.menuItem){
          const items=ctxmenu.querySelectorAll('.mi');
          for(let k=0;k<items.length;k++){
            if(items[k].dataset.label===s.menuItem){ rip(items[k]); items[k].click(); break; }
          }
        }
        if(s.openApp){
          const ic=iconById(s.openApp);
          if(ic) openIcon(s.openApp);
        }
        if(s.run){ s.run(next); return; }
        DT(s.wait||560,next);
      });
    }
    next();
  }

   { id:'l5', name:'开始菜单与滚轮', emoji:'🌀', color:'#0b7285',

      { t:'点「照片」窗口的「—」最小化，再从任务栏点回来', h:'最小化以后，任务栏上还有它。',

      { t:'把「画图」窗口放到最大，再点「还原」', h:'最大化是 □，还原是它变成的 ❐。',
        goal:{k:'seq',steps:[{k:'snap',id:'win-draw',zone:'max'},{k:'snap',id:'win-draw',zone:null}]}, star:true },
      { t:'关掉挡住「照片」的「作文」窗口', h:'点它的 ✕。',
        goal:{k:'seq',steps:[{k:'winOpen',id:'win-photo'},{k:'winClosed',id:'win-essay'}]}, star:true },
      { t:'把叠在下面的「照片」窗口点一下，叫到最前面',

           makeWindow({id:'win-essay',title:'作文',icon:'📝',

             size:[560,330],x:300,y:150});
         }
         if(ti===1||ti===3||ti===4||ti===5){
           makeWindow({id:'win-photo',title:'照片',icon:'🖼',html:APPS.photo.body,size:[520,330],x:420,y:230});
         }
         if(ti===2){ makeWindow({id:'win-draw',title:'画图',icon:'🎨',html:APPS.draw.body,size:[520,330],x:330,y:170}); }
         if(ti===4){ activate(winById('win-essay')); }
       });
     }
   },

   { id:'l7', name:'窗口贴边', emoji:'🧲', color:'#7c3aed',
     tasks:[
      { t:'把「作文」窗口拖到屏幕左边缘，松手占半个屏幕', h:'拖到最左边，会先出现一个方框。',
        goal:{k:'snap',id:'win-essay',zone:'left'}, star:false,
        demo:[{at:'[data-win="win-essay"] .tbar', msg:'① 按住标题栏，一直拖到屏幕最左边'},
              {run:function(next){ demoDrag('win-essay','left',next); }}] },
      { t:'再把它拖到右边缘，占右半边', h:'先拖回来，再往右拖。',
        goal:{k:'snap',id:'win-essay',zone:'right'}, star:false },
      { t:'拖到左上角，占四分之一', h:'贴着左上角松手。', goal:{k:'snap',id:'win-essay',zone:'tl'}, star:true },
      { t:'拖到右上角', h:'', goal:{k:'snap',id:'win-essay',zone:'tr'}, star:true },
      { t:'拖到屏幕最上面，让它最大化', h:'贴着顶部松手。', goal:{k:'snap',id:'win-essay',zone:'max'}, star:true },
      { t:'先最大化，再拖到左下角', h:'最大化以后，从标题栏往下拖一点就能拖动了。',
        goal:{k:'seq',steps:[{k:'snap',id:'win-essay',zone:'max'},{k:'snap',id:'win-essay',zone:'bl'}]}, star:true }
     ],
     setup:function(){
       S.icons=lay([['pc',[0,0]],['bin',[1,0]]]);
       T(80,function(){
         const w=makeWindow({id:'win-essay',title:'作文',icon:'📝',html:'<div id="essayScroll">'+SCROLL_ESSAY+'</div>',size:[560,360],x:330,y:150});
         if(w) flash(w.el,'flash');

   },

   { id:'l8', name:'综合任务', emoji:'🏁', color:'#b45309',
     tasks:[
      { t:'在桌面右键，新建一个文件夹', h:'', goal:{k:'folders',n:1}, star:true },
      { t:'双击打开「美术作业」', h:'', goal:{k:'winOpen',id:'win-paint'}, star:true },
      { t:'把「语文作业」拖进「作业」文件夹', h:'',
        goal:{k:'folder',icon:'cn',folder:'folder'}, star:true },
      { t:'把「美术作业」窗口贴到屏幕左半边', h:'拖到最左边松手。',
        goal:{k:'snap',id:'win-paint',zone:'left'}, star:true },
      { t:'打开「作文」，滚轮滚到最后一行（2026）', h:'右边还有地方放它。',
        goal:{k:'seq',steps:[{k:'winOpen',id:'win-essay'},{k:'marker',win:'win-essay',marker:'mk-end'}]}, star:true },
      { t:'关掉所有窗口，回到干净的桌面', h:'一个一个关。', goal:{k:'allClosed'}, star:true }
     ],
     setup:function(){ S.icons=lay([['paint',[0,0]],['cn',[1,0]],['folder',[2,0]],['pc',[3,0]],['essay',[4,0]]]); }
   }
  ];

  /* 演示里"拖图标"的动作 */
  function tapIcon(node,col,row,next){
    if(!node){ if(next) next(); return; }
    const r=rectOf(node);
    const layer=iconsLayer.getBoundingClientRect();
    const p=slotPos(col,row);
    ghostTo(r.x+r.w/2, r.y+r.h/2, 420);
    DT(500,function(){
      rip(node);
      node.style.transition='left .6s ease, top .6s ease';
      node.style.left=p.x+'px'; node.style.top=p.y+'px';
      ghostTo(layer.left+p.x+50, layer.top+p.y+54, 620);
      DT(680,function(){
        node.style.transition='';
        const ic=iconById(node.dataset.id);
        if(ic){ ic.col=col; ic.row=row; }
        renderIcons();
        say('松手就对齐到格子里了');
        DT(500,next);
      });
    });
  }
  /* 演示里"拖窗口"的动作 */
  function demoDrag(winId,zone,next){
    const w=winById(winId);
    if(!w){ if(next) next(); return; }
    const tb=w.el.querySelector('.tbar');
    const c=centerOf(tb);
    ghostTo(c.x,c.y,500);
    DT(560,function(){
      rip(tb);
      tb.classList.add('grabbing');
      const target=zone?snapRect(zone):{x:w.rect.x+250,y:w.rect.y+40,w:w.rect.w,h:w.rect.h};
      if(zone) showSnapView(zone);
      w.el.style.transition='left .6s ease, top .6s ease, width .6s ease, height .6s ease';
      w.el.style.left=target.x+'px'; w.el.style.top=target.y+'px';
      w.el.style.width=target.w+'px'; w.el.style.height=target.h+'px';
      const dr=desk.getBoundingClientRect();
      ghostTo(dr.left+target.x+(zone?60:160), dr.top+target.y+22, 620);
      DT(680,function(){
        w.el.style.transition='';
        tb.classList.remove('grabbing');
        showSnapView(null);
        if(zone){ applySnap(w,zone); }
        else {
          w.rect={x:Math.round(target.x),y:Math.round(target.y),w:Math.round(target.w),h:Math.round(target.h)};
          setFlag('move:'+winId);
        }
        DT(420,next);
      });
    });
  }

  /* ================= 任务流程 ================= */
  let L=0, TI=0, stars=0, TOTAL=0, mode='home';
  const cleared={};
  function curTask(){ const lv=LEVELS[L]; return lv&&lv.tasks[TI]; }
  function updateTop(){
    const lv=LEVELS[L], t=curTask();
    lvName.textContent=(mode==='home')?'鼠标练习营 3':('第 '+(L+1)+' 课 · '+lv.name);
    if(mode==='home'){
      taskText.innerHTML='<b>点两下图标</b>，就能进去上课';
      dotsEl.innerHTML='';
      starsEl.textContent='⭐ '+TOTAL;
      return;
    }
    taskText.innerHTML='<b>任务 '+(TI+1)+'/'+lv.tasks.length+'</b>　'+t.t;
    dotsEl.innerHTML='';
    lv.tasks.forEach(function(x,i){
      dotsEl.appendChild(el('span','dot'+(i<TI?' done':(i===TI?' now':''))));
    });
    starsEl.textContent='⭐ '+stars;
  }
  function prepare(){
    clearTimers(); stopDemo(); closeCtx(); closeStart();
    checklist.className='checklist';
    closeAllWindows();
    S.sel=null; S.seqStep=0; S.selSeen={}; S.flags={}; S.ctxOn=null; S.inFolder={};
    S.wallLight=false; wall.className='wall'; S.zTop=30; S.active=null;
    S.taskDone=false;
    const t=curTask();
    LEVELS[L].setup(TI,t);
    renderIcons(); renderTaskbar(); updateTop(); renderChecklist();
    desk.dataset.level=LEVELS[L].id;
    desk.dataset.task=String(TI+1);
  }
  function showTask(){
    prepare();
    const t=curTask();
    btnDemo.style.display=t.demo?'':'none';
    say('<b>'+t.t+'</b>'+(t.h?('<br><span style="font-size:16px;font-weight:600;color:#5c6470">'+t.h+'</span>'):''));
    if(t.demo) T(1500,playDemo);
    else if(t.h) tip('提示：'+t.h,6000);
  }
  function resetTask(){ prepare(); const t=curTask(); btnDemo.style.display=t.demo?'':'none'; }
  function taskFinished(){
    if(S.taskDone) return;
    S.taskDone=true;
    const t=curTask();
    if(t.star){ stars++; notify('任务完成 ⭐','又得到一颗星，真棒！'); }
    else notify('做到啦 ✅','这是练习任务，不计星。');
    updateTop();
    T(1600,nextTask);
  }
  function nextTask(){
    TI++;
    if(TI>=LEVELS[L].tasks.length) levelDone();
    else showTask();
  }
  function levelDone(){
    const lv=LEVELS[L];
    cleared[lv.id]=true;
    TOTAL+=stars;
    desk.dataset.task='done';        /* 给自检脚本的信号：这一关做完了 */
    const all=LEVELS.every(function(l){ return cleared[l.id]; });
    if(all){ showFinale(); return; }
    let nextIdx=-1;
    for(let i=0;i<LEVELS.length;i++){ if(!cleared[LEVELS[i].id]){ nextIdx=i; break; } }
    showHome('第 '+(L+1)+' 课「'+lv.name+'」完成啦！⭐ '+stars+' 颗星。<br>点下一个图标，继续第 '+(nextIdx+1)+' 课。');
  }
  function showFinale(){
    $('#certSkills').innerHTML=LEVELS.map(function(l){
      return '<span>'+l.emoji+' '+l.name+'</span>';
    }).join('');
    $('#certSub').innerHTML='你认识了桌面、会用图标、会开窗口、会贴边、会用滚轮了！<br>一共拿到 <b>⭐ '+TOTAL+'</b> 颗星。';
    $('#finale').className='finale show';
    confettiBurst();
  }
  function confettiBurst(){
    const colors=['#f2c14e','#60a6ff','#7bd389','#ff8a65','#b39ddb','#4dd0e1'];
    for(let i=0;i<60;i++){
      const c=el('div','cf');
      c.style.left=(Math.random()*100)+'vw';
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDelay=(Math.random()*.6)+'s';
      c.style.animationDuration=(1.6+Math.random()*1.4)+'s';
      document.body.appendChild(c);
      setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); },3600);
    }
  }
  function showHome(msg){
    mode='home';
    clearTimers(); stopDemo(); closeCtx(); closeStart(); closeAllWindows();
    checklist.className='checklist';
    S.icons=LEVELS.map(function(l,i){
      return {id:'lv'+i,label:'第'+(i+1)+'课<span class="sub">'+l.name+'</span>',
              emoji:l.emoji,col:0,row:0,lv:i};
    });
    arrangeIcons();
    S.sel=null; S.inFolder={}; S.flags={}; S.seqStep=0; S.taskDone=true;
    wall.className='wall'; S.wallLight=false;
    renderIcons(); renderTaskbar(); updateTop();
    btnDemo.style.display='none';
    desk.dataset.level='home';
    desk.dataset.task='0';
    say(msg||'欢迎来到你的第一台电脑！<br>这些图标就是八节课，<b>点两下</b>就能进去。');
  }
  function startLevel(i){
    mode='play';
    L=i; TI=0; stars=0;
    showTask();
  }
  on($('#btnHome'),'click',function(){ showHome('回到桌面啦。点两下图标，可以再进去练一次。'); });
  on(btnDemo,'click',function(){ if(curTask()&&curTask().demo) playDemo(); });
  on($('#certOk'),'click',function(){
    $('#finale').className='finale';
    for(const k in cleared) delete cleared[k];
    TOTAL=0;
    showHome('欢迎再玩一遍！点两下第一个图标开始。');
  });
  function tickClock(){
    const d=new Date();
    const hh=('0'+d.getHours()).slice(-2), mm=('0'+d.getMinutes()).slice(-2);
    $('#clock').innerHTML=hh+':'+mm+'<small>'+(d.getMonth()+1)+'月'+d.getDate()+'日</small>';
  }
  window.addEventListener('resize',function(){
    if(mode==='home'||mode==='play') renderIcons();
  });

  /* ================= 启动 ================= */
  /* 给自检脚本读的数据（页面上看不到，也不影响玩法） */
  window.__mt={ levels:LEVELS, state:S, mode:function(){ return mode; },
                level:function(){ return L; }, task:function(){ return TI; },
                stars:function(){ return stars; }, total:function(){ return TOTAL; } };
  renderStart();
  tickClock();
  setInterval(tickClock,20000);
  showHome();
})();
</script>
