<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖥️ 鼠标练习营 3 · 电脑小课堂</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f6cbd'/><rect x='5' y='7' width='22' height='15' rx='2' fill='%23f3f3f3'/><circle cx='16' cy='14' r='3.2' fill='%230f6cbd'/><path d='M11 26h10' stroke='%23f3f3f3' stroke-width='2' stroke-linecap='round'/></svg>">
<meta name="theme-color" content="#c9ecff">
<style>
  :root{
    --ink:#2b2b45; --muted:#8a8aa8;
    --blue:#0f6cbd; --blue-dark:#0b5394; --blue-soft:#dceaf7;
    --orange:#ff9f45; --green:#4ed47e; --cyan:#43d2e8;
    --purple:#a577ff; --pink:#ff6fa5; --yellow:#ffd23f;
    --good:#2ec77b; --good-soft:#e4f9ec;
    --accent:#e8890c;
    --shadow:0 10px 22px rgba(90,70,160,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    color:var(--ink); min-height:100vh;
    background:linear-gradient(160deg,#c9ecff,#dcd3ff 55%,#ffe0ea);
    background-attachment:fixed;
    padding:16px 30px 44px;padding:16px clamp(8px,3vw,30px) 44px;
    user-select:none;
  }
  .wrap{max-width:900px;margin:0 auto}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes popin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes burst{40%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}
  @keyframes floatb{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-40px) scale(1.1)}}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(232,137,12,.7)}
    50%{box-shadow:0 0 0 16px rgba(232,137,12,0)}
  }

  /* ===== 背景小泡泡 ===== */
  .bg-bubbles{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden;z-index:0}
  .bg-bubbles span{position:absolute;border-radius:50%;opacity:.5;animation:floatb 9s ease-in-out infinite}

  /* ===== 顶部：小老鼠 + 说话气泡 ===== */
  header{display:flex;align-items:center;gap:14px;margin:0 auto 12px;position:relative;z-index:1}
  html.no-flexgap header > *:not(:last-child){margin-right:14px}
  .mascot{
    width:80px;height:80px;flex-shrink:0;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:44px;
    box-shadow:var(--shadow);border:4px solid #fff;animation:bob 2.6s ease-in-out infinite;
  }
  .bubble{
    background:#fff;border-radius:20px 20px 20px 6px;padding:14px 18px;
    box-shadow:var(--shadow);font-size:24px;font-size:clamp(17px,2.7vw,24px);font-weight:800;line-height:1.5;
    flex:1;min-height:64px;display:flex;align-items:center;
  }
  .bubble b{color:var(--blue)}
  .bubble.shake{animation:shake .4s ease}

  /* ===== 关卡按钮 ===== */
  nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 12px;position:relative;z-index:1}
  html.no-flexgap nav > *:not(:last-child){margin-right:8px}
  nav button{
    border:none;cursor:pointer;border-radius:16px;padding:9px 13px;
    font-family:inherit;font-size:17px;font-size:clamp(14px,2vw,17px);font-weight:800;color:#fff;
    display:flex;align-items:center;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.12), var(--shadow);
    transition:transform .1s ease;justify-content:center;
  }
  html.no-flexgap nav button > *:not(:last-child){margin-right:6px}
  nav button:hover{transform:translateY(-3px)}
  nav button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
  nav button.b-home{background:var(--purple)}
  nav button span.emo{font-size:19px}
  nav button.n-done::after{content:" ✓";font-size:.72em;opacity:.95}

  /* ===== 星星 ===== */
  .stars{display:flex;gap:7px;justify-content:center;margin:0 auto 10px;flex-wrap:wrap;position:relative;z-index:1;min-height:32px}
  html.no-flexgap .stars > *:not(:last-child){margin-right:7px}
  .stars .star .s-in{display:inline-block;font-size:26px;filter:grayscale(1);opacity:.4;transition:all .2s ease}
  .stars .star.pop .s-in{filter:none;opacity:1;transform:scale(1.25)}
  .stars .big-count{color:#fff;font-weight:900;font-size:18px;text-shadow:0 2px 6px rgba(60,40,120,.3);margin-left:7px}

  .star-total{
    position:fixed;top:12px;right:12px;z-index:2000;
    background:#fff;border-radius:999px;padding:8px 15px;
    display:flex;align-items:center;gap:7px;
    box-shadow:0 8px 18px rgba(60,40,120,.22);border:3px solid #ffe08a;
    font-weight:900;font-size:20px;color:var(--ink);
  }
  html.no-flexgap .star-total > *:not(:last-child){margin-right:7px}
  .star-total .st-ico{font-size:22px}
  .star-total .st-lbl{font-size:14px;color:var(--muted);font-weight:800}

  /* ===== 练习区 ===== */
  .play{
    position:relative;background:linear-gradient(180deg,#eaf3ff,#dbe9fb);
    border-radius:24px;height:470px;height:clamp(330px,56vh,470px);overflow:hidden;
    box-shadow:var(--shadow);border:4px solid #fff;
  }
  .stage{position:absolute;top:0;right:0;bottom:0;left:0}
  .wallmini{
    position:absolute;top:0;right:0;bottom:0;left:0;
    background:
      radial-gradient(circle at 76% 20%, #ffe9b0 0 7%, rgba(255,233,176,0) 26%),
      linear-gradient(180deg,#2f5f9e 0%,#5b9bd5 62%,#a8cdec 100%);
    transition:filter .35s ease;
  }
  .wallmini::after{
    content:"";position:absolute;left:-8%;right:-8%;bottom:-4%;height:34%;
    background:
      radial-gradient(60% 100% at 26% 100%, #2f6b4f 0 60%, rgba(47,107,79,0) 62%),
      radial-gradient(60% 96% at 74% 104%, #245a43 0 60%, rgba(36,90,67,0) 62%);
  }
  .stage.lightbg .wallmini{filter:brightness(1.35) saturate(.7)}

  /* 练习区里的小图标 */
  .micons{position:absolute;top:8px;right:0;bottom:6px;left:0}
  .micon{
    position:absolute;width:92px;height:100px;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 3px 3px;
    cursor:pointer;border:2px solid transparent;transition:background .12s ease,border-color .12s ease;
  }
  html.no-flexgap .micon > *:not(:last-child){margin-bottom:3px}
  .micon .face{
    width:56px;height:56px;border-radius:11px;background:#fff;font-size:32px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 9px rgba(10,25,50,.22);
  }
  .micon .lbl{
    font-size:13px;font-weight:700;color:#fff;text-align:center;line-height:1.2;
    text-shadow:0 1px 3px rgba(0,0,0,.55);max-width:88px;word-break:break-all;
  }
  .micon:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.55)}
  .micon.sel{background:rgba(96,166,255,.45);border-color:#cfe6ff}
  .micon.dragging{opacity:.7}
  .micon.folderTarget{border-color:var(--yellow);background:rgba(255,210,63,.35)}
  .micon.hintring{animation:pulse 1.4s ease-in-out infinite;border-radius:12px}

  /* 练习区里的小窗口（和练习营2的窗口同一套写法，尺寸小一点） */
  .mwins{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
  .mwin{
    position:absolute;pointer-events:auto;background:#fff;border-radius:9px;overflow:hidden;
    border:1px solid rgba(0,0,0,.16);box-shadow:0 12px 24px rgba(15,25,45,.28);
    display:flex;flex-direction:column;transition:opacity .16s ease,transform .16s ease;
  }
  .mwin.min{opacity:0;transform:scale(.7);pointer-events:none}
  .mwin .tbar{
    height:38px;flex-shrink:0;background:#eef1f5;border-bottom:1px solid #d7dbe2;
    display:flex;align-items:center;gap:8px;padding:0 5px 0 10px;cursor:grab;touch-action:none;
  }
  html.no-flexgap .mwin .tbar > *:not(:last-child){margin-right:8px}
  .mwin .tbar.grabbing{cursor:grabbing}
  .mwin .tbar .wico{font-size:17px}
  .mwin .tbar .wtxt{flex:1;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mwin .wbtns{display:flex;gap:3px}
  html.no-flexgap .mwin .wbtns > *:not(:last-child){margin-right:3px}
  .mwin .wb{
    width:36px;height:28px;border:none;border-radius:5px;background:transparent;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:800;color:#41474f;
    display:flex;align-items:center;justify-content:center;
  }
  .mwin .wb:hover{background:#dfe4ea}
  .mwin .wb.cls:hover{background:#e81123;color:#fff}
  .mwin .wbody{flex:1;overflow:auto;padding:12px 14px;font-size:15px;line-height:1.85;color:#2b3038;background:#fff}
  .mwin.active{box-shadow:0 14px 30px rgba(15,25,45,.36);border-color:#7fb6ef}
  .mwin.hintring{animation:pulse 1.4s ease-in-out infinite}
  .mtask.hide{display:none}

  /* 练习区里的右键菜单 */
  .mmenu{
    position:absolute;z-index:60;display:none;min-width:184px;background:#fbfcfe;
    border-radius:9px;padding:5px;box-shadow:0 12px 26px rgba(10,20,40,.34);
    border:1px solid rgba(0,0,0,.12);
  }
  .mmenu.show{display:block;animation:popin .12s ease}
  .mmenu .mi{
    display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:7px;
    font-size:15px;font-weight:700;cursor:pointer;
  }
  html.no-flexgap .mmenu .mi > *:not(:last-child){margin-right:9px}
  .mmenu .mi:hover{background:var(--blue-soft)}
  .mmenu .mi .ic{font-size:17px;width:20px;text-align:center}

  /* 练习区里的开始菜单 */
  .mstart{
    position:absolute;z-index:55;left:8px;bottom:42px;width:270px;display:none;
    background:#f7f9fc;border-radius:10px;border:1px solid rgba(0,0,0,.14);
    box-shadow:0 14px 30px rgba(10,20,40,.34);overflow:hidden;
  }
  .mstart.show{display:block;animation:popin .14s ease}
  .mstart .sm-head{padding:9px 13px 6px;font-size:13px;font-weight:800;color:var(--muted)}
  .mstart .sm-list{max-height:196px;overflow:auto;padding:0 5px 8px}
  .mstart .app{
    display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;
    font-size:15px;font-weight:700;cursor:pointer;
  }
  html.no-flexgap .mstart .app > *:not(:last-child){margin-right:10px}
  .mstart .app:hover{background:var(--blue-soft)}
  .mstart .app .face{font-size:19px;width:22px;text-align:center}

  /* 练习区里的小任务栏 */
  .mtask{
    position:absolute;left:0;right:0;bottom:0;height:38px;z-index:50;
    background:rgba(28,32,40,.92);display:flex;align-items:center;gap:8px;padding:0 8px;color:#fff;
  }
  html.no-flexgap .mtask > *:not(:last-child){margin-right:8px}
  .mtask .mtbtn{
    border:none;font-family:inherit;cursor:pointer;color:#fff;background:rgba(255,255,255,.14);
    border-radius:7px;padding:7px 12px;font-size:14px;font-weight:700;
    display:flex;align-items:center;gap:6px;min-height:28px;
  }
  html.no-flexgap .mtask .mtbtn > *:not(:last-child){margin-right:6px}
  .mtask .mtbtn:hover{background:rgba(255,255,255,.26)}
  .mtask .mtbtn.on{background:var(--blue-soft);color:#12314f}
  .mtask .mtbtn.start{background:var(--blue)}
  .mtask .mtlist{display:flex;align-items:center;gap:6px;flex:1;overflow:hidden}
  html.no-flexgap .mtask .mtlist > *:not(:last-child){margin-right:6px}
  .mtask .mtclock{font-size:13px;font-weight:700;white-space:nowrap;border-left:1px solid rgba(255,255,255,.28);padding-left:8px}

  /* 练习区里的信息条（选中时出现的那一行） */
  .minfo{
    position:absolute;left:50%;bottom:46px;transform:translateX(-50%);z-index:45;
    background:rgba(20,26,36,.9);color:#fff;border-radius:9px;padding:8px 16px;
    font-size:14px;font-weight:700;box-shadow:var(--shadow);display:none;max-width:82%;text-align:center;
    pointer-events:none;
  }
  .minfo.show{display:block}
  .minfo b{color:#ffd76a}

  /* 幽灵指针 */
  .ghost{position:absolute;left:0;top:0;z-index:90;pointer-events:none;opacity:0;transition:opacity .2s ease}
  .ghost .cur{display:block;filter:drop-shadow(0 5px 9px rgba(20,30,70,.4))}
  .ghost .rip{
    position:absolute;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;
    border-radius:50%;border:5px solid rgba(96,166,255,.75);opacity:0;transform:scale(.3);
  }
  .ghost .rip.go{animation:rip .6s ease-out}
  @keyframes rip{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(1.5)}}

  /* "点这里"的标签 */
  .tag-here{
    position:absolute;z-index:70;pointer-events:none;background:var(--accent);color:#231a03;
    border-radius:999px;padding:6px 14px;font-size:15px;font-weight:800;
    box-shadow:var(--shadow);white-space:nowrap;animation:bob 1.5s ease-in-out infinite;
  }

  /* ===== 练习区下面的控制条 ===== */
  .ctrlrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:12px;position:relative;z-index:1;min-height:44px}
  html.no-flexgap .ctrlrow > *:not(:last-child){margin-right:10px}
  .phase{background:#fff;border-radius:999px;padding:8px 15px;font-weight:800;font-size:15px;color:var(--muted);box-shadow:var(--shadow)}
  .phase.practice{background:#fff6da;color:#a97c2f}
  .phase.star{background:#eaf7ff;color:#2b6ea8}
  .phase.watch{background:#f2eaff;color:#6a4fb8}
  .stepbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  html.no-flexgap .stepbar > *:not(:last-child){margin-right:8px}
  .step{background:rgba(255,255,255,.68);border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;color:#a9a9c0;transition:all .18s ease}
  .step.on{background:#fff;color:var(--ink);transform:translateY(-3px);box-shadow:var(--shadow)}
  .btn{
    border:none;cursor:pointer;border-radius:16px;padding:11px 18px;
    font-family:inherit;font-size:16px;font-weight:800;transition:transform .1s ease;box-shadow:0 5px 0 rgba(0,0,0,.12);
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(2px)}
  .btn.primary{background:var(--green);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink)}

  /* ===== 弹窗 ===== */
  .overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(40,30,80,.4);display:none;align-items:center;justify-content:center;z-index:10000;padding:18px}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:28px;box-shadow:var(--shadow);max-width:440px;width:100%;padding:28px 22px;text-align:center;animation:popin .3s ease}
  .modal .moji{font-size:70px;line-height:1}
  .modal h2{margin:10px 0 6px;font-size:30px;font-size:clamp(22px,5vw,30px);color:var(--blue)}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:16px;line-height:1.7}
  .modal .mstars{font-size:24px;letter-spacing:4px;margin-bottom:16px}

  /* ===== 通关证书 ===== */
  .finale{
    position:fixed;top:0;right:0;bottom:0;left:0;z-index:900;display:none;
    align-items:center;justify-content:center;padding:18px;
    background:radial-gradient(circle at 50% 30%,#12406f 0%,#0a1b30 60%,#050c16 100%);
  }
  .finale.show{display:flex}
  .cert{
    background:#fffdf7;border-radius:16px;padding:28px 32px;max-width:680px;width:100%;
    text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5);border:8px double var(--yellow);
    animation:popin .5s ease;
  }
  .cert .big{font-size:68px;line-height:1}
  .cert h2{margin:10px 0 6px;font-size:34px;font-size:clamp(24px,5vw,34px);color:var(--blue-dark)}
  .cert p{margin:0 0 14px;font-size:17px;color:var(--muted);line-height:1.8}
  .cert .skills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
  html.no-flexgap .cert .skills > *:not(:last-child){margin-right:8px}
  .cert .skills span{background:var(--blue-soft);color:#12314f;border-radius:999px;padding:7px 14px;font-size:15px;font-weight:700}
  .cert button{font-family:inherit;font-size:18px;font-weight:800;cursor:pointer;border:none;border-radius:10px;padding:13px 24px;background:var(--blue);color:#fff}
  .cert button:hover{background:#1a7fd0}
  .cf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:950;pointer-events:none;animation:cfall 2s linear forwards}
  @keyframes cfall{to{transform:translateY(110vh) rotate(540deg);opacity:.35}}

  @media(max-height:700px){
    .play{height:390px}
    .mascot{width:66px;height:66px;font-size:36px}
    .bubble{font-size:20px;min-height:56px}
  }
  @media(max-width:900px){
    .mascot{width:66px;height:66px;font-size:36px}
    .bubble{font-size:19px}
    .micon{width:82px;height:92px}
    .micon .face{width:48px;height:48px;font-size:27px}
  }
</style>
<script>
/* ===== 防误触兜底 =====
   1) 右键菜单：本页要练右键，系统菜单会挡住画面，所以全局取消默认菜单，
      只调 preventDefault、绝不 stopPropagation，页内自己画的菜单照常工作。
      输入框除外。2) 拖拽：防止图标/文字被浏览器拖走；页内拖动都走 pointer 事件，
      不受影响。3) 防误退：压两层 history 哨兵，右键拖动手势和误按后退键都不会
      把学生带走。本页不使用 hash / history 导航。 */
(function () {
  function keepNative(el) {
    return !!(el && el.closest &&
      el.closest('input, textarea, [contenteditable]:not([contenteditable="false"])'));
  }
  document.addEventListener('contextmenu', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();                    /* 只取消默认菜单，不阻断页内逻辑 */
  }, true);
  document.addEventListener('dragstart', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();
  }, true);

  if (location.protocol === 'file:') return;      /* file:// 下浏览器禁止 pushState */
  function guard() {
    try { history.pushState({ mtSentinel: 1 }, '', location.href); } catch (e) {}
  }
  try {
    guard(); guard();
    window.addEventListener('popstate', guard);
  } catch (e) {}
})();
</script>
<script>
/* ===== 兼容层 A：flex gap 能力探测 =====
   老内核（Edge 84 以前、EdgeHTML）的 flex 布局不支持 gap，间距会全部塌掉。
   这里用真实布局量一次宽度来判断，不支持就给 <html> 挂上 no-flexgap。 */
(function () {
  try {
    var box = document.createElement('div');
    box.style.cssText = 'position:absolute;top:-9999px;left:-9999px;display:flex;gap:10px;width:auto;height:1px';
    var a = document.createElement('i');
    var b = document.createElement('i');
    a.style.cssText = b.style.cssText = 'display:block;width:10px;height:1px';
    box.appendChild(a); box.appendChild(b);
    document.documentElement.appendChild(box);
    var w = box.getBoundingClientRect().width || box.scrollWidth;
    document.documentElement.removeChild(box);
    if (!(w >= 30)) document.documentElement.className += ' no-flexgap';
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="bg-bubbles" id="bg"></div>

<div class="wrap">
  <div class="star-total" aria-live="polite"><span class="st-ico">⭐</span><span id="starNum">0</span><span class="st-lbl">颗星</span></div>

  <header>
    <div class="mascot" id="mascot">🐭</div>
    <div class="bubble" id="bubble" aria-live="polite">点一个圆圈，我们开始学电脑！</div>
  </header>

  <nav id="nav"></nav>

  <div class="stars" id="stars"></div>

  <div class="play" id="play"></div>

  <div class="ctrlrow" id="ctrlrow" style="display:none">
    <span class="phase" id="phase">练习轮</span>
    <div class="stepbar" id="stepbar"></div>
    <button class="btn ghost" id="btnDemo">再看一遍 👀</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="moji" id="mMoji">🎉</div>
    <h2 id="mTitle">真棒！</h2>
    <p id="mText"></p>
    <div class="mstars" id="mStars"></div>
    <div class="actions"><button class="btn primary" id="mOk">确定</button></div>
  </div>
</div>

<div class="finale" id="finale">
  <div class="cert">
    <div class="big">🏆</div>
    <h2>电脑小达人</h2>
    <p id="certSub"></p>
    <div class="skills" id="certSkills"></div>
    <button id="certOk">再玩一遍</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  const $ = s=>document.querySelector(s);
  const play=$('#play'), bubble=$('#bubble'), mascot=$('#mascot'), starsEl=$('#stars');
  const phaseEl=$('#phase'), stepbar=$('#stepbar'), ctrlrow=$('#ctrlrow'), btnDemo=$('#btnDemo');
  const overlay=$('#overlay');

  /* ================= 通用小工具 ================= */
  function el(tag,cls,html){
    const e=document.createElement(tag);
    if(cls) e.className=cls;
    if(html!=null) e.innerHTML=html;
    return e;
  }
  function say(html,shake){
    bubble.innerHTML=html;
    if(shake){ bubble.classList.remove('shake'); void bubble.offsetWidth; bubble.classList.add('shake'); }
  }
  let sayTimer=null;
  function saySoon(html,ms){
    clearTimeout(sayTimer);
    sayTimer=setTimeout(function(){ say(html); }, ms||3600);
  }
  function flashTxt(){}
  let timers=[];
  function T(ms,fn){ timers.push(setTimeout(fn,ms)); }
  function clearTimers(){ while(timers.length) clearTimeout(timers.pop()); clearTimeout(sayTimer); }
  let handlers=[];
  function on(target,type,fn,opt){
    target.addEventListener(type,fn,opt||false);
    handlers.push(function(){ target.removeEventListener(type,fn,opt||false); });
  }
  function clearHandlers(){ while(handlers.length) handlers.pop()(); }
  function centerOf(node){
    const r=node.getBoundingClientRect();
    return {x:r.left+r.width/2, y:r.top+r.height/2};
  }
  function rectOf(node){ const r=node.getBoundingClientRect(); return {x:r.left,y:r.top,w:r.width,h:r.height}; }
  function flash(node,cls){ if(!node) return; node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
  function setStars(done,total){
    starsEl.innerHTML='';
    for(let i=0;i<total;i++){
      starsEl.appendChild(el('span','star'+(i<done?' pop':''),'<span class="s-in">⭐</span>'));
    }
    if(total>0){
      starsEl.appendChild(el('span','big-count',done+' / '+total));
    }
  }
  function confetti(){
    const colors=['#ff6fa5','#ffd23f','#43a3ff','#4ed47e','#a577ff','#43d2e8'];
    for(let i=0;i<24;i++){
      const c=el('div','cf');
      c.style.left=Math.random()*100+'vw';
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDelay=(Math.random()*.25)+'s';
      document.body.appendChild(c);
      setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); },1600);
    }
  }
  function showModal(moji,title,text,mstarStr){
    $('#mMoji').textContent=moji;
    $('#mTitle').textContent=title;
    $('#mText').innerHTML=text;
    $('#mStars').textContent=mstarStr||'';
    overlay.classList.add('show');
  }
  function hideModal(){ overlay.classList.remove('show'); }

  /* ================= 练习区尺寸 ================= */
  const PAD=12, CELL_W=100, CELL_H=106, COLS=8, BAR=38;
  function pW(){ return play.clientWidth; }
  function pH(){ return play.clientHeight; }
  function barOn(){ return !!(S.scene&&S.scene.bar) || S.wins.length>0; }
  function barH(){ return barOn()?BAR:0; }
  function workH(){ return pH()-barH(); }
  function slotPos(col,row){ return {x:PAD+col*CELL_W, y:PAD+row*CELL_H}; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  /* ================= 状态 ================= */
  const S={ icons:[], wins:[], sel:null, selSeen:{}, inFolder:{}, seqStep:0, flags:{},
            zTop:20, active:null, scene:null, layer:null, winLayer:null, menu:null, start:null,
            info:null, taskbar:null, hid:null, done:false, found:false };
  const APPS={
    pc:   {label:'我的电脑', emoji:'🖥',  body:'<p>这里是你的电脑。</p><p>左边能看到硬盘和文件夹。</p>'},
    bin:  {label:'回收站',   emoji:'🗑',  body:'<p>删掉的东西先放在这里。</p>'},
    draw: {label:'画图',     emoji:'🎨',  body:'<p>可以在这里画画。</p><p>左边是颜色，上面是画笔。</p>'},
    photo:{label:'照片',     emoji:'🖼',  body:'<div style="font-size:56px;text-align:center;line-height:1.3">🌄</div><p style="text-align:center">这是你拍的照片</p>'},
    essay:{label:'作文',     emoji:'📝',  scroll:true},
    calc: {label:'计算器',   emoji:'🧮',  body:'<p style="text-align:right;font-size:22px;font-weight:800;background:#eef1f5;border-radius:6px;padding:6px 10px">2026</p><p style="text-align:center">1 2 3 + 4 = 5</p>'},
    music:{label:'音乐',     emoji:'🎵',  body:'<p>正在播放：小星星</p><p>⏵ ⏸ ⏭</p>'},
    paint:{label:'美术作业', emoji:'🖼',  body:'<div style="font-size:56px;text-align:center;line-height:1.3">🎨</div><p style="text-align:center">这幅画要交给老师</p>'},
    cn:   {label:'语文作业', emoji:'📖',  body:'<p>今天的作业：</p><p>1. 读课文三遍<br>2. 抄写生字</p>'},
    folder:{label:'作业',    emoji:'📁',  folder:true}
  };
  const START_APPS=[['calc','计算器','🧮'],['draw','画图','🎨'],['photo','照片','🖼'],['essay','作文','📝'],
                    ['music','音乐','🎵'],['pc','我的电脑','🖥'],['bin','回收站','🗑'],['note','记事本','📒'],
                    ['clock','时钟','⏰'],['camera','相机','📷'],['weather','天气','⛅'],['paint3d','3D 画图','🧊']];
  const SCROLL_ESSAY=
    '<h3 style="margin:0 0 8px">我的周末</h3>'
    +'<p>星期六早上，我七点就起床了。</p>'
    +'<p>我先刷牙洗脸，然后吃早饭。早饭是牛奶和面包。</p>'
    +'<p>吃完早饭，我写了一会儿作业，就下楼玩了。</p>'
    +'<p id="mk-hello" style="background:#fff3cd;padding:5px 9px;border-radius:6px"><b>早上好</b>，我们一起玩到中午。</p>'
    +'<p>中午回家吃饭，妈妈做了西红柿炒鸡蛋。</p>'
    +'<p>下午我睡了一会儿午觉，起来看了一集动画片。</p>'
    +'<p>动画片里的小狗特别可爱，它还会数数。</p>'
    +'<p>晚上我和爸爸一起散步，天上的星星很亮。</p>'
    +'<p>回家以后，我洗了澡，刷了牙，九点就睡觉了。</p>'
    +'<p id="mk-end" style="background:#e3f2fd;padding:5px 9px;border-radius:6px"><b>最后一行：我的作业编号是 2026</b></p>'
    +'<p style="height:40px"></p>';

  /* ================= 搭场景（每次只放这一关要用的东西） ================= */
  function buildScene(cfg){
    clearHandlers();
    play.innerHTML='';
    S.icons=[]; S.wins=[]; S.sel=null; S.selSeen={}; S.inFolder={}; S.seqStep=0; S.flags={};
    S.zTop=20; S.active=null; S.done=false; S.found=false; S.hid=null; S.menu=null; S.start=null;
    S.ready=false;
    folderSeq=0;                       /* 每一关新建的文件夹都从 1 号开始 */
    const scene=cfg.scene||{};
    S.scene=scene;
    const st=el('div','stage'+(scene.light?' lightbg':''));
    play.appendChild(st); S.stage=st;
    st.appendChild(el('div','wallmini'));
    const layer=el('div','micons'); st.appendChild(layer); S.layer=layer;
    const wl=el('div','mwins'); st.appendChild(wl); S.winLayer=wl;
    if(scene.hid){
      const h=el('div','mhid','<span class="face">'+scene.hid.emoji+'</span>');
      h.style.cssText='position:absolute;z-index:2;width:'+(scene.hid.size||86)+'px;height:'+(scene.hid.size||86)+'px;'
        +'border-radius:14px;background:#fff;border:4px dashed #cfd8ef;display:flex;align-items:center;justify-content:center;'
        +'font-size:'+Math.round((scene.hid.size||86)*0.5)+'px;box-shadow:0 6px 14px rgba(15,25,45,.2)';
      st.appendChild(h); S.hid=h;
      S.hidAt=scene.hid.at||[0.72,0.5];
      on(h,'click',function(){ if(S.found){ S.flags.hidclick=true; checkGoal(); } });
    }
    const m=el('div','mmenu'); st.appendChild(m); S.menu=m;
    const sm=el('div','mstart');
    sm.innerHTML='<div class="sm-head">所有应用（滚轮往下滑）</div><div class="sm-list"></div>';
    st.appendChild(sm); S.start=sm;
    const info=el('div','minfo'); st.appendChild(info); S.info=info;
    /* 任务栏一直建好，按需要显示/隐藏（这样后开的窗口也能触发判定） */
    const tb=el('div','mtask hide');
    tb.innerHTML='<button class="mtbtn start"><span>⊞</span>开始</button><div class="mtlist"></div>'
      +'<div class="mtclock">'+clockText()+'</div>';
    st.appendChild(tb); S.taskbar=tb;
    (scene.i||[]).forEach(function(it){
      const id=it[0], src=APPS[id];
      S.icons.push({id:id,label:src.label,emoji:src.emoji,folder:!!src.folder,app:id,col:it[1],row:it[2]});
    });
    (scene.w||[]).forEach(function(spec){ makeWindow(spec,true); });
    const actWin=(scene.w||[]).filter(function(s){ return s.active; })[0];
    if(actWin){ const aw=winById(actWin.id); if(aw) activate(aw,true); }
    layout();
    renderIcons(); renderTaskbar();
    if(S.taskbar){
      on(S.taskbar.querySelector('.mtbtn.start'),'click',function(){
        if(S.start.classList.contains('show')) closeStart(); else openStart();
      });
    }
    addGhost();
    on(play,'click',function(e){
      if(e.target.closest('.micon')||e.target.closest('.mwin')||e.target.closest('.mmenu')
         ||e.target.closest('.mstart')||e.target.closest('.mtask')) return;
      closeMenu(); closeStart();
      if(S.sel) selectIcon(null);
    });
    on(play,'contextmenu',function(e){
      if(e.target.closest('input,textarea')) return;
      if(e.target.closest('.mwin')||e.target.closest('.mtask')) return;
      const ic=e.target.closest('.micon');
      const pr=play.getBoundingClientRect();
      const x=e.clientX-pr.left, y=e.clientY-pr.top;
      if(ic){ selectIcon(ic.dataset.id); openMenu(x,y,'icon',ic.dataset.id); }
      else if(!e.target.closest('.mmenu')&&!e.target.closest('.mstart')){ openMenu(x,y,'desk'); }
    });
    /* 学生自己动手了，就停下演示（演示只在没人动的时候自己放） */
    on(play,'pointerdown',function(){ if(demoOn){ stopDemo(); S.ready=true; } },true);
    if(scene.start) openStart();
  }
  function clockText(){
    const d=new Date();
    return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  }
  function layout(){
    if(!S.layer) return;
    S.icons.forEach(function(ic){
      const n=iconEl(ic.id); if(!n) return;
      const p=slotPos(ic.col,ic.row);
      n.style.left=p.x+'px'; n.style.top=p.y+'px';
    });
    S.wins.forEach(function(w){
      if(w.snap) { setRect(w,snapRect(w.snap)); return; }
      placeWindow(w);
    });
    if(S.hid){
      const p=slotPos(0,0);
      const hx=clamp(S.hidAt[0]*(pW()-S.hid.offsetWidth),10,pW()-S.hid.offsetWidth-10);
      const hy=clamp(S.hidAt[1]*(workH()-S.hid.offsetHeight),8,Math.max(8,workH()-S.hid.offsetHeight-8));
      S.hid.style.left=Math.round(hx)+'px'; S.hid.style.top=Math.round(hy)+'px';
    }
  }
  /* 给窗口定一个能看见的初始位置（后开的窗口也要有） */
  function placeWindow(w){
    const size=w.spec.size||[520,320];
    const wide=clamp(size[0],280,pW()-24), high=clamp(size[1],180,workH()-30);
    const at=w.spec.at||[0.5,0.4];
    const x=clamp(at[0]*(pW()-wide),10,Math.max(10,pW()-wide-10));
    const y=clamp(at[1]*(workH()-high),8,Math.max(8,workH()-high-8));
    setRect(w,{x:x,y:y,w:wide,h:high});
  }

  /* ================= 桌面图标 ================= */
  function iconEl(id){
    if(!S.layer) return null;
    const list=S.layer.querySelectorAll('.micon');
    for(let i=0;i<list.length;i++){ if(list[i].dataset.id===id) return list[i]; }
    return null;
  }
  function iconById(id){ for(let i=0;i<S.icons.length;i++){ if(S.icons[i].id===id) return S.icons[i]; } return null; }
  function renderIcons(){
    if(!S.layer) return;
    S.layer.innerHTML='';
    S.icons.forEach(function(ic){
      if(ic.hidden||S.inFolder[ic.id]) return;
      const n=el('div','micon','<span class="face">'+ic.emoji+'</span><span class="lbl">'+ic.label+'</span>');
      n.dataset.id=ic.id;
      const p=slotPos(ic.col,ic.row);
      n.style.left=p.x+'px'; n.style.top=p.y+'px';
      if(S.sel===ic.id) n.classList.add('sel');
      S.layer.appendChild(n);
      bindIcon(n,ic.id);
    });
  }
  function bindIcon(node,id){
    on(node,'click',function(){ selectIcon(id); });
    on(node,'dblclick',function(){ openIcon(id); });
    on(node,'contextmenu',function(e){
      if(e.target.closest('input,textarea')) return;
      e.preventDefault();
      selectIcon(id);
      const pr=play.getBoundingClientRect();
      openMenu(e.clientX-pr.left, e.clientY-pr.top, 'icon', id);
    });
    on(node,'pointerdown',function(e){ iconDragStart(e,id); });
  }
  function showInfo(html){
    if(!S.info) return;
    S.info.innerHTML=html;
    S.info.classList.add('show');
    clearTimeout(showInfo._t);
    showInfo._t=setTimeout(function(){ S.info.classList.remove('show'); },3600);
  }
  function selectIcon(id){
    S.sel=id;
    renderIcons();
    if(id){
      const ic=iconById(id);
      S.selSeen[id]=true;
      showInfo('已选中：<b>'+ic.label+'</b>　双击可以打开');
    } else showInfo('已取消选中');
    checkGoal();
  }
  function freeSlot(col,row){
    return !S.icons.some(function(ic){
      return !ic.hidden && !S.inFolder[ic.id] && ic.col===col && ic.row===row;
    });
  }
  function nearestSlot(x,y){
    let best=null, bestD=1e9;
    for(let row=0;row<4;row++){
      for(let col=0;col<COLS;col++){
        if(!freeSlot(col,row)) continue;
        const p=slotPos(col,row);
        const d=Math.abs(p.x-x)+Math.abs(p.y-y);
        if(d<bestD){ bestD=d; best={col:col,row:row}; }
      }
    }
    return best||{col:0,row:0};
  }
  let iconDrag=null;
  function iconDragStart(e,id){
    if(e.button!==0) return;
    stopDemo(); closeMenu(); closeStart();
    const node=iconEl(id); if(!node) return;
    const r=rectOf(node);
    iconDrag={id:id,node:node,id0:e.pointerId,dx:e.clientX-r.x,dy:e.clientY-r.y,moved:false};
    document.addEventListener('pointermove',iconDragMove);
    document.addEventListener('pointerup',iconDragEnd);
    document.addEventListener('pointercancel',iconDragEnd);
  }
  function iconDragMove(e){
    if(!iconDrag||e.pointerId!==iconDrag.id0) return;
    const lr=S.layer.getBoundingClientRect();
    const x=e.clientX-iconDrag.dx-lr.left, y=e.clientY-iconDrag.dy-lr.top;
    if(Math.abs(x-parseFloat(iconDrag.node.style.left||0))>3||Math.abs(y-parseFloat(iconDrag.node.style.top||0))>3){
      iconDrag.moved=true;
      iconDrag.node.classList.add('dragging');
      iconDrag.node.classList.remove('sel');
    }
    if(iconDrag.moved) e.preventDefault();
    iconDrag.node.style.left=Math.round(x)+'px';
    iconDrag.node.style.top=Math.round(y)+'px';
    const f=folderUnder(e.clientX,e.clientY,iconDrag.node);
    S.layer.querySelectorAll('.micon').forEach(function(n){
      n.classList.toggle('folderTarget', !!f && f===n);
    });
  }
  function folderUnder(cx,cy,skip){
    const list=S.layer.querySelectorAll('.micon');
    for(let i=0;i<list.length;i++){
      const n=list[i];
      if(skip&&n===skip) continue;
      const ic=iconById(n.dataset.id);
      if(!ic||!ic.folder) continue;
      const r=n.getBoundingClientRect();
      if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom) return n;
    }
    return null;
  }
  function iconDragEnd(e){
    if(!iconDrag||e.pointerId!==iconDrag.id0) return;
    document.removeEventListener('pointermove',iconDragMove);
    document.removeEventListener('pointerup',iconDragEnd);
    document.removeEventListener('pointercancel',iconDragEnd);
    const d=iconDrag; iconDrag=null;
    d.node.classList.remove('dragging');
    S.layer.querySelectorAll('.folderTarget').forEach(function(n){ n.classList.remove('folderTarget'); });
    if(!d.moved) return;                 /* 没拖动，选中交给 click 事件 */
    const ic=iconById(d.id);
    const f=folderUnder(e.clientX,e.clientY,null);
    if(f){
      S.inFolder[d.id]=f.dataset.id;
      if(S.sel===d.id) S.sel=null;
      renderIcons();
      showInfo('「'+ic.label+'」放进「'+iconById(f.dataset.id).label+'」里了');
      checkGoal();
      return;
    }
    if(S.inFolder[d.id]) delete S.inFolder[d.id];
    const p=nearestSlot(parseFloat(d.node.style.left||0),parseFloat(d.node.style.top||0));
    ic.col=p.col; ic.row=p.row;
    renderIcons();
    checkGoal();
  }
  function openIcon(id){
    const ic=iconById(id);
    if(!ic) return;
    if(ic.folder){
      const inside=S.icons.filter(function(x){ return S.inFolder[x.id]===ic.id; });
      makeWindow({id:'win-folder-'+ic.id,title:ic.label,icon:'📁',
        html:inside.length?('<p>里面有 '+inside.length+' 个东西：</p><p>'+inside.map(function(x){return x.emoji+' '+x.label;}).join('<br>')+'</p>')
                         :'<p>这个文件夹是空的。</p><p>把图标拖进来试试。</p>',
        size:[420,280]});
      return;
    }
    const ex=winById('win-'+ic.id);
    if(ex){ activate(ex); return; }
    const app=APPS[ic.app||ic.id]||{};
    makeWindow({id:'win-'+ic.id,title:ic.label,icon:ic.emoji,essay:!!app.scroll,
      html:app.body||'<p>这里还没有内容。</p>',size:[520,330]});
  }

  /* ================= 窗口 ================= */
  let winSeq=1;
  function winById(id){ for(let i=0;i<S.wins.length;i++){ if(S.wins[i].id===id) return S.wins[i]; } return null; }
  function setRect(w,r){
    w.rect={x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.w),h:Math.round(r.h)};
    w.el.style.left=w.rect.x+'px'; w.el.style.top=w.rect.y+'px';
    w.el.style.width=w.rect.w+'px'; w.el.style.height=w.rect.h+'px';
  }
  function makeWindow(spec,initial){
    const w={spec:spec, id:spec.id||('w'+(winSeq++)), snap:spec.snap||null,
             state:spec.min?'min':'normal', rect:null, el:null};
    const node=el('div','mwin');
    node.dataset.win=w.id;
    node.innerHTML='<div class="tbar"><span class="wico">'+(spec.icon||'🪟')+'</span>'
      +'<span class="wtxt">'+spec.title+'</span>'
      +'<span class="wbtns"><button class="wb min" title="最小化">—</button>'
      +'<button class="wb max" title="最大化">□</button>'
      +'<button class="wb cls" title="关闭">✕</button></span></div>'
      +'<div class="wbody">'+(spec.essay?SCROLL_ESSAY:(spec.html||''))+'</div>';
    S.winLayer.appendChild(node);
    w.el=node;
    S.wins.push(w);
    on(node,'pointerdown',function(){ if(S.active!==w.id) activate(w); });
    on(node.querySelector('.wb.min'),'click',function(){ minimize(w); });
    on(node.querySelector('.wb.max'),'click',function(){ toggleMax(w); });
    on(node.querySelector('.wb.cls'),'click',function(){ closeWindow(w); });
    on(node.querySelector('.tbar'),'dblclick',function(){ toggleMax(w); });
    on(node.querySelector('.tbar'),'pointerdown',function(ev){ winDragStart(ev,w); });
    on(node.querySelector('.wbody'),'scroll',function(){ checkGoal(); });
    if(w.state==='min') node.classList.add('min');
    if(w.snap){ renderTaskbar(); }
    renderTaskbar();
    placeWindow(w);                     /* 后开的窗口也要有位置，不然拖不动 */
    activate(w,true);                   /* 新开的窗口一定在最前面（否则会被旧窗口压住） */
    return w;
  }
  function activate(w,silent){
    if(!w) return;
    if(w.state==='min'){ w.state='normal'; w.el.classList.remove('min'); }
    S.active=w.id;
    S.wins.forEach(function(x){
      x.el.classList.toggle('active',x.id===w.id);
      if(x.id===w.id) x.el.style.zIndex=++S.zTop;

  function toggleMax(w){
    if(w.snap){ if(w.restore) setRect(w,w.restore); w.snap=null; w.el.querySelector('.wb.max').textContent='□'; }
    else { w.restore=w.rect; setRect(w,snapRect('max')); w.snap='max'; w.el.querySelector('.wb.max').textContent='❐'; }
    w.state='normal'; w.el.classList.remove('min');
    activate(w);

  function snapRect(zone){
    const W=pW(), H=workH(), w2=Math.round(W/2), h2=Math.round(H/2);
    if(zone==='max')  return {x:0,y:0,w:W,h:H};
    if(zone==='left') return {x:0,y:0,w:w2,h:H};
    if(zone==='right')return {x:W-w2,y:0,w:w2,h:H};
    if(zone==='tl')   return {x:0,y:0,w:w2,h:h2};
    if(zone==='tr')   return {x:W-w2,y:0,w:w2,h:h2};
    if(zone==='bl')   return {x:0,y:H-h2,w:w2,h:h2};
    if(zone==='br')   return {x:W-w2,y:H-h2,w:w2,h:h2};
  }
  function snapZoneAt(x,y){
    const W=pW(), H=workH(), ex=40, ey=40;
    const nl=x<ex, nr=x>W-ex, nt=y<ey, nb=y>H-ey;
    if(nt&&!nl&&!nr) return 'max';
    if(nl&&nt) return 'tl';
    if(nl&&nb) return 'bl';
    if(nr&&nt) return 'tr';
    if(nr&&nb) return 'br';
    if(nl) return 'left';
    if(nr) return 'right';
    return null;
  }
  let snapView=null;
  function showSnapView(zone){
    if(!snapView){ snapView=el('div'); snapView.style.cssText='position:absolute;z-index:15;pointer-events:none;'
      +'background:rgba(96,166,255,.32);border:3px solid #bfe0ff;border-radius:9px;display:none'; play.appendChild(snapView); }
    if(!zone){ snapView.style.display='none'; return; }
    const r=snapRect(zone);
    snapView.style.display='block';
    snapView.style.left=r.x+'px'; snapView.style.top=r.y+'px';
    snapView.style.width=r.w+'px'; snapView.style.height=r.h+'px';
  }
  let winDrag=null;
  function winDragStart(ev,w){
    if(ev.button!==0) return;
    if(ev.target.closest&&ev.target.closest('.wb')) return;
    stopDemo(); closeMenu(); closeStart();
    const r=rectOf(w.el);
    winDrag={w:w,id:ev.pointerId,dx:ev.clientX-r.x,dy:ev.clientY-r.y,zone:null,moved:false};
    activate(w,true);
    w.el.querySelector('.tbar').classList.add('grabbing');
    document.addEventListener('pointermove',winDragMove);
    document.addEventListener('pointerup',winDragEnd);
    document.addEventListener('pointercancel',winDragEnd);
  }
  function winDragMove(ev){
    if(!winDrag||ev.pointerId!==winDrag.id) return;
    ev.preventDefault();
    const w=winDrag.w;
    if(w.snap){
      const before=w.restore||{w:420,h:280};
      const pr=play.getBoundingClientRect();
      const rx=(ev.clientX-pr.left)/(w.rect.w||1);
      setRect(w,{w:before.w,h:before.h,x:ev.clientX-pr.left-before.w*rx,y:ev.clientY-pr.top-19});
      w.snap=null;
      w.el.querySelector('.wb.max').textContent='□';
      winDrag.dx=ev.clientX-(pr.left+w.rect.x); winDrag.dy=19;
    }
    const pr=play.getBoundingClientRect();
    let x=ev.clientX-pr.left-winDrag.dx;
    let y=ev.clientY-pr.top-winDrag.dy;
    x=clamp(x,-w.rect.w+80,pW()-80);
    y=clamp(y,-6,workH()-20);
    w.el.style.left=Math.round(x)+'px'; w.el.style.top=Math.round(y)+'px';
    w.rect.x=Math.round(x); w.rect.y=Math.round(y);
    winDrag.moved=true;
    const zone=snapZoneAt(ev.clientX-pr.left,ev.clientY-pr.top);
    if(zone!==winDrag.zone){ winDrag.zone=zone; showSnapView(zone); }
  }
  function winDragEnd(ev){
    if(!winDrag||ev.pointerId!==winDrag.id) return;
    document.removeEventListener('pointermove',winDragMove);
    document.removeEventListener('pointerup',winDragEnd);
    document.removeEventListener('pointercancel',winDragEnd);
    const w=winDrag.w, zone=winDrag.zone, moved=winDrag.moved;
    w.el.querySelector('.tbar').classList.remove('grabbing');
    winDrag=null;
    showSnapView(null);
    if(zone){ w.restore=w.restore||w.rect; setRect(w,snapRect(zone)); w.snap=zone;
              w.el.querySelector('.wb.max').textContent=(zone==='max')?'❐':'□'; }
    else if(moved) S.flags['move:'+w.id]=true;
    checkGoal();
  }

  /* ================= 目标判定 ================= */
  function visFrac(){
    if(!S.hid) return 0;
    const h=S.hid.getBoundingClientRect();
    const area=Math.max(1,h.width*h.height);
    let cover=0;
    S.wins.forEach(function(w){
      if(w.state==='min') return;
      const r=w.el.getBoundingClientRect();
      const ix=Math.max(0,Math.min(h.right,r.right)-Math.max(h.left,r.left));
      const iy=Math.max(0,Math.min(h.bottom,r.bottom)-Math.max(h.top,r.top));
      cover=Math.max(cover,ix*iy);
    });
    return 1-cover/area;
  }
  function tickHid(){
    if(!S.hid||S.found) return;
    const r=S.hid.getBoundingClientRect();
    const top=document.elementFromPoint(r.left+r.width/2, r.top+r.height/2);
    const clickable=!!(top&&(top===S.hid||S.hid.contains(top)));
    if(visFrac()>=0.9&&clickable){          /* 露出来、而且点得到，才算找到 */
      S.found=true;
      S.hid.classList.add('found');
      S.hid.style.borderStyle='solid';
      S.hid.style.borderColor='#2ec77b';
      S.hid.style.cursor='pointer';
      showInfo('找到啦！点一下它');
    }
  }
  function markerVisible(winId,markerId){
    const w=winById(winId); if(!w) return false;
    const body=w.el.querySelector('.wbody'); if(!body) return false;
    const mk=body.querySelector('#'+markerId); if(!mk) return false;
    const br=body.getBoundingClientRect(), mr=mk.getBoundingClientRect();
    return mr.top>=br.top-4 && mr.bottom<=br.bottom+4;
  }
  function scrolledBottom(winId){
    const w=winById(winId); if(!w) return false;
    const b=w.el.querySelector('.wbody');
    return !!b && (b.scrollTop+b.clientHeight >= b.scrollHeight-8);
  }
  function goalMet(g){
    if(!g) return false;
    switch(g.k){
      case 'sel':     return S.sel===g.id;
      case 'none':    return !S.sel;
      case 'selAll':  return g.ids.every(function(id){ return !!S.selSeen[id]; });
      case 'seq': {
        let st=S.seqStep||0;
        while(st<g.steps.length && goalMet(g.steps[st])) st++;   /* 一次判定把能过的都过掉 */
        S.seqStep=st;
        return st>=g.steps.length;
      }
      case 'flag':    return !!S.flags[g.name];
      case 'ctx': {
        if(!S.ctxOn) return false;
        if(!g.on) return true;
        if(g.on==='desk') return S.ctxOn==='desk';
        return S.ctxOn==='icon:'+g.id;
      }
      case 'winOpen': return !!winById(g.id);
      case 'winClosed': return !winById(g.id);
      case 'allClosed': return S.wins.length===0;
      case 'allMin':  return S.wins.length>0 && S.wins.every(function(w){ return w.state==='min'; });
      case 'state':   return !!winById(g.id) && winById(g.id).state===g.value;
      case 'snap':    return !!winById(g.id) && winById(g.id).snap===g.zone;
      case 'active':  return S.active===g.id && !!winById(g.id) && winById(g.id).state!=='min';
      case 'folder':  return S.inFolder[g.icon]===g.folder;
      case 'folders': return S.icons.filter(function(i){ return i.folder&&i.isNew&&!i.hidden; }).length>=g.n;
      case 'slots':   return g.list.every(function(x){
                        const ic=iconById(x.id);
                        return ic && ic.col===x.col && ic.row===x.row; });
      case 'uncover': return visFrac()>=0.9;
      case 'marker':  return markerVisible(g.win,g.marker);
      case 'bottom':  return scrolledBottom(g.win);
      case 'light':   return !!S.scene.light;
      default: return false;
    }
  }

  let demoOn=false, demoTimers=[];
  function DT(ms,fn){ demoTimers.push(setTimeout(fn,ms)); }
  function ghostTo(x,y,ms){

  function ripAt(x,y){

  function runSteps(steps,done){
    let i=0;
    function next(){
      if(i>=steps.length){ if(done) done(); return; }
      const s=steps[i++];
      if(s.msg) say(s.msg);
      const node=s.at?$(s.at):null;
      const go=function(cb){
        if(node){ const c=centerOf(node); ghostTo(c.x,c.y,420); DT(470,cb); }
        else DT(60,cb);
      };
      go(function(){
        if(s.act){
          if(node) rip(node);
          if(s.act==='click'&&node) node.click();
          if(s.act==='dblclick'&&node&&node.dataset.id) openIcon(node.dataset.id);
          if(s.act==='rightclick'&&node){
            const c=centerOf(node), pr=play.getBoundingClientRect();
            if(node.dataset.id) openMenu(c.x-pr.left,c.y-pr.top,'icon',node.dataset.id);
            else openMenu(c.x-pr.left,c.y-pr.top,'desk');
          }
          if(s.act==='start') openStart();
        }
        if(s.menuItem){
          const items=S.menu.querySelectorAll('.mi');
          for(let k=0;k<items.length;k++){
            if(items[k].dataset.label===s.menuItem){ rip(items[k]); items[k].click(); break; }
          }
        }
        if(s.run){ s.run(next); return; }
        DT(s.wait||520,next);
      });
    }
    next();
  }

  /* ================= 每一关的流程 ================= */
  let L=0, RI=0, stars=0, TOTAL=0, mode='home';
  const cleared={}, best={};
  let navs=[];
  function curRound(){ const lv=LEVELS[L]; return lv&&lv.rounds[RI]; }
  function levelStars(lv){ return lv.rounds.filter(function(r){ return r.star; }).length; }
  function markNav(id){
    navs.forEach(function(b){
      b.style.outline=(b.dataset.mode===id)?'3px solid #fff':'none';
      if(b.dataset.mode!=='home'&&cleared[b.dataset.mode]) b.classList.add('n-done');
      else b.classList.remove('n-done');
    });
  }
  function updatePhase(){
    const r=curRound();
    if(!r){ phaseEl.className='phase'; phaseEl.textContent=''; return; }
    phaseEl.className='phase '+(r.star?'star':'practice');
    phaseEl.textContent=r.star?('第 '+(RI+1)+' 次 · 计星'):'练习轮 · 不计星';
  }
  function updateStepbar(){
    const r=curRound();
    stepbar.innerHTML='';
    if(!r||!r.steps) return;
    r.steps.forEach(function(s,i){ stepbar.appendChild(el('span','step'+(i===0?' on':''),s)); });
  }
  function goalSelector(g){
    if(!g) return null;
    switch(g.k){
      case 'sel': return '#play .micon[data-id="'+g.id+'"]';
      case 'folder': return '#play .micon[data-id="'+g.icon+'"]';
      case 'slots': return '#play .micon[data-id="'+g.list[0].id+'"]';
      case 'uncover': return '#play .mwin .tbar';
      case 'winOpen': case 'winClosed': case 'active': case 'state': case 'snap':
        if(g.id.indexOf('win-app-')===0) return '#play .mtbtn.start';
        return '#play .micon[data-id="'+g.id.slice(4)+'"]';
      case 'flag':
        if(g.name==='refresh') return null;
        if(g.name.indexOf('move:')===0) return '#play .mwin .tbar';
        return null;
      case 'seq': return goalSelector(g.steps[0]);
      default: return null;
    }
  }
  function showTag(r){
    if(!r||!r.guided) return;
    const sel=goalSelector(r.goal);
    const node=sel?$(sel):null;
    if(!node) return;
    node.classList.add('hintring');
    const c=centerOf(node), pr=play.getBoundingClientRect();
    const tag=el('div','tag-here','点这里');
    play.appendChild(tag);
    const nodeTop=c.y-pr.top-node.getBoundingClientRect().height/2;
    const below=nodeTop<64;                 /* 目标太靠上就把标签放到下面，别压住它 */
    tag.style.left=clamp(Math.round(c.x-pr.left-tag.offsetWidth/2),6,pW()-tag.offsetWidth-6)+'px';
    tag.style.top=clamp(below
      ? Math.round(nodeTop+node.getBoundingClientRect().height+10)
      : Math.round(nodeTop-tag.offsetHeight-10),6,workH()-30)+'px';
    r._tag={node:node,tag:tag};
  }
  function clearTag(){
    const r=curRound();
    if(!r||!r._tag) return;
    if(r._tag.node) r._tag.node.classList.remove('hintring');
    if(r._tag.tag&&r._tag.tag.parentNode) r._tag.tag.parentNode.removeChild(r._tag.tag);
    r._tag=null;
  }
  function showRound(){
    mode='play';
    clearTimers(); stopDemo(); hideModal();
    S.done=false;
    const lv=LEVELS[L], r=curRound();
    buildScene(r);
    ctrlrow.style.display='';
    updatePhase(); updateStepbar();
    say('<b>'+r.tip+'</b>'+(r.hint?('<br><span style="font-size:16px;font-weight:600;color:#8a8aa8">'+r.hint+'</span>'):''));
    btnDemo.style.display=r.demo?'':'none';
    play.dataset.level=lv.id;
    play.dataset.round=String(RI+1);
    if(r.demo) T(950,function(){ if(!S.done) playDemo(); });
    else { S.ready=true; T(300,function(){ showTag(r); }); }
  }
  function playDemo(){
    const r=curRound();
    if(!r||!r.demo||demoOn) return;
    stopDemo();
    demoOn=true;
    btnDemo.style.display='none';
    const g=$('#ghost');
    if(g){ g.style.opacity='1'; g.style.transition='none'; g.style.transform='translate('+(pW()*0.5-3)+'px,'+(workH()-24)+'px)'; }
    runSteps(r.demo,function(){
      DT(420,function(){
        stopDemo();
        btnDemo.style.display=r.demo?'':'none';
        buildScene(r);                     /* 演示把画面动过，重新摆一遍 */
        say('看懂了吗？轮到你啦 👉<br><span style="font-size:16px;font-weight:600;color:#8a8aa8">'+r.tip+'</span>');
        S.ready=true;
        T(300,function(){ showTag(r); });
      });
    });
  }
  function roundDone(){
    if(S.done) return;
    S.done=true;
    clearTag();
    const r=curRound();
    if(r.star){
      stars++;
      setStars(stars,levelStars(LEVELS[L]));
      confetti();
      say('太棒了！<b>得到一颗星</b> ⭐');
    } else {
      say('做到啦！✅ 这次是<b>练习</b>，不计星～');
    }
    T(1200,nextRound);
  }
  function nextRound(){
    RI++;
    if(RI>=LEVELS[L].rounds.length) levelDone();
    else showRound();
  }
  function levelDone(){
    const lv=LEVELS[L];
    cleared[lv.id]=true;
    if((best[lv.id]||0)<stars) best[lv.id]=stars;
    TOTAL=0;
    for(const k in best) TOTAL+=(best[k]||0);
    const n=document.getElementById('starNum');
    if(n) n.textContent=TOTAL;
    markNav(L);
    play.dataset.round='done';
    const all=LEVELS.every(function(l){ return cleared[l.id]; });
    if(all){
      $('#certSkills').innerHTML=LEVELS.map(function(l){ return '<span>'+l.emoji+' '+l.name+'</span>'; }).join('');
      $('#certSub').innerHTML='图标、双击、右键、拖动、滚轮、窗口，你都会啦！<br>一共拿到 <b>⭐ '+TOTAL+'</b> 颗星。';
      $('#finale').classList.add('show');
      for(let i=0;i<60;i++){
        const c=el('div','cf');
        const colors=['#ffd23f','#43a3ff','#4ed47e','#ff8a65','#b39ddb','#43d2e8'];
        c.style.left=(Math.random()*100)+'vw';
        c.style.background=colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDelay=(Math.random()*.6)+'s';
        document.body.appendChild(c);
        setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); },3600);
      }
      return;
    }
    let nextIdx=-1;
    for(let i=0;i<LEVELS.length;i++){ if(!cleared[LEVELS[i].id]){ nextIdx=i; break; } }
    showModal('🏆','第 '+(L+1)+' 课 · 学会啦',
      lv.line+'<br>这一课拿到 ⭐ '+stars+' 颗星。',
      '⭐'.repeat(stars));
    const ok=$('#mOk');
    ok.onclick=function(){
      hideModal();
      if(nextIdx>=0) startLevel(nextIdx); else enterHome();
    };
  }
  function startLevel(i){
    mode='play';
    L=i; RI=0; stars=0;
    markNav(LEVELS[i].id);
    setStars(0,levelStars(LEVELS[i]));
    ctrlrow.style.display='';
    showRound();
  }
  function enterHome(){
    mode='home';
    clearTimers(); stopDemo(); hideModal();
    ctrlrow.style.display='none';
    buildScene({i:[['pc',0,0],['photo',1,0],['folder',2,0]],
      w:[{id:'win-home',title:'电脑小课堂',icon:'💡',
          html:'<p>点上面的圆圈，选一课开始。</p><p>每一课都先「看一遍」，再跟着做。</p>',
          size:[420,240],at:[0.3,0.3]}]});
    S.done=true;                       /* 首页不判任务 */
    setStars(0,0);
    say('欢迎来到电脑小课堂！<br>点上面的圆圈，<b>选一课</b>开始学。');
    play.dataset.level='home';
    play.dataset.round='0';
    markNav('home');
  }

  /* ================= 启动 ================= */
  (function buildNav(){
    const nav=$('#nav');
    const bh=el('button','b-home','<span class="emo">🏠</span>开始');
    bh.dataset.mode='home';
    bh.addEventListener('click',function(){ enterHome(); });
    nav.appendChild(bh);
    LEVELS.forEach(function(lv,i){
      const b=el('button',null,'<span class="emo">'+lv.emoji+'</span>'+lv.name);
      b.dataset.mode=lv.id;
      b.style.background=lv.color;
      b.addEventListener('click',function(){ startLevel(i); });
      nav.appendChild(b);
    });
    navs=[].slice.call(nav.querySelectorAll('button'));
  })();
  on(btnDemo,'click',function(){ playDemo(); });
  on($('#certOk'),'click',function(){
    $('#finale').classList.remove('show');
    for(const k in cleared) delete cleared[k];
    for(const k in best) delete best[k];
    TOTAL=0;
    const n=document.getElementById('starNum'); if(n) n.textContent='0';
    enterHome();
  });
  window.addEventListener('resize',function(){ if(S.stage) layout(); });
  window.__mt={ levels:LEVELS, state:S, mode:function(){ return mode; },
                level:function(){ return L; }, round:function(){ return RI; },
                stars:function(){ return stars; }, total:function(){ return TOTAL; },
                ready:function(){ return !!S.ready && !demoOn; },
                goalMet:function(g){ return goalMet(g); },
                goto:function(li,ri){ mode='play'; L=li; RI=ri||0; stars=0;
                  markNav(LEVELS[li].id); setStars(0,levelStars(LEVELS[li]));
                  ctrlrow.style.display=''; showRound(); } };
  (function bubbles(){
    const cols=['#ffffff','#ffffff','#ffe3f2','#d9f0ff'];
    for(let i=0;i<14;i++){
      const s=el('span');
      const sz=(Math.random()*40+20);
      s.style.width=sz+'px'; s.style.height=sz+'px';
      s.style.left=(Math.random()*100)+'vw';
      s.style.bottom='-40px';
      s.style.background=cols[i%cols.length];
      s.style.animationDuration=(Math.random()*6+6)+'s';
      s.style.animationDelay=(Math.random()*4)+'s';
      $('#bg').appendChild(s);
    }
  })();
  enterHome();
})();
</script>
</body>
</html>
