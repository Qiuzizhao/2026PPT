<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖥️ 鼠标练习营 3 · 电脑小课堂</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f6cbd'/><rect x='5' y='7' width='22' height='15' rx='2' fill='%23f3f3f3'/><circle cx='16' cy='14' r='3.2' fill='%230f6cbd'/><path d='M11 26h10' stroke='%23f3f3f3' stroke-width='2' stroke-linecap='round'/></svg>">
<meta name="theme-color" content="#f4f7fb">
<style>
  :root{
    --ink:#1f2937; --muted:#64748b;
    --blue:#2563eb; --blue-dark:#1d4ed8; --blue-soft:#eff6ff;
    --orange:#f59e0b; --green:#10b981; --cyan:#06b6d4;
    --purple:#7c3aed; --pink:#ec4899; --yellow:#f59e0b;
    --good:#10b981; --good-soft:#ecfdf5;
    --accent:#2563eb;
    --panel:#ffffff; --panel-2:#f8fafc; --line:#dbe4f0;
    --line-hot:#2563eb;
    --shadow:0 10px 30px rgba(15,42,80,.09);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    color:var(--ink); min-height:100vh; overflow-x:hidden;
    background:
      radial-gradient(circle at 12% 0%, #eef6ff 0, rgba(238,246,255,0) 34%),
      radial-gradient(circle at 88% 8%, #f0fdfa 0, rgba(240,253,250,0) 30%),
      linear-gradient(180deg,#f8fafc 0%,#f4f7fb 100%);
    background-attachment:fixed;
    padding:16px 30px 44px;padding:16px clamp(8px,3vw,30px) 44px;
    user-select:none;
  }
  body::before{
    content:"";position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0;opacity:.55;
    background-image:linear-gradient(#e8eef6 1px, transparent 1px),
                     linear-gradient(90deg, #e8eef6 1px, transparent 1px);
    background-size:32px 32px;
  }
  .wrap{max-width:900px;margin:0 auto;position:relative;z-index:1}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes popin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes burst{40%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}
  @keyframes floatb{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-40px) scale(1.1)}}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.4)}
    50%{box-shadow:0 0 0 14px rgba(37,99,235,0)}
  }

  /* ===== 背景小泡泡 ===== */
  .bg-bubbles{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden;z-index:0}
  .bg-bubbles span{
    position:absolute;border-radius:50%;opacity:.2;animation:floatb 9s ease-in-out infinite;
    border:1px solid rgba(37,99,235,.1);box-shadow:none;
  }

  /* ===== 顶部：小老鼠 + 说话气泡 ===== */
  header{display:flex;align-items:center;gap:14px;margin:0 auto 12px;position:relative;z-index:1}
  html.no-flexgap header > *:not(:last-child){margin-right:14px}
  .mascot{
    position:relative;width:76px;height:76px;flex-shrink:0;border-radius:18px;
    background:#ffffff;
    display:flex;align-items:center;justify-content:center;font-size:44px;
    border:1px solid var(--line);
    box-shadow:0 8px 22px rgba(15,42,80,.08);
    animation:bob 2.6s ease-in-out infinite;overflow:hidden;
  }
  .mascot::before{
    content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(37,99,235,.05),rgba(37,99,235,0) 52%);
  }
  .mascot::after{
    content:"";position:absolute;left:50%;bottom:8px;width:8px;height:8px;transform:translateX(-50%);
    border-radius:50%;background:var(--blue);
  }
  .bubble{
    position:relative;background:#ffffff;border-radius:18px;padding:14px 18px;
    border:1px solid var(--line);box-shadow:0 10px 28px rgba(15,42,80,.07);
    font-size:24px;font-size:clamp(17px,2.7vw,24px);font-weight:800;line-height:1.5;
    flex:1;height:102px;min-height:102px;display:flex;align-items:center;
    color:var(--ink);overflow:hidden;
  }
  .bubble .bubble-inner{width:100%}
  .bubble::before{
    content:"";position:absolute;left:-11px;top:28px;width:0;height:0;
    border-top:9px solid transparent;border-bottom:9px solid transparent;border-right:11px solid var(--line);
  }
  .bubble::after{
    content:"";position:absolute;left:-9px;top:30px;width:0;height:0;
    border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:9px solid #ffffff;
  }
  .bubble b{color:var(--blue)}
  .bubble .bubble-inner > span{font-size:15px !important;font-weight:600 !important;color:var(--muted) !important}
  .bubble.shake{animation:shake .4s ease}

  /* ===== 关卡按钮 ===== */
  nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 12px;position:relative;z-index:1}
  html.no-flexgap nav > *:not(:last-child){margin-right:8px}
  nav button{
    position:relative;overflow:hidden;border:1px solid var(--line);cursor:pointer;border-radius:10px;padding:9px 13px;
    font-family:inherit;
    font-size:17px;font-size:clamp(14px,2vw,17px);font-weight:800;color:#1e293b;
    display:flex;align-items:center;gap:6px;justify-content:center;
    background-image:linear-gradient(180deg,rgba(255,255,255,.86),rgba(255,255,255,.58)) !important;
    box-shadow:0 2px 0 #e6edf6,0 4px 12px rgba(15,42,80,.05);
    text-shadow:none;outline:none !important;
    transition:transform .1s ease,filter .1s ease;
  }
  nav button::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:rgba(255,255,255,.42);pointer-events:none;
  }
  html.no-flexgap nav button > *:not(:last-child){margin-right:6px}
  nav button:hover{transform:translateY(-2px);filter:saturate(1.06);background-image:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.74)) !important}
  nav button:active{transform:translateY(1px);box-shadow:0 1px 0 #e6edf6,inset 0 2px 4px rgba(15,42,80,.08)}
  nav button.b-home{background-color:var(--blue-soft) !important;color:var(--blue-dark)}
  nav button[style*="3px solid"]{outline:2px solid var(--blue) !important;outline-offset:2px}
  nav button span.emo{
    width:28px;height:28px;flex-shrink:0;border-radius:9px;
    display:inline-flex;align-items:center;justify-content:center;
    color:var(--blue);line-height:1;background:rgba(255,255,255,.78);
    border:1px solid rgba(255,255,255,.92);box-shadow:0 2px 6px rgba(15,42,80,.06);
  }
  nav button span.emo svg{width:18px;height:18px;display:block}
  nav button[style*="3px solid"] span.emo{background:#ffffff;box-shadow:0 0 0 2px rgba(37,99,235,.12)}
  nav button.n-done::after{content:" ✓";font-size:.72em;color:var(--green);opacity:1}
  nav button.n-half::after{content:" ◷";font-size:.72em;color:#b45309}

  /* ===== 星星 ===== */
  .stars{display:flex;gap:7px;justify-content:center;margin:0 auto 10px;flex-wrap:wrap;position:relative;z-index:1;min-height:32px}
  html.no-flexgap .stars > *:not(:last-child){margin-right:7px}
  .stars .star .s-in{
    display:inline-block;font-size:26px;filter:grayscale(1);opacity:.38;
    transition:filter .2s ease,transform .2s ease,opacity .2s ease;text-shadow:none;
  }
  .stars .star.pop .s-in{filter:none;opacity:1;transform:scale(1.15)}
  .stars .big-count{
    color:var(--ink);font-family:"Consolas","Microsoft YaHei",monospace;
    font-weight:900;font-size:18px;text-shadow:none;margin-left:7px;
  }

  .star-total{
    position:fixed;top:12px;right:12px;z-index:2000;
    background:#ffffff;border-radius:12px;padding:8px 15px;
    display:flex;align-items:center;gap:7px;
    box-shadow:0 8px 22px rgba(15,42,80,.08);
    border:1px solid #fde68a;
    font-family:"Consolas","Microsoft YaHei",monospace;font-weight:900;font-size:20px;color:var(--ink);
  }
  html.no-flexgap .star-total > *:not(:last-child){margin-right:7px}
  .star-total .st-ico{font-size:22px}
  .star-total .st-lbl{font-size:14px;color:var(--muted);font-weight:800}

  /* ===== 显示器外壳：把练习区包成一台轻巧的桌面显示器 ===== */
  .monitor{
    position:relative;
    height:470px;height:clamp(330px,56vh,470px);
    padding:12px 12px 20px;margin:0 auto 76px;
    background:
      linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 34%),
      linear-gradient(180deg,#303b4b 0%,#151d2a 62%,#0b1220 100%);
    border:2px solid #080d16;border-radius:18px;
    box-shadow:0 16px 34px rgba(15,23,42,.24),inset 0 1px 0 rgba(255,255,255,.14);
  }
  .monitor::before{
    content:"";position:absolute;left:50%;bottom:-44px;
    width:58px;height:46px;transform:translateX(-50%);
    background:linear-gradient(180deg,#263244,#0b1220);
    clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
  }
  .monitor::after{
    content:"";position:absolute;left:50%;bottom:-58px;
    width:230px;height:15px;transform:translateX(-50%);
    background:linear-gradient(180deg,#2b374a,#0b1220);
    border-radius:999px;
    box-shadow:0 8px 16px rgba(15,23,42,.25),inset 0 1px 0 rgba(255,255,255,.13);
  }

  /* ===== 练习区（显示器里的屏幕） ===== */
  .play{
    position:relative;height:100%;
    background:#edf4fc;border-radius:10px;overflow:hidden;
    box-shadow:inset 0 0 0 1px #0b1220,0 0 0 1px rgba(255,255,255,.08);
  }
  .stage{position:absolute;top:0;right:0;bottom:0;left:0}
  .slot-grid{position:absolute;top:0;right:0;bottom:0;left:0;display:none;pointer-events:none}
  .slot-grid.show{display:block}
  .slot-cell{
    position:absolute;border:1px dashed rgba(255,255,255,.55);border-radius:10px;
    transition:background .1s ease,border-color .1s ease;
  }
  .slot-cell .slot-coord{
    position:absolute;left:5px;top:3px;font-size:10px;line-height:1;font-weight:700;
    color:rgba(255,255,255,.86);text-shadow:0 1px 2px rgba(0,0,0,.45);white-space:nowrap;
  }
  .slot-cell.hot{background:rgba(255,255,255,.2);border:2px dashed #ffffff}
  .slot-cell.hot .slot-coord{color:#ffffff}
  .wallmini{
    position:absolute;top:0;right:0;bottom:0;left:0;
    background:
      radial-gradient(circle at 78% 18%, rgba(255,255,255,.88) 0 6%, rgba(255,255,255,0) 28%),
      linear-gradient(160deg,#0b5cad 0%,#2f8fd8 52%,#a8d8ff 100%);
    transition:filter .35s ease;
  }
  .wallmini::before{
    content:"";position:absolute;top:0;right:0;bottom:0;left:0;
    background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%);
  }
  .wallmini::after{
    content:"";position:absolute;left:-12%;right:-12%;bottom:-16%;height:46%;
    border-radius:50% 50% 0 0;
    background:linear-gradient(180deg,rgba(10,58,104,.5),rgba(10,58,104,0));
  }

  /* ===== 开始页：直接铺开关卡 ===== */
  .home-hub{
    position:absolute;top:0;right:0;bottom:0;left:0;overflow:auto;
    padding:16px 18px 14px;background:linear-gradient(180deg,#f8fbff,#eef6ff);
  }
  .home-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;color:var(--ink)}
  .home-head b{font-size:18px}
  .home-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .home-card{
    position:relative;min-height:104px;border:1px solid var(--line);border-top:4px solid var(--lv,var(--blue));
    border-radius:14px;background:#ffffff;padding:12px 14px;text-align:left;cursor:pointer;
    display:flex;flex-direction:column;justify-content:center;gap:10px;color:var(--ink);font-family:inherit;
    box-shadow:0 8px 20px rgba(15,42,80,.07);
    transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;
  }
  html.no-flexgap .home-card > *:not(:last-child){margin-bottom:6px}
  .home-card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(15,42,80,.12);border-color:#bfdbfe}
  .home-card:active{transform:translateY(1px)}
  .home-card .hc-top{display:flex;align-items:center;gap:8px}
  html.no-flexgap .home-card .hc-top > *:not(:last-child){margin-right:8px}
  .home-card .hc-ico{
    width:30px;height:30px;flex-shrink:0;border-radius:9px;background:var(--blue-soft);color:var(--blue);
    display:flex;align-items:center;justify-content:center;
  }
  .home-card .hc-ico svg{width:18px;height:18px;display:block}
  .home-card .hc-name{font-size:16px;font-weight:800;line-height:1.3}
  .home-card .hc-foot{font-size:13px;font-weight:700;color:var(--muted)}
  .home-card.done{border-top-color:var(--green)}
  .home-card.done .hc-foot{color:#059669}
  .home-card.half{border-top-color:#f59e0b}
  .home-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
  html.no-flexgap .home-actions > *:not(:last-child){margin-right:10px}
  .home-actions button{border:1px solid var(--line);border-radius:10px;background:#ffffff;color:var(--muted);
    padding:8px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .home-actions .home-finale{background:#fff7d6;border-color:#fbbf24;color:#92400e}

  /* 练习区里的小图标 */
  .micons{position:absolute;top:8px;right:0;bottom:6px;left:0}
  .micon{
    position:absolute;width:92px;height:100px;border-radius:4px;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;
    cursor:pointer;border:1px solid transparent;transition:background .12s ease,border-color .12s ease;
  }
  html.no-flexgap .micon > *:not(:last-child){margin-bottom:2px}
  .micon .face{
    width:64px;height:64px;border-radius:0;background:transparent;font-size:46px;
    display:flex;align-items:center;justify-content:center;color:#ffffff;
    border:none;box-shadow:none;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));
    transition:filter .12s ease;
  }
  .micon .lbl{
    font-size:13px;font-weight:600;color:#ffffff;text-align:center;line-height:1.2;
    text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 4px rgba(0,0,0,.5);max-width:88px;word-break:break-all;
    background:transparent;border:none;border-radius:2px;padding:2px 4px;
    transition:background .12s ease,border-color .12s ease,color .12s ease;
  }
  .micon:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35)}
  .micon:hover .face{filter:drop-shadow(0 3px 4px rgba(0,0,0,.58))}
  .micon:hover .lbl{background:transparent;border-color:transparent}
  .micon.sel{background:rgba(0,120,215,.42);border-color:rgba(180,220,255,.95)}
  .micon.sel .face{border:none;box-shadow:none}
  .micon.sel .lbl{background:transparent;border:none;color:#ffffff}
  .micon.dragging{opacity:.62}
  .micon.folderTarget{border-color:#ffd166;background:rgba(255,209,102,.25);box-shadow:inset 0 0 0 2px rgba(255,209,102,.35)}
  .micon.hintring{animation:pulse 1.4s ease-in-out infinite;border-radius:6px}
  .mhid.found{border-color:var(--green) !important;box-shadow:0 0 0 3px rgba(78,230,168,.28),0 0 24px rgba(78,230,168,.35) !important}

  /* 练习区里的小窗口：轻量、清晰的电脑窗口 */
  .mwins{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
  .mwin{
    position:absolute;pointer-events:auto;background:#ffffff;border-radius:10px;overflow:hidden;
    border:1px solid #dbe4f0;box-shadow:0 14px 32px rgba(15,42,80,.14);
    display:flex;flex-direction:column;transition:opacity .16s ease,transform .16s ease;
  }
  .mwin.min{opacity:0;transform:scale(.72) translateY(12px);pointer-events:none}
  .mwin .tbar{
    height:38px;flex-shrink:0;background:#f1f5f9;border-bottom:1px solid #e2e8f0;
    display:flex;align-items:center;gap:8px;padding:0 5px 0 10px;cursor:grab;touch-action:none;
    color:#334155;
  }
  html.no-flexgap .mwin .tbar > *:not(:last-child){margin-right:8px}
  .mwin .tbar.grabbing{cursor:grabbing}
  .mwin .tbar .wico{font-size:17px}
  .mwin .tbar .wtxt{flex:1;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#334155}
  .mwin .wbtns{display:flex;gap:4px}
  html.no-flexgap .mwin .wbtns > *:not(:last-child){margin-right:4px}
  .mwin .wb{
    width:30px;height:30px;border:1px solid #e2e8f0;border-radius:9px;background:#ffffff;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:800;color:#64748b;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 5px rgba(15,42,80,.05);
    transition:transform .1s ease,background .1s ease,border-color .1s ease,color .1s ease;
  }
  .mwin .wb:hover{background:#eff6ff;border-color:#bfdbfe;color:var(--blue)}
  .mwin .wb:active{transform:scale(.96)}
  .mwin .wb.cls:hover{background:#fee2e2;border-color:#fecaca;color:#dc2626}
  .mwin .wbody{flex:1;overflow:auto;padding:12px 14px;font-size:15px;line-height:1.85;color:#334155;background:#ffffff}
  .mwin.active{border-color:var(--blue);box-shadow:0 16px 34px rgba(37,99,235,.16)}
  .mwin.hintring{animation:pulse 1.4s ease-in-out infinite}
  .mtask.hide{display:none}

  /* 练习区里的右键菜单 */
  .mmenu{
    position:absolute;z-index:60;display:none;min-width:184px;background:#ffffff;
    border-radius:10px;padding:5px;box-shadow:0 14px 32px rgba(15,42,80,.16);
    border:1px solid var(--line);
  }
  .mmenu.show{display:block;animation:popin .12s ease}
  .mmenu .mi{
    display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:7px;
    font-size:15px;font-weight:700;cursor:pointer;color:#334155;
  }
  html.no-flexgap .mmenu .mi > *:not(:last-child){margin-right:9px}
  .mmenu .mi:hover{background:var(--blue-soft);color:var(--blue-dark)}
  .mmenu .mi .ic{
    width:28px;height:28px;flex-shrink:0;border-radius:8px;background:#f1f5f9;
    display:flex;align-items:center;justify-content:center;font-size:16px;color:#475569;
    transition:background .12s ease,color .12s ease;
  }
  .mmenu .mi:hover .ic{background:#dbeafe;color:var(--blue)}

  /* 练习区里的开始菜单 */
  .mstart{
    position:absolute;z-index:55;left:8px;bottom:42px;width:270px;display:none;
    background:#ffffff;border-radius:10px;border:1px solid var(--line);
    box-shadow:0 16px 34px rgba(15,42,80,.16);overflow:hidden;
  }
  .mstart.show{display:block;animation:popin .14s ease}
  .mstart .sm-head{padding:9px 13px 7px;font-size:13px;font-weight:800;color:var(--muted);background:#f8fafc;border-bottom:1px solid var(--line)}
  .mstart .sm-list{max-height:196px;overflow:auto;padding:0 5px 8px}
  .mstart .app{
    display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;
    font-size:15px;font-weight:700;cursor:pointer;color:#334155;
  }
  html.no-flexgap .mstart .app > *:not(:last-child){margin-right:10px}
  .mstart .app:hover{background:var(--blue-soft);color:var(--blue-dark)}
  .mstart .app .face{
    width:28px;height:28px;flex-shrink:0;border-radius:8px;background:#f1f5f9;
    display:flex;align-items:center;justify-content:center;font-size:17px;
    transition:background .12s ease;
  }
  .mstart .app:hover .face{background:#dbeafe}

  /* 练习区里的小任务栏 */
  .mtask{
    position:absolute;left:0;right:0;bottom:0;height:38px;z-index:50;
    background:rgba(255,255,255,.96);border-top:1px solid var(--line);
    display:flex;align-items:center;gap:8px;padding:0 8px;color:#334155;
    box-shadow:0 -4px 14px rgba(15,42,80,.06);
  }
  html.no-flexgap .mtask > *:not(:last-child){margin-right:8px}
  .mtask .mtbtn{
    border:1px solid #e2e8f0;font-family:inherit;cursor:pointer;color:#475569;background:#ffffff;
    border-radius:9px;padding:5px 11px;font-size:14px;font-weight:700;
    display:flex;align-items:center;gap:6px;min-height:28px;
    box-shadow:0 2px 5px rgba(15,42,80,.04);
    transition:transform .1s ease,background .1s ease,border-color .1s ease,color .1s ease;
  }

<script>
/* ===== 防误触兜底 =====
   1) 右键菜单：本页要练右键，系统菜单会挡住画面，所以全局取消默认菜单，
      只调 preventDefault、绝不 stopPropagation，页内自己画的菜单照常工作。
      输入框除外。2) 拖拽：防止图标/文字被浏览器拖走；页内拖动都走 pointer 事件，
      不受影响。3) 防误退：压两层 history 哨兵，右键拖动手势和误按后退键都不会
      把学生带走。本页不使用 hash / history 导航。 */
(function () {
  function keepNative(el) {
    return !!(el && el.closest &&
      el.closest('input, textarea, [contenteditable]:not([contenteditable="false"])'));
  }
  document.addEventListener('contextmenu', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();                    /* 只取消默认菜单，不阻断页内逻辑 */
  }, true);
  document.addEventListener('dragstart', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();
  }, true);

  if (location.protocol === 'file:') return;      /* file:// 下浏览器禁止 pushState */
  function guard() {
    try { history.pushState({ mtSentinel: 1 }, '', location.href); } catch (e) {}
  }
  try {
    guard(); guard();
    window.addEventListener('popstate', guard);
  } catch (e) {}
})();
</script>
<script>
/* ===== 兼容层 A：flex gap 能力探测 =====
   老内核（Edge 84 以前、EdgeHTML）的 flex 布局不支持 gap，间距会全部塌掉。
   这里用真实布局量一次宽度来判断，不支持就给 <html> 挂上 no-flexgap。 */
(function () {
  try {
    var box = document.createElement('div');
    box.style.cssText = 'position:absolute;top:-9999px;left:-9999px;display:flex;gap:10px;width:auto;height:1px';
    var a = document.createElement('i');
    var b = document.createElement('i');
    a.style.cssText = b.style.cssText = 'display:block;width:10px;height:1px';
    box.appendChild(a); box.appendChild(b);
    document.documentElement.appendChild(box);
    var w = box.getBoundingClientRect().width || box.scrollWidth;
    document.documentElement.removeChild(box);
    if (!(w >= 30)) document.documentElement.className += ' no-flexgap';
  } catch (e) {}
})();
</script>
<script>
/* ===== 打开后尽量全屏 =====
   浏览器只允许在用户操作里进入全屏：打开时先尝试一次；
   如果被拦下，学生第一次点页面或按键盘时自动进入全屏。 */
(function () {
  var gestureDone = false;
  function removeGesture() {
    var types = ['pointerdown','mousedown','touchstart','keydown'];
    for (var i = 0; i < types.length; i++) document.removeEventListener(types[i], onGesture, true);
  }
  function requestFs() {
    if (gestureDone) return;
    gestureDone = true;
    try {
      var el = document.documentElement;
      var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (fn) {
        var p = fn.call(el);
        if (p && p.catch) p.catch(function () {});
      }
    } catch (e) {}
    removeGesture();
  }
  function onGesture() { requestFs(); }
  function armGesture() {
    var types = ['pointerdown','mousedown','touchstart','keydown'];
    for (var i = 0; i < types.length; i++) document.addEventListener(types[i], onGesture, true);
  }
  function autoTry() {
    try {
      var el = document.documentElement;
      var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (fn) {
        var p = fn.call(el);
        if (p && p.catch) p.catch(function () {});
      }
    } catch (e) {}
  }
  armGesture();
  window.addEventListener('load', autoTry);
})();
</script>

  const phaseEl=$('#phase'), stepbar=$('#stepbar'), ctrlrow=$('#ctrlrow');
  const overlay=$('#overlay');

  /* ================= 通用小工具 ================= */
  function el(tag,cls,html){
    const e=document.createElement(tag);
    if(cls) e.className=cls;
    if(html!=null) e.innerHTML=html;
    return e;
  }
  function say(html,shake){
    bubble.innerHTML='<div class="bubble-inner">'+html+'</div>';
    if(shake){ bubble.classList.remove('shake'); void bubble.offsetWidth; bubble.classList.add('shake'); }
  }
  let sayTimer=null;
  function saySoon(html,ms){
    clearTimeout(sayTimer);

  }
  function flashTxt(){}
  let timers=[];
  function T(ms,fn){ timers.push(setTimeout(fn,ms)); }
  function clearTimers(){ while(timers.length) clearTimeout(timers.pop()); clearTimeout(sayTimer); }
  let handlers=[];
  function on(target,type,fn,opt){
    target.addEventListener(type,fn,opt||false);
    handlers.push(function(){ target.removeEventListener(type,fn,opt||false); });
  }
  function clearHandlers(){ while(handlers.length) handlers.pop()(); }
  function centerOf(node){
    const r=node.getBoundingClientRect();
    return {x:r.left+r.width/2, y:r.top+r.height/2};
  }
  function rectOf(node){ const r=node.getBoundingClientRect(); return {x:r.left,y:r.top,w:r.width,h:r.height}; }
  function flash(node,cls){ if(!node) return; node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
  function uiScale(){ return window.innerWidth>=1900?1.3:(window.innerWidth>=1500?1.15:1); }
  function setStars(done,total){
    starsEl.innerHTML='';

  function confetti(){
    const colors=['#ff6fa5','#ffd23f','#43a3ff','#4ed47e','#a577ff','#43d2e8'];

  function showModal(moji,title,text,mstarStr){

  /* ================= 练习区尺寸 ================= */
  const UI_SCALE=window.innerWidth>=1900?1.3:(window.innerWidth>=1500?1.15:1);
  const PAD=Math.round(12*UI_SCALE), CELL_W=Math.round(100*UI_SCALE), CELL_H=Math.round(106*UI_SCALE);
  const COLS=8, ROWS=4, BAR=Math.round(38*UI_SCALE);
  function pW(){ return play.clientWidth; }
  function pH(){ return play.clientHeight; }
  function barOn(){ return !!(S.scene&&S.scene.bar); }
  function barH(){ return barOn()?BAR:0; }
  function workH(){ return pH()-barH(); }
  function slotPos(col,row){ return {x:PAD+col*CELL_W, y:PAD+row*CELL_H}; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  /* ================= 状态 ================= */
  const S={ icons:[], wins:[], sel:null, selSeen:{}, inFolder:{}, seqStep:0, flags:{},

    cn:   {label:'语文作业', emoji:'📖',  body:'<p>今天的作业：</p><p>1. 读课文三遍<br>2. 抄写生字</p>'},
    folder:{label:'作业',    emoji:'📁',  folder:true}

  const START_APPS=[['calc','计算器','🧮'],['draw','画图','🎨'],['photo','照片','🖼'],['essay','作文','📝'],
                    ['music','音乐','🎵'],['pc','我的电脑','🖥'],['bin','回收站','🗑'],['note','记事本','📒'],

  const SCROLL_ESSAY=
    '<h3 style="margin:0 0 8px">我的周末</h3>'
    +'<p>星期六早上，我七点就起床了。</p>'

    +'<p id="mk-end" style="background:#e3f2fd;padding:5px 9px;border-radius:6px"><b>最后一行：我的作业编号是 2026</b></p>'

  /* ================= 搭场景（每次只放这一关要用的东西） ================= */
  function buildScene(cfg){
    clearHandlers();
    play.innerHTML='';
    S.icons=[]; S.wins=[]; S.sel=null; S.selSeen={}; S.inFolder={}; S.seqStep=0; S.flags={};
    S.zTop=20; S.active=null; S.done=false; S.found=false; S.hid=null; S.menu=null; S.start=null;
    S.ready=false; S.grid=null;
    folderSeq=0;                       /* 每一关新建的文件夹都从 1 号开始 */
    const scene=cfg.scene||{};
    S.scene=scene;
    const st=el('div','stage');
    play.appendChild(st); S.stage=st;
    st.appendChild(el('div','wallmini'));
    const grid=el('div','slot-grid');
    for(let row=0;row<ROWS;row++){
      for(let col=0;col<COLS;col++){
        const cell=el('div','slot-cell','<span class="slot-coord">第'+(col+1)+'列 第'+(row+1)+'行</span>');
        const p=slotPos(col,row);
        cell.style.left=p.x+'px'; cell.style.top=p.y+'px';
        cell.style.width=CELL_W+'px'; cell.style.height=CELL_H+'px';
        grid.appendChild(cell);
      }
    }
    st.appendChild(grid); S.grid=grid;
    const layer=el('div','micons'); st.appendChild(layer); S.layer=layer;
    const wl=el('div','mwins'); st.appendChild(wl); S.winLayer=wl;
    if(scene.hid){
      const h=el('div','mhid','<span class="face">'+scene.hid.emoji+'</span>');
      h.style.cssText='position:absolute;z-index:2;width:'+(scene.hid.size||86)+'px;height:'+(scene.hid.size||86)+'px;'
        +'border-radius:14px;background:#fff;border:4px dashed #cfd8ef;display:flex;align-items:center;justify-content:center;'
        +'font-size:'+Math.round((scene.hid.size||86)*0.5)+'px;box-shadow:0 6px 14px rgba(15,25,45,.2)';
      st.appendChild(h); S.hid=h;
      S.hidAt=scene.hid.at||[0.72,0.5];
      on(h,'click',function(){ if(S.found){ S.flags.hidclick=true; checkGoal(); } });
    }
    const m=el('div','mmenu'); st.appendChild(m); S.menu=m;
    const sm=el('div','mstart');
    sm.innerHTML='<div class="sm-head">所有应用（滚轮往下滑）</div><div class="sm-list"></div>';
    st.appendChild(sm); S.start=sm;
    const info=el('div','minfo'); st.appendChild(info); S.info=info;
    /* 任务栏一直建好，按需要显示/隐藏（这样后开的窗口也能触发判定） */
    const tb=el('div','mtask hide');
    tb.innerHTML='<button class="mtbtn start"><span>⊞</span>开始</button><div class="mtlist"></div>'
      +'<div class="mtclock">'+clockText()+'</div>';
    st.appendChild(tb); S.taskbar=tb;
    (scene.i||[]).forEach(function(it){
      const id=it[0], src=APPS[id];
      S.icons.push({id:id,label:src.label,emoji:src.emoji,folder:!!src.folder,app:id,col:it[1],row:it[2]});
    });
    (scene.w||[]).forEach(function(spec){ makeWindow(spec,true); });
    const actWin=(scene.w||[]).filter(function(s){ return s.active; })[0];
    if(actWin){ const aw=winById(actWin.id); if(aw) activate(aw,true); }
    layout();
    renderIcons(); renderTaskbar();
    if(S.taskbar){
      on(S.taskbar.querySelector('.mtbtn.start'),'click',function(){
        if(S.start.classList.contains('show')) closeStart(); else openStart();
      });
    }
    on(play,'click',function(e){
      if(e.target.closest('.micon')||e.target.closest('.mwin')||e.target.closest('.mmenu')
         ||e.target.closest('.mstart')||e.target.closest('.mtask')) return;
      closeMenu(); closeStart();
      if(S.sel) selectIcon(null);
    });
    on(play,'contextmenu',function(e){
      if(e.target.closest('input,textarea')) return;
      if(e.target.closest('.mwin')||e.target.closest('.mtask')) return;
      const ic=e.target.closest('.micon');
      const pr=play.getBoundingClientRect();
      const x=e.clientX-pr.left, y=e.clientY-pr.top;
      if(ic){ selectIcon(ic.dataset.id); openMenu(x,y,'icon',ic.dataset.id); }
      else if(!e.target.closest('.mmenu')&&!e.target.closest('.mstart')){ openMenu(x,y,'desk'); }
    });
    if(scene.start) openStart();
  }
  function clockText(){
    const d=new Date();
    return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  }
  function layout(){
    if(!S.layer) return;
    S.icons.forEach(function(ic){
      const n=iconEl(ic.id); if(!n) return;
      const p=slotPos(ic.col,ic.row);
      n.style.left=p.x+'px'; n.style.top=p.y+'px';
    });
    S.wins.forEach(function(w){
      if(w.snap) { setRect(w,snapRect(w.snap)); return; }
      placeWindow(w);
    });
    if(S.hid){
      const p=slotPos(0,0);
      const hx=clamp(S.hidAt[0]*(pW()-S.hid.offsetWidth),10,pW()-S.hid.offsetWidth-10);
      const hy=clamp(S.hidAt[1]*(workH()-S.hid.offsetHeight),8,Math.max(8,workH()-S.hid.offsetHeight-8));
      S.hid.style.left=Math.round(hx)+'px'; S.hid.style.top=Math.round(hy)+'px';
    }
  }
  /* 给窗口定一个能看见的初始位置（后开的窗口也要有） */
  function placeWindow(w){
    const size=w.spec.size||[520,320];
    const s=uiScale();
    const wide=clamp(Math.round(size[0]*s),280,pW()-24), high=clamp(Math.round(size[1]*s),180,workH()-30);
    const at=w.spec.at||[0.5,0.4];
    const x=clamp(at[0]*(pW()-wide),10,Math.max(10,pW()-wide-10));
    const y=clamp(at[1]*(workH()-high),8,Math.max(8,workH()-high-8));
    setRect(w,{x:x,y:y,w:wide,h:high});
  }

  /* ================= 桌面图标 ================= */
  function iconEl(id){
    if(!S.layer) return null;
    const list=S.layer.querySelectorAll('.micon');
    for(let i=0;i<list.length;i++){ if(list[i].dataset.id===id) return list[i]; }
    return null;
  }
  function iconById(id){ for(let i=0;i<S.icons.length;i++){ if(S.icons[i].id===id) return S.icons[i]; } return null; }
  function renderIcons(){
    if(!S.layer) return;
    S.layer.innerHTML='';
    S.icons.forEach(function(ic){
      if(ic.hidden||S.inFolder[ic.id]) return;
      const n=el('div','micon','<span class="face">'+ic.emoji+'</span><span class="lbl">'+ic.label+'</span>');
      n.dataset.id=ic.id;
      const p=slotPos(ic.col,ic.row);
      n.style.left=p.x+'px'; n.style.top=p.y+'px';
      if(S.sel===ic.id) n.classList.add('sel');
      S.layer.appendChild(n);
      bindIcon(n,ic.id);
    });
  }
  function bindIcon(node,id){
    on(node,'click',function(){ selectIcon(id); });
    on(node,'dblclick',function(){ openIcon(id); });
    on(node,'contextmenu',function(e){
      if(e.target.closest('input,textarea')) return;
      e.preventDefault();
      selectIcon(id);
      const pr=play.getBoundingClientRect();
      openMenu(e.clientX-pr.left, e.clientY-pr.top, 'icon', id);
    });
    on(node,'pointerdown',function(e){ iconDragStart(e,id); });
  }
  function showInfo(html){
    if(!S.info) return;
    S.info.innerHTML=html;
    S.info.classList.add('show');
    clearTimeout(showInfo._t);
    showInfo._t=setTimeout(function(){ S.info.classList.remove('show'); },3600);
  }
  function selectIcon(id){
    S.sel=id;
    renderIcons();
    if(id){
      const ic=iconById(id);
      S.selSeen[id]=true;
      if(L===0&&RI===4) showInfo('已选中：<b>'+ic.label+'</b>　再点另一个图标，选中会切换');
      else if(L===0) showInfo('已选中：<b>'+ic.label+'</b>');
      else showInfo('已选中：<b>'+ic.label+'</b>　双击可以打开');
    } else showInfo('已取消选中');
    checkGoal();
  }
  function freeSlot(col,row){
    return !S.icons.some(function(ic){
      return !ic.hidden && !S.inFolder[ic.id] && ic.col===col && ic.row===row;
    });
  }
  function nearestSlot(x,y){
    let best=null, bestD=1e9;
    for(let row=0;row<4;row++){
      for(let col=0;col<COLS;col++){
        if(!freeSlot(col,row)) continue;
        const p=slotPos(col,row);
        const d=Math.abs(p.x-x)+Math.abs(p.y-y);
        if(d<bestD){ bestD=d; best={col:col,row:row}; }
      }
    }
    return best||{col:0,row:0};
  }
  let iconDrag=null;
  function iconDragStart(e,id){
    if(e.button!==0) return;
    stopDemo(); closeMenu(); closeStart();
    const node=iconEl(id); if(!node) return;
    const r=rectOf(node);
    iconDrag={id:id,node:node,id0:e.pointerId,dx:e.clientX-r.x,dy:e.clientY-r.y,
      startX:e.clientX,startY:e.clientY,moved:false};
    document.addEventListener('pointermove',iconDragMove);
    document.addEventListener('pointerup',iconDragEnd);
    document.addEventListener('pointercancel',iconDragEnd);
  }
  function iconDragMove(e){
    if(!iconDrag||e.pointerId!==iconDrag.id0) return;
    const lr=S.layer.getBoundingClientRect();
    const x=e.clientX-iconDrag.dx-lr.left, y=e.clientY-iconDrag.dy-lr.top;
    if(!iconDrag.moved && Math.hypot(e.clientX-iconDrag.startX,e.clientY-iconDrag.startY)>10){
      clearTag();
      if(S.grid) S.grid.classList.add('show');
      iconDrag.moved=true;
      iconDrag.node.classList.add('dragging');
      iconDrag.node.classList.remove('sel');
    }
    if(!iconDrag.moved) return;  /* 轻微抖动仍是单击，图标也不提前移位 */
    e.preventDefault();
    iconDrag.node.style.left=Math.round(x)+'px';
    iconDrag.node.style.top=Math.round(y)+'px';
    if(S.grid){
      const cx=x+iconDrag.node.offsetWidth/2, cy=y+iconDrag.node.offsetHeight/2;
      const col=clamp(Math.floor((cx-PAD)/CELL_W),0,COLS-1);
      const row=clamp(Math.floor((cy-PAD)/CELL_H),0,ROWS-1);
      const cells=S.grid.children;
      for(let i=0;i<cells.length;i++) cells[i].classList.remove('hot');
      if(cells[row*COLS+col]) cells[row*COLS+col].classList.add('hot');
    }
    const f=folderUnder(e.clientX,e.clientY,iconDrag.node);
    S.layer.querySelectorAll('.micon').forEach(function(n){
      n.classList.toggle('folderTarget', !!f && f===n);
    });
  }
  function folderUnder(cx,cy,skip){
    const list=S.layer.querySelectorAll('.micon');
    for(let i=0;i<list.length;i++){
      const n=list[i];
      if(skip&&n===skip) continue;
      const ic=iconById(n.dataset.id);
      if(!ic||!ic.folder) continue;
      const r=n.getBoundingClientRect();
      if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom) return n;
    }
    return null;
  }
  function iconDragEnd(e){
    if(!iconDrag||e.pointerId!==iconDrag.id0) return;
    document.removeEventListener('pointermove',iconDragMove);
    document.removeEventListener('pointerup',iconDragEnd);
    document.removeEventListener('pointercancel',iconDragEnd);
    if(S.grid){
      S.grid.classList.remove('show');
      const cells=S.grid.children;
      for(let i=0;i<cells.length;i++) cells[i].classList.remove('hot');
    }
    const d=iconDrag; iconDrag=null;
    d.node.classList.remove('dragging');
    S.layer.querySelectorAll('.folderTarget').forEach(function(n){ n.classList.remove('folderTarget'); });
    if(!d.moved){ checkGoal(); return; }  /* 没拖动，选中交给 click 事件 */
    const ic=iconById(d.id);
    const f=folderUnder(e.clientX,e.clientY,d.node);  /* 松手时也跳过自己，文件夹不能装进自己 */
    if(f){
      S.inFolder[d.id]=f.dataset.id;
      if(S.sel===d.id) S.sel=null;
      renderIcons();
      showInfo('「'+ic.label+'」放进「'+iconById(f.dataset.id).label+'」里了');
      checkGoal();
      return;
    }
    if(S.inFolder[d.id]) delete S.inFolder[d.id];
    const p=nearestSlot(parseFloat(d.node.style.left||0),parseFloat(d.node.style.top||0));
    ic.col=p.col; ic.row=p.row;
    renderIcons();
    checkGoal();
  }
  function openIcon(id){
    const ic=iconById(id);
    if(!ic) return;
    if(ic.folder){
      const inside=S.icons.filter(function(x){ return S.inFolder[x.id]===ic.id; });
      makeWindow({id:'win-folder-'+ic.id,title:ic.label,icon:'📁',
        html:inside.length?('<p>里面有 '+inside.length+' 个东西：</p><p>'+inside.map(function(x){return x.emoji+' '+x.label;}).join('<br>')+'</p>')
                         :'<p>这个文件夹是空的。</p><p>把图标拖进来试试。</p>',
        size:[420,280]});
      return;
    }
    const ex=winById('win-'+ic.id);
    if(ex){ activate(ex); return; }
    const app=APPS[ic.app||ic.id]||{};
    makeWindow({id:'win-'+ic.id,title:ic.label,icon:ic.emoji,essay:!!app.scroll,
      html:app.body||'<p>这里还没有内容。</p>',size:[520,330]});
  }

  /* ================= 窗口 ================= */
  let winSeq=1;
  function winById(id){ for(let i=0;i<S.wins.length;i++){ if(S.wins[i].id===id) return S.wins[i]; } return null; }
  function setRect(w,r){
    w.rect={x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.w),h:Math.round(r.h)};
    w.el.style.left=w.rect.x+'px'; w.el.style.top=w.rect.y+'px';
    w.el.style.width=w.rect.w+'px'; w.el.style.height=w.rect.h+'px';
  }
  function makeWindow(spec,initial){
    const w={spec:spec, id:spec.id||('w'+(winSeq++)), snap:spec.snap||null,
             state:spec.min?'min':'normal', rect:null, el:null};
    const node=el('div','mwin');
    node.dataset.win=w.id;
    node.innerHTML='<div class="tbar"><span class="wico">'+(spec.icon||'🪟')+'</span>'
      +'<span class="wtxt">'+spec.title+'</span>'
      +'<span class="wbtns"><button class="wb min" title="最小化">—</button>'
      +'<button class="wb max" title="最大化">□</button>'
      +'<button class="wb cls" title="关闭">✕</button></span></div>'
      +'<div class="wbody">'+(spec.essay?SCROLL_ESSAY:(spec.html||''))+'</div>';
    S.winLayer.appendChild(node);
    w.el=node;
    S.wins.push(w);
    on(node,'pointerdown',function(){ if(S.active!==w.id) activate(w); });
    on(node.querySelector('.wb.min'),'click',function(){ minimize(w); });
    on(node.querySelector('.wb.max'),'click',function(){ toggleMax(w); });
    on(node.querySelector('.wb.cls'),'click',function(){ closeWindow(w); });
    on(node.querySelector('.tbar'),'dblclick',function(){ toggleMax(w); });
    on(node.querySelector('.tbar'),'pointerdown',function(ev){ winDragStart(ev,w); });
    on(node.querySelector('.wbody'),'scroll',function(){ checkGoal(); });
    if(w.state==='min') node.classList.add('min');
    if(w.snap){ renderTaskbar(); }
    renderTaskbar();
    placeWindow(w);                     /* 后开的窗口也要有位置，不然拖不动 */
    activate(w,true);                   /* 新开的窗口一定在最前面（否则会被旧窗口压住） */
    return w;
  }
  function activate(w,silent){
    if(!w) return;
    if(w.state==='min'){ w.state='normal'; w.el.classList.remove('min'); }
    S.active=w.id;
    S.wins.forEach(function(x){
      x.el.classList.toggle('active',x.id===w.id);

  function renderTaskbar(){

  function minimize(w){

  function toggleMax(w){
    if(w.snap){ if(w.restore) setRect(w,w.restore); w.snap=null; w.el.querySelector('.wb.max').textContent='□'; }
    else { w.restore=w.rect; setRect(w,snapRect('max')); w.snap='max'; w.el.querySelector('.wb.max').textContent='❐'; }
    w.state='normal'; w.el.classList.remove('min');
    activate(w);
  }
  function snapRect(zone){
    const W=pW(), H=workH(), w2=Math.round(W/2), h2=Math.round(H/2);
    if(zone==='max')  return {x:0,y:0,w:W,h:H};
    if(zone==='left') return {x:0,y:0,w:w2,h:H};
    if(zone==='right')return {x:W-w2,y:0,w:w2,h:H};
    if(zone==='tl')   return {x:0,y:0,w:w2,h:h2};
    if(zone==='tr')   return {x:W-w2,y:0,w:w2,h:h2};
    if(zone==='bl')   return {x:0,y:H-h2,w:w2,h:h2};
    if(zone==='br')   return {x:W-w2,y:H-h2,w:w2,h:h2};
  }
  function snapZoneAt(x,y){
    const W=pW(), H=workH(), ex=40, ey=40;
    const nl=x<ex, nr=x>W-ex, nt=y<ey, nb=y>H-ey;
    if(nt&&!nl&&!nr) return 'max';
    if(nl&&nt) return 'tl';
    if(nl&&nb) return 'bl';
    if(nr&&nt) return 'tr';
    if(nr&&nb) return 'br';
    if(nl) return 'left';
    if(nr) return 'right';
    return null;
  }
  let snapView=null;
  function showSnapView(zone){
    if(!snapView){ snapView=el('div'); snapView.style.cssText='position:absolute;z-index:15;pointer-events:none;'
      +'background:rgba(96,166,255,.32);border:3px solid #bfe0ff;border-radius:9px;display:none'; play.appendChild(snapView); }
    if(!zone){ snapView.style.display='none'; return; }
    const r=snapRect(zone);
    snapView.style.display='block';
    snapView.style.left=r.x+'px'; snapView.style.top=r.y+'px';
    snapView.style.width=r.w+'px'; snapView.style.height=r.h+'px';
  }
  let winDrag=null;
  function winDragStart(ev,w){
    if(ev.button!==0) return;
    if(ev.target.closest&&ev.target.closest('.wb')) return;
    stopDemo(); closeMenu(); closeStart();
    const r=rectOf(w.el);
    winDrag={w:w,id:ev.pointerId,dx:ev.clientX-r.x,dy:ev.clientY-r.y,zone:null,moved:false};
    activate(w,true);
    w.el.querySelector('.tbar').classList.add('grabbing');
    document.addEventListener('pointermove',winDragMove);
    document.addEventListener('pointerup',winDragEnd);
    document.addEventListener('pointercancel',winDragEnd);
  }
  function winDragMove(ev){
    if(!winDrag||ev.pointerId!==winDrag.id) return;
    ev.preventDefault();
    const w=winDrag.w;
    if(w.snap){
      const before=w.restore||{w:420,h:280};
      const pr=play.getBoundingClientRect();
      const rx=(ev.clientX-pr.left)/(w.rect.w||1);
      setRect(w,{w:before.w,h:before.h,x:ev.clientX-pr.left-before.w*rx,y:ev.clientY-pr.top-19});
      w.snap=null;
      w.el.querySelector('.wb.max').textContent='□';
      winDrag.dx=ev.clientX-(pr.left+w.rect.x); winDrag.dy=19;
    }
    const pr=play.getBoundingClientRect();
    let x=ev.clientX-pr.left-winDrag.dx;
    let y=ev.clientY-pr.top-winDrag.dy;
    x=clamp(x,-w.rect.w+80,pW()-80);
    y=clamp(y,-6,workH()-20);
    w.el.style.left=Math.round(x)+'px'; w.el.style.top=Math.round(y)+'px';
    w.rect.x=Math.round(x); w.rect.y=Math.round(y);
    winDrag.moved=true;
    const zone=snapZoneAt(ev.clientX-pr.left,ev.clientY-pr.top);
    if(zone!==winDrag.zone){ winDrag.zone=zone; showSnapView(zone); }
  }
  function winDragEnd(ev){
    if(!winDrag||ev.pointerId!==winDrag.id) return;
    document.removeEventListener('pointermove',winDragMove);
    document.removeEventListener('pointerup',winDragEnd);
    document.removeEventListener('pointercancel',winDragEnd);
    const w=winDrag.w, zone=winDrag.zone, moved=winDrag.moved;
    w.el.querySelector('.tbar').classList.remove('grabbing');
    winDrag=null;
    showSnapView(null);
    if(zone){ w.restore=w.restore||w.rect; setRect(w,snapRect(zone)); w.snap=zone;
              w.el.querySelector('.wb.max').textContent=(zone==='max')?'❐':'□'; }
    else if(moved) S.flags['move:'+w.id]=true;
    checkGoal();
  }

  function iconNeeded(id){

      if(g.k==='selAll'&&g.ids&&g.ids.indexOf(id)>=0) need=true;
      if(g.k==='folder'&&(g.icon===id||g.folder===id)) need=true;
      if(g.k==='slots') g.list.forEach(function(x){ if(x.id===id) need=true; });
      if(g.k==='slotsAny'&&g.ids.indexOf(id)>=0) need=true;
      if(g.k==='ctx'&&g.on==='icon'&&g.id===id) need=true;
      if((g.k==='winOpen'||g.k==='winClosed'||g.k==='state'||g.k==='snap'||g.k==='active')
         && g.id&&g.id.indexOf('win-')===0&&g.id.slice(4)===id) need=true;
      if(g.k==='seq') g.steps.forEach(walk);
    })(r.goal);

  /* ================= 目标判定 ================= */
  function visFrac(){
    if(!S.hid) return 0;
    const h=S.hid.getBoundingClientRect();
    const area=Math.max(1,h.width*h.height);
    let cover=0;
    S.wins.forEach(function(w){
      if(w.state==='min') return;
      const r=w.el.getBoundingClientRect();
      const ix=Math.max(0,Math.min(h.right,r.right)-Math.max(h.left,r.left));
      const iy=Math.max(0,Math.min(h.bottom,r.bottom)-Math.max(h.top,r.top));
      cover=Math.max(cover,ix*iy);
    });
    return 1-cover/area;
  }
  function tickHid(){
    if(!S.hid||S.found) return;
    const r=S.hid.getBoundingClientRect();
    const top=document.elementFromPoint(r.left+r.width/2, r.top+r.height/2);
    const clickable=!!(top&&(top===S.hid||S.hid.contains(top)));
    if(visFrac()>=0.9&&clickable){          /* 露出来、而且点得到，才算找到 */
      S.found=true;
      S.hid.classList.add('found');
      S.hid.style.borderStyle='solid';
      S.hid.style.borderColor='#2ec77b';
      S.hid.style.cursor='pointer';
      showInfo('找到啦！点一下它');
    }
  }
  function markerVisible(winId,markerId){
    const w=winById(winId); if(!w) return false;
    const body=w.el.querySelector('.wbody'); if(!body) return false;
    const mk=body.querySelector('#'+markerId); if(!mk) return false;
    const br=body.getBoundingClientRect(), mr=mk.getBoundingClientRect();
    return mr.top>=br.top-4 && mr.bottom<=br.bottom+4;
  }
  function scrolledBottom(winId){
    const w=winById(winId); if(!w) return false;
    const b=w.el.querySelector('.wbody');
    return !!b && (b.scrollTop+b.clientHeight >= b.scrollHeight-8);
  }
  function goalMet(g){
    if(!g) return false;
    switch(g.k){
      case 'sel':     return S.sel===g.id;
      case 'seen':    return !!S.selSeen[g.id];
      case 'none':    return !S.sel;
      case 'selAll':  return g.ids.every(function(id){ return !!S.selSeen[id]; });
      case 'seq': {
        let st=S.seqStep||0;
        while(st<g.steps.length && goalMet(g.steps[st])) st++;   /* 一次判定把能过的都过掉 */
        S.seqStep=st;
        return st>=g.steps.length;
      }
      case 'flag':    return !!S.flags[g.name];
      case 'ctx': {
        if(!S.ctxOn) return false;
        if(!g.on) return true;
        if(g.on==='desk') return S.ctxOn==='desk';
        return S.ctxOn==='icon:'+g.id;
      }
      case 'winOpen': return !!winById(g.id);
      case 'winClosed': return !winById(g.id);
      case 'allClosed': return S.wins.length===0;
      case 'allMin':  return S.wins.length>0 && S.wins.every(function(w){ return w.state==='min'; });
      case 'state':   return !!winById(g.id) && winById(g.id).state===g.value;
      case 'snap':    return !!winById(g.id) && winById(g.id).snap===g.zone;
      case 'active':  return S.active===g.id && !!winById(g.id) && winById(g.id).state!=='min';
      case 'folder': {
        if(g.folder==='anyNew'){
          const folder=iconById(S.inFolder[g.icon]);
          return !!folder && folder.folder && folder.isNew && !folder.hidden;
        }
        return S.inFolder[g.icon]===g.folder;
      }
      case 'folders': return S.icons.filter(function(i){ return i.folder&&i.isNew&&!i.hidden; }).length>=g.n;
      case 'slots':   return g.list.every(function(x){
                        const ic=iconById(x.id);
                        return ic && ic.col===x.col && ic.row===x.row; });
      case 'slotsAny': {
        const icons=g.ids.map(iconById);
        return icons.length===g.rows.length &&
          icons.every(function(ic){ return ic&&!ic.hidden&&!S.inFolder[ic.id]&&ic.col===g.col; }) &&
          g.rows.every(function(row){ return icons.some(function(ic){ return ic.row===row; }); });
      }
      case 'uncover': return visFrac()>=0.9;
      case 'marker':  return markerVisible(g.win,g.marker);
      case 'bottom':  return scrolledBottom(g.win);
      default: return false;
    }
  }
  function checkGoal(){
    if(!S.stage||!S.ready) return;

    refreshTag();
  }

  /* ================= 演示已取消：以下函数保留但不再调用 ================= */
  let demoOn=false, demoTimers=[];
  function DT(ms,fn){ demoTimers.push(setTimeout(fn,ms)); }
  function ghostTo(x,y,ms){
    const g=$('#ghost'); if(!g) return;
    g.style.transition='transform '+ms+'ms cubic-bezier(.35,.05,.3,1)';
    g.style.transform='translate('+(x-3)+'px,'+(y-2)+'px)';

  function ripAt(x,y){
    const r=$('#rip'); if(!r) return;

  }
  function rip(node){ const c=centerOf(node); ripAt(c.x,c.y); }
  function stopDemo(){
    const was=demoOn;

    while(demoTimers.length) clearTimeout(demoTimers.pop());
    const g=$('#ghost'); if(g){ g.style.opacity='0'; }
    if(was&&curRound()&&curRound().revert) curRound().revert();
  }
  function runSteps(steps,done){
    let i=0;
    function next(){
      if(i>=steps.length){ if(done) done(); return; }
      const s=steps[i++];
      if(s.msg) say(s.msg);
      const node=s.at?$(s.at):null;
      const go=function(cb){
        if(node){ const c=centerOf(node); ghostTo(c.x,c.y,420); DT(470,cb); }
        else DT(60,cb);
      };
      go(function(){
        if(s.act){
          if(node) rip(node);
          if(s.act==='click'&&node) node.click();
          if(s.act==='dblclick'&&node&&node.dataset.id) openIcon(node.dataset.id);
          if(s.act==='rightclick'&&node){
            const c=centerOf(node), pr=play.getBoundingClientRect();
            if(node.dataset.id) openMenu(c.x-pr.left,c.y-pr.top,'icon',node.dataset.id);
            else openMenu(c.x-pr.left,c.y-pr.top,'desk');
          }
          if(s.act==='start') openStart();
        }
        if(s.menuItem){
          const items=S.menu.querySelectorAll('.mi');
          for(let k=0;k<items.length;k++){
            if(items[k].dataset.label===s.menuItem){ rip(items[k]); items[k].click(); break; }
          }
        }
        if(s.run){ s.run(next); return; }
        DT(s.wait||520,next);
      });
    }
    next();
  }

  function demoWinMove(id,dx,dy,next){
    const w=winById(id);
    if(!w){ if(next) next(); return; }
    const tb=w.el.querySelector('.tbar'), c=centerOf(tb);
    ghostTo(c.x,c.y,460);
    DT(520,function(){
      rip(tb);
      tb.classList.add('grabbing');
      const target={x:clamp(w.rect.x+dx,0,pW()-w.rect.w),y:clamp(w.rect.y+dy,0,workH()-w.rect.h)};
      w.el.style.transition='left .6s ease, top .6s ease';
      w.el.style.left=target.x+'px'; w.el.style.top=target.y+'px';
      ghostTo(c.x+(target.x-w.rect.x), c.y+(target.y-w.rect.y), 620);
      DT(660,function(){
        w.el.style.transition='';
        tb.classList.remove('grabbing');
        setRect(w,{x:target.x,y:target.y,w:w.rect.w,h:w.rect.h});
        S.flags['move:'+id]=true;
        say('窗口挪开了');
        DT(420,next);
      });
    });
  }

        goal:{k:'seq',steps:[{k:'folders',n:1},{k:'folder',icon:'cn',folder:'newfolder1'},
                             {k:'folder',icon:'paint',folder:'newfolder1'}]}, star:true }
     ] }
  ];

  /* ================= 每一关的流程 ================= */
  let L=0, RI=0, stars=0, TOTAL=0, mode='home';
  const cleared={}, best={}, stage={};
  const SAVE_KEY='mousecamp3.progress.v1';
  const previewFinale=/[?&]finale=1\b/.test(location.search);
  let navs=[];
  function curRound(){ const lv=LEVELS[L]; return lv&&lv.rounds[RI]; }
  function levelStars(lv){ return lv.rounds.filter(function(r){ return r.star; }).length; }
  function refreshTotal(){
    TOTAL=0;
    LEVELS.forEach(function(lv){ TOTAL+=best[lv.id]||0; });
    const n=document.getElementById('starNum');
    if(n) n.textContent=TOTAL;
  }
  function writeSave(){
    if(previewFinale) return;
    try{ localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,best:best,cleared:cleared,stage:stage,ts:Date.now()})); }
    catch(e){}
  }
  function restoreSave(){
    let d=null;
    try{ d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){}
    if(!d||d.v!==1||typeof d!=='object') return;
    LEVELS.forEach(function(lv){
      const id=lv.id, max=levelStars(lv);
      const b=d.best&&d.best[id];
      if(typeof b==='number'&&isFinite(b)) best[id]=Math.max(0,Math.min(max,Math.floor(b)));
      if(d.cleared&&d.cleared[id]===true){ cleared[id]=true; best[id]=max; return; }
      const st=d.stage&&d.stage[id];
      if(st&&typeof st.round==='number'&&typeof st.stars==='number'&&
         isFinite(st.round)&&isFinite(st.stars)){
        const round=Math.floor(st.round), stars=Math.floor(st.stars);
        if(round>0&&round<lv.rounds.length&&stars>=0&&stars<=max){
          stage[id]={round:round,stars:stars};
          best[id]=Math.max(best[id]||0,stars);
        }
      }
    });
    refreshTotal();
  }
  function clearSave(){
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    for(const k in best) delete best[k];
    for(const k in cleared) delete cleared[k];
    for(const k in stage) delete stage[k];
    refreshTotal();
  }
  function allCleared(){ return LEVELS.every(function(lv){ return !!cleared[lv.id]; }); }
  function markNav(id){
    navs.forEach(function(b){
      b.style.outline=(b.dataset.mode===id)?'3px solid #fff':'none';
      if(b.dataset.mode!=='home'&&cleared[b.dataset.mode]) b.classList.add('n-done');
      else b.classList.remove('n-done');
      b.classList.toggle('n-half',!!(stage[b.dataset.mode]&&!cleared[b.dataset.mode]));
    });
  }
  function updatePhase(){
    const r=curRound();
    if(!r){ phaseEl.className='phase'; phaseEl.textContent=''; return; }
    phaseEl.className='phase star';
    phaseEl.textContent='第 '+(RI+1)+' 次 · 计星';
  }
  function updateStepbar(){
    const r=curRound();
    stepbar.innerHTML='';
    if(!r||!r.steps) return;
    const isSeq=!!(r.goal&&r.goal.k==='seq');
    const done=isSeq?(S.seqStep||0):-1;
    r.steps.forEach(function(s,i){
      stepbar.appendChild(el('span','step'+(isSeq&&i===done?' on':'')+(isSeq&&i<done?' done':''),s));
    });
  }
  function goalSelector(g){
    if(!g) return null;
    switch(g.k){
      case 'sel': return '#play .micon[data-id="'+g.id+'"]';
      case 'seen': return '#play .micon[data-id="'+g.id+'"]';
      case 'folder': return '#play .micon[data-id="'+g.icon+'"]';
      case 'slots': return '#play .micon[data-id="'+g.list[0].id+'"]';
      case 'slotsAny': return '#play .micon[data-id="'+g.ids[0]+'"]';
      case 'uncover': return '#play .mwin .tbar';
      case 'winClosed': return '#play .mwin[data-win="'+g.id+'"] .wb.cls';
      case 'winOpen':
        if(g.id.indexOf('win-app-')===0) return '#play .mtbtn.start';
        return '#play .micon[data-id="'+g.id.slice(4)+'"]';
      case 'state': {
        const w=winById(g.id);
        if(w&&g.value==='min') return '#play .mwin[data-win="'+g.id+'"] .wb.min';
        if(w) return '#play .mwin[data-win="'+g.id+'"] .tbar';
        return '#play .micon[data-id="'+g.id.slice(4)+'"]';
      }
      case 'snap': {
        const w=winById(g.id);
        return w?'#play .mwin[data-win="'+g.id+'"] .tbar':'#play .micon[data-id="'+g.id.slice(4)+'"]';
      }
      case 'active': {
        const w=winById(g.id);
        if(w&&w.state==='min') return '#play .mtask .mtbtn[data-win="'+g.id+'"]';
        if(w) return '#play .mwin[data-win="'+g.id+'"]';
        return '#play .micon[data-id="'+g.id.slice(4)+'"]';
      }
      case 'flag':
        if(g.name==='refresh') return '#play .stage';
        if(g.name==='hidclick') return '#play .mhid';
        if(g.name.indexOf('move:')===0) return '#play .mwin .tbar';
        return null;
      case 'folders': return '#play .stage';
      case 'light': return '#play .stage';
      case 'allClosed': return S.wins.length?'#play .mwin .wb.cls':null;
      case 'allMin': return S.wins.length?'#play .mwin .wb.min':null;
      case 'seq': {
        const st=Math.min(S.seqStep||0,g.steps.length-1);
        return goalSelector(g.steps[st]);
      }
      default: return null;
    }
  }
  function tagKey(){
    const r=curRound();
    if(!r||!r.goal) return '';
    return r.goal.k==='seq'?String(S.seqStep||0):'';
  }
  function showTag(r){
    if(!r||!r.guided) return;
    if(r._tag) clearTag();
    const sel=goalSelector(r.goal);
    const node=sel?$(sel):null;
    if(!node) return;
    node.classList.add('hintring');
    const c=centerOf(node), pr=play.getBoundingClientRect();
    let g=r.goal;
    if(g.k==='seq') g=g.steps[Math.min(S.seqStep||0,g.steps.length-1)];
    let label='';
    if(g.k==='sel'||g.k==='seen'){
      const ic=iconById(g.id);
      label='单击「'+(ic?ic.label:'图标')+'」';
    } else if(g.k==='winOpen'){
      if(g.id.indexOf('win-app-')===0) label='点「开始」';
      else {
        const ic=iconById(g.id.slice(4));
        label='双击「'+(ic?ic.label:'图标')+'」';
      }
    } else if(g.k==='slots'||g.k==='slotsAny') label='按住图标拖';
    else if(g.k==='uncover'||g.k==='snap') label='按住标题栏拖';
    else if(g.k==='winClosed'||g.k==='allClosed') label='点「✕」';
    else if(g.k==='state'&&g.value==='min'||g.k==='allMin') label='点「—」';
    else if(g.k==='active'){
      const w=winById(g.id), name=w?w.spec.title:'窗口';
      label=node.classList.contains('mtbtn')?'点任务栏「'+name+'」':'点「'+name+'」窗口';
    } else if(g.k==='flag'&&g.name==='refresh') label='右键选「刷新」';
    else if(g.k==='flag'&&g.name==='hidclick') label='点露出的东西';
    else if(g.k==='folders') label='右键选「新建文件夹」';
    if(!label){ node.classList.remove('hintring'); return; }
    const tag=el('div','tag-here',label);
    play.appendChild(tag);
    const nodeTop=c.y-pr.top-node.getBoundingClientRect().height/2;
    const below=nodeTop<tag.offsetHeight;  /* 上面放不下时才移到下面 */
    tag.style.left=clamp(Math.round(c.x-pr.left-tag.offsetWidth/2),6,pW()-tag.offsetWidth-6)+'px';
    tag.style.top=clamp(below
      ? Math.round(nodeTop+node.getBoundingClientRect().height+10)
      : Math.round(nodeTop-tag.offsetHeight-10),6,workH()-30)+'px';
    r._tag={node:node,tag:tag,key:tagKey()};
  }
  function refreshTag(){
    const r=curRound();
    if(!r||!r.guided) return;
    if(r._tag&&r._tag.key===tagKey()) return;
    clearTag();
    showTag(r);
    updateStepbar();
  }
  function clearTag(){
    const r=curRound();
    if(!r||!r._tag) return;
    if(r._tag.node) r._tag.node.classList.remove('hintring');
    if(r._tag.tag&&r._tag.tag.parentNode) r._tag.tag.parentNode.removeChild(r._tag.tag);
    r._tag=null;
  }
  function showRound(){
    mode='play';
    clearTimers(); stopDemo(); hideModal();
    S.done=false;
    const lv=LEVELS[L], r=curRound();
    buildScene(r);
    ctrlrow.style.display='';
    updatePhase(); updateStepbar();
    say('<b>'+r.tip+'</b>'+(r.hint?('<br><span style="font-size:16px;font-weight:600;color:#8a8aa8">'+r.hint+'</span>'):''));
    play.dataset.level=lv.id;
    play.dataset.round=String(RI+1);
    S.ready=true;
    if(!cleared[lv.id]){
      stage[lv.id]={round:RI,stars:stars};
      writeSave();
    }
    T(300,function(){ if(!S.done) showTag(r); });
  }
  function roundDone(){
    if(S.done) return;
    S.done=true;
    clearTag();
    stars++;
    setStars(stars,levelStars(LEVELS[L]));
    const lv=LEVELS[L];
    if((best[lv.id]||0)<stars) best[lv.id]=stars;
    if(cleared[lv.id]) delete stage[lv.id];
    else if(RI+1>=lv.rounds.length){ cleared[lv.id]=true; delete stage[lv.id]; }
    else stage[lv.id]={round:RI+1,stars:stars};
    refreshTotal();
    markNav(lv.id);
    writeSave();
    confetti();
    say('太棒了！<b>得到一颗星</b> ⭐');
    T(1200,nextRound);
  }
  function nextRound(){
    RI++;
    if(RI>=LEVELS[L].rounds.length) levelDone();
    else showRound();
  }
  function showFinale(){
    clearTimers(); stopDemo(); hideModal();
    document.documentElement.style.overflow='hidden';
    const navBtns=document.querySelectorAll('#nav button');
    for(let i=0;i<navBtns.length;i++) navBtns[i].disabled=true;
    $('#certSkills').innerHTML=LEVELS.map(function(l){ return '<span>'+l.emoji+' '+l.name+'</span>'; }).join('');
    $('#certSub').innerHTML='图标、双击、右键、拖动、滚轮、窗口，你都会啦！<br>一共拿到 <b>⭐ '+TOTAL+'</b> 颗星。';
    $('#finale').classList.add('show');
    scheduleSliceGame();
    for(let i=0;i<60;i++){
      const c=el('div','cf');
      const colors=['#ffd23f','#43a3ff','#4ed47e','#ff8a65','#b39ddb','#43d2e8'];
      c.style.left=(Math.random()*100)+'vw';
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDelay=(Math.random()*.6)+'s';
      document.body.appendChild(c);
      setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); },3600);
    }
  }
  function levelDone(){
    const lv=LEVELS[L];
    cleared[lv.id]=true;
    if((best[lv.id]||0)<stars) best[lv.id]=stars;
    delete stage[lv.id];
    refreshTotal();
    writeSave();
    markNav(lv.id);
    play.dataset.round='done';
    const all=LEVELS.every(function(l){ return cleared[l.id]; });
    if(all){
      showFinale();
      return;
    }
    let nextIdx=-1;
    for(let i=0;i<LEVELS.length;i++){ if(!cleared[LEVELS[i].id]){ nextIdx=i; break; } }
    showModal('🏆','第 '+(L+1)+' 课 · 学会啦',
      lv.line+'<br>这一课拿到 ⭐ '+stars+' 颗星。',
      '⭐'.repeat(stars));
    const ok=$('#mOk');
    ok.onclick=function(){
      hideModal();
      if(nextIdx>=0) startLevel(nextIdx); else enterHome();
    };
  }
  function startLevel(i){
    mode='play';
    L=i;
    const st=cleared[LEVELS[i].id]?null:stage[LEVELS[i].id];
    RI=st?st.round:0; stars=st?st.stars:0;
    markNav(LEVELS[i].id);
    setStars(stars,levelStars(LEVELS[i]));
    ctrlrow.style.display='';
    showRound();
    if(st){
      const id=LEVELS[i].id, at=RI;
      T(1500,function(){
        if(mode==='play'&&L===i&&RI===at&&!S.done&&stage[id])
          say('接着上次继续：你已经有 '+stars+' 颗星啦 ⭐');
      });
    }
  }
  function buildHomeScene(){
    clearHandlers();

    S.icons=[]; S.wins=[]; S.sel=null; S.selSeen={}; S.inFolder={}; S.seqStep=0; S.flags={};
    S.zTop=20; S.active=null; S.done=true; S.found=false; S.hid=null; S.menu=null; S.start=null;
    S.ready=false; S.scene=null; S.layer=null; S.winLayer=null; S.info=null; S.taskbar=null; S.stage=null; S.grid=null;
    const hub=el('div','home-hub');
    hub.appendChild(el('div','home-head','<b>选择一课开始</b>'));
    const grid=el('div','home-grid');
    LEVELS.forEach(function(lv,i){
      const total=levelStars(lv), got=best[lv.id]||0, done=!!cleared[lv.id], half=stage[lv.id];
      const card=el('button','home-card'+(done?' done':(half?' half':'')),
        '<span class="hc-top"><span class="hc-ico">'+navIcon(NAV_ICON_NAMES[lv.id])+'</span>'

      on(card,'click',function(){ startLevel(i); });

    peach:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 14c-4-5-12-5-16 1-4 7 0 17 7 22 3 2 6 1 9-1 3 2 6 3 9 1 7-5 11-15 7-22-4-6-12-6-16-1Z" fill="#f9a8d4" stroke="#be185d" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 14c0-4 2-7 5-9" fill="none" stroke="#4d7c0f" stroke-width="2.5" stroke-linecap="round"/><path d="M24 14c-2-3-5-5-8-5" fill="none" stroke="#65a30d" stroke-width="2.5" stroke-linecap="round"/><path d="M18 26c4 3 8 3 12 0" fill="none" stroke="#fce7f3" stroke-width="2.5" stroke-linecap="round"/></svg>',
    pineapple:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 12c8 0 14 8 14 18s-6 13-14 13-14-3-14-13 6-18 14-18Z" fill="#facc15" stroke="#a16207" stroke-width="2.5"/><path d="M24 12c-2-5-1-8 3-10M24 12c3-4 6-5 9-4M24 12c-4-3-7-3-10 0" fill="none" stroke="#4d7c0f" stroke-width="2.5" stroke-linecap="round"/><path d="M17 22l7 5-7 5M31 22l-7 5 7 5M24 19v17" fill="none" stroke="#ca8a04" stroke-width="2" stroke-linecap="round"/></svg>',
    star:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="m24 5 5.5 11.2 12.4 1.8-9 8.8 2.1 12.4L24 33.4l-11 5.8 2.1-12.4-9-8.8 12.4-1.8Z" fill="#fbbf24" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/><path d="m24 12 3 6.1 6.7 1-4.8 4.7 1.1 6.7-6-3.2-6 3.2 1.1-6.7-4.8-4.7 6.7-1Z" fill="#fde68a"/></svg>'
  };
  function sliceIcon(name){ return SLICE_ICONS[name]||SLICE_ICONS.apple; }
  let sliceStartTimer=0, sliceCleanup=null;
  function scheduleSliceGame(){
    if(sliceStartTimer){ clearTimeout(sliceStartTimer); sliceStartTimer=0; }
    sliceStartTimer=setTimeout(function(){ sliceStartTimer=0; startSliceGame(); },1700);
  }
  function stopSliceGame(){
    if(sliceStartTimer){ clearTimeout(sliceStartTimer); sliceStartTimer=0; }
    if(sliceCleanup){ sliceCleanup(); sliceCleanup=null; }
  }
  function startSliceGame(){
    stopSliceGame();
    const area=$('#sliceArea');
    if(!area) return;
    const scoreEl=$('#sliceScore'), lvEl=$('#sliceLevel'), lvChip=$('#sliceLvChip'), tip=$('#sliceTip');
    const blade=$('#sliceBlade'), bctx=blade?blade.getContext('2d'):null;
    const FRUITS=['apple','orange','lemon','melon','strawberry','grape','banana','peach','pineapple'];
    let score=0, level=1, items=[], last=0, nextSpawn=120, raf=0, slicing=false, lastPt=null, tipTimer=0;
    let bladePoints=[], bladeW=0, bladeH=0;
    scoreEl.textContent=score; lvEl.textContent=level;
    if(tip) tipTimer=setTimeout(function(){ tip.classList.add('hide'); },5200);
    function resizeBlade(){
      if(!blade||!bctx) return;
      bladeW=area.clientWidth; bladeH=area.clientHeight;
      const dpr=Math.min(2,window.devicePixelRatio||1);
      blade.width=Math.round(bladeW*dpr); blade.height=Math.round(bladeH*dpr);
      blade.style.width=bladeW+'px'; blade.style.height=bladeH+'px';
      bctx.setTransform(dpr,0,0,dpr,0,0);
    }
    function drawBlade(now){
      if(!bctx||!blade) return;
      bctx.clearRect(0,0,bladeW,bladeH);
      if(bladePoints.length<2) return;
      const life=180;
      let write=0;
      for(let i=0;i<bladePoints.length;i++){ if(now-bladePoints[i].t<life) bladePoints[write++]=bladePoints[i]; }
      bladePoints.length=write;
      if(bladePoints.length<2) return;
      const first=bladePoints[0], lastP=bladePoints[bladePoints.length-1];
      const headFade=Math.max(0,1-(now-lastP.t)/life);
      function bladePath(){
        bctx.beginPath();
        bctx.moveTo(bladePoints[0].x,bladePoints[0].y);
        for(let i=1;i<bladePoints.length-1;i++){
          const xc=(bladePoints[i].x+bladePoints[i+1].x)/2;
          const yc=(bladePoints[i].y+bladePoints[i+1].y)/2;
          bctx.quadraticCurveTo(bladePoints[i].x,bladePoints[i].y,xc,yc);
        }
        bctx.lineTo(lastP.x,lastP.y);
      }
      const glow=bctx.createLinearGradient(first.x,first.y,lastP.x,lastP.y);
      glow.addColorStop(0,'rgba(37,99,235,0)');
      glow.addColorStop(.52,'rgba(37,99,235,'+(.3*headFade)+')');
      glow.addColorStop(1,'rgba(37,99,235,'+(.9*headFade)+')');
      const core=bctx.createLinearGradient(first.x,first.y,lastP.x,lastP.y);
      core.addColorStop(0,'rgba(255,255,255,0)');
      core.addColorStop(1,'rgba(255,255,255,'+(.95*headFade)+')');
      bctx.save();
      bctx.lineCap='round'; bctx.lineJoin='round';
      bctx.shadowColor='rgba(37,99,235,.55)'; bctx.shadowBlur=16;
      bladePath(); bctx.strokeStyle=glow; bctx.lineWidth=12; bctx.stroke();
      bctx.shadowBlur=0;
      bladePath(); bctx.strokeStyle=core; bctx.lineWidth=3.5; bctx.stroke();
      bctx.beginPath(); bctx.arc(lastP.x,lastP.y,5*headFade+1,0,Math.PI*2);
      bctx.fillStyle='rgba(255,255,255,'+(.9*headFade)+')';
      bctx.shadowColor='rgba(37,99,235,.6)'; bctx.shadowBlur=12; bctx.fill();
      bctx.restore();
    }
    function removeEl(n){ if(n&&n.parentNode) n.parentNode.removeChild(n); }
    function areaPoint(ev){
      const r=area.getBoundingClientRect();
      return {x:ev.clientX-r.left,y:ev.clientY-r.top};
    }
    function spawn(forceFruit,startY){
      const w=area.clientWidth,h=area.clientHeight;
      if(w<80||h<120) return;
      const gold=!forceFruit&&Math.random()<0.08;
      const kind=gold?'star':FRUITS[Math.floor(Math.random()*FRUITS.length)];
      const lv=level;
      const vyBoost=Math.min(1.35,1+(lv-1)*0.045);
      const gBoost=Math.min(1.95,1+(lv-1)*0.095);
      const sizeFactor=Math.max(0.78,1-(lv-1)*0.025);
      const cap=window.innerWidth>=1900?92:(window.innerWidth>=1500?80:68);
      const size=Math.round(Math.max(36,Math.min(cap,h*0.15)*sizeFactor));
      const node=document.createElement('div');
      node.className='slice-item'+(gold?' gold':'');
      node.style.width=size+'px'; node.style.height=size+'px';
      node.innerHTML=sliceIcon(kind);
      const it={
        el:node,x:size+Math.random()*Math.max(1,w-size*2),y:startY!=null?startY:h+size*.65,
        vx:(Math.random()-.5)*(w*Math.min(.22,.12+(lv-1)*.012)),
        vy:-(h*.92*vyBoost+Math.random()*h*.30*vyBoost),
        g:h*1.05*gBoost,size:size,gold:gold,rot:Math.random()*360,
        vr:(Math.random()-.5)*160,dead:false
      };
      node.style.transform='translate3d('+it.x+'px,'+it.y+'px,0) rotate('+it.rot+'deg)';
      area.appendChild(node);
      items.push(it);
      if(items.length>16){ const old=items.shift(); if(old) removeEl(old.el); }
    }
    function spark(it){
      for(let i=0;i<6;i++){
        const s=document.createElement('div');
        s.className='slice-spark'+(it.gold?' gold':'');
        const a=Math.random()*Math.PI*2, d=18+Math.random()*26;
        s.style.left=(it.x+it.size/2)+'px'; s.style.top=(it.y+it.size/2)+'px';
        s.style.setProperty('--dx',Math.round(Math.cos(a)*d)+'px');
        s.style.setProperty('--dy',Math.round(Math.sin(a)*d)+'px');
        area.appendChild(s);
        setTimeout(function(){ removeEl(s); },440);
      }
    }
    function cut(it,ang){
      const c=document.createElement('div');
      const len=Math.round(it.size*1.45);
      c.className='slice-cut';
      c.style.width=len+'px';
      c.style.left=(it.x+it.size/2-len/2)+'px';
      c.style.top=(it.y+it.size/2-2)+'px';
      c.style.setProperty('--rot',ang+'rad');
      area.appendChild(c);
      setTimeout(function(){ removeEl(c); },260);
    }
    function nearSegment(it,a,b){
      const cx=it.x+it.size/2, cy=it.y+it.size/2;
      const dx=b.x-a.x,dy=b.y-a.y,len2=dx*dx+dy*dy;
      let t=len2?((cx-a.x)*dx+(cy-a.y)*dy)/len2:0;
      t=Math.max(0,Math.min(1,t));
      const px=a.x+t*dx,py=a.y+t*dy,ddx=cx-px,ddy=cy-py,r=it.size*.62;
      return ddx*ddx+ddy*ddy<=r*r;
    }
    function showPlus(it,gain){
      const p=document.createElement('div');
      p.className='slice-plus'+(gain>1?' big':'');
      p.textContent='+'+gain;
      p.style.left=(it.x+it.size/2)+'px'; p.style.top=(it.y+it.size*.12)+'px';
      area.appendChild(p);
      setTimeout(function(){ removeEl(p); },900);
    }
    function hit(it,ang){
      if(it.dead) return;
      it.dead=true;
      const gain=it.gold?5:1;
      score+=gain; scoreEl.textContent=score;
      const nl=Math.floor(score/10)+1;
      if(nl>level){
        level=nl; lvEl.textContent=level;
        if(lvChip){ lvChip.classList.remove('flash'); void lvChip.offsetWidth; lvChip.classList.add('flash'); }
      }
      it.el.classList.add('hit');
      it.el.style.transform='translate3d('+it.x+'px,'+it.y+'px,0) rotate('+(it.rot+24)+'deg) scale(1.35)';
      setTimeout(function(){ removeEl(it.el); },240);
      cut(it,ang);
      spark(it);
      showPlus(it,gain);
    }
    function onDown(ev){
      if(ev.button!==0) return;
      slicing=true; lastPt=areaPoint(ev);
      bladePoints=[{x:lastPt.x,y:lastPt.y,t:performance.now()}];
      try{ area.setPointerCapture(ev.pointerId); }catch(e){}
      if(ev.preventDefault) ev.preventDefault();
    }
    function onMove(ev){
      if(!slicing) return;
      const p=areaPoint(ev);
      bladePoints.push({x:p.x,y:p.y,t:performance.now()});
      if(bladePoints.length>24) bladePoints.shift();
      for(let i=items.length-1;i>=0;i--){
        const it=items[i];
        if(!it.dead&&nearSegment(it,lastPt,p)){ hit(it,Math.atan2(p.y-lastPt.y,p.x-lastPt.x)); items.splice(i,1); }
      }
      lastPt=p;
      if(ev.preventDefault) ev.preventDefault();
    }
    function onUp(){ slicing=false; lastPt=null; }
    area.addEventListener('pointerdown',onDown);
    area.addEventListener('pointermove',onMove);
    area.addEventListener('pointerup',onUp);
    area.addEventListener('pointercancel',onUp);
    resizeBlade();
    window.addEventListener('resize',resizeBlade);
    function frame(now){
      raf=requestAnimationFrame(frame);
      if(document.hidden) return;
      if(!last){ last=now; return; }
      const dt=Math.min(.05,(now-last)/1000); last=now;
      const h=area.clientHeight;
      if(h<120) return;
      nextSpawn-=dt*1000;
      if(nextSpawn<=0){
        spawn();
        nextSpawn=Math.max(220,540-level*42)*(0.8+Math.random()*0.4);
      }
      const w=area.clientWidth;
      for(let i=items.length-1;i>=0;i--){
        const it=items[i];
        if(it.dead) continue;
        it.vy+=it.g*dt; it.x+=it.vx*dt; it.y+=it.vy*dt; it.rot+=it.vr*dt;
        if(it.x<2){ it.x=2; it.vx=Math.abs(it.vx); }
        if(it.x>w-it.size-2){ it.x=w-it.size-2; it.vx=-Math.abs(it.vx); }
        if(it.y>h+it.size&&it.vy>0){ removeEl(it.el); items.splice(i,1); continue; }
        it.el.style.transform='translate3d('+it.x+'px,'+it.y+'px,0) rotate('+it.rot+'deg)';
      }
      drawBlade(now);
    }
    sliceCleanup=function(){
      cancelAnimationFrame(raf);
      if(tipTimer){ clearTimeout(tipTimer); tipTimer=0; }
      window.removeEventListener('resize',resizeBlade);
      area.removeEventListener('pointerdown',onDown);
      area.removeEventListener('pointermove',onMove);
      area.removeEventListener('pointerup',onUp);
      area.removeEventListener('pointercancel',onUp);
      bladePoints=[];
      if(bctx) bctx.clearRect(0,0,bladeW,bladeH);
      items.forEach(function(it){ removeEl(it.el); });
      items=[];
      const leftovers=area.querySelectorAll('.slice-item,.slice-spark,.slice-cut,.slice-plus');
      for(let i=0;i<leftovers.length;i++) removeEl(leftovers[i]);
      if(tip) tip.classList.remove('hide');
    };
    const firstH=area.clientHeight;
    spawn(true,firstH*.68); spawn(true,firstH*.84); spawn(true,firstH*.98);
    raf=requestAnimationFrame(frame);
  }
  (function buildNav(){
    const nav=$('#nav');
    const bh=el('button','b-home','<span class="emo">'+navIcon('home')+'</span><span>开始</span>');
    bh.dataset.mode='home';
    bh.addEventListener('click',function(){ enterHome(); });
    nav.appendChild(bh);
    LEVELS.forEach(function(lv,i){
      const b=el('button',null,'<span class="emo">'+navIcon(NAV_ICON_NAMES[lv.id])+'</span><span>'+lv.name+'</span>');
      b.dataset.mode=lv.id;
      b.style.background=lv.color;
      b.addEventListener('click',function(){ startLevel(i); });
      nav.appendChild(b);
    });
    navs=[].slice.call(nav.querySelectorAll('button'));
  })();
  window.addEventListener('resize',function(){ if(S.stage) layout(); });
  window.__mt={ levels:LEVELS, state:S, mode:function(){ return mode; },
                level:function(){ return L; }, round:function(){ return RI; },
                stars:function(){ return stars; }, total:function(){ return TOTAL; },
                ready:function(){ return !!S.ready; },
                goalMet:function(g){ return goalMet(g); },
                sliceStart:function(){ startSliceGame(); },
                sliceStop:function(){ stopSliceGame(); },
                goto:function(li,ri){ mode='play'; L=li; RI=ri||0; stars=0;
                  markNav(LEVELS[li].id); setStars(0,levelStars(LEVELS[li]));
                  ctrlrow.style.display=''; showRound(); } };
  (function bubbles(){
    const cols=['#ffffff','#ffffff','#ffe3f2','#d9f0ff'];
    for(let i=0;i<14;i++){
      const s=el('span');
      const sz=(Math.random()*40+20);
      s.style.width=sz+'px'; s.style.height=sz+'px';
      s.style.left=(Math.random()*100)+'vw';
      s.style.bottom='-40px';
      s.style.background=cols[i%cols.length];
      s.style.animationDuration=(Math.random()*6+6)+'s';
      s.style.animationDelay=(Math.random()*4)+'s';
      $('#bg').appendChild(s);
    }
  })();
  /* ?finale=1 只用于预览结束页：星级只标在内存里，不写任何进度。 */
  restoreSave();
  if(previewFinale){
    LEVELS.forEach(function(l){ cleared[l.id]=true; best[l.id]=levelStars(l); });
    refreshTotal();
    showFinale();
  } else {
    enterHome();
  }
})();
</script>
