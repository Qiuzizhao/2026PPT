<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>我的推箱子编码记录 · 学习单</title>
<style>
  @page { size: A4; margin: 12mm 13mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body {
    font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
    color: #1a1a1a;
    font-size: 11.5pt;
    line-height: 1.45;
  }
  .sheet { max-width: 184mm; margin: 0 auto; }

  h1 {
    font-size: 17pt;
    text-align: center;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 1mm;
  }
  .sub {
    text-align: center;
    font-size: 10.5pt;
    color: #555;
    margin-bottom: 4mm;
  }

  .info {
    display: flex;
    gap: 6mm;
    font-size: 11.5pt;
    margin-bottom: 4mm;
  }
  .info .item { flex: 1; }
  .line {
    display: inline-block;
    border-bottom: 1px solid #333;
    min-width: 32mm;
    height: 1em;
    vertical-align: bottom;
  }

  .legend {
    border: 1.2px solid #333;
    padding: 1.5mm 3.5mm 1mm;
    margin-bottom: 2.5mm;
  }
  .legend h2 {
    font-size: 11.5pt;
    font-weight: bold;
    margin-bottom: 1mm;
  }
  .legend .row {
    height: 7mm;
    border-bottom: 1px dashed #aaa;
  }
  .legend .row:last-child { border-bottom: none; }

  .level {
    border: 1.2px solid #333;
    margin-bottom: 2.2mm;
  }
  .level:last-child { margin-bottom: 0; }
  .level-head {
    padding: 1mm 3.5mm;
    border-bottom: 1px solid #999;
    font-size: 11.5pt;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
  }
  .level-head .hint { font-weight: normal; color: #666; font-size: 10pt; }
  .level-body {
    height: 30mm;
    padding: 2mm 3mm;
    position: relative;
  }
</style>
</head>
<body>
<div class="sheet">

  <h1>我的推箱子编码记录</h1>
  <div class="sub">第14课《编码也能动起来》学习单</div>

  <div class="info">
    <div class="item">班级：<span class="line"></span></div>
    <div class="item">姓名：<span class="line"></span></div>
    <div class="item">座号：<span class="line"></span></div>
  </div>

  <div class="legend">
    <h2>我的符号约定（开始玩之前，先定好你自己的符号）</h2>
    <div class="row"></div>
    <div class="row"></div>
  </div>

  <div class="level">
    <div class="level-head"><span>第 1 关</span><span class="hint">把你这关怎么走的，用自己的方法记下来</span></div>
    <div class="level-body"></div>
  </div>

  <div class="level">
    <div class="level-head"><span>第 2 关</span><span class="hint">把你这关怎么走的，用自己的方法记下来</span></div>
    <div class="level-body"></div>
  </div>

  <div class="level">
    <div class="level-head"><span>第 3 关</span><span class="hint">把你这关怎么走的，用自己的方法记下来</span></div>
    <div class="level-body"></div>
  </div>

  <div class="level">
    <div class="level-head"><span>第 4 关</span><span class="hint">把你这关怎么走的，用自己的方法记下来</span></div>
    <div class="level-body"></div>
  </div>

  <div class="level">
    <div class="level-head"><span>第 5 关</span><span class="hint">把你这关怎么走的，用自己的方法记下来</span></div>
    <div class="level-body"></div>
  </div>

</div>
</body>
</html>
