  <body>
    <canvas id="town" aria-label="可旋转和缩放的三维低多边形小镇"></canvas>
    <header class="topbar">
      <a class="brand" href="#" aria-label="风和小镇首页"><span class="brand-icon">⌂</span><span>风和小镇<small>WEATHER TOWN</small></span></a>
    </header>
    <main class="intro">
      <button id="explore" class="explore">进入小镇 <span>↗</span></button>
    </main>
    <aside class="weather-card" aria-label="当前小镇天气">
      <div class="weather-icon" id="weather-icon">☀</div>
      <div><span class="weather-label">小镇此刻</span><div class="weather-value" id="weather-value">晴朗 · 午后</div></div>
      <span class="temperature" id="temperature">24°</span>
    </aside>
    <section class="walking-hud" aria-label="开放探索">
      <div class="walk-banner"><span class="walk-dot"></span><span id="walk-location">自在探索 · 风和小镇</span><small>慢慢走，随处看看</small></div>
      <aside class="minimap-card"><canvas id="minimap" width="256" height="256" aria-label="小镇地图，三角形为当前位置"></canvas><div>你在这里 <span id="coordinates">1.8, -1.5</span></div></aside>
      <div class="walk-help">W A S D / 方向键 移动 <b>·</b> 鼠标自由调整视角 <b>·</b> 1 近 / 2 中 / 3 远 <b>·</b> E 交互 <b>·</b> Esc 暂停</div>
      <div class="walk-zoom" role="group" aria-label="镜头距离"><button data-walk-zoom="0" aria-pressed="false">1 近</button><button data-walk-zoom="1" aria-pressed="true">2 中</button><button data-walk-zoom="2" aria-pressed="false">3 远</button></div>
      <div class="mouse-capture"><svg class="mouse-capture-icon" viewBox="0 0 32 40" aria-hidden="true"><rect x="5" y="2" width="22" height="34" rx="11"/><path d="M16 3v11M5 17h22"/></svg><div><span id="mouse-status" role="status" aria-live="polite"></span><small>点击「查看全镇」退出探索</small></div></div>
      <div class="touch-help">左侧摇杆移动 · 右侧滑动自由调整视角</div>
      <div id="joystick" aria-label="移动摇杆"><div id="joystick-knob"></div></div>
      <button id="mobile-pause" type="button" aria-label="暂停探索">Ⅱ</button>
      <div id="mobile-pause-panel"><strong>探索已暂停</strong><div class="mobile-resolution" role="group" aria-label="画面清晰度"><span>画面清晰度</span><button type="button" data-mobile-resolution="1.5" aria-pressed="false">1.5×</button><button type="button" data-mobile-resolution="2" aria-pressed="true">2×</button></div><button id="mobile-resume" type="button">继续探索</button><button id="mobile-overview" type="button">查看全镇</button></div>
    </section>
    <aside class="places" aria-label="小镇建筑导航">
      <label id="place-label">TOWN DIRECTORY <span>街区导览</span></label>
      <div class="place-picker">
        <button id="place-select" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="place-options" aria-labelledby="place-label place-value"><span id="place-value">选择建筑</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 6 5 5 5-5"/></svg></button>
        <div id="place-options" role="listbox" aria-labelledby="place-label" hidden></div>
      </div>
      <p id="place-description">选择一处建筑，走近看看小镇的日常。</p>
    </aside>
    <nav class="controls" aria-label="场景控制">
      <div class="mode-group time-track" role="slider" tabindex="0" aria-label="时间：拖动弧线或滚动鼠标滚轮调整" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="白天" title="拖动或滚轮调整时间">
        <svg class="time-arc" viewBox="0 0 236 150" aria-hidden="true"><path class="time-daylight" d="M24 118A94 94 0 0 1 118 24"/><path class="time-afterglow" d="M118 24A94 94 0 0 1 212 118"/></svg>
        <span class="time-thumb" aria-hidden="true">☀</span>
        <span class="time-stop time-stop-day">白天</span><span class="time-stop time-stop-sunset">黄昏</span><span class="time-stop time-stop-night">夜晚</span>
      </div>
      <div class="divider"></div><button id="rotate" aria-pressed="false" title="自动环绕">↻ <span>环绕</span></button><button id="reset" title="回到初始视角">⌖ <span>归位</span></button><button id="walk-toggle" aria-pressed="false">↟ 步行探索</button>
    </nav>
    <button id="mobile-orientation" type="button" aria-label="切换竖屏" hidden>竖屏</button>
    <div id="status" role="status">正在搭建你的小镇…</div>
  </body>
</html>
