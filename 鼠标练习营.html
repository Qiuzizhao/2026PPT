<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖱️ 鼠标小乐园</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23f7f6f2'/><rect x='.75' y='.75' width='30.5' height='30.5' rx='6.5' fill='none' stroke='%231c3d6e' stroke-opacity='.28' stroke-width='1.5'/><rect x='10.5' y='5.5' width='11' height='21' rx='5.5' fill='%2344a3ff' fill-opacity='.16' stroke='%231c3d6e' stroke-width='2'/><path d='M16 6.2v6' stroke='%231c3d6e' stroke-width='2' stroke-linecap='round'/><rect x='14.4' y='9.9' width='3.2' height='5.4' rx='1.6' fill='%23e0668f'/></svg>">
<meta name="theme-color" content="#c9ecff">
<style>
  :root{
    --ink:#2b2b45; --muted:#8a8aa8;
    --card:#ffffff; --line:#ffe3ee;
    --blue:#44a3ff; --orange:#ff9f45; --green:#4ed47e; --cyan:#43d2e8;
    --purple:#a577ff; --pink:#ff6fa5; --yellow:#ffd23f;
    --good:#2ec77b; --good-soft:#e4f9ec;
    --bad:#ff6a5e; --bad-soft:#ffe9e7;
    --shadow:0 10px 22px rgba(90,70,160,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Comic Sans MS","Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    color:var(--ink); min-height:100vh;
    background:linear-gradient(160deg,#c9ecff,#dcd3ff 55%,#ffe0ea);
    background-attachment:fixed;
    padding:18px 36px 50px;padding:18px clamp(8px,3vw,36px) 50px;
    user-select:none;
  }
  .wrap{max-width:900px;margin:0 auto}

  /* bubbles in background */
  .bg-bubbles{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden;z-index:0}
  .bg-bubbles span{position:absolute;border-radius:50%;opacity:.5;animation:float 9s ease-in-out infinite}

  /* ===== Header / mascot ===== */
  header{display:flex;align-items:center;gap:16px;margin:0 auto 16px;position:relative;z-index:1}
  html.no-flexgap header > *:not(:last-child){margin-right:16px}
  .mascot{
    width:88px;height:88px;flex-shrink:0;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:50px;
    box-shadow:var(--shadow);border:4px solid #fff;animation:bob 2.6s ease-in-out infinite;
  }
  .bubble{
    background:#fff;border-radius:22px 22px 22px 6px;padding:16px 20px;
    box-shadow:var(--shadow);font-size:27px;font-size:clamp(19px,3vw,27px);font-weight:800;line-height:1.5;
    flex:1;min-height:70px;display:flex;align-items:center;
  }
  .bubble b{color:var(--blue)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-40px) scale(1.1)}}

  /* ===== Nav ===== */
  nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 auto 16px;position:relative;z-index:1}
  html.no-flexgap nav > *:not(:last-child){margin-right:10px}
  nav button{
    border:none;cursor:pointer;border-radius:20px;padding:12px 18px;
    font-family:inherit;font-size:19px;font-size:clamp(16px,2.4vw,19px);font-weight:800;color:#fff;
    display:flex;align-items:center;gap:8px;box-shadow:0 6px 0 rgba(0,0,0,.12), var(--shadow);
    transition:transform .1s ease;min-width:74px;justify-content:center;
  }
  html.no-flexgap nav button > *:not(:last-child){margin-right:8px}
  nav button:hover{transform:translateY(-3px)}
  nav button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
  nav button.b-home{background:var(--purple)}
  nav button.b-left{background:var(--blue)}
  nav button.b-right{background:var(--orange)}
  nav button.b-double{background:var(--green)}
  nav button.b-wheel{background:var(--cyan)}
  nav button.b-menu{background:var(--pink)}
  nav button span.emo{font-size:22px}
  nav button.n-done::after{content:" ✓";font-size:.72em;opacity:.9}

  /* completed (frozen) state */
  .done-wrap{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px}
  html.no-flexgap .done-wrap > *:not(:last-child){margin-bottom:8px}
  .done-wrap .trophy{font-size:120px;font-size:min(120px,24vw);line-height:1;animation:bob 2.6s ease-in-out infinite}
  .done-wrap .done-title{font-size:38px;font-size:clamp(26px,6vw,38px);font-weight:900;color:var(--blue);text-shadow:0 3px 0 rgba(255,255,255,.6)}
  .done-wrap .done-sub{font-size:20px;font-size:clamp(15px,3vw,20px);color:var(--muted);font-weight:700;max-width:420px}

  /* ===== Progress stars ===== */
  .stars{display:flex;gap:8px;justify-content:center;margin:0 auto 14px;flex-wrap:wrap;position:relative;z-index:1;min-height:36px}
  html.no-flexgap .stars > *:not(:last-child){margin-right:8px}
  .stars .star{transition:transform .2s ease}
  .stars .star .s-in{display:inline-block;font-size:30px;filter:grayscale(1);opacity:.4;transition:all .2s ease}
  .stars .star.pop .s-in{filter:none;opacity:1;transform:scale(1.25)}
  .stars .big-count{color:#fff;font-weight:900;font-size:20px;text-shadow:0 2px 6px rgba(60,40,120,.3);margin-left:8px}
  /* 接着上次继续时，星星后面多一个「重新开始」小按钮 */
  .again-btn{
    border:none;cursor:pointer;font-family:inherit;font-weight:800;
    border-radius:999px;padding:6px 14px;font-size:15px;color:#fff;background:#7d5b96;
    box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .1s ease;
  }
  .again-btn:hover{transform:translateY(-2px)}
  .again-btn:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.12)}

  /* 五关全通之后才露出来的金色入口：回去看奖杯、玩无尽点点乐 */
  .finale-bar{
    display:block;width:100%;margin:0 auto 14px;border:none;cursor:pointer;font-family:inherit;
    border-radius:22px;padding:14px 18px;
    font-size:19px;font-size:clamp(16px,2.4vw,19px);font-weight:900;color:#4a3708;
    background:linear-gradient(90deg,#fff7dd,#ffe9a8 42%,#fff7dd);
    box-shadow:var(--shadow);position:relative;z-index:1;transition:transform .1s ease;
  }
  .finale-bar:hover{transform:translateY(-2px)}
  .finale-bar:active{transform:translateY(1px)}
  /* 关卡按钮上的「做了一半」小标 */
  nav button.n-half::after{content:" ⏱";font-size:.72em;opacity:.9}

  /* ===== Play ===== */
  .play{
    position:relative;background:linear-gradient(180deg,#ffffff,#f2f8ff);
    border-radius:28px;height:460px;height:clamp(320px,52vh,460px);overflow:hidden;
    box-shadow:var(--shadow);border:4px solid #fff;
  }
  .play .ground{
    position:absolute;left:0;right:0;bottom:0;height:60px;
    background:linear-gradient(180deg,transparent,#eafff1);opacity:.8;
  }
  .home-grid{position:absolute;top:18px;right:18px;bottom:18px;left:18px;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center}
  html.no-flexgap .home-grid > *:not(:last-child){margin-right:16px}
  .homebtn{
    width:140px;height:140px;border-radius:50%;border:none;cursor:pointer;color:#fff;
    box-shadow:0 8px 0 rgba(0,0,0,.12), var(--shadow);transition:transform .12s ease;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:inherit;
  }
  html.no-flexgap .homebtn > *:not(:last-child){margin-bottom:4px}
  .homebtn:hover{transform:translateY(-4px) scale(1.05)}
  .homebtn:active{transform:translateY(2px)}
  .homebtn .face{font-size:40px;line-height:1}
  .homebtn .lbl{font-weight:800;font-size:20px}
  .homebtn.done2{filter:saturate(.75);opacity:.9}
  .homebtn.done2 .lbl::after{content:" ✓";color:#fff;opacity:.95}

  /* top-right total star counter */
  .star-total{
    position:fixed;top:12px;right:12px;z-index:2000;
    background:#fff;border-radius:999px;padding:9px 16px;
    display:flex;align-items:center;gap:8px;
    box-shadow:0 8px 18px rgba(60,40,120,.22);border:3px solid #ffe08a;
    font-weight:900;font-size:21px;color:var(--ink);
  }
  html.no-flexgap .star-total > *:not(:last-child){margin-right:8px}
  .star-total .st-ico{font-size:24px}
  .star-total .st-lbl{font-size:14px;color:var(--muted);font-weight:800}
  @media(max-width:640px){
    .star-total{top:8px;right:8px;padding:7px 12px;font-size:18px}
    .star-total .st-lbl{display:none}
    .bubble{padding-right:64px}
  }

  .target{position:absolute;user-select:none;cursor:pointer;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 0 rgba(0,0,0,.14), var(--shadow);
    transition:transform .12s ease;will-change:transform;
  }
  .target:active{transform:scale(.9)}
  .target .face{font-size:64px;font-size:clamp(38px,6vw,64px);line-height:1}
  .target.pop-in{animation:popin .3s ease}
  @keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .target.burst{animation:burst .45s ease forwards}
  @keyframes burst{40%{transform:scale(1.35)}100%{transform:scale(0);opacity:0}}

  /* message under mascot for actions */
  .bubble.shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  /* confetti */
  .cf{position:fixed;top:0;width:12px;height:16px;z-index:99999;pointer-events:none;
    border-radius:3px;animation:fall 1.1s ease-in forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}

  /* ===== Wheel ===== */
  .wheel-zone{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;gap:40px;gap:clamp(16px,4vw,40px);flex-wrap:wrap;padding:16px}
  html.no-flexgap .wheel-zone > *:not(:last-child){margin-right:40px}
  .pic-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
  html.no-flexgap .pic-wrap > *:not(:last-child){margin-bottom:8px}
  .bottle{width:180px;max-width:44vw;width:min(180px,44vw);height:300px;max-height:46vh;height:min(300px,46vh);background:#eef4fb;border-radius:18px;position:relative;overflow:hidden;border:3px solid #cfdcf0}
  .bottle .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#6fd6ff,#3aa3ff);transition:height .12s ease}
  .bottle .goal{position:absolute;left:0;right:0;border-top:4px solid #ff6a5e;z-index:3}
  .bottle .goal::after{content:"🎯";position:absolute;right:-2px;top:-16px;font-size:20px}
  .wheel-num{font-size:54px;font-size:clamp(34px,7vw,54px);font-weight:900;color:var(--blue);text-align:center}
  .wheel-sub{font-size:18px;font-size:clamp(14px,2.6vw,18px);color:var(--muted);text-align:center;font-weight:700}

  /* ===== Menu ===== */
  .menu-zone{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;cursor:context-menu}
  .menu-zone .task{font-size:24px;font-size:clamp(18px,3vw,24px);font-weight:800;line-height:1.8;text-align:center;padding:0 18px;color:var(--muted)}
  .menu-zone .req{color:#fff;background:var(--pink);padding:4px 16px;border-radius:14px;display:inline-block;margin:4px}
  .ctmenu{position:fixed;z-index:9999;min-width:190px;background:#fff;border-radius:18px;
    box-shadow:0 16px 40px rgba(40,30,90,.35);border:3px solid #f3e2ff;padding:8px;display:none;animation:menuin .15s ease}
  @keyframes menuin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  .ctmenu .mi{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;cursor:pointer;font-size:18px;font-weight:700}
  html.no-flexgap .ctmenu .mi > *:not(:last-child){margin-right:12px}
  .ctmenu .mi:hover{background:var(--good-soft)}
  .ctmenu .mi .ic{font-size:22px}
  .ctmenu .sep{height:2px;background:#f3e2ff;margin:5px 8px}

  /* ===== Modal ===== */
  .overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(40,30,80,.4);display:none;align-items:center;justify-content:center;z-index:10000;padding:18px}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:30px;box-shadow:var(--shadow);max-width:460px;width:100%;padding:30px 24px;text-align:center;animation:popin .32s ease}
  .modal .moji{font-size:74px;line-height:1}
  .modal h2{margin:10px 0 6px;font-size:32px;font-size:clamp(24px,6vw,32px);color:var(--blue)}
  .modal p{margin:0 0 18px;color:var(--muted);font-size:17px;line-height:1.7}
  .modal .mstars{font-size:26px;letter-spacing:4px;margin-bottom:18px}
  .modal .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  html.no-flexgap .modal .actions > *:not(:last-child){margin-right:12px}
  .btn{border:none;cursor:pointer;border-radius:18px;padding:15px 22px;font-family:inherit;font-size:18px;font-weight:800;transition:transform .1s ease;box-shadow:0 5px 0 rgba(0,0,0,.12)}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(2px)}
  .btn.primary{background:var(--green);color:#fff}
  .btn.ghost{background:#eef2ff;color:var(--ink)}

  /* ===== Grand finale (all levels cleared) ===== */
  body.locked{overflow:hidden}
  .finale{
    position:fixed;top:0;right:0;bottom:0;left:0;z-index:30000;display:none;overflow:hidden;
    flex-direction:column;align-items:center;justify-content:center;padding:14px;
    background:radial-gradient(circle at 50% 36%,#4b3a8c 0%,#2c2356 48%,#16122f 100%);
  }
  .finale.show{display:flex}
  .finale-fx{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
  /* 通关页分上下两半：上半是奖杯，下半全是掉落物小游戏 */
  .finale-top{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;flex:1 1 50%;width:100%;min-height:0}
  .finale-card{
    position:relative;z-index:3;text-align:center;color:#fff;max-width:780px;
    opacity:0;transform:translateY(30px) scale(.82);
  }
  .finale.card-in .finale-card{animation:card-in .9s cubic-bezier(.18,1.5,.45,1) forwards}
  @keyframes card-in{
    0%{opacity:0;transform:translateY(34px) scale(.8)}
    60%{opacity:1;transform:translateY(-8px) scale(1.04)}
    100%{opacity:1;transform:none}
  }
  .trophy-wrap{
    position:relative;display:inline-flex;align-items:center;justify-content:center;
    width:168px;max-width:34vw;width:min(168px,34vw);height:168px;max-height:34vw;height:min(168px,34vw);
  }
  .trophy-wrap::before{
    content:"";position:absolute;top:4%;right:4%;bottom:4%;left:4%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,210,63,.45),rgba(255,210,63,0) 68%);
    animation:glowpulse 2.4s ease-in-out infinite;
  }
  .trophy-rays{
    position:absolute;top:-20%;right:-20%;bottom:-20%;left:-20%;border-radius:50%;opacity:.75;
    background:conic-gradient(from 0deg,rgba(255,224,120,.75) 0 5deg,transparent 5deg 22deg);
    -webkit-mask:radial-gradient(circle,#000 30%,transparent 72%);
    mask:radial-gradient(circle,#000 30%,transparent 72%);
    animation:spin 18s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes glowpulse{0%,100%{opacity:.6;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
  .big-trophy{
    position:relative;font-size:118px;font-size:min(118px,26vw);line-height:1;
    filter:drop-shadow(0 14px 26px rgba(255,178,40,.6));
    animation:bob 2.6s ease-in-out infinite;
  }
  .finale-title{
    margin:4px 0 6px;font-size:42px;font-size:clamp(26px,5.4vw,42px);font-weight:900;letter-spacing:2px;
    background:linear-gradient(180deg,#fffbe4,#ffd23f 46%,#ff9f45);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.28));
  }
  .finale-sub{margin:0;font-size:18px;font-size:clamp(13px,2.4vw,18px);font-weight:700;color:#e4dcff}

  /* ===== 通关页的「无尽点点乐」：先做完的学生一直有得玩 =====
    规则只有一条——点掉飘下来的小东西就加分。无限关、没有失败、也不会离开本页。
    普通物件 +1 分，金色 🌟 +5 分；漏掉不扣分、不惩罚，什么都没发生。
    每 10 分升一关，落得更快、来得更密，所以永远玩不完。
    游戏区宽度封顶 1000px（见下面的 max-width）：屏幕再宽也不能把掉落范围拉成一整条，
    否则物件横向撒得太开，学生根本点不过来。 */
  .ep{
    position:relative;z-index:4;flex:1 1 50%;width:100%;max-width:1000px;min-height:0;
    padding:0 2px 2px;box-sizing:border-box;
    display:flex;flex-direction:column;gap:8px;
  }
  html.no-flexgap .ep > *:not(:last-child){margin-bottom:8px}
  .ep-head{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;color:#fff}
  html.no-flexgap .ep-head > *:not(:last-child){margin-right:10px}
  .ep-k{
    display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.28);
    border-radius:999px;padding:4px 13px;font-weight:800;
    font-size:16px;font-size:clamp(13px,2.2vw,16px);backdrop-filter:blur(2px);
  }
  html.no-flexgap .ep-k > *:not(:last-child){margin-right:6px}
  .ep-k b{color:#ffd23f;font-size:1.15em;font-variant-numeric:tabular-nums}
  .ep-lv b{color:#8ff0bc}
  .ep-lv.flash{animation:ep-flash .55s ease}
  @keyframes ep-flash{
    0%{transform:scale(1)}
    45%{transform:scale(1.16);background:rgba(143,240,188,.36)}
    100%{transform:scale(1)}
  }
  .ep-area{
    position:relative;flex:1;min-height:0;overflow:hidden;
    border-radius:20px;border:2px solid rgba(255,255,255,.16);
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  }
  .ep-area::after{
    content:"";position:absolute;right:0;bottom:0;left:0;height:3px;pointer-events:none;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.4),rgba(255,255,255,0));
  }
  .ep-tip{
    position:absolute;top:50%;right:20px;left:20px;transform:translateY(-50%);
    text-align:center;color:#ffe9a8;font-weight:800;pointer-events:none;
    text-shadow:0 2px 8px rgba(20,10,50,.6);
    font-size:18px;font-size:clamp(14px,2.6vw,18px);transition:opacity .5s ease;
  }
  .ep-tip.hide{opacity:.5}
  .ep-item{
    position:absolute;top:0;left:0;display:flex;align-items:center;justify-content:center;
    border-radius:50%;background:rgba(255,255,255,.94);
    box-shadow:0 6px 14px rgba(20,10,50,.35);cursor:pointer;user-select:none;
    -webkit-user-select:none;touch-action:none;transition:opacity .2s linear;will-change:transform;
  }
  .ep-item.gold{
    background:linear-gradient(180deg,#fff6c9,#ffd23f);
    box-shadow:0 0 0 3px rgba(255,210,63,.55),0 6px 16px rgba(255,178,40,.5);
  }
  .ep-plus{
    position:absolute;top:0;left:0;transform:translate(-50%,0);pointer-events:none;
    color:#ffe9a8;font-weight:900;font-size:18px;text-shadow:0 2px 6px rgba(0,0,0,.35);
    animation:ep-rise .85s ease forwards;
  }
  .ep-plus.big{color:#ffd23f;font-size:24px}
  @keyframes ep-rise{
    from{opacity:1;transform:translate(-50%,0) scale(.9)}
    to{opacity:0;transform:translate(-50%,-52px) scale(1.2)}
  }
  /* 屏幕不高时把上半区的奖杯缩小，保证上下两半都不挤 */
  @media(max-height:700px){
    .trophy-wrap{width:136px;max-width:28vw;width:min(136px,28vw);height:136px;max-height:28vw;height:min(136px,28vw)}
    .big-trophy{font-size:94px;font-size:min(94px,22vw)}
    .finale-title{font-size:34px;font-size:clamp(24px,4.6vw,34px);letter-spacing:1px}
    .finale-sub{font-size:15px;font-size:clamp(12px,2.2vw,15px)}
  }
  @media(max-height:560px){

  }

<script>
/* ===== 防误触兜底 =====
   1) 右键菜单：学生鼠标不熟练，乱按时很容易弹出系统右键菜单挡住画面。
      这里全局取消默认菜单，但只调 preventDefault、绝不 stopPropagation，
      所以本页的右键练习（气球上的 contextmenu）和菜单练习照常收到事件。
   2) 拖拽：防止图片/文字被拖出页面。拖拽练习走 pointer 事件，不受影响。
   3) 防误退：Edge 的鼠标手势（右键按住向左拖动）和误按后退键都会触发浏览器
      后退，把学生从练习页带走。压两层 history 哨兵，任何后退/前进都只会落回
      本页，popstate 一响立刻再压一层，页面始终留在原地。
   本页不使用 hash / history 导航，以上都不影响页内任何功能。 */
(function () {
  /* 输入框里保留原生右键菜单，方便右键粘贴 */
  function keepNative(el) {
    return !!(el && el.closest &&
      el.closest('input, textarea, [contenteditable]:not([contenteditable="false"])'));
  }
  document.addEventListener('contextmenu', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();                    /* 只取消默认菜单，不阻断页内逻辑 */
  }, true);
  document.addEventListener('dragstart', function (e) {
    if (keepNative(e.target)) return;
    e.preventDefault();
  }, true);

  /* 防误退 */
  if (location.protocol === 'file:') return;      /* file:// 下浏览器禁止 pushState */
  function guard() {
    try { history.pushState({ mtSentinel: 1 }, '', location.href); } catch (e) {}
  }
  try {
    guard(); guard();
    window.addEventListener('popstate', guard);
  } catch (e) {}
})();
</script>
<script>
/* ===== 兼容层 A：flex gap 能力探测 =====
   老内核（Edge 84 以前、EdgeHTML）的 flex 布局不支持 gap，间距会全部塌掉。
   这里用真实布局量一次宽度来判断，支持就用原样，不支持就给 <html> 挂上
   no-flexgap，样式表里预置的 margin 规则接管间距。
   不用 CSS.supports('gap') 判断：gap 在 Chrome 66 起就作为 grid-gap 的别名存在，
   老版本会误报"支持"。 */
(function () {
  try {
    var box = document.createElement('div');
    box.style.cssText = 'position:absolute;top:-9999px;left:-9999px;display:flex;gap:10px;width:auto;height:1px';
    var a = document.createElement('i');
    var b = document.createElement('i');
    a.style.cssText = b.style.cssText = 'display:block;width:10px;height:1px';
    box.appendChild(a); box.appendChild(b);
    document.documentElement.appendChild(box);
    var w = box.getBoundingClientRect().width || box.scrollWidth;
    document.documentElement.removeChild(box);
    if (!(w >= 30)) document.documentElement.className += ' no-flexgap';
  } catch (e) {}
})();
</script>

<script>
(function(){
  "use strict";
  const $ = s=>document.querySelector(s);
  const play = $('#play');
  const bubble = $('#bubble');
  const mascot = $('#mascot');
  const stars = $('#stars');
  const ctmenu = $('#ctmenu');
  const overlay = $('#overlay');
  const doneSet = new Set();

  /* ===== 进度存档（localStorage）=====
     以前这一页的成绩（每关几颗星、哪几关做完了）只留在内存里，一刷新就归零，
     学生手一抖刷新就得从头练。现在每关的进度都写进 localStorage，下次打开接着做：
       best[关卡]    这一关拿到过的最多星星（0~10）
       cleared[关卡] 这一关是否已经通关
       stage[关卡]   {got} 这一关做到第几颗星（这一关做完了就删掉）
     存不进去（浏览器隐私设置、老策略）时静默降级成"只记在内存里"：
     读写都包在 try/catch 里，最坏情况只是不保存，绝不让页面报错。 */
  const SAVE_KEY='mousecamp1.progress.v1';
  const stageMap={};
  let previewMode=false;                 /* ?finale=1 预览：只标在内存里，不写存档 */
  let againOn=false;                     /* 这一关是不是"接着上次"在做 */
  function writeSave(){
    if(previewMode) return;
    const cleared={};
    doneSet.forEach(function(k){ cleared[k]=true; });
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v:1, best:starBest, cleared:cleared, stage:stageMap, ts:Date.now()
      }));
    }catch(e){}
  }
  /* 读回来的数据一律按"已知的五关"过滤，坏数据、旧版本数据都不会把页面带崩 */
  function restoreSave(){
    let d=null;
    try{
      const raw=localStorage.getItem(SAVE_KEY);
      if(raw) d=JSON.parse(raw);
    }catch(e){ d=null; }
    if(!d||typeof d!=='object') return;
    LEVELS.forEach(function(l){
      const id=l[0], max=TOTALS[id]||0;
      const b=d.best?d.best[id]:0;
      if(b>0) starBest[id]=Math.max(0,Math.min(max,Math.round(b)));
      if(d.cleared&&d.cleared[id]) markDone(id);
      const st=d.stage?d.stage[id]:null;
      if(st&&!doneSet.has(id)){
        const g=Math.round(st.got||0);
        if(g>0&&g<max) stageMap[id]={got:g};
      }
    });
    refreshTotal();
    markHalf();
    refreshFinaleBar();
  }
  function refreshTotal(){
    const tot=Object.values(starBest).reduce((a,b)=>a+b,0);
    const n=document.getElementById('starNum');
    if(n) n.textContent=tot;
  }
  /* 导航按钮上的「⏱ 做了一半」小标 */
  function markHalf(){
    document.querySelectorAll('#nav button').forEach(function(b){
      const id=b.dataset.mode;
      b.classList.toggle('n-half', !!(stageMap[id]&&stageMap[id].got));
    });
  }
  /* 五关全通之后，导航上方那条金色入口才露出来：回去看奖杯、玩无尽点点乐 */
  function refreshFinaleBar(){
    const bar=$('#finaleBar');
    if(bar) bar.style.display=(allCleared()&&!finaleOn)?'block':'none';
  }
  function markDone(m){
    doneSet.add(m);                       // completed -> locked, cannot replay
    const b=document.querySelector('#nav [data-mode="'+m+'"]');
    if(b) b.classList.add('n-done');      // show a ✓ on the nav button
    delete stageMap[m];                   /* 这一关做完了，不用再"接着上次" */
    markHalf();
    writeSave();
    refreshFinaleBar();
  }
  const TOTALS={left:10,right:10,double:10,wheel:10,menu:10};

  /* running total of stars earned (best per mode, so it never double-counts) */
  const starBest={left:0,right:0,double:0,wheel:0,menu:0};
  function recordStars(mode,got){
    if(got>starBest[mode]) starBest[mode]=got;
    if(got<TOTALS[mode]) stageMap[mode]={got:got}; else delete stageMap[mode];
    refreshTotal();
    markHalf();
    writeSave();                          /* 得分是离散事件：点了就落盘，刷新后不会少星 */
  }
  /* 接着上次：存档里的 got 就是这一关已经拿到的星数（做完了的关卡不会留 stage） */
  function resumeAt(from,total){
    const n=Math.round(from||0);
    return n>0?Math.max(0,Math.min(n,total-1)):0;
  }
  let modeToken = 0;
  let cleanups = [];
  function addListen(el,ev,fn,o){el.addEventListener(ev,fn,o||false);cleanups.push(()=>el.removeEventListener(ev,fn));}
  function cleanup(){while(cleanups.length){const c=cleanups.pop();c();}}
  function say(html, shake){
    bubble.innerHTML = html;
    if(shake){ bubble.classList.remove('shake'); void bubble.offsetWidth; bubble.classList.add('shake'); }
  }
  let toastTimer=null;
  function toast(msg,color){
    bubble.style.background = color||'#fff';
    bubble.innerHTML = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{bubble.style.background='#fff';}, 1600);
  }
  function confetti(){
    const colors=['#ff6fa5','#ffd23f','#44a3ff','#4ed47e','#a577ff','#43d2e8'];
    for(let i=0;i<28;i++){
      const c=document.createElement('div'); c.className='cf';
      c.style.left=Math.random()*100+'vw';
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDelay=(Math.random()*.25)+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),1500);
    }
  }
  function setStars(done,total){
    stars.innerHTML='';
    let txt='';
    for(let i=0;i<total;i++){
      const s=document.createElement('span'); s.className='star'+(i<done?' pop':'');
      s.innerHTML='<span class="s-in">⭐</span>';
      stars.appendChild(s);
    }
    if(total>0) txt = done+' / '+total;
    if(txt){ const b=document.createElement('span'); b.className='big-count'; b.textContent=txt; stars.appendChild(b); }
    if(againOn) stars.appendChild(againBtn);      /* 「接着上次」时才有的重新开始 */
  }
  /* ↺ 重新开始：把这一关做了一半的现场丢掉，从头练 */
  const againBtn=document.createElement('button');
  againBtn.type='button';
  againBtn.className='again-btn';
  againBtn.textContent='↺ 重新开始这一关';
  againBtn.addEventListener('click', function(){
    if(currentMode==='home') return;
    delete stageMap[currentMode];
    writeSave(); markHalf();
    showMode(currentMode);
  });

  function showModal(moji,title,text,mstarStr){
    $('#mMoji').textContent=moji;
    $('#mTitle').textContent=title;
    $('#mText').innerHTML=text;
    $('#mStars').textContent=mstarStr;
    overlay.classList.add('show');
  }
  function hideModal(){overlay.classList.remove('show');}

  /* targets */
  function makeTarget(size,face,bg){
    const t=document.createElement('div');
    t.className='target pop-in';
    t.style.width=size+'px'; t.style.height=size+'px';
    t.style.background=bg;
    t.innerHTML='<span class="face">'+face+'</span>';
    return t;
  }
  function place(t){
    const b=16, sz=t.offsetWidth;
    const mx=Math.max(b, play.clientWidth-sz-b);
    const my=Math.max(b, play.clientHeight-sz-b-10);
    t.style.left=(Math.random()*mx)+'px';
    t.style.top=(Math.random()*my)+'px';
  }

  /* ============ MODES ============ */
  function modeHome(){
    mascot.textContent='🐭';
    say('点一个<b>圆圈</b>开始！');
    setStars(0,0);
    const games=[
      ['left','👆','左键','用左键点我','#44a3ff'],
      ['right','🖱️','右键','用右键点我','#ff9f45'],
      ['double','✌️','双击','快速点两下','#4ed47e'],
      ['wheel','🌀','滚轮','转一转小轮子','#43d2e8'],
      ['menu','📋','选菜单','开菜单选一个','#ff6fa5'],
    ];
    play.innerHTML='<div class="ground"></div><div class="home-grid"></div>';
    play.style.cursor='default';
    const grid=play.querySelector('.home-grid');
    games.forEach((g)=>{
      const b=document.createElement('button');
      b.className='homebtn'+(doneSet.has(g[0])?' done2':'');
      b.style.background=g[4];
      b.innerHTML='<span class="face">'+g[1]+'</span><span class="lbl">'+g[2]+'</span>';
      b.onclick=()=>showMode(g[0]);
      grid.appendChild(b);
    });
  }

  function modeLeft(from){
    mascot.textContent='👆';
    say('用<b>左键</b>点小星星！');
    const TOTAL=10; let got=resumeAt(from,TOTAL); const tok=modeToken;
    setStars(got,TOTAL);
    play.innerHTML='<div class="ground"></div>';
    function next(){
      const t=makeTarget(120,'⭐','linear-gradient(150deg,#ffd23f,#ffb52e)');
      play.appendChild(t); place(t);
      addListen(t,'click',(e)=>{
        e.stopPropagation();
        t.classList.add('burst');
        setTimeout(()=>t.remove(),460); got++;
        setStars(got,TOTAL); recordStars('left',got);
        if(got>=TOTAL){ celebrate('left','🎉','好厉害！','你会用左键啦！<br>点按钮、点链接都要靠它。','⭐'.repeat(TOTAL)); }
        else setTimeout(()=>{ if(tok===modeToken) next(); },320);
      });
    }
    addListen(play,'click',()=>say('用<b>左键</b>点那个星星哦！'));
    next();
  }

  function modeRight(from){
    mascot.textContent='🖱️';
    say('这次用<b>右键</b>点它！');
    const TOTAL=10; let got=resumeAt(from,TOTAL); const tok=modeToken;
    setStars(got,TOTAL);
    play.innerHTML='<div class="ground"></div>';
    addListen(play,'contextmenu',(e)=>e.preventDefault());
    addListen(play,'click',()=>toast('要用<b>右键</b>哦！👈','#fff'));
    function next(){
      const t=makeTarget(120,'🎈','linear-gradient(150deg,#ff9f45,#ff8a3d)');
      play.appendChild(t); place(t);
      addListen(t,'contextmenu',(e)=>{
        e.preventDefault(); e.stopPropagation();
        t.classList.add('burst'); setTimeout(()=>t.remove(),460); got++;
        setStars(got,TOTAL); recordStars('right',got);
        if(got>=TOTAL){ celebrate('right','🎉','真棒！','你会用右键啦！<br>右键常常会弹出小菜单。','⭐'.repeat(TOTAL)); }
        else setTimeout(()=>{ if(tok===modeToken) next(); },320);
      });
      addListen(t,'click',(e)=>{e.stopPropagation(); toast('这是左键～ 试试<b>右键</b>！','#fff');});
    }
    next();
  }

  function modeDouble(from){
    mascot.textContent='✌️';
    say('对着它<b>快速点两下</b>！');
    const TOTAL=10; let got=resumeAt(from,TOTAL); const tok=modeToken;
    setStars(got,TOTAL);
    play.innerHTML='<div class="ground"></div>';
    function next(){
      const t=makeTarget(130,'🍎','linear-gradient(150deg,#ff7a9c,#ff6fa5)');
      play.appendChild(t); place(t);
      addListen(t,'dblclick',(e)=>{
        e.stopPropagation();
        t.classList.add('burst'); setTimeout(()=>t.remove(),460); got++;
        setStars(got,TOTAL); recordStars('double',got);
        if(got>=TOTAL){ celebrate('double','🎉','太快啦！','双击可以打开东西，你学会啦！','⭐'.repeat(TOTAL)); }
        else setTimeout(()=>{ if(tok===modeToken) next(); },320);
      });
      addListen(t,'click',()=>toast('再点一下！<b>快一点</b>😄','#fff'));
    }
    next();
  }

  function modeWheel(from){
    mascot.textContent='🌀';
    say('转小轮子，把水装到<b>红线</b>！');
    const TOTAL=10; let got=resumeAt(from,TOTAL); const tok=modeToken;
    setStars(got,TOTAL);
    play.innerHTML='';
    const z=document.createElement('div'); z.className='wheel-zone';
    z.innerHTML='<div class="pic-wrap"><div class="wheel-num" id="wnum">0</div><div class="wheel-sub">转动滚轮·装到红线🎯</div></div>'
      +'<div class="bottle"><div class="fill" id="fill" style="height:0%"></div><div class="goal" id="goal" style="top:40%"></div></div>';
    play.appendChild(z);
    const fill=z.querySelector('#fill'), wnum=z.querySelector('#wnum'), goalEl=z.querySelector('#goal');
    let goal=60, cur=0, live=false;
    function newGoal(){
      let g; do{ g=Math.floor(Math.random()*15)*5+20; }while(g===goal);
      goal=g; cur=0; live=true;
      goalEl.style.top=(100-goal)+'%';
      draw();
    }
    function draw(){
      fill.style.height=cur+'%';
      wnum.textContent=cur+' / '+goal;
      fill.style.background = (live && cur===goal) ? '#2ec77b' : 'linear-gradient(180deg,#6fd6ff,#3aa3ff)';
    }
    addListen(z,'wheel',(e)=>{
      e.preventDefault();
      if(!live) return;
      cur = e.deltaY<0 ? Math.min(100,cur+5) : Math.max(0,cur-5);
      draw();
      if(cur===goal){
        live=false; got++; setStars(got,TOTAL); recordStars('wheel',got);
        if(got>=TOTAL){ celebrate('wheel','🎉','装满了！','你会用滚轮啦！<br>它能帮你上下看页面。','⭐'.repeat(TOTAL)); }
        else { toast('装满了！再来一关😄','#fff'); setTimeout(()=>{ if(tok===modeToken) newGoal(); },500); }
      }
    },{passive:false});
    addListen(play,'contextmenu',(e)=>e.preventDefault());
    newGoal();
  }

  function modeMenu(from){
    mascot.textContent='📋';
    const ROUNDS=10; const tok=modeToken;
    const ALL=['复制','粘贴','删除','重命名','查看属性','另存为'];
    let got=resumeAt(from,ROUNDS);
    setStars(got,ROUNDS);
    play.innerHTML='';
    const z=document.createElement('div'); z.className='menu-zone';
    play.appendChild(z);
    addListen(z,'contextmenu',(e)=>{e.preventDefault();e.stopPropagation(); say('用<b>左键</b>选一个：'); openMenu(e.clientX,e.clientY);});
    addListen(document,'click',(e)=>{ if(!ctmenu.contains(e.target)) ctmenu.style.display='none'; });
    let req='';
    function drawTask(){
      req=ALL[Math.floor(Math.random()*ALL.length)];
      say('点<b>右键</b>打开菜单，选「<b style="color:var(--pink)">'+req+'</b>」');
      z.innerHTML='<div class="task">在下面这里点右键👇<br><span class="req">'+req+'</span></div>';
    }
    function openMenu(x,y){
      const ICONS={'复制':'📄','粘贴':'📋','删除':'🗑️','重命名':'✏️','查看属性':'🔍','另存为':'💾'};
      const items=ALL.slice();
      const idx=items.indexOf(req); const correct=items.splice(idx,1)[0];
      items.sort(()=>Math.random()-.5);
      const at=Math.floor(Math.random()*(items.length+1));
      items.splice(at,0,correct);
      ctmenu.innerHTML='';
      items.forEach((it,i)=>{
        if(i===2){const sep=document.createElement('div');sep.className='sep';ctmenu.appendChild(sep);}
        const mi=document.createElement('div'); mi.className='mi';
        mi.innerHTML='<span class="ic">'+ICONS[it]+'</span>'+it;
        mi.onclick=()=>{
          ctmenu.style.display='none';
          if(it===req){
            got++; setStars(got,ROUNDS); recordStars('menu',got);
            if(got>=ROUNDS){ celebrate('menu','🎉','选对啦！','你会用右键菜单啦！<br>右键能做好多事。','⭐'.repeat(ROUNDS)); }
            else { toast('选对啦！再来一题😄','#fff'); drawTask(); }
          } else { toast('不对哦，找「<b>'+req+'</b>」','#fff'); drawTask(); }
        };
        ctmenu.appendChild(mi);
      });
      ctmenu.style.display='block';
      const w=ctmenu.offsetWidth,h=ctmenu.offsetHeight;
      ctmenu.style.left=Math.min(x,innerWidth-w-8)+'px';
      ctmenu.style.top=Math.min(y,innerHeight-h-8)+'px';
    }
    drawTask();
  }

  const MODES={home:modeHome,left:modeLeft,right:modeRight,double:modeDouble,wheel:modeWheel,menu:modeMenu};
  let currentMode='home';
  function showCompleted(name){
    // frozen finished-state for an already-completed level (no replay)
    mascot.textContent='🏆';
    say('这一关<b>完成啦</b>！你真棒！');
    setStars(TOTALS[name], TOTALS[name]);      // all stars lit
    play.innerHTML='<div class="ground"></div><div class="done-wrap">'
      +'<div class="trophy">🏆</div>'
      +'<div class="done-title">已完成</div>'
      +'<div class="done-sub">你已经学会「'+labelOf(name)+'」啦～<br>去玩别的游戏吧</div>'
      +'</div>';
  }
  function labelOf(name){
    const m={home:'开始',left:'左键',right:'右键',double:'双击',wheel:'滚轮',menu:'选菜单'};
    return m[name]||name;
  }
  /* ===== finale: every level cleared -> fireworks + big trophy, page frozen here ===== */
  const LEVELS=[
    ['left','左键','👆'],['right','右键','🖱️'],['double','双击','✌️'],
    ['wheel','滚轮','🌀'],['menu','选菜单','📋']
  ];
  function allCleared(){ return LEVELS.every(l=>doneSet.has(l[0])); }
  let finaleOn=false;
  function finishLevel(name){
    if(allCleared()) startFinale(); else showCompleted(name);
  }
  function celebrate(name,moji,title,text,starStr){
    markDone(name);
    if(allCleared()){                       // 最后一关：不弹小窗，直接进通关大奖
      hideModal();
      setTimeout(startFinale,420);
      return;
    }
    confetti();
    showModal(moji,title,text,starStr);
  }
  function bigConfetti(){
    const colors=['#ff6fa5','#ffd23f','#44a3ff','#4ed47e','#a577ff','#43d2e8','#ff9f45','#fff7d6'];
    for(let i=0;i<70;i++){
      const c=document.createElement('div'); c.className='cf';
      const sz=8+Math.random()*12;
      c.style.left=(Math.random()*100)+'vw';
      c.style.width=sz+'px'; c.style.height=(sz*1.4)+'px';
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.borderRadius=Math.random()<0.4?'50%':'3px';
      c.style.animationDuration=(2.2+Math.random()*2)+'s';
      c.style.animationDelay=(Math.random()*1.2)+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),5000);
    }
  }
  function startFireworks(){
    const cv=$('#fxCanvas'), ctx=cv.getContext('2d');
    let W=0,H=0,dpr=1,S=1;
    function resize(){
      dpr=Math.min(2,window.devicePixelRatio||1);
      W=window.innerWidth; H=window.innerHeight;
      S=Math.max(0.62,Math.min(1.5,H/900));
      cv.width=Math.max(1,Math.round(W*dpr)); cv.height=Math.max(1,Math.round(H*dpr));
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.lineCap='round';
    }
    resize();
    window.addEventListener('resize',resize);
    const COLORS=['#ff6fa5','#ffd23f','#44a3ff','#4ed47e','#a577ff','#43d2e8','#ff9f45','#fff7d6'];
    const pick=()=>COLORS[Math.floor(Math.random()*COLORS.length)];
    const rockets=[], sparks=[], confs=[];
    function launch(x){
      rockets.push({
        x:(x==null? W*(0.12+Math.random()*0.76) : Math.max(24,Math.min(W-24,x))),
        y:H+14, vy:-(H*0.0105+Math.random()*H*0.0042),
        ty:H*(0.10+Math.random()*0.34), col:pick(), trail:[]
      });
    }
    function explode(x,y,col){
      const n=62+Math.floor(Math.random()*40);
      const spread=0.85+Math.random()*0.3;
      for(let i=0;i<n;i++){
        const a=(Math.PI*2*i)/n+Math.random()*0.12;
        const sp=(1.5+Math.random()*4.2)*S;
        sparks.push({
          x:x,y:y,vx:Math.cos(a)*sp*spread,vy:Math.sin(a)*sp*spread,
          life:1, decay:0.0055+Math.random()*0.011,
          col:(Math.random()<0.7? col : pick()), r:1.5+Math.random()*2.1
        });
      }
      sparks.push({x:x,y:y,vx:0,vy:0,life:1,decay:0.06,col:col,r:10*S,flash:true});
    }
    function rainConfetti(n){
      for(let i=0;i<n;i++){
        confs.push({
          x:Math.random()*W, y:-Math.random()*H*0.9,
          vx:(Math.random()-.5)*1.6, vy:0.8+Math.random()*2.2,
          w:6+Math.random()*8, h:9+Math.random()*10,
          rot:Math.random()*6.283, vr:(Math.random()-.5)*0.4,
          col:pick(), seed:Math.random()*100
        });
      }
    }
    rainConfetti(150);
    let start=0, last=0, nextLaunch=0;
    function frame(now){
      if(!start){ start=now; last=now; }
      const d=Math.min(2.6,(now-last)/16.667); last=now;
      const el=now-start;
      /* crisp redraw each frame; trails come from the particles themselves */
      ctx.clearRect(0,0,W,H);
      ctx.globalCompositeOperation='lighter';
      ctx.lineCap='round';
      /* launch schedule: busy burst first, then an ambient show */
      if(el>nextLaunch){
        launch();
        if(el<2600){ launch(); if(Math.random()<0.5) launch(); }
        nextLaunch=el+(el<4000? 210+Math.random()*170 : 850+Math.random()*950);
      }
      for(let i=rockets.length-1;i>=0;i--){
        const r=rockets[i];
        r.trail.push({x:r.x,y:r.y}); if(r.trail.length>9) r.trail.shift();
        r.y+=r.vy*d; r.vy+=0.05*d*S;
        for(let k=0;k<r.trail.length;k++){
          const q=r.trail[k], a=(k+1)/r.trail.length;
          ctx.globalAlpha=a*0.85; ctx.fillStyle=r.col;
          ctx.beginPath(); ctx.arc(q.x,q.y,1.7*a+0.5,0,6.283); ctx.fill();
        }
        ctx.globalAlpha=1; ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(r.x,r.y,2.6,0,6.283); ctx.fill();
        if(r.y<=r.ty||r.vy>=0){ explode(r.x,r.y,r.col); rockets.splice(i,1); }
      }
      for(let i=sparks.length-1;i>=0;i--){
        const p=sparks[i];
        if(p.flash){
          p.life-=p.decay*d;
          if(p.life<=0){ sparks.splice(i,1); continue; }
          ctx.globalAlpha=p.life*0.38; ctx.fillStyle=p.col;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1.25-p.life),0,6.283); ctx.fill();
          continue;
        }
        p.px=p.x; p.py=p.y;
        p.x+=p.vx*d; p.y+=p.vy*d;
        p.vy+=0.035*d*S;
        p.vx*=Math.pow(0.986,d); p.vy*=Math.pow(0.986,d);
        p.life-=p.decay*d*1.6;
        if(p.life<=0){ sparks.splice(i,1); continue; }
        const rr=p.r*(0.35+p.life*0.95);
        ctx.globalAlpha=Math.min(1,p.life)*0.9;
        ctx.strokeStyle=p.col; ctx.lineWidth=rr*1.7;
        ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x,p.y); ctx.stroke();
        ctx.globalAlpha=Math.min(1,p.life);
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(p.x,p.y,rr*0.55,0,6.283); ctx.fill();
      }
      ctx.globalAlpha=1;
      ctx.globalCompositeOperation='source-over';
      for(let i=confs.length-1;i>=0;i--){
        const c=confs[i];
        c.x+=c.vx*d; c.y+=c.vy*d;
        c.vy=Math.min(c.vy+0.03*d*S,3.4*S);
        c.vx+=Math.sin((c.y+c.seed)/70)*0.02*d;
        c.rot+=c.vr*d;
        if(c.y>H+40){ confs.splice(i,1); continue; }
        ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
        ctx.globalAlpha=0.95; ctx.fillStyle=c.col;
        ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
        ctx.restore();
      }
      ctx.globalAlpha=1;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  /* ===== 通关页的「无尽点点乐」=====
     给先做完的学生一个不会结束的小练习：飘下来的小东西点掉就加分。
     普通物件 +1 分，金色 🌟 +5 分；漏掉不扣分、不惩罚，什么都不发生。
     每 10 分升一关——东西落得更快、来得更密，所以是无限关。
     页面只显示「得分」和「第几关」，**不记最高分、不做排行、不显示连击**。
     只在通关页启动，不碰任何一个正课关卡。 */

  /* 通关页的现场（localStorage）：学生正在这一页玩无尽点点乐时手一抖刷新了，
     不该被丢回关卡，更不该把攒的分数清零。存的就是这一页看到的两个数：
       {ts, score, level}——ts 最后活动时间、得分、第几关。
     只有真的进了通关页才落盘，?finale=1 预览不写（免得污染学生机上的真实进度）。
     超过 FINALE_FRESH 没动过的存档算过期：上一节课玩的通关页，下一节课打开是正常的
     关卡（导航上方那条金色入口还在，点一下就能回去），不会被永远锁在通关页里。 */
  const FINALE_KEY='mousecamp1.finale.v1';
  const FINALE_FRESH=30*60*1000;
  let finaleEndless={score:0, level:1};
  let finaleWriteAt=0, finaleFlushTimer=0;
  function writeFinaleState(force){
    if(previewMode) return;
    const now=Date.now();
    /* 得分是离散事件，点了就立刻落盘；帧循环里的调用按 900ms 节流，只为了刷 ts */
    if(!force&&now-finaleWriteAt<900){
      if(!finaleFlushTimer){
        finaleFlushTimer=setTimeout(function(){ finaleFlushTimer=0; writeFinaleState(true); },900-(now-finaleWriteAt));
      }
      return;
    }
    if(finaleFlushTimer){ clearTimeout(finaleFlushTimer); finaleFlushTimer=0; }
    finaleWriteAt=now;
    try{
      localStorage.setItem(FINALE_KEY,JSON.stringify({
        v:1, ts:now, score:finaleEndless.score, level:finaleEndless.level
      }));
    }catch(e){}
  }
  function readFinaleState(){
    let d=null;
    try{ d=JSON.parse(localStorage.getItem(FINALE_KEY)||'null'); }catch(e){ d=null; }
    if(!d||typeof d!=='object') return null;
    if(!(Date.now()-(d.ts||0)<FINALE_FRESH)) return null;      /* 过期：回关卡 */
    return { score:Math.max(0,Math.round(d.score||0)), level:Math.max(1,Math.round(d.level||1)) };
  }

  let epAudio=null;
  function epBeep(freq,dur){
    try{
      if(!epAudio) epAudio=new (window.AudioContext||window.webkitAudioContext)();
      if(epAudio.state==='suspended'&&epAudio.resume) epAudio.resume();
      const o=epAudio.createOscillator(), g=epAudio.createGain();
      o.type='sine'; o.frequency.value=freq; g.gain.value=.05;
      o.connect(g); g.connect(epAudio.destination); o.start();
      g.gain.exponentialRampToValueAtTime(.0001,epAudio.currentTime+(dur||.09));
      o.stop(epAudio.currentTime+(dur||.09)+.02);
    }catch(e){}
  }
  function startEndless(){
    const area=$('#epArea');
    if(!area) return;
    const scoreEl=$('#epScore'), lvEl=$('#epLevel'), lvChip=$('#epLvChip'), tip=$('#epTip');
    const ITEMS=['⭐','🎈','🍎','🍓','⚽','🍬','🐤','🌸','🍀'];
    const GOLD='🌟';
    /* 难度曲线：每 10 分一关。第 1 关每秒下落约 0.3 个掉落区高度（约 3.3 秒落到底）、
       平均 0.7 秒来一个；每升一关快一点、密一点，不设上限。 */
    const FALL_H=0.26, LEVEL_FAST=0.035;
    /* 刷新前攒的分数和第几关接着用（startFinale 已经把存档读进 finaleEndless） */
    let score=finaleEndless.score, level=finaleEndless.level, items=[], last=0, nextSpawn=350;
    scoreEl.textContent=score; lvEl.textContent=level;
    if(tip) setTimeout(()=>tip.classList.add('hide'),5200);

    function spawn(){
      const w=area.clientWidth, h=area.clientHeight;
      if(w<40||h<40) return;
      const gold=Math.random()<0.12;
      const size=Math.max(34,Math.min(62,Math.round(h*0.22)));
      const x=6+Math.random()*Math.max(6,w-size-12);
      const el=document.createElement('div');
      el.className='ep-item'+(gold?' gold':'');
      el.style.width=size+'px'; el.style.height=size+'px';
      el.style.lineHeight=size+'px';
      el.style.fontSize=Math.round(size*0.56)+'px';
      el.textContent=gold?GOLD:ITEMS[Math.floor(Math.random()*ITEMS.length)];
      const it={el:el,x:x,y:-size,size:size,gold:gold,dead:false,
                vy:h*(FALL_H+level*LEVEL_FAST)*(0.85+Math.random()*0.35)};
      el.style.transform='translate3d('+it.x+'px,'+it.y+'px,0)';
      area.appendChild(el);
      el.addEventListener('pointerdown',ev=>{ ev.preventDefault(); hit(it); });
      items.push(it);
      if(items.length>16){                       /* 保险：同时存在太多就淘汰最老的 */
        const old=items.shift();
        if(old&&old.el&&old.el.parentNode) old.el.parentNode.removeChild(old.el);
      }
    }

    function rise(it,gain){
      const p=document.createElement('div');
      p.className='ep-plus'+(gain>1?' big':'');
      p.textContent='+'+gain;
      p.style.left=(it.x+it.size/2)+'px';
      p.style.top=(it.y+it.size*0.15)+'px';
      area.appendChild(p);
      setTimeout(()=>{ if(p.parentNode) p.parentNode.removeChild(p); },900);
    }

    function hit(it){
      if(it.dead) return;
      it.dead=true;
      const idx=items.indexOf(it); if(idx>=0) items.splice(idx,1);
      const gain=it.gold?5:1;
      score+=gain;
      scoreEl.textContent=score;
      const nl=Math.floor(score/10)+1;
      if(nl>level){                              /* 每 10 分升一关：更快、更密，并且晃一下提示 */
        level=nl; lvEl.textContent=level;
        if(lvChip){ lvChip.classList.remove('flash'); void lvChip.offsetWidth; lvChip.classList.add('flash'); }
      }
      finaleEndless.score=score; finaleEndless.level=level;
      writeFinaleState(true);                    /* 得分是离散事件，点了就落盘，刷新后不会少分 */
      it.el.style.transform='translate3d('+it.x+'px,'+it.y+'px,0) scale(1.45)';
      it.el.style.opacity='0';
      setTimeout(()=>{ if(it.el.parentNode) it.el.parentNode.removeChild(it.el); },260);
      rise(it,gain);
      epBeep(it.gold?1180:880,.09);
    }

    window.addEventListener('resize',()=>{
      const w=area.clientWidth;
      items.forEach(it=>{
        if(it.x>w-it.size-4){
          it.x=Math.max(4,w-it.size-4);
          it.el.style.transform='translate3d('+it.x+'px,'+it.y+'px,0)';
        }
      });
    });

    function frame(now){
      requestAnimationFrame(frame);
      if(document.hidden) return;
      writeFinaleState();                        /* 滑一下存档时间：正在玩就别算过期 */
      if(!last){ last=now; return; }
      const dt=Math.min(.05,(now-last)/1000); last=now;
      const h=area.clientHeight;
      if(h<40) return;
      nextSpawn-=dt*1000;
      if(nextSpawn<=0){
        spawn();
        nextSpawn=Math.max(300,700-level*45)*(0.8+Math.random()*0.5);
      }
      for(let i=items.length-1;i>=0;i--){
        const it=items[i];
        it.y+=it.vy*dt;
        if(it.y>h){                                /* 漏掉了：不扣分，只断连击 */
          it.dead=true;
          if(it.el.parentNode) it.el.parentNode.removeChild(it.el);
          items.splice(i,1);
          continue;
        }
        it.el.style.transform='translate3d('+it.x+'px,'+it.y+'px,0)';
      }
    }
    requestAnimationFrame(frame);
  }

  function startFinale(){
    if(finaleOn) return;
    finaleOn=true;
    const box=$('#finale');
    /* 预览不看存档、也不写存档；正常进来就接着上次的得分和第几关继续 */
    finaleEndless=previewMode?{score:0, level:1}:(readFinaleState()||{score:0, level:1});
    writeFinaleState(true);
    refreshFinaleBar();
    document.documentElement.style.overflow='hidden';
    document.body.classList.add('locked');
    document.querySelectorAll('#nav button').forEach(b=>b.disabled=true);
    ctmenu.style.display='none'; hideModal();
    box.classList.add('show');
    bigConfetti();                              /* 撒花 */
    startFireworks();                           /* 烟花 */
    setTimeout(()=>box.classList.add('card-in'),1500);   /* 大奖杯 */
    setTimeout(()=>bigConfetti(),2700);
    setTimeout(startEndless,1700);              /* 通关后一直有得玩：无尽点点乐 */
    /* 锁定：画面停在这里，不接受任何滚动/操作 */
    const block=e=>{e.preventDefault();e.stopPropagation();};
    const stopKeys=[' ','Spacebar','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'];
    document.addEventListener('wheel',block,{passive:false,capture:true});
    document.addEventListener('touchmove',block,{passive:false,capture:true});
    document.addEventListener('contextmenu',block,{capture:true});
    document.addEventListener('dragstart',block,{capture:true});
    document.addEventListener('selectstart',block,{capture:true});
    document.addEventListener('keydown',e=>{ if(stopKeys.indexOf(e.key)>=0) block(e); },true);
    document.addEventListener('click',e=>{ if(!box.contains(e.target)) block(e); },true);
  }
  function showMode(name){
    currentMode=name;
    modeToken++; cleanup(); ctmenu.style.display='none'; hideModal();
    document.querySelectorAll('#nav button').forEach(b=>b.style.outline = b.dataset.mode===name ? '3px solid #fff' : 'none');
    /* 这一关上次做到一半（而且还没通关）就接着做，星星接着攒 */
    const st=(name!=='home'&&!doneSet.has(name))?stageMap[name]:null;
    againOn=!!(st&&st.got);
    refreshFinaleBar();
    if(allCleared()){ showCompleted(name); return; }       // everything cleared: hold on the award screen
    if(doneSet.has(name)){ showCompleted(name); return; }   // completed: hold, no replay
    MODES[name](st&&st.got?st.got:0);
    /* 等关卡自己的提示说完，再补一句"接着上次"；这一关被重新开始/做完了就别说了 */
    if(st&&st.got) setTimeout(function(){
      const now=stageMap[name];
      if(currentMode===name&&now&&now.got===st.got) say('接着上次继续：你已经有 <b>'+st.got+'</b> 颗星啦 ⭐');
    },1400);
  }
  document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>showMode(b.dataset.mode)));
  $('#finaleBar').addEventListener('click', function(){ if(!finaleOn) startFinale(); });
  $('#mOk').onclick=()=>{ hideModal(); finishLevel(currentMode); };   // OK -> finished level or grand finale

  /* ===== 启动 =====
     网址后面加 ?finale=1 直接进通关页（用于预览/验收，不写进任何界面提示）。
     先认这个参数：预览期间五关只标在内存里，**进度和通关页存档都不写**，
     学生正常打开（没有这个参数）时这里一行都不会生效。 */
  previewMode=/[?&]finale=1\b/.test(location.search);
  restoreSave();          /* 先把上次的成绩、"做了一半的现场"读回来 */
  showMode('home');
  if(previewMode){
    LEVELS.forEach(l=>{ markDone(l[0]); starBest[l[0]]=TOTALS[l[0]]||0; });
    refreshTotal();
    setTimeout(startFinale,60);
  } else if(allCleared()&&readFinaleState()){
    /* 刷新前就停在通关页里（误按刷新、误关标签页都算）：直接回到通关页，
       无尽点点乐的得分和第几关也接着上次继续 */
    setTimeout(startFinale,60);
  }

  /* bubbles */
  (function(){
    const cols=['#ffffff','#ffffff','#ffe3f2','#d9f0ff'];
    for(let i=0;i<14;i++){
      const s=document.createElement('span');
      const sz=(Math.random()*40+20);
      s.style.width=sz+'px'; s.style.height=sz+'px';
      s.style.left=(Math.random()*100)+'vw';
      s.style.bottom=(-40)+'px';
      s.style.background=cols[i%cols.length];
      s.style.animationDuration=(Math.random()*6+6)+'s';
      s.style.animationDelay=(Math.random()*4)+'s';
      $('#bg').appendChild(s);
    }
  })();

})();
</script>
</body>
